evised, blocked, rejected or deferred. By linking decisions to evidence and provenance, Brain Researcher embeds methodological judgment within the workflow, not after it.", "title_cn": "将分析严谨性带入智能体人工智能用于科学：面向神经影像数据分析的 Brain Researcher 平台", "abstract_cn": "智能体能够执行科学分析，但只有在对替代方案进行权衡并将主张限定在证据支持的范围之后，分析结果才能成为可辩护的主张。智能体可能复现选择性分析、过早宣称成功以及优化不完善标准等错误。我们介绍了 Brain Researcher，这是一个在遵循可接受分析、必要检查和主张范围规则下运行的智能体研究框架，运行于神经影像研究人员的计算环境中。在基准测试中，Brain Researcher 使七种模型的首次工具选择准确率提高了 70.2 个百分点（未使用该框架为 23.3%，使用该框架为 93.6%），可验证的 grounding 从 4.6% 提升至 22.0%。在协作主导和自我进化研究中，多宇宙分析揭示了分析选择对结果的敏感性，科学审查将主张分类为接受、有条件通过、修订、阻止、拒绝或延后。通过决策与证据及来源的关联，Brain Researcher 将方法论判断嵌入工作流之中，而非工作流之后。", "interpret": "当前，AI 代理能执行科学分析，但其结论往往因缺乏对替代方案的充分权衡而缺乏说服力，易导致选择性分析或过早下结论。为此，研究者推出了\"Brain Researcher\"平台，这是一个在神经影像学分析环境中运行的智能代理系统，其核心在于确立可接受的分析规则、强制检查机制及明确的结论边界。\n\n关键研究发现，该系统显著提升了 AI 的严谨性：在七项基准测试中，首选工具选择准确率从 23.3% 跃升至 93.6%，可验证的结论支撑度也从 4.6% 提升至 22.0%。通过“多宇宙分析”及同行协作研究，该平台有效暴露了分析选择对结果的影响，并使科学界能更准确地对 AI 生成的结论进行分类（如接受、限定、修改等）。这一进展为可信的人工智能辅助科研提供了重要范式，推动科学发现从“自动化执行”迈向“可辩护推理”。", "interpret_v": 3, "num": 19}, {"title": "MaliciousSkillBench: A Comprehensive Benchmark for Malicious Agent Skill Detection", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-20T19:13:00+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Agent Skills extend LLM agents with reusable instruction packages that may also include scripts, resources, and service configuration. This creates a direct distribution channel for malicious behavior, yet existing malicious-Skill datasets are fragmented across sources, artifact formats, evidence regimes, and benign coverage; duplicated and structurally related content further complicates direct aggregation and evaluation. We present MaliciousSkillBench, a comprehensive benchmark for malicious Agent Skill detection. We consolidate 13 public sources, 11 of which contribute Core malicious artifacts, and reduce 8,414 raw malicious records to 7,539 normalized-unique identities in 4,588 operational structural families. After conservative cross-label conflict exclusion, the primary benchmark contains 9,740 Skills: 7,505 malicious and 2,235 benign. To characterize its coverage, we harmonize 11 attack categories for 4,983 malicious identities with supported source-native mappings and find substantial differences in threat composition across sources. We then evaluate three learned text detectors and three off-the-shelf Skill scanners. Learned detectors achieve 0.882-0.932 Random Macro-F1 but only 0.653-0.665 under Source-Disjoint evaluation; the strongest word TF-IDF SVM scores 0.932/0.916/0.665 on Random/structural-disjoint/Source-Disjoint while retaining 95.6% malicious recall but producing 62.4% benign FPR on held-out sources. Off-the-shelf scanners occupy different but also unsatisfactory operating regimes, reducing false positives only at the cost of sharply lower malicious recall. Together, these results show that reliable malicious-Skill detection requires both broader cross-source benchmark coverage and evaluation that jointly measures attack detection and benign over-flagging.", "link": "https://arxiv.org/abs/2608.19901", "points": {"类别": "实证研究。针对恶意 Agent 技能数据集碎片化问题构建统一基准，评估检测器性能。", "背景": "大模型 Agent 具备可复用技能包，成为恶意行为直接传播渠道，但现有数据分散且格式不一。", "贡献": "整合 13 个公开来源构建涵盖良/恶技能的 9740 项技能基准，并系统对比三种检测器在交叉源下的表现。", "合理性": "通过交叉标签冲突剔除与源域分离评估，实验设计严谨，能真实反映跨源检测的泛化与误报局限。", "清晰度": "摘要逻辑清晰，从问题、基准构建到实验结果层层递进，数据详实且结论指向明确。"}, "kind": "paper", "abstract": "Agent Skills extend LLM agents with reusable instruction packages that may also include scripts, resources, and service configuration. This creates a direct distribution channel for malicious behavior, yet existing malicious-Skill datasets are fragmented across sources, artifact formats, evidence regimes, and benign coverage; duplicated and structurally related content further complicates direct aggregation and evaluation. We present MaliciousSkillBench, a comprehensive benchmark for malicious Agent Skill detection. We consolidate 13 public sources, 11 of which contribute Core malicious artifacts, and reduce 8,414 raw malicious records to 7,539 normalized-unique identities in 4,588 operational structural families. After conservative cross-label conflict exclusion, the primary benchmark contains 9,740 Skills: 7,505 malicious and 2,235 benign. To characterize its coverage, we harmonize 11 attack categories for 4,983 malicious identities with supported source-native mappings and find substantial differences in threat composition across sources. We then evaluate three learned text detectors and three off-the-shelf Skill scanners. Learned detectors achieve 0.882-0.932 Random Macro-F1 but only 0.653-0.665 under Source-Disjoint evaluation; the strongest word TF-IDF SVM scores 0.932/0.916/0.665 on Random/structural-disjoint/Source-Disjoint while retaining 95.6% malicious recall but producing 62.4% benign FPR on held-out sources. Off-the-shelf scanners occupy different but also unsatisfactory operating regimes, reducing false positives only at the cost of sharply lower malicious recall. Together, these results show that reliable malicious-Skill detection requires both broader cross-source benchmark coverage and evaluation that jointly measures attack detection and benign over-flagging.", "title_cn": "恶意技能基准：针对恶意智能体技能检测的综合基准", "abstract_cn": "智能体技能通过可重用的指令包扩展了大语言模型智能体的能力，其中可能包含脚本、资源和服务配置，这为恶意行为提供了直接的传播渠道。然而，现有的恶意技能数据集来源分散、格式各异、证据标准不同，且良性样本覆盖不全，加之内容重复和结构相似，使得直接聚合与评估变得复杂。我们提出了 MaliciousSkillBench，这是一个用于恶意智能体技能检测的综合基准。我们整合了 13 个公开来源（其中 11 个贡献了核心恶意工件），将 8,414 条原始恶意记录缩减为 7,539 种规范化唯一身份，涵盖 4,588 个操作结构家族。在保守的跨标签冲突排除后，主要基准包含 9,740 项技能，其中 7,505 项为恶意技能，2,235 项为良性技能。为表征其覆盖范围，我们针对 4,983 个恶意身份对 11 类攻击进行了标准化处理，并支持源原生映射，发现不同来源在威胁构成上存在显著差异。随后，我们对三种自研文本检测器和三种现成技能扫描器进行了评估。自研检测器在随机宏观 F1 分数上达到 0.882-0.932，但在源独立评估下仅为 0.653-0.665；最强的词频 - 逆文档频率支持向量机在随机、结构独立和源独立的指标上得分分别为 0.932、0.916 和 0.665，在保留 95.6% 恶意召回率的同时，在预留源上产生了 62.4% 的良性误报率。现成扫描器虽然处于不同的但同样不令人满意的工作模式，仅在减少误报的代价是显著降低恶意召回率。综合结果表明，可靠的恶意技能检测需要更广泛的跨来源基准覆盖，并采用同时衡量攻击检测与良性误报的评估方法。", "interpret": "大语言模型智能体（LLM Agent）正通过可扩展的指令包和脚本分发恶意行为，成为新的安全风险源。然而，现有的恶意技能数据集来源碎片化、格式不一且存在大量冗余，严重阻碍了有效检测工具的开发。为此，本研究提出了 MaliciousSkillBench，旨在构建首个通用的恶意智能技能检测基准。该研究整合了 13 个公开数据源，将原始 8,414 条恶意记录清洗为 7,539 个标准化唯一身份，并归纳出 4,588 种操作结构家族。经保守冲突剔除后，基准最终包含 9,740 项技能，其中 7,505 项为恶意，2,235 项为良性对照。此项工作通过大幅清洗与结构化归一，填补了当前数据分散的空白，为构建鲁棒的多模态攻击检测框架提供了关键的数据基础与统一评估标准。", "interpret_v": 3, "num": 20}, {"title": "EnvHarness: Awakening Static Worlds for Agent Learning", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-20T18:42:06+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "LLM agents learn by interacting with environments, yet these environments are hand-built and static: blind to an agent's weaknesses, and quickly left behind as it improves. While recent environment generation methods attempt to address this, they require domain-specific pipelines, rely on expensive or unreliable verifiers, and still produce static environments. To alleviate the engineering burden of rebuilding environments from scratch, we propose Environment Harness (EnvHarness), a programmable layer of plug-in components that wraps a static environment to reshape its behavior without modifying the underlying logic. Operating through standard interfaces, EnvHarness applies across diverse domains while ensuring every reshaped environment retains its original verifier. To automate this process, we introduce EnvRigger, which treats the target policy as a black box, observing its execution trajectories to synthesize EnvHarness components targeting diagnosed flaws, and validating them via fresh rollouts. Across five benchmarks in four domains, EnvHarness outperforms both original environments and domain-specific environment generation pipelines, achieving up to a 9.0-point improvement on held-out instances with 9.8% fewer execution steps. Furthermore, EnvHarness provides a superior optimization signal for reinforcement learning, enabling continuous, targeted co-evolution of the policy and its environment.", "link": "https://arxiv.org/abs/2608.19880", "points": {"类别": "系统，提出 EnvHarness 插件层与 EnvRigger 自动化生成工具。", "背景": "解决 LLM 代理静态环境无法适应策略提升及人工构建成本高的问题。", "贡献": "无需修改底层逻辑即可重塑环境行为，实现与策略的持续协同进化。", "合理性": "在五个基准测试中验证有效，通过黑盒观测轨迹合成组件方法具可信度。", "清晰度": "摘要逻辑流畅，从痛点到方案再到实验结果的叙述结构清晰明确。"}, "kind": "paper", "abstract": "LLM agents learn by interacting with environments, yet these environments are hand-built and static: blind to an agent's weaknesses, and quickly left behind as it improves. While recent environment generation methods attempt to address this, they require domain-specific pipelines, rely on expensive or unreliable verifiers, and still produce static environments. To alleviate the engineering burden of rebuilding environments from scratch, we propose Environment Harness (EnvHarness), a programmable layer of plug-in components that wraps a static environment to reshape its behavior without modifying the underlying logic. Operating through standard interfaces, EnvHarness applies across diverse domains while ensuring every reshaped environment retains its original verifier. To automate this process, we introduce EnvRigger, which treats the target policy as a black box, observing its execution trajectories to synthesize EnvHarness components targeting diagnosed flaws, and validating them via fresh rollouts. Across five benchmarks in four domains, EnvHarness outperforms both original environments and domain-specific environment generation pipelines, achieving up to a 9.0-point improvement on held-out instances with 9.8% fewer execution steps. Furthermore, EnvHarness provides a superior optimization signal for reinforcement learning, enabling continuous, targeted co-evolution of the policy and its environment.", "title_cn": "EnvHarness：唤醒静态世界以支持智能体学习", "abstract_cn": "大语言模型智能体通过与环境互动进行学习，但这些环境是人工构建且静态的：它们无法察觉智能体的弱点，并随着智能体的进步而迅速过时。尽管近期生成的环境方法试图解决这一问题，但它们需要领域特定的管道，依赖昂贵或不可靠的验证器，且仍会产生静态环境。为减轻从头开始重建环境带来的工程负担，我们提出了环境支架（EnvHarness），这是一个可插装的组件层，它封装静态环境以重塑其行为，而无需修改底层逻辑。EnvHarness 通过标准接口运行，适用于多个领域，同时确保每个重塑后的环境都保留其原始验证器。为了自动化这一过程，我们引入了 EnvRigger，它将目标策略视为黑盒，通过观测其执行轨迹来合成针对诊断缺陷的 EnvHarness 组件，并通过新的模拟进行验证。在四个领域的五个基准测试中，EnvHarness 超越了原始环境和领域特定的环境生成管道，在离线实例上最高提升了 9.0 分的性能，同时减少了 9.8% 的执行步骤。此外，EnvHarness 为强化学习提供了更优的优化信号，实现了策略及其环境的连续、有针对性的协同演化。", "interpret": "大型语言模型（LLM）智能体依赖环境进行交互学习，但现有环境多为人工构建且固定不变，无法感知智能体的弱点，也难以伴随其能力提升而动态调整。此外，现有生成方法往往依赖领域特定流程或昂贵的验证器，工程负担沉重且环境仍显僵化。针对这些问题，研究者提出了 Environment Harness（EnvHarness），这是一种可插拔的编程组件层，它能在不修改底层逻辑的前提下重塑静态环境的行为。通过统一接口，EnvHarness 能跨领域应用并保留原有验证机制。配合 EnvRigger 将目标策略视为黑盒进行观测分析，该方案旨在大幅降低重建环境的工程成本，为智能体的高效自适应学习提供关键支撑。", "interpret_v": 3, "num": 21}, {"title": "PolicyGuide: From Guarding One Action to Guiding the Whole Workflow for Policy-Compliant LLM Agents", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-20T18:13:19+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Customer-service LLM agents must follow organizational policy when acting on a user's behalf. Compliance failures arise from either forbidden actions, such as granting an ineligible change, or omitted procedural requirements, such as identification or confirmation. Runtime safeguards can intervene on risky actions, but action-local checks do not guide an agent through a multi-step procedure. Workflow-following systems support prescribed process execution, but primarily target workflow completion rather than safeguarding agent behavior. PolicyGuide instead compiles each domain policy into a workflow graph and invokes a proactive verifier at user-turn boundaries. From persisted graph state, the verifier reconciles open requests and returns step-specific remediation along a policy-compliant path. Across the $τ^2$-bench airline, retail, and telecom domains with a GPT-5.4 agent and verifier, PolicyGuide raises mean $\\mathrm{Pass}^4$ from $0.42$ to $0.62$, with the largest gain on telecom ($0.19$ to $0.61$), the most workflow-structured domain. The same workflows transfer to Claude Sonnet 4.6 and Gemini 2.5 Pro agents. Complementary evaluations find the lowest observed attack-success rate under adversarial users and the strongest procedural compliance in an author-designed workflow-level validation.", "link": "https://arxiv.org/abs/2608.19861", "points": {"类别": "方法", "背景": "针对客服 LLM 代理存在禁止动作或遗漏流程步骤导致的合规失败问题。", "贡献": "将域政策编译为工作流图并在用户回合边界激活主动验证器以提供针对性修复。", "合理性": "实验数据表明该方法显著提升了多领域代理的通过率，验证逻辑可信但依赖 GPT 版本。", "清晰度": "摘要逻辑连贯且数据详实，从问题定义到实验结果呈现清晰易懂。"}, "kind": "paper", "abstract": "Customer-service LLM agents must follow organizational policy when acting on a user's behalf. Compliance failures arise from either forbidden actions, such as granting an ineligible change, or omitted procedural requirements, such as identification or confirmation. Runtime safeguards can intervene on risky actions, but action-local checks do not guide an agent through a multi-step procedure. Workflow-following systems support prescribed process execution, but primarily target workflow completion rather than safeguarding agent behavior. PolicyGuide instead compiles each domain policy into a workflow graph and invokes a proactive verifier at user-turn boundaries. From persisted graph state, the verifier reconciles open requests and returns step-specific remediation along a policy-compliant path. Across the $τ^2$-bench airline, retail, and telecom domains with a GPT-5.4 agent and verifier, PolicyGuide raises mean $\\mathrm{Pass}^4$ from $0.42$ to $0.62$, with the largest gain on telecom ($0.19$ to $0.61$), the most workflow-structured domain. The same workflows transfer to Claude Sonnet 4.6 and Gemini 2.5 Pro agents. Complementary evaluations find the lowest observed attack-success rate under adversarial users and the strongest procedural compliance in an author-designed workflow-level validation.", "title_cn": "PolicyGuide：从守护单一动作到引导完整工作流，实现政策合规的 LLM 智能体", "abstract_cn": "客户服务型 LLM 智能体在代表用户执行操作时必须遵循组织政策，而合规失败通常源于禁止的动作（如授予 ineligible 变更）或缺失的程序要求（如身份验证或确认）。运行时防护机制虽能介入高风险动作，但局部动作检查无法引导智能体完成多步流程；而工作流遵循系统虽能支持既定的流程执行，却主要关注工作流的完成而非智能体行为的保护。PolicyGuide 将各域政策编译为工作流图，并在用户交互边界调用主动验证器，基于持久化的图状态对开放请求进行协调，并沿政策合规路径返回特定步骤的修复建议。在$τ^2$-bench 航空、零售和电信等域的 GPT-5.4 智能体与验证器组合测试中，PolicyGuide 使平均$\\mathrm{Pass}^4$分数从 0.42 提升至 0.62，在最具结构化的电信域（从 0.19 提升至 0.61）提升幅度最大。该工作流程同样适用于 Claude Sonnet 4.6 和 Gemini 2.5 Pro 智能体。补充评估发现，其在对抗性用户攻击下的成功率最低，在作者设计的工作流级验证中程序合规性最强。", "interpret": "在客服场景中，大模型代理若执行违规操作或遗漏必要流程步骤，将严重损害组织合规性。现有方法多局限于对单个高风险动作的事后干预，缺乏对多步骤完整业务流程的前瞻性引导。PolicyGuide 提出将各领域的组织策略编译为工作流图，并在用户交互节点调用主动验证器进行动态检查。该系统基于持久化的状态追踪，自动弥合未决请求，并为代理提供符合政策的具体修正路径，而非简单判定是否通过。实验涵盖航空、零售与电信等多元场景，结合大模型与专用验证器，证明了其能显著提升复杂任务中的行为合规率。这一方法标志着从单一动作防护向全链路流程管控的跨越，为构建可信、自主的智能代理提供了关键基础设施。", "interpret_v": 3, "num": 22}, {"title": "Inadvertent Context Leakage in Language Models", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-20T18:05:29+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "For AI agents to be useful beyond simple chat, they must hold sensitive user context such as calendars, credentials, health records, and financial data. We study whether the mere presence of such secrets in a model's context window introduces hidden correlations into the model's benign outputs, allowing reconstruction even when the model correctly refuses direct extraction. We further study whether an adversary can actively engineer prompts that amplify this effect, using the model as a covert carrier to transmit secrets through seemingly innocuous text. In both cases, this limited leakage is exploited using a novel adaptive attack that assumes black-box access to the underlying model. In controlled experiments across eight proprietary models, we find that 2-digit in-context secrets are reconstructed with near-perfect accuracy and 4-digit secrets at 82\\% exact match, all from outputs the model produces in response to ordinary, non-adversarial requests. We observe that more capable models leak more: stronger instruction-following amplifies sensitivity to in-context secrets, suggesting leakage is a byproduct of capability as opposed to a patchable bug. We show this leakage enables two practical attacks: (1) a trained classifier that infers semantic predicates about user memories (e.g., health conditions, financial events) from routine natural-language outputs, and (2) an RL-trained adversary that extracts full Social Security Numbers from a production-style agent.", "link": "https://arxiv.org/abs/2608.19857", "points": {"类别": "实证研究，通过控制实验揭示大型语言模型在非指令性请求下泄露敏感上下文数据的现象。", "背景": "随着 AI 代理需管理日历、健康记录等敏感用户数据，必须评估其在正确拒绝直接提取时是否仍存在隐性信息泄露。", "贡献": "发现模型能力越强泄露越多，并提出自适应黑盒攻击可近乎完美重构两位数乃至四位数秘密。", "合理性": "实验数据详实且结论符合技术直觉，但仅测试了八款专有模型且未涉及大规模真实用户场景验证。", "清晰度": "研究逻辑从现象观察到攻击验证层层递进，结构严谨且专业术语使用得当，阅读体验流畅。"}, "kind": "paper", "abstract": "For AI agents to be useful beyond simple chat, they must hold sensitive user context such as calendars, credentials, health records, and financial data. We study whether the mere presence of such secrets in a model's context window introduces hidden correlations into the model's benign outputs, allowing reconstruction even when the model correctly refuses direct extraction. We further study whether an adversary can actively engineer prompts that amplify this effect, using the model as a covert carrier to transmit secrets through seemingly innocuous text. In both cases, this limited leakage is exploited using a novel adaptive attack that assumes black-box access to the underlying model. In controlled experiments across eight proprietary models, we find that 2-digit in-context secrets are reconstructed with near-perfect accuracy and 4-digit secrets at 82\\% exact match, all from outputs the model produces in response to ordinary, non-adversarial requests. We observe that more capable models leak more: stronger instruction-following amplifies sensitivity to in-context secrets, suggesting leakage is a byproduct of capability as opposed to a patchable bug. We show this leakage enables two practical attacks: (1) a trained classifier that infers semantic predicates about user memories (e.g., health conditions, financial events) from routine natural-language outputs, and (2) an RL-trained adversary that extracts full Social Security Numbers from a production-style agent.", "title_cn": "语言模型中的无意上下文泄露", "abstract_cn": "为了使 AI 代理超越简单的聊天交互，它们必须存储包括日历、凭证、健康记录和财务数据在内的敏感用户上下文。我们研究此类秘密仅存在于模型上下文窗口中，是否会在模型生成看似良性的输出时引入隐藏的相关性，从而允许即便模型正确拒绝直接提取的情况也进行重构。我们进一步研究了攻击者能否主动设计提示词以放大这一效应，利用模型作为隐蔽载体通过看似无害的文字传递秘密。在这两种情况下，这种有限的泄露均采用一种假设底层模型具有黑盒访问权限的新型自适应攻击加以利用。在针对八个专有模型的受控实验中，我们发现 2 位数字的上下文秘密能以近乎完美的准确率被重构，4 位数字的秘密可达 82% 的精确匹配率，所有这些重构均源自模型对普通、非对抗性请求的响应。我们观察到能力更强的模型泄露更多：更强的指令遵循能力加剧了对上下文秘密的敏感性，表明泄露是能力的副产品而非可修补的漏洞。我们展示了这种泄露能够支持两项实际攻击：(1) 一种训练有素的分类器，能够从常规的文本自然语言输出中推断关于用户记忆（如健康状况、财务事件）的语义谓词，以及 (2) 一种通过强化学习训练的对抗者，能够从生产式代理中提取完整的社会保障号码。", "interpret": "当前大模型常被赋予访问用户日历、健康记录等敏感信息的权限，以便扮演智能助手角色。然而，这些秘密是否会在模型输出中留下隐蔽痕迹，从而被攻击者窃取，尚存疑虑。本研究聚焦这一“无意信息泄露”问题，探究即便模型正确拒绝了直接提取请求，其在看似无害的回复中是否仍会泄露信息；并进一步研究攻击者能否通过定制提示词，利用模型作为隐秘载体传输秘密。实验表明，在控制环境下，针对八个专有模型的新型自适应攻击（假设黑盒访问）显示：2 位数字的秘密能以近乎完美的精度被重建，4 位数字的匹配率达到 82%。这一发现揭示了当前模型在保护用户隐私方面的巨大漏洞，意味着即使没有直接报错，敏感数据仍可能通过统计偏差被逆向工程还原，对构建可信的人机协作系统提出了严峻警示。", "interpret_v": 3, "num": 23}, {"title": "ADAPT: Physics-Aware Diffusion-based World Models for Adaptive Predictive Transferable HVAC Control", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T16:58:28+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Buildings account for roughly one-third of global energy consumption and CO$_2$ emissions. Optimizing indoor climate systems plays a critical role for urban climate mitigation aligned with UN Sustainable Development Goals 11 and 13. However, indoor delayed thermodynamic responses and partial observability severely hinder existing methods, which are primarily limited by implicit thermal inertia, occupancy dynamic prediction, and cumulative prediction errors, especially for out-of-distribution environments. In practice, these challenges are further exacerbated by the high cost and privacy burden of dense indoor sensing, forcing operators to collect only limited data in a single operating regime while expecting controllers to generalize reliably across unseen seasons and climate regions. To address this problem, we propose ADAPT, a physics-aware conditional diffusion indoor environmental world model for HVAC control. The model predicts a short-horizon held-action thermal baseline to capture the latent thermal inertia of the buildings. The diffusion backbone utilizes the robustness of generative models, while a learnable multi-zone heat-balance regularizer constrains generated trajectories to satisfy transferable building thermodynamics without requiring known building geometry or manually calibrated thermal parameters. A credit assignment is then design for the downstream reinforcement learning. Extensive experiments on SemibuildingSim and Sinergym demonstrate that ADAPT reduces HVAC energy consumption by 7.3\\% and occupant discomfort by 30.2\\% compared with state-of-the-art baselines under IID control. Under OOD control scenarios spanning unseen seasons and climate regions, ADAPT maintains robust performance with only marginal degradation relative to its IID performance, substantially outperforming existing methods in transfer robustness.", "link": "https://arxiv.org/abs/2608.19804", "points": {"类别": "系统 本文提出一种基于物理感知的扩散模型，用于开发适应性的 HVAC 控制与预测系统。", "背景": "室内环境存在热惯性延迟和观测受限问题，导致现有方法在未见过的季节和气候区泛化能力不足。", "贡献": "该方法通过引入热平衡正则化无需已知建筑几何即可预测热基线，并显著降低了能耗与不适感。", "合理性": "利用扩散模型生成轨迹结合物理约束设计合理，实验数据证明其适应未见过的季节效果显著。", "清晰度": "摘要逻辑从问题挑战推导至方法提出与实验验证，结构清晰且专业。"}, "kind": "paper", "abstract": "Buildings account for roughly one-third of global energy consumption and CO$_2$ emissions. Optimizing indoor climate systems plays a critical role for urban climate mitigation aligned with UN Sustainable Development Goals 11 and 13. However, indoor delayed thermodynamic responses and partial observability severely hinder existing methods, which are primarily limited by implicit thermal inertia, occupancy dynamic prediction, and cumulative prediction errors, especially for out-of-distribution environments. In practice, these challenges are further exacerbated by the high cost and privacy burden of dense indoor sensing, forcing operators to collect only limited data in a single operating regime while expecting controllers to generalize reliably across unseen seasons and climate regions. To address this problem, we propose ADAPT, a physics-aware conditional diffusion indoor environmental world model for HVAC control. The model predicts a short-horizon held-action thermal baseline to capture the latent thermal inertia of the buildings. The diffusion backbone utilizes the robustness of generative models, while a learnable multi-zone heat-balance regularizer constrains generated trajectories to satisfy transferable building thermodynamics without requiring known building geometry or manually calibrated thermal parameters. A credit assignment is then design for the downstream reinforcement learning. Extensive experiments on SemibuildingSim and Sinergym demonstrate that ADAPT reduces HVAC energy consumption by 7.3\\% and occupant discomfort by 30.2\\% compared with state-of-the-art baselines under IID control. Under OOD control scenarios spanning unseen seasons and climate regions, ADAPT maintains robust performance with only marginal degradation relative to its IID performance, substantially outperforming existing methods in transfer robustness.", "title_cn": "ADAPT：面向自适应可迁移暖通空调控制的物理感知扩散世界模型", "abstract_cn": "建筑约占全球能源消耗和二氧化碳排放量的三分之一，优化室内气候系统对于实现联合国可持续发展目标 11 和 13 所倡导的城市气候减缓至关重要。然而，室内热力学响应的延迟和观测的不完整性严重阻碍了现有方法，这些方法主要受限于隐含的热惯性、占用动态预测以及累积预测误差，特别是在分布外环境中。在实践中，由于密集的室内传感具有高成本和隐私负担，迫使运营者仅在单一运行模式下收集有限的数据，却期望控制器能够可靠地泛化至未见的季节和气候区域。为了解决这一问题，我们提出了 ADAPT，一种用于暖通空调控制的物理感知条件扩散室内环境世界模型。该模型预测短视距的持续动作热基线，以捕捉建筑的潜在热惯性。扩散骨干利用了生成模型的鲁棒性，而可学习的多区热平衡正则化器约束生成轨迹以满足可转移的建筑热力学，而无需已知建筑几何形状或手动校准的热参数。随后为下游强化学习设计了信用分配机制。在 SemibuildingSim 和 Sinergym 上的广泛实验表明，与最先进的基线相比，ADAPT 在独立同分布（IID）控制下将暖通空调能耗降低了 7.3%，并减少了 30.2% 的 occupants 不适感。在未见的季节和气候区域的分布外（OOD）控制场景中，ADAPT 在性能仅发生微小下降的情况下保持了鲁棒性，在转移鲁棒性方面显著优于现有方法。", "interpret": "建筑物消耗了全球约三分之一的能源并产生相应的碳排放，其高效运行对实现联合国可持续发展目标至关重要。然而，室内热响应滞后、部分信息不可见以及现有控制方法的泛化能力不足，严重制约了现有技术的效能，尤其是在面对未见过的气候环境时。此外，高密度传感器采集成本高且存在隐私风险，迫使管理者仅在单一运行模式下列举少量数据，却期望控制器能跨季节和地域可靠工作。针对这一痛点，研究提出了 ADAPT 模型，该模型基于物理原理设计的扩散式世界模型。其核心发现在于成功将物理法则作为生成模型的约束，解决了热惯性建模和动态预测等难题。这一成果显著提升了 HVAC 控制系统在数据稀缺和分布外场景中的适应能力与能效，为构建低碳、智能的下一代城市气候调节系统提供了可行的技术路径。", "interpret_v": 3, "num": 24}, {"title": "Towards general embodied intelligence: integrating large language models, knowledge bases, and reasoning capabilities to build the next generation of AI agents", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-20T16:45:51+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "The convergence of large language models (LLMs), structured knowledge bases (KBs), and reasoning ability (RA) presents a promising trajectory toward general embodied intelligence (GEI). This paper reviews the evolution of LLM-centered intelligent systems, emphasising their integration with knowledge representation, logical reasoning, and physical embodiment. We analyse LLM architectures, pre-training methods, and inference mechanisms, along with their interaction with external knowledge sources and structured reasoning frameworks. Furthermore, we examine embodied intelligence (EI) paradigms wherein agents learn and act in physical environments. To synthesise these dimensions, we present a conceptual framework that illustrates the synergy among LLMs, KBs, RA, and embodiment, serving as a guiding model for perception, reasoning, and action rather than an implemented engineering architecture. To advance toward GEI, we identify five key challenges: efficient LLM deployment, closed-loop knowledge integration, hybrid symbolic-neural reasoning, perception-action grounding, and continual learning. This survey provides a comprehensive roadmap for developing adaptive, multimodal agents capable of operating in complex, dynamic settings.", "link": "https://arxiv.org/abs/2608.19794", "points": {"类别": "综述，本文梳理大语言模型与具身智能融合的技术演进路径。", "背景": "解决通用具身智能如何整合语言知识、逻辑推理及物理行动的问题。", "贡献": "构建概念框架并指出高效部署、闭环知识集成等五项核心挑战。", "合理性": "方法基于现有技术演进，逻辑严密，但作为概念模型未含实验验证。", "清晰度": "结构清晰，层层递进地从技术基础推导至未来挑战，阅读顺畅。"}, "kind": "paper", "abstract": "The convergence of large language models (LLMs), structured knowledge bases (KBs), and reasoning ability (RA) presents a promising trajectory toward general embodied intelligence (GEI). This paper reviews the evolution of LLM-centered intelligent systems, emphasising their integration with knowledge representation, logical reasoning, and physical embodiment. We analyse LLM architectures, pre-training methods, and inference mechanisms, along with their interaction with external knowledge sources and structured reasoning frameworks. Furthermore, we examine embodied intelligence (EI) paradigms wherein agents learn and act in physical environments. To synthesise these dimensions, we present a conceptual framework that illustrates the synergy among LLMs, KBs, RA, and embodiment, serving as a guiding model for perception, reasoning, and action rather than an implemented engineering architecture. To advance toward GEI, we identify five key challenges: efficient LLM deployment, closed-loop knowledge integration, hybrid symbolic-neural reasoning, perception-action grounding, and continual learning. This survey provides a comprehensive roadmap for developing adaptive, multimodal agents capable of operating in complex, dynamic settings.", "title_cn": "迈向通用具身智能：整合大语言模型、知识库与推理能力构建下一代 AI 智能体", "abstract_cn": "大语言模型（LLMs）、结构化知识库（KBs）与推理能力（RA）的融合为迈向通用具身智能（GEI）描绘了极具前景的路径。本文综述了以 LLM 为核心的智能系统的演进，重点探讨其与知识表示、逻辑推理及物理具身化的整合。我们分析了 LLM 架构、预训练方法及推理机制，并考察了其与外部知识源及结构化推理框架的交互。此外，文章还审视了使智能体在物理环境中学习与行动的具身智能范式，并提出了一种概念框架来阐释 LLM、KB、RA 与具身化之间的协同效应，该框架作为感知、推理与行动的指导模型，而非具体的工程实现。为推进 GEI，我们识别了五个关键挑战：高效的 LLM 部署、闭环知识集成、混合符号神经推理、感知行动 grounding 以及持续学习。本综述为开发能够适应复杂动态环境的自适应多模态智能体提供了全面路线图。", "interpret": "本研究致力于构建下一代通用具身智能体（GEI），旨在将大语言模型（LLM）、结构化知识库（KB）与推理能力（RA）深度融合。当前 AI 正经历从单纯文本对话向理解物理世界行动的转变，单纯依赖 LLM 虽能生成内容，却缺乏对客观事实的精准把控及在复杂环境中的逻辑推导能力。为此，该论文提出了一套概念框架，阐明三者如何协同工作：LLM 提供泛化理解力，KB 注入可靠知识锚点，RA 确保严密逻辑链条，最终赋能智能体在物理环境中完成感知、推理与行动。这一理论模型不仅解释了未来智能系统的演进方向，更为开发具备真实世界适应能力的通用 AI 提供了清晰的指引，标志着 AI 从“数字助手”向“全能伙伴”的关键跨越。", "interpret_v": 3, "featured_date": "2026-08-22", "num": 25}, {"title": "An Irreducible Quantum Advantage in Aligning World Models with Reality", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T16:23:48+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "World models provide digital simulacra of the true world, allowing agents to be trained and tested before costly real-world deployment. At each time step, they receive an action and generate an observation and reward matching the statistics of the true world. In complex environments where present outcomes depend on events far in the past, this requires memory. One might expect that, by increasing memory, we can always build a model accurately enough to align the optimal agent policies of the real and virtual worlds. We show that this is false for classical world models, even when the true world itself is classical. We construct true worlds for which every finite classical model fails along the same possible trajectory: it either loses the ability to distinguish actions when the true world clearly prefers one, or repeatedly assigns the highest expected reward to suboptimal actions. Its expected-reward estimates also retain a nonvanishing average error. In contrast, each such true world admits a quantum world model using a single qutrit that reproduces it exactly: its reward estimates and preferred actions always match those of the true world, ensuring that the optimal policies of the real and virtual worlds remain perfectly aligned.", "link": "https://arxiv.org/abs/2608.19779", "points": {"类别": "理论实证结合，证明有限经典模型存在不可克服的世界对齐缺陷。", "背景": "源于智能体世界模拟中应对长程依赖时的记忆存储与决策一致性难题。", "贡献": "构建经典世界反例证伪无限记忆有效性，并展示单量子比特即可完美对齐。", "合理性": "逻辑严密，通过构造特定轨迹从数学上确立了经典理论的根本局限性。", "清晰度": "摘要结构紧凑，先提出假设再给出反例与量子方案对比，层次分明。"}, "kind": "paper", "abstract": "World models provide digital simulacra of the true world, allowing agents to be trained and tested before costly real-world deployment. At each time step, they receive an action and generate an observation and reward matching the statistics of the true world. In complex environments where present outcomes depend on events far in the past, this requires memory. One might expect that, by increasing memory, we can always build a model accurately enough to align the optimal agent policies of the real and virtual worlds. We show that this is false for classical world models, even when the true world itself is classical. We construct true worlds for which every finite classical model fails along the same possible trajectory: it either loses the ability to distinguish actions when the true world clearly prefers one, or repeatedly assigns the highest expected reward to suboptimal actions. Its expected-reward estimates also retain a nonvanishing average error. In contrast, each such true world admits a quantum world model using a single qutrit that reproduces it exactly: its reward estimates and preferred actions always match those of the true world, ensuring that the optimal policies of the real and virtual worlds remain perfectly aligned.", "title_cn": "不可减少的量子优势：使世界模型与现实对齐", "abstract_cn": "世界模型提供了真实世界的数字拟物，使得智能体能够在昂贵的现实世界部署前进行训练和测试。每个时间步，它们接收动作并生成符合真实世界统计规律的观察和奖励。在结果依赖于遥远过去事件的复杂环境中，这要求模型具备记忆能力。人们或许认为，通过增加记忆，我们可以构建足够精确的模型以实现对真实世界和虚拟世界中最优智能体策略的对齐。然而，我们证明了对于经典世界模型，即便真实世界本身也是经典的，这一观点也是错误的。我们构造了某些真实世界，使得每一个有限规模的经典模型在相同的可能轨迹上都会失败：它们要么无法区分当真实世界明显偏好某个动作时的动作，要么反复将最高期望奖励分配给次优动作，且其期望奖励估计仍保留非零的平均误差。相反，每一个此类真实世界都可以通过使用单个三能级量子系统的量子世界模型进行精确再现：其奖励估计和偏好动作始终与真实世界保持一致，从而确保真实世界与虚拟世界中的最优策略保持完美对齐。", "interpret": "世界模型旨在通过数字仿真预演真实环境，帮助智能体在低成本情况下训练最优策略。传统观点认为，只要增加记忆容量，就能构建足够准确的模型以实现虚实策略对齐。然而，近期研究揭示了一个颠覆性发现：即使是基于经典物理的真实环境，也存在特定的场景，使得所有有限容量的经典世界模型均会失效。在这些极端情况下，无论模型如何优化，都无法区分关键动作，甚至反复奖励次优策略。这一“不可约约的量子优势”表明，经典计算存在根本性局限，无法完全模拟现实世界的因果复杂性。该发现不仅挑战了传统强化学习的边界，也预示着在复杂系统中，可能需要超越经典比特、引入量子机制才能实现真正的智能对齐。", "interpret_v": 3, "num": 26}, {"title": "SafeBranch: Branch-Pair Safety Alignment for Embodied Agents", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-20T15:29:07+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Vision-language-model-based embodied agents can complete instructed tasks but often violate safety constraints in the process, a problem recently framed as interactive safety. Training such agents to act safely is difficult, since safety and task success are distinct objectives, and safety arises only at a small number of safety-critical steps within a trajectory. Standard supervision is insufficient: imitating safe trajectories teaches behavior without explaining why it is safe, and contrasting arbitrary safe and unsafe trajectories mixes the safety signal with unrelated differences. We propose SafeBranch, a framework that aligns an embodied actor on safety through branch pairs constructed from the actor's own unsafe rollouts via environment rollback. SafeBranch rolls each unsafe rollout back to the safety-critical step that caused the violation, queries the actor for a safe alternative, and pairs the original action with the alternative so that the two branches differ only at that step. The trained actor acts safely at deployment with no critic in the loop. On IS-Bench, SafetyALFRED, and out-of-distribution variants with unseen tasks and objects, it handles safety reliably without sacrificing task success, achieving roughly ten times more safe successes than the untrained baseline on the unseen-object variant.", "link": "https://arxiv.org/abs/2608.19729", "points": {"类别": "系统，提出无需循环强化学习器的分支对安全对齐框架，解决具身智能体安全约束违反难题。", "背景": "源于具身智能体在互动过程中难以兼顾任务成功与安全性这一新兴交互安全问题。", "贡献": "首创通过环境回溯构建分支对，仅修正临界步骤差异，实现安全行为与任务目标的高效对齐。", "合理性": "利用自滚退行为构建对比样本逻辑自洽，离线训练与在线部署分离方案显著降低实验风险。", "清晰度": "摘要层次分明，清晰阐述了问题本质、核心方法机制及在多项基准上的量化提升成果。"}, "kind": "paper", "abstract": "Vision-language-model-based embodied agents can complete instructed tasks but often violate safety constraints in the process, a problem recently framed as interactive safety. Training such agents to act safely is difficult, since safety and task success are distinct objectives, and safety arises only at a small number of safety-critical steps within a trajectory. Standard supervision is insufficient: imitating safe trajectories teaches behavior without explaining why it is safe, and contrasting arbitrary safe and unsafe trajectories mixes the safety signal with unrelated differences. We propose SafeBranch, a framework that aligns an embodied actor on safety through branch pairs constructed from the actor's own unsafe rollouts via environment rollback. SafeBranch rolls each unsafe rollout back to the safety-critical step that caused the violation, queries the actor for a safe alternative, and pairs the original action with the alternative so that the two branches differ only at that step. The trained actor acts safely at deployment with no critic in the loop. On IS-Bench, SafetyALFRED, and out-of-distribution variants with unseen tasks and objects, it handles safety reliably without sacrificing task success, achieving roughly ten times more safe successes than the untrained baseline on the unseen-object variant.", "title_cn": "SafeBranch：基于分支对的安全性对齐的具身智能体", "abstract_cn": "基于视觉 - 语言模型的具身智能体虽然能够完成指令任务，但往往在执行过程中违反安全约束，这一问题近期被界定为交互式安全。由于安全与任务成功是两个独立的目标，且安全仅在轨迹中的少量安全关键步骤中体现，因此训练此类智能体安全行动十分困难；标准监督方法效果不足：模仿安全轨迹虽能教导行为但无法解释其安全性，而对比任意的安全与不安全轨迹会将安全信号与无关差异混合。我们提出 SafeBranch 框架，该方法通过从智能体自身不安全 rollout 中经由环境回滚构造分支对，从而将具身智能体与安全性对齐。SafeBranch 将每个不安全 rollout 回滚至引发违规的安全关键步骤，查询智能体以获取安全替代方案，并将原始动作与替代方案配成对，使得这两个分支仅在该步骤不同。经训练的智能体在部署时无需循环中引入 critic 即可安全行动。在 IS-Bench、SafetyALFRED 以及包含未见任务和物体的分布外变体上的测试表明，该方法能够在不牺牲任务成功率的前提下可靠地处理安全问题，在未见物体变体上比未训练的基线多获得了约十倍的有安全保障的成功率。", "interpret": "基于视觉 - 语言模型的具身智能体虽能完成任务，却常忽略安全约束，这被称为“交互式安全”难题。由于安全仅发生于轨迹中的少数关键步骤，而安全与任务目标往往存在冲突，传统的模仿学习或简单对比难以有效对齐。为此，研究提出了 SafeBranch 框架，该方案利用智能体自身产生的不安全轨迹进行改进：通过环境回滚机制，将每个不安全轨迹回溯至导致违规的关键步骤，并查询智能体生成安全替代方案，从而构建用于安全对齐的“分支对”。这种方法避免了引入无关差异干扰安全信号，实现了基于自我反思的安全强化学习，为提升具身智能在实际环境中的安全可靠性提供了新思路。", "interpret_v": 3, "num": 27}, {"title": "RFWM: Physics-Guided World Model for Dynamic Wireless Radiance Field Generation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T15:08:50+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Radio-frequency (RF) radiance-field modeling is essential for wireless network optimization and sensing, yet remains challenging in dynamic and unseen environments. Existing learning-based methods synthesize RF fields from sparse measurements, but most struggle to generalize to dynamic and unseen environments. To address this limitation, we propose RFWM, a physics-guided RF world model that maps multimodal physical conditions like visual dynamics and AP configurations to spatiotemporal RF fields. RFWM adopts a two-stage training strategy with physics-guided priors and constraints. In the first stage, RFWM adapts a pretrained visual diffusion backbone to RF trajectories to predict RF sequences from a few past RF inputs, while conditioning the backbone on a Friis-guided prior for coarse attenuation guidance. In the second stage, RFWM learns the physical-to-RF mapping by training a ControlNet from scratch and fine-tuning the RF-adapted backbone, while six physics-guided regularizers enforce fine-grained propagation consistency. Cross-height heads then jointly generate RF trajectories at queried receiver heights in one forward pass. We construct a new benchmark of 7,715 sequences averaging 33 frames across 115 environments for dynamic RF-field generation. Experimental results show that RFWM improves MSE by approximately 7 dB and 3 dB over the state of the art under in-distribution and out-of-distribution settings, respectively.", "link": "https://arxiv.org/abs/2608.19709", "points": {"类别": "方法，提出融合物理先验的世界模型以解决动态场景下的无线电波辐射场生成难题。", "背景": "源自无线网络优化与感知需求，现有学习方法在动态及未见环境中的泛化能力严重不足。", "贡献": "构建新基准并设计两阶段训练策略，利用 Friis 定律约束扩散模型，在泛化与精度上均取得显著提升。", "合理性": "方法逻辑严密且通过新基准验证，物理正则化有效缓解过拟合，实验指标优异但仅覆盖特定环境。", "清晰度": "摘要结构清晰，从问题背景到方法流程及实验结果的叙述流畅易懂，专业术语使用规范。"}, "kind": "paper", "abstract": "Radio-frequency (RF) radiance-field modeling is essential for wireless network optimization and sensing, yet remains challenging in dynamic and unseen environments. Existing learning-based methods synthesize RF fields from sparse measurements, but most struggle to generalize to dynamic and unseen environments. To address this limitation, we propose RFWM, a physics-guided RF world model that maps multimodal physical conditions like visual dynamics and AP configurations to spatiotemporal RF fields. RFWM adopts a two-stage training strategy with physics-guided priors and constraints. In the first stage, RFWM adapts a pretrained visual diffusion backbone to RF trajectories to predict RF sequences from a few past RF inputs, while conditioning the backbone on a Friis-guided prior for coarse attenuation guidance. In the second stage, RFWM learns the physical-to-RF mapping by training a ControlNet from scratch and fine-tuning the RF-adapted backbone, while six physics-guided regularizers enforce fine-grained propagation consistency. Cross-height heads then jointly generate RF trajectories at queried receiver heights in one forward pass. We construct a new benchmark of 7,715 sequences averaging 33 frames across 115 environments for dynamic RF-field generation. Experimental results show that RFWM improves MSE by approximately 7 dB and 3 dB over the state of the art under in-distribution and out-of-distribution settings, respectively.", "title_cn": "RFWM：面向动态无线辐射场生成的物理引导世界模型", "abstract_cn": "无线电波（RF）辐射场建模对于无线网络优化与感知至关重要，但在动态及未见环境中仍极具挑战；现有基于学习的方法虽能从稀疏测量中合成 RF 场，但在泛化能力上存在局限。为此，我们提出 RFWM，一种能够将视觉动态与接入点配置等多模态物理条件映射至时空 RF 场的物理引导 RF 世界模型；该模型采用两阶段训练策略，引入物理引导先验与约束。第一阶段，RFWM 利用预训练的视觉扩散骨干适应 RF 轨迹，仅凭少量历史 RF 输入即可预测 RF 序列，并结合由 Friis 定律引导的先验进行衰减的粗略指导；第二阶段，RFWM 从零训练 ControlNet 并微调 RF 适配骨干以学习物理到 RF 的映射，同时施加六个物理引导正则化器以确保精细的传播一致性，随后跨高度头可在单次前向传播中联合生成查询接收高度处的 RF 轨迹。此外，我们构建了包含 115 个环境、平均每场景 33 帧、共 7,715 条序列的新基准数据集，用于动态 RF 场生成评估。实验结果表明，RFWM 在分布内及分布外场景下，相较于最先进方法将均方误差降低约 7 dB 和 3 dB。", "interpret": "无线频段辐射场建模对优化无线网络与感知至关重要，尤其在动态且未见过的环境中，传统基于学习的方法因依赖稀疏测量数据，泛化能力常显不足。针对此难题，本文提出了 RFWM，一种物理引导的辐射场世界模型。该模型创新性地融合视觉动态与环境配置等多模态物理条件，映射至时空无线辐射场。其核心采用两阶段训练策略：首阶段利用预训练视觉扩散骨干预测射频序列，并结合基于费斯定律的衰减先验进行粗粒度引导；次阶段则进一步学习物理特征到射频信号的精细映射。RFWM 的关键突破在于有效利用物理定律作为强先验约束，显著提升了模型在未知动态场景下的预测精度与鲁棒性，为下一代智能无线感知与通信系统提供了可解释且高效的数据生成新范式。", "interpret_v": 3, "num": 28}, {"title": "Rethinking the Evaluation and Optimization of LLM-Based Social Simulation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-20T14:26:03+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "LLM-based social simulation is a promising complement to traditional methods such as surveys and behavioral experiments. A core question is how to evaluate the fidelity of LLM-simulated human behavior and optimize LLMs toward it. Prevailing practice evaluates by accuracy, checking whether the model selects the single response observed from a human, and trains the LLM to reproduce this hard label. However, human behavior is inherently subjective: the same person in the same situation may reasonably act differently, so an observed response is only one draw from an underlying response distribution, rendering accuracy-based evaluation unreliable and hard-label training misleading. To address these problems, we first introduce the subjectivity coefficient, an entropy-based quantity distinguishing objective tasks such as coding from subjective ones such as social simulation, and use it to systematically analyze how accuracy-based evaluation and hard-label training fail as subjectivity grows. Based on the subjectivity coefficient, we propose Subjectivity-Adaptive soft-Label Training (SALT): it pools observed outputs from semantically nearby inputs into soft distributional labels, with an aggregation radius adapted to the estimated subjectivity of each input; in the near-objective limit the neighborhood shrinks, so SALT naturally falls back to standard single-label training. Moreover, since existing datasets record only single observed responses and cannot support distributional evaluation, we construct SUBJSIM, a benchmark of 19,300 contexts covering 193 annotators and 100 subjective questions. Since real-world data typically provide only a single observation per input, our experiments train models from single observed outputs while evaluating them against the full response distributions, verifying feasibility in realistic settings. Results on SUBJSIM demonstrate the advantages of our method.", "link": "https://arxiv.org/abs/2608.19689", "points": {"背景": "旨在解决基于 LLM 的社会仿真中现有准确度评估与硬标签训练因忽略主观性而失效的问题。", "贡献": "提出主观性系数定义软标签训练策略，并构建大规模基准 SUBJSIM 验证方法可行性与优越性。", "合理性": "基于人类行为分布特性设计的软硬标签自适应机制逻辑严密，且实验设置贴合真实数据场景。", "清晰度": "摘要结构严谨，从问题根源到方法创新再到验证实验层层递进，重点突出清晰明确。"}, "kind": "paper", "abstract": "LLM-based social simulation is a promising complement to traditional methods such as surveys and behavioral experiments. A core question is how to evaluate the fidelity of LLM-simulated human behavior and optimize LLMs toward it. Prevailing practice evaluates by accuracy, checking whether the model selects the single response observed from a human, and trains the LLM to reproduce this hard label. However, human behavior is inherently subjective: the same person in the same situation may reasonably act differently, so an observed response is only one draw from an underlying response distribution, rendering accuracy-based evaluation unreliable and hard-label training misleading. To address these problems, we first introduce the subjectivity coefficient, an entropy-based quantity distinguishing objective tasks such as coding from subjective ones such as social simulation, and use it to systematically analyze how accuracy-based evaluation and hard-label training fail as subjectivity grows. Based on the subjectivity coefficient, we propose Subjectivity-Adaptive soft-Label Training (SALT): it pools observed outputs from semantically nearby inputs into soft distributional labels, with an aggregation radius adapted to the estimated subjectivity of each input; in the near-objective limit the neighborhood shrinks, so SALT naturally falls back to standard single-label training. Moreover, since existing datasets record only single observed responses and cannot support distributional evaluation, we construct SUBJSIM, a benchmark of 19,300 contexts covering 193 annotators and 100 subjective questions. Since real-world data typically provide only a single observation per input, our experiments train models from single observed outputs while evaluating them against the full response distributions, verifying feasibility in realistic settings. Results on SUBJSIM demonstrate the advantages of our method.", "title_cn": "重思基于大语言模型的社会模拟评估与优化", "abstract_cn": "基于大语言模型的社会模拟是对传统调查和行为实验等方法的一种有前景的补充。核心问题是如何评估大语言模拟的人类行为保真度并据此优化模型。现有实践通过准确性进行评估，检查模型是否选择了从人类观察到的单一响应，并训练模型重现这一硬标签。然而，人类行为本质上具有主观性：同一人在同一情境下合理地可能采取不同行动，因此观察到的响应只是潜在响应分布中的单次抽取，导致基于准确性的评估不可靠，基于硬标签的训练具有误导性。为解决这些问题，我们首先引入主体性系数，这是一个基于熵的数量，用于区分编码等客观任务与社会模拟等主观任务，并利用其系统性地分析随着主体性增加，基于准确性的评估和基于硬标签的训练如何失效。基于主体性系数，我们提出了主体性自适应软标签训练（SALT）：它将语义邻近输入的观察输出池化为软分布标签，并聚合半径根据每个输入的估计主体性进行自适应调整；在近客观极限下，邻域收缩，因此 SALT 自然退化为标准单标签训练。此外，由于现有数据集仅记录单一观察响应且无法支持分布式评估，我们构建了涵盖 19,300 个语境、193 名标注者和 100 个主观问题的 SUBJSIM 基准。由于现实世界数据通常仅提供单次观察，我们的实验从单一观察输出训练模型，并将其评估针对完整响应分布，验证了其在现实场景中的可行性。SUBJSIM 上的实验结果证明了该方法的优势。", "interpret": "大语言模型（LLM）在社会模拟研究中展现出巨大潜力，是对传统问卷调查和实验的重要补充。然而，现有评估方法过度依赖“答案准确性”，即要求模型复现特定受访者的具体回答。这种方法存在根本缺陷：人类行为本质上是主观且概率分布的，同一人在同一情境下可能产生不同反应。因此，将单次回答视为唯一标准既不可靠，也难以指导模型学习。\n\n本研究提出通过“主观性系数”来优化评估体系。该系数基于信息熵理论，能有效区分客观任务（如编程）与主观任务（如社会模拟），避免用错误的标准衡量 LLM 的社会行为生成质量。这一突破不仅重新定义了 AI 对人类行为的理解，更为未来构建更逼真、更具泛化能力的社会仿真系统提供了核心理论支撑，推动科研从“硬标签拟合”转向“概率分布还原”。", "interpret_v": 3, "featured_date": "2026-08-21", "num": 29}, {"title": "World-Model-Grounded LLM Planning for AUV and ASV Navigation Near Offshore Wind Farms", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T13:56:25+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Large language models can turn a natural-language mission into a sequence of robot actions, but they do not have a sense of physics: they cannot judge how long a command should run, or whether it will make the robot drift into an obstacle. We proposed the use of a world model to expand the capabilities of Large Language model-based planners. Our method has three components: a physics-grounded neural world model, a three-phase gradient-based trajectory optimizer, and a Model Predictive Controller (MPC)-style closed-loop replanner with a trust-region guard. The language model decides what to do, and the world model decides how long, whether that means driving eight thrusters through 6 DOF or two differential thrusters through 3 DOF. We evaluate two marine vehicle classes operating near offshore wind infrastructure: a 6-DOF Autonomous Underwater Vehicle (AUV) and a 3-DOF differential-drive Autonomous Surface Vehicle (ASV). In five benchmark missions per platform, both vehicles reach every goal with zero predicted collisions, and both transfer to GazeboSim under ocean current, waves, and thruster dynamics, remaining collision-free and cutting GazeboSim goal-distance error versus the ungrounded baseline by 70-82% (ASV) and roughly 93% (AUV), after a residual fine-tuning pass that separately reduces surrogate rollout Root Mean Square Error (RMSE) by 60% (AUV) and 69% (ASV). For the ASV we further demonstrate a Vision language model (VLM)-assisted semantic-mapping pipeline that extracts obstacles and environmental context from satellite imagery, nautical charts, and forecast Application Programming Interface (API) instead of onboard sensors, reaching 96% navigability accuracy as a drop-in replacement for hand-specified obstacle geometry.", "link": "https://arxiv.org/abs/2608.19661", "points": {"类别": "方法，融合世界模型与语言规划器的 AUV/ASV 导航新方案。", "背景": "解决纯语言大模型缺乏物理感知导致指令漂移或碰撞的风险。", "贡献": "提出世界模型优化轨迹、闭环重规划及基于图像的无传感器地图构建方法。", "合理性": "仿真与迁移实验数据详实，碰撞零发生且误差显著降低，假设成立可信。", "清晰度": "逻辑结构严谨，从问题定义到技术方案再到定量评估，表述清晰易懂。"}, "kind": "paper", "abstract": "Large language models can turn a natural-language mission into a sequence of robot actions, but they do not have a sense of physics: they cannot judge how long a command should run, or whether it will make the robot drift into an obstacle. We proposed the use of a world model to expand the capabilities of Large Language model-based planners. Our method has three components: a physics-grounded neural world model, a three-phase gradient-based trajectory optimizer, and a Model Predictive Controller (MPC)-style closed-loop replanner with a trust-region guard. The language model decides what to do, and the world model decides how long, whether that means driving eight thrusters through 6 DOF or two differential thrusters through 3 DOF. We evaluate two marine vehicle classes operating near offshore wind infrastructure: a 6-DOF Autonomous Underwater Vehicle (AUV) and a 3-DOF differential-drive Autonomous Surface Vehicle (ASV). In five benchmark missions per platform, both vehicles reach every goal with zero predicted collisions, and both transfer to GazeboSim under ocean current, waves, and thruster dynamics, remaining collision-free and cutting GazeboSim goal-distance error versus the ungrounded baseline by 70-82% (ASV) and roughly 93% (AUV), after a residual fine-tuning pass that separately reduces surrogate rollout Root Mean Square Error (RMSE) by 60% (AUV) and 69% (ASV). For the ASV we further demonstrate a Vision language model (VLM)-assisted semantic-mapping pipeline that extracts obstacles and environmental context from satellite imagery, nautical charts, and forecast Application Programming Interface (API) instead of onboard sensors, reaching 96% navigability accuracy as a drop-in replacement for hand-specified obstacle geometry.", "title_cn": "面向海上风电场周边航行环境的基于世界模型的 AUV 与 ASV 大语言模型规划", "abstract_cn": "大语言模型虽能将自然语言指令转化为机器人动作序列，却缺乏对物理世界的感知能力，无法判断指令持续时间或预判是否会与障碍物发生碰撞。本文提出引入世界模型以扩展基于大语言模型的规划能力，该方法包含三个核心组件：基于物理机理的神经网络世界模型、基于梯度的三阶段轨迹优化器，以及具有置信区域约束的模型预测控制（MPC）式闭环重规划器。语言模型负责决策“做什么”，而世界模型则决定“做多久”，这涵盖了从六自由度（6-DOF）推进到八轴推力器，或从三自由度（3-DOF）差速推进器到双推力器的动作跨度。本研究在两类于海上风电基础设施附近航行的海洋平台（6-DOF 自主水下航行器 AUV 与 3-DOF 差速驱动自主水面航行器 ASV）上进行了评估，包含五个基准任务。两种平台均实现了零预测碰撞并成功抵达目标，且在 GazeboSim 仿真环境中考虑了洋流、波浪及推进器动力学后，仍能保持无碰撞状态，相较于无世界模型的基准方法，将目标距离误差分别降低了 70%-82%（ASV）和约 93%（AUV）。最后，在 ASV 上进一步验证了基于视觉语言模型（VLM）的语义建图管道，该技术能从卫星图像、航海图及预报应用程序接口（API）中提取障碍物与环境信息，而无需依赖机载传感器，作为预定义障碍物几何形状的替代品实现了 96% 的导航可达性准确率。", "interpret": "大型语言模型虽能将自然语言指令转化为机器人动作，却缺乏对物理世界的直观感知，难以判断指令时长或避障效果。本文提出将“世界模型”融入大语言模型规划器，构建了一套具备物理推理能力的海洋车辆导航新框架。该方法包含三大核心：基于物理的神经世界模型、三阶段梯度轨迹优化器，以及带有信任区域保护的闭环重新规划器。通过实验验证，该框架在六自由度（6-DOF）自主水下机器人（AUV）和差速驱动式自主水面艇（ASV）两种海工场景中均表现优异。关键在于让语言模型决定“做什么”，而世界模型辅助计算“何时做”及“如何实现”（如六自由度全姿态控制或三维差速驱动）。这一突破解决了现有 AI 导航器“有想法无手感”的痛点，显著提升了海洋作业在复杂风场环境下的安全性与自主性，为深远海智能装备提供了重要的技术范式。", "interpret_v": 3, "num": 30}, {"title": "Mitigating Identity Essentialism in LLM Agents with Longitudinal Life Trajectories", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-20T12:13:11+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Large language models (LLMs) offer a scalable approach to social simulation, but their credibility depends on how agents are constructed. Existing methods can partially reproduce population-level patterns, yet often fail to capture human-like diversity. Our analysis shows that static-profile agents exhibit stronger demographic separation and within-group compression than humans, a pattern consistent with identity essentialism: demographic labels can encourage models to treat group-average tendencies as individual traits, homogenizing responses within groups. We argue that this limitation arises from two related factors: sparse, static agent representations and the limited ability of prompt-only memory to persistently integrate experience. Inspired by complementary memory systems, we propose LifeMem, a longitudinal memory framework that combines structured life-event retrieval with agent-specific parametric memory for experience integration. Experiments on Add Health and Understanding Society with three LLMs show that LifeMem improves alignment with human data in terms of response distributions, overall and within-group diversity, and patterns of within-person response change across life stages. These findings highlight the value of longitudinal life-event memory for constructing more faithful and dynamically evolving social agents.", "link": "https://arxiv.org/abs/2608.19621", "points": {"类别": "方法类创新，针对 LLM 社会仿真中的身份本质主义提出长程记忆框架", "背景": "现有静态代理虽能复现宏观模式，却无法捕捉人类个体的多样性与变化轨迹", "贡献": "提出结合事件检索与参数化存储的 LifeMem 框架，显著提升代理的动态演化能力", "合理性": "实验数据支持其有效性，但缺乏长期跨模型泛化测试以验证极端场景的鲁棒性", "清晰度": "摘要逻辑严密，从问题定义到方案提出及实证结果层层递进，表达专业流畅"}, "kind": "paper", "abstract": "Large language models (LLMs) offer a scalable approach to social simulation, but their credibility depends on how agents are constructed. Existing methods can partially reproduce population-level patterns, yet often fail to capture human-like diversity. Our analysis shows that static-profile agents exhibit stronger demographic separation and within-group compression than humans, a pattern consistent with identity essentialism: demographic labels can encourage models to treat group-average tendencies as individual traits, homogenizing responses within groups. We argue that this limitation arises from two related factors: sparse, static agent representations and the limited ability of prompt-only memory to persistently integrate experience. Inspired by complementary memory systems, we propose LifeMem, a longitudinal memory framework that combines structured life-event retrieval with agent-specific parametric memory for experience integration. Experiments on Add Health and Understanding Society with three LLMs show that LifeMem improves alignment with human data in terms of response distributions, overall and within-group diversity, and patterns of within-person response change across life stages. These findings highlight the value of longitudinal life-event memory for constructing more faithful and dynamically evolving social agents.", "title_cn": "利用纵向生命轨迹缓解大语言模型 Agents 的身份本质主义", "abstract_cn": "大型语言模型提供了可扩展的社会仿真方案，但其可信度取决于代理的构建方式；现有方法虽能部分复现人群层面的模式，却往往无法捕捉人类般的多样性。我们的分析表明，静态画像代理相比人类表现出更强的社会分层与群体内压缩现象，这种模式与身份本质主义一致：即人口学标签促使模型将群体平均倾向视为个体特征，从而在群体内同质化回答。我们认为这一局限性源于两个相关因素：稀疏且静态的代理表示，以及提示仅记忆系统难以持久整合经验的能力。受互补记忆系统的启发，我们提出了 LifeMem，这是一种结合结构化生命事件检索与代理特定参数记忆以整合经验的纵向记忆框架。在 Add Health 与 Understanding Society 数据集上的三项 LLM 实验显示，LifeMem 在回答分布、总体及群体内多样性以及随生命阶段变化的个体回答模式等方面，提升了与人类数据的一致性。这些发现强调了构建更具保真度且动态演化的社会代理所需的纵向生命事件记忆的价值。", "interpret": "大语言模型虽能模拟社会互动，但常因静态身份标签导致“本质主义”，即让群体特征过度同化个体差异。本文指出，现有模型常犯此错误，而通过整合结构化人生事件与体验记忆提出的\"LifeMem\"框架，旨在解决这一难题。该方法利用纵向生命轨迹追踪，使 Agent 能更真实地处理复杂社会经验，打破身份固化。这一创新不仅提升了 AI 在模拟人类多样性上的可信度，也为构建更具共情能力与动态适应性的社会型智能体提供了新范式，推动了人工智能从简单规则匹配向深度情境理解的关键跨越。", "interpret_v": 3, "featured_date": "2026-08-22", "num": 31}, {"title": "数据约束下的混合预训练缩放定律", "source": "Apple Machine Learning Research（RSS）", "sourceShort": "Apple Machine Learning Research", "hue": 209, "domain": "LLM", "ts": "2026-08-20T08:00:00+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "苹果机器学习研究团队通过2000余次语言模型训练实验，系统研究了稀缺目标数据与通用数据混合预训练中的权衡问题。研究发现，目标数据占比过低会导致模型对目标领域暴露不足，而占比过高则因重复样本过多引发收益递减乃至过拟合，为数据约束下的混合预训练策略提供了量化依据。", "link": "https://machinelearning.apple.com/research/scaling-laws-mixture-pretraining", "points": {"类别": "实证研究。通过大规模实验揭示混合预训练中数据配比与性能的非线性关系。", "背景": "源于大模型训练成本高、目标数据稀缺的现实，探索通用数据与垂直数据的最优平衡。", "贡献": "量化证明目标数据占比过低或过高均损害效果，确立收益递减拐点作为策略关键依据。", "合理性": "基于 2000 余次实验数据，发现过拟合与曝光不足的矛盾规律，结论可信但受限于特定数据集分布。", "清晰度": "逻辑链条完整，实验量充分支撑结论，直接回应行业痛点，表达清晰且专业度高。"}, "kind": "paper", "abstract": "苹果机器学习研究团队通过2000余次语言模型训练实验，系统研究了稀缺目标数据与通用数据混合预训练中的权衡问题。研究发现，目标数据占比过低会导致模型对目标领域暴露不足，而占比过高则因重复样本过多引发收益递减乃至过拟合，为数据约束下的混合预训练策略提供了量化依据。", "abstract_cn": "苹果机器学习研究团队通过2000余次语言模型训练实验，系统研究了稀缺目标数据与通用数据混合预训练中的权衡问题。研究发现，目标数据占比过低会导致模型对目标领域暴露不足，而占比过高则因重复样本过多引发收益递减乃至过拟合，为数据约束下的混合预训练策略提供了量化依据。", "interpret": "针对当前人工智能领域通用知识与特定领域知识平衡难的问题，苹果机器学习团队通过分析超过 2000 次实验，系统揭示了在稀缺目标数据与海量通用数据混合预训练中的关键规律。研究表明，数据比例并非线性关系：若目标领域数据占比过低，模型难以充分掌握专业知识；而若占比过高，大量重复样本会引发收益递减甚至导致过拟合。这一量化发现为构建高效模型提供了新依据，意味着在实际应用中，通过优化混合数据策略，既能在保证基础能力的同时，显著提升模型在特定场景下的表现，推动大模型从“通用智能”向“垂直领域专家”的精准演进。", "interpret_v": 3, "num": 32}, {"title": "MemTrapBench：为 LLM 记忆使用中的认知陷阱设立基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI认知算法", "ts": "2026-08-20T08:00:00+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "现有记忆基准多只评估信息提取与检索，却忽视了检索到的记忆如何重塑模型推理并影响当前任务表现。为此研究者推出 MemTrapBench，覆盖推理固着与信念扭曲两类认知陷阱。实验显示，所有被测记忆策略均不如无记忆设置，最强方法性能下降也超过 10%；新提出的 AdaptiveMem 推理期方法可缓解这些陷阱，同时保持或提升标准记忆基准上的表现。", "link": "https://arxiv.org/abs/2608.20202", "points": {"类别": "实证研究，关注 LLM 记忆使用中易被忽视的认知陷阱问题。", "背景": "现有基准仅评估记忆存取准确性，却忽略了检索记忆如何扭曲模型推理与性能。", "贡献": "发现“推理固化”与“信念扭曲”两类陷阱，并基于此设计 MemTrapBench 基准及应对方法 AdaptiveMem。", "合理性": "实验证实强记忆策略均劣于无记忆设置，证明陷阱存在且普遍，方案简单有效。", "清晰度": "逻辑连贯，先定义问题再提出基准与解决方案，结构清晰易读。"}, "kind": "paper", "abstract": "Memory has become a key component of large language models, enabling them to retain information and learn from long-term interactions. However, existing memory benchmarks mainly evaluate whether information is correctly extracted, stored, and retrieved, while largely overlooking how retrieved memories reshape model reasoning and affect performance on the current task. We identify memory-induced cognitive traps: even faithfully recorded and semantically relevant memories can distort model reasoning or beliefs and degrade current task performance. To systematically evaluate these failure modes, we introduce MemTrapBench, which covers two forms of cognitive traps: Reasoning Fixation and Belief Distortion. Experiments across two model families and five representative memory frameworks show that MemTrapBench is challenging: all evaluated memory strategies underperform the no-memory setting, with even the strongest methods suffering drops of more than 10%. To mitigate these cognitive traps, we propose AdaptiveMem, a simple yet effective inference-time method that instructs LLMs to avoid memory traps. AdaptiveMem mitigates cognitive traps on MemTrapBench while preserving or improving performance on standard memory benchmarks across diverse memory frameworks.", "title_cn": "MemTrapBench：为 LLM 记忆使用中的认知陷阱设立基准", "abstract_cn": "记忆已成为大型语言模型的关键组成部分，使其能够保留信息并从长期交互中学习。然而，现有的记忆基准主要评估信息是否正确提取、存储和检索，而 largely 忽视了检索后的记忆如何重塑模型推理并影响当前任务性能。我们识别出了记忆引发的认知陷阱：即使记忆被忠实记录且语义相关，也可能扭曲模型的推理或信念，从而降低当前任务的表现。为了系统性地评估这些失败模式，我们引入了 MemTrapBench，涵盖了两种形式的认知陷阱：推理固化（Reasoning Fixation）和信念扭曲（Belief Distortion）。在两个模型家族和五种代表性记忆框架上的实验表明，MemTrapBench 极具挑战性：所有被评估的记忆策略均不如无记忆设置，且即便是最强的方法也会遭受超过 10% 的性能下降。为缓解这些认知陷阱，我们提出了一种简单而有效的推理时方法 AdaptiveMem，指导大语言模型避开记忆陷阱。AdaptiveMem 在 MemTrapBench 上缓解了认知陷阱，同时在不同记忆框架上保持了或在标准记忆基准测试中提升了性能。", "interpret": "随着大语言模型（LLM）日益依赖记忆机制以处理长程交互，现有评估多仅关注信息的存储与检索准确性，却忽视了记忆如何重塑模型推理过程并影响任务表现。本研究识别出两类关键问题：推理固化与信念扭曲，即即便记忆内容真实且语义相关，仍可能误导模型判断。为此，研究团队构建了 MemTrapBench 基准测试，涵盖上述两种认知陷阱。实验显示，在两大主流模型族及五种代表性记忆框架中，所有采用记忆增强的策略在测试中均不如不使用记忆的基线表现，表明当前模型对记忆的潜在认知偏差缺乏有效防御。这一发现揭示了大模型在结合外部知识时面临的深层挑战，为提升模型的推理鲁棒性与可信度提供了重要警示。", "interpret_v": 3, "num": 33}, {"title": "EXIMO：用 VLM 引导探索来微调 VLA 机器人策略", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-20T08:00:00+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "EXIMO 提出一种高效微调视觉-语言-动作（VLA）策略的三阶段算法：探索、模仿与优化。探索阶段由视觉语言模型（VLM）充当规划器，将长程任务分解为短程子任务并收集编排数据；模仿阶段用该数据微调 VLA；优化阶段采用残差离线策略强化学习进一步提升。实验表明，EXIMO 在样本效率和最终性能上显著优于现有方法。", "link": "https://arxiv.org/abs/2608.19891", "points": {"类别": "方法论文，提出一种基于视觉语言模型引导的 VLA 机器人策略微调算法。", "背景": "解决大参数 VLA 模型在长程任务中通过遥操作数据微调成本高、强化学习样本效率低的问题。", "贡献": "设计探索、模仿、优化三阶段流程，利用 VLM 分解复杂任务并构建协同数据集以高效微调策略。", "合理性": "方法逻辑自洽且通过消融实验验证了各阶段有效性，但依赖 VLM 性能及长程规划能力是潜在局限。", "清晰度": "摘要结构清晰，分阶段阐述创新点与实验结果，专业术语使用准确且易于理解。"}, "kind": "paper", "abstract": "How to efficiently finetune robot policies to learn new tasks on the fly? State of the art robotic manipulation policies are based on behaviour cloning of large vision-language-action (VLA) models with billions of parameters on huge teleoperation datasets. While this simple approach has enabled significant advances for robotic manipulation, finetuning of VLA policies for learning new tasks still remains an open problem. In particular, collecting teleoperation datasets requires hundreds of hours of expensive human labour and the alternative, reinforcement learning (RL), can be notoriously sample-inefficient especially for long-horizon tasks. In addition, RL with VLAs imposes several challenges due to the model's size and architectural design. In this work, we propose EXIMO, an efficient algorithm for finetuning of VLA policies. EXIMO operates in three stages: explore, imitate, and optimize. During the explore phase, EXIMO equips the VLA with a vision language model (VLM) that acts as a planner. The VLM thinks and breaks down challenging long-horizon problems into shorter ones for the VLA. The VLM, together with the VLA, is used to collect an orchestrated dataset on new tasks. During the imitate phase, the VLA is finetuned with the orchestrated data. Finally, during the optimize stage, we use residual off-policy RL to further finetune the policy. In our experiments, we ablate all three stages of EXIMO and show that it outperforms existing approaches significantly in terms of sample-efficiency and final performance.", "title_cn": "EXIMO：用 VLM 引导探索来微调 VLA 机器人策略", "abstract_cn": "如何高效微调机器人策略以实时学习新任务？当前最先进的机器人操作策略基于在包含数十亿参数的巨大遥操作数据集上对大型视觉 - 语言 - 行动（VLA）模型进行行为克隆。虽然这种简单的方法为机器人操作带来了显著进展，但 VLA 策略的学习新任务仍遗留微调问题。特别是，收集遥操作数据集需要数百小时昂贵的劳动力，而替代方案强化学习（RL）在样本效率方面尤为低下，尤其是对于长视距任务。此外，VLA 与 RL 的结合由于模型规模和架构设计而面临诸多挑战。在这项工作中，我们提出了 EXIMO，一种用于微调 VLA 策略的高效算法。EXIMO 在三个阶段运行：探索、模仿和优化。在探索阶段，EXIMO 为 VLA 配备了一个作为规划器的视觉语言模型（VLM）。VLM 思考和将具有挑战性的长视距问题分解为更短的任务。VLM 与 VLA 一起用于在新型任务上收集协调数据集。在模仿阶段，使用协调数据微调 VLA。最后，在优化阶段，我们使用残差离线策略 RL 进一步微调策略。在我们的实验中，我们消融了 EXIMO 的所有三个阶段，并表明其在样本效率和最终性能方面显著优于现有方法。", "interpret": "现有机器人策略多依赖海量人机演示数据通过行为克隆微调，虽有效但受限于昂贵的人工采集成本，且替代方案强化学习在长程任务中样本效率低。针对大视语言动作模型（VLA）微调难题，本研究提出 EXIMO 算法，创新性地利用视觉 - 语言模型（VLM）引导机器人自主探索以高效获取新任务数据。该方法分三阶段运行：先由 VLM 规划探索路径，再基于探索与示范数据构建数据集，最后进行策略优化。EXIMO 避免了传统方法对昂贵标注数据的依赖，显著提升了大模型在未知任务上的适应能力。这不仅为机器人解决长程规划与少样本学习难题提供了新路径，也为工业场景中机器人快速部署和新技能习得奠定了实用基础。", "interpret_v": 3, "num": 34}, {"title": "PolicyGuide：从单步守护到全流程引导的合规 LLM 智能体", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-20T08:00:00+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "PolicyGuide 将领域策略编译为工作流图，并在用户轮次边界调用主动验证器，从持久化图状态协调未决请求、返回合规路径上的分步修复。", "link": "https://arxiv.org/abs/2608.19861", "points": {"类别": "系统，提出将组织策略编译为工作流图并集成前置验证的智能体框架", "背景": "现有运行时防护仅能阻断风险动作，无法引导多步骤流程中的合规执行", "贡献": "PolicyGuide 实现全流程主动验证，显著跨多个行业提升策略遵循与抗攻击能力", "合理性": "基于实测数据展示多领域有效性且覆盖不同代理模型，实验设计与结论可信", "清晰度": "摘要逻辑严密，创新点与数据结果对应清晰，技术细节表达准确易读"}, "kind": "paper", "abstract": "Customer-service LLM agents must follow organizational policy when acting on a user's behalf. Compliance failures arise from either forbidden actions, such as granting an ineligible change, or omitted procedural requirements, such as identification or confirmation. Runtime safeguards can intervene on risky actions, but action-local checks do not guide an agent through a multi-step procedure. Workflow-following systems support prescribed process execution, but primarily target workflow completion rather than safeguarding agent behavior. PolicyGuide instead compiles each domain policy into a workflow graph and invokes a proactive verifier at user-turn boundaries. From persisted graph state, the verifier reconciles open requests and returns step-specific remediation along a policy-compliant path. Across the $τ^2$-bench airline, retail, and telecom domains with a GPT-5.4 agent and verifier, PolicyGuide raises mean $\\mathrm{Pass}^4$ from $0.42$ to $0.62$, with the largest gain on telecom ($0.19$ to $0.61$), the most workflow-structured domain. The same workflows transfer to Claude Sonnet 4.6 and Gemini 2.5 Pro agents. Complementary evaluations find the lowest observed attack-success rate under adversarial users and the strongest procedural compliance in an author-designed workflow-level validation.", "title_cn": "PolicyGuide：从单步守护到全流程引导的合规 LLM 智能体", "abstract_cn": "客户服务大语言模型代理在代表用户执行任务时须遵循组织政策，合规失败源于被禁止的操作或省略的程序性要求。运行时保障措施可干预高风险操作，但基于操作的检查无法引导代理完成多步流程；虽然流程遵循系统主要支持既定执行的完成，却未侧重于保障代理行为。PolicyGuide 将各领域的政策编译为工作流图，并在用户轮次边界调用主动验证器；基于持久化的图状态，验证器可重复合并的待处理请求，并提供沿合规路径的特定步骤补救方案。在航空、零售和电信三个领域的$τ^2$测试基准上，配合 GPT-5.4 代理与验证器，PolicyGuide 将平均通过率从 0.42 提升至 0.62，其中电信（最结构化流程的领域）提升幅度最大（0.19 至 0.61）；相同的工作流亦可迁移至 Claude Sonnet 4.6 和 Gemini 2.5 Pro 代理。补充评估显示，该方案在对抗性用户下的攻击成功率最低，且在作者设计的工作流级验证中展现出最强的程序性合规性。", "interpret": "在客户服务场景中，让大型语言模型（LLM）代理执行任务时，必须严格遵循组织政策。然而，违规往往源于禁止的操作或遗漏必要的程序步骤（如身份确认）。传统的运行时防护仅能拦截高风险动作，而无法指导多步骤流程；现有的工作流系统虽能确保任务完成，却缺乏对代理行为的主动保障。PolicyGuide 创新地将各领域政策编译为工作流图，并在用户交互边界调用主动验证器。该系统利用持久化的图状态比对待办请求，沿合规路径提供具体修复建议。在涵盖航空、零售和电信等多个领域的实验中，该框架成功实现了从单步防护到全流程引导的跨越，显著提升了 LLM 代理在复杂业务场景中的合规性与可靠性，为构建可信的 AI 服务提供了新范式。", "interpret_v": 3, "num": 35}, {"title": "EnvHarness：为智能体学习唤醒静态环境", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-20T08:00:00+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "EnvHarness 提出一种可编程插件层，在不修改底层逻辑的前提下重塑静态环境行为，并配套 EnvRigger 将目标策略视为黑盒，通过观察执行轨迹自动合成组件。在四个领域的五个基准上，EnvHarness 超越原始环境与领域专用生成管线，在保留实例上最高提升 9.0 分，同时减少 9.8% 执行步骤，并为强化学习提供更优的优化信号。", "link": "https://arxiv.org/abs/2608.19880", "points": {"类别": "系统/实证研究，一种通用框架可动态重塑静态环境以提升智能体表现。", "背景": "解决大模型智能体在固定环境中进步停滞及环境构建工程负担大的问题。", "贡献": "提出插件式 EnvHarness 与黑盒自动化工具 EnvRigger 实现环境与策略协同进化。", "合理性": "在五个基准测试中显著优于传统方法且保持验证器有效性，方法逻辑严谨可信。", "清晰度": "摘要结构清晰，从问题痛点到解决方案及实验结果层层递进，易于理解。"}, "kind": "paper", "abstract": "LLM agents learn by interacting with environments, yet these environments are hand-built and static: blind to an agent's weaknesses, and quickly left behind as it improves. While recent environment generation methods attempt to address this, they require domain-specific pipelines, rely on expensive or unreliable verifiers, and still produce static environments. To alleviate the engineering burden of rebuilding environments from scratch, we propose Environment Harness (EnvHarness), a programmable layer of plug-in components that wraps a static environment to reshape its behavior without modifying the underlying logic. Operating through standard interfaces, EnvHarness applies across diverse domains while ensuring every reshaped environment retains its original verifier. To automate this process, we introduce EnvRigger, which treats the target policy as a black box, observing its execution trajectories to synthesize EnvHarness components targeting diagnosed flaws, and validating them via fresh rollouts. Across five benchmarks in four domains, EnvHarness outperforms both original environments and domain-specific environment generation pipelines, achieving up to a 9.0-point improvement on held-out instances with 9.8% fewer execution steps. Furthermore, EnvHarness provides a superior optimization signal for reinforcement learning, enabling continuous, targeted co-evolution of the policy and its environment.", "title_cn": "EnvHarness：为智能体学习唤醒静态环境", "abstract_cn": "大语言模型代理通过与环境交互进行学习，但这些环境通常是人工构建且静态的：它们对代理的弱点视而不见，且随着代理能力的提升迅速过时。虽然最近的环境生成方法试图解决这一问题，但它们需要特定领域的流水线、依赖昂贵或不可靠的验证器，并且仍产生静态环境。为减轻从零开始重新构建环境的工程负担，我们提出了环境训练器（EnvHarness），这是一种由可插件组件构成的可编程层，它封装了静态环境以重塑其行为，而无需修改底层逻辑。EnvHarness 通过标准接口运行，适用于多个不同领域，并确保每个重塑后的环境保留其原始验证器。为了自动化这一过程，我们引入了 EnvRigger，它将目标策略视为黑盒，通过观测其执行轨迹来合成针对诊断缺陷的 EnvHarness 组件，并通过新的运行序列进行验证。在四个领域中的五个基准测试中，EnvHarness 的表现优于原始环境和特定领域的环境生成流水线，在保留实例上带来了高达 9.0 分的提升，且执行步骤减少了 9.8%。此外，EnvHarness 为强化学习提供了更优的优化信号，支持策略与其环境之间的持续、针对性协同进化。", "interpret": "大型语言模型驱动的智能体学习依赖交互环境，但现有环境多为人工构建的静态平台，无法感知智能体的短板，也滞后于其能力进化。尽管已有环境生成方法试图解决这一问题，却往往依赖特定领域的复杂管道、昂贵的验证器，且最终仍产出静态环境。为此，研究提出 EnvHarness，这是一种可编程的插件层，可在不修改底层逻辑的前提下重塑静态环境的行为，从而动态适配智能体的成长。为自动实现该过程，团队开发了 EnvRigger，它将目标策略视为“黑盒”，通过观察其执行表现来驱动环境调整。这项研究降低了重新构建环境的工程负担，确保了验证逻辑的连续性，为智能体在更真实、动态的反馈中自我迭代提供了通用解决方案。", "interpret_v": 3, "num": 36}, {"title": "SWE-bench Science：编码智能体能否解决科学领域的工程任务？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-20T08:00:00+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "研究团队推出 SWE-bench Science，一个覆盖 20 个科学领域、98 个 GitHub 仓库、共 119 项任务的仓库级科学软件工程基准。即使表现最佳的智能体 Claude Code with Opus-5（max），pass@1 也不足 50%。配对消融实验显示，科学知识并非一律有益：良好对齐的信息能提升平均性能与 token 效率，而错位的引导可能引发锚定效应。", "link": "https://arxiv.org/abs/2608.19799", "points": {"类别": "基准评测，提出首个专注于科学软件工程的编码智能体评估集合", "背景": "源于科学计算依赖软件且现有评测缺乏对科学软件失败原因的深度分析", "贡献": "构建含 119 项任务的新基准，揭示智能体修复失败机制并验证科学引导的双刃剑效应", "合理性": "基于真实 GitHub 仓库数据，实验设计严谨但受限于当前大模型在复杂科学推理上的通用瓶颈", "清晰度": "结构逻辑严密，从问题提出到实证结果层层递进，术语使用规范准确"}, "kind": "paper", "abstract": "Software increasingly functions as part of the scientific instrument itself, making failures in scientific code capable of compromising not only program behavior but also the evidence underlying scientific conclusions. Yet existing evaluations of coding agents largely emphasize aggregate task success, providing limited insight into why agents fail when repairing scientific software. We introduce \\textbf{SWE-bench Science}, a repository-level benchmark for scientific software engineering comprising 119 tasks from 98 GitHub repositories across 20 scientific domains. Each task is organized into one of three paradigms: Issue-driven, Expert-exploratory, and Engineering-integration. Even the best-performing agent, \\textbf{Claude Code with Opus-5 (max), achieves a pass@1 below 50\\%}, highlighting the substantial challenges posed by scientific software engineering. We identify four recurring failure mechanisms: deficits in scientific knowledge or abstraction, misguided exploration or surface-level repair, incomplete repair coverage or system integration, and failures to generalize scientific knowledge beyond observed cases in our analysis. We further conduct a paired ablation that removes explicit scientific guidance while preserving the repository and executable engineering context. The results show that scientific knowledge is not uniformly beneficial: well-grounded information can constrain repair and improve average performance and token efficiency, whereas poorly aligned guidance can induce anchoring and does not necessarily improve exact repair success. Together, SWE-bench Science provides a broad testbed for studying both the capabilities and failure mechanisms of coding agents in scientific software engineering.", "title_cn": "SWE-bench Science：编码智能体能否解决科学领域的工程任务？", "abstract_cn": "软件日益成为科学仪器的一部分，科学代码的故障不仅会影响程序行为，还可能破坏支撑科学结论的证据。然而，现有的代码代理评估大多强调整体任务成功率，未能深入揭示代理在修复科学软件时失败的原因。我们引入了软件科学工程基准（SWE-bench Science），该基准包含来自 20 个科学领域 98 个 GitHub 仓库的 119 个任务，任务分为问题驱动、专家探索性和工程集成三种范式。即使是表现最好的代理——配备 Opus-5(max) 的 Claude Code，其单样本通过率也低于 50%，凸显了科学软件工程面临的巨大挑战。我们在分析中识别出四种常见的失败机制：科学知识或抽象能力不足、错误的探索或浅层修复、修复覆盖不全或系统整合失败，以及无法泛化至未观察到的科学案例。我们进一步进行了一项配对消融实验，移除了显式科学指导同时保留仓库和可执行工程上下文。结果显示科学知识并非 uniformly 有益：经过良好验证的信息可以约束修复过程并提高平均性能和 token 效率，而导向不佳的指导则会引发锚定效应，并不一定能提升精确修复成功率。总之，SWE-bench Science 为研究科学软件工程中文本编码代理的能力与失败机制提供了广泛的测试床。", "interpret": "随着软件日益成为科学研究的“仪器”本身，科学代码的失败不仅会导致程序异常，更会直接动摇科学结论的证据基础。然而，现有的编码智能体评估多关注总体任务成功率，却难以解释智能体在修复科学软件时为何失败。为此，研究引入了 SWE-bench Science，构建了一个包含 20 个科学领域、98 个仓库及 119 个任务的基准测试，涵盖问题驱动、专家探索与工程集成三种范式。实验结果显示，即便是表现最优的 Claude Code with Opus-5，其单次通过率也低于 50%，凸显了科学软件工程面临的严峻挑战。这一发现不仅揭示了当前人工智能在处理复杂科研代码时的局限，也为推动更可靠的自主科学发现提供了关键数据支撑。", "interpret_v": 3, "num": 37}, {"title": "Beyond Multimodal Alignment: Certifying Physical Language through Response Substitution and Ordered Execution", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T07:04:53+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "World models increasingly treat compact multimodal representations as interfaces between perception and physical interaction, yet existing probes do not establish whether different sensors carry the same executable meaning or whether that meaning survives a new action composition. We introduce an operational capability hierarchy and the Disjoint-Bridge Operator-Substitution Certificate (DBOSC), which asks whether independently trained modality compilers enter a frozen response chart interchangeably on evidence outside their training panels. On Cluster Haptic, audio and acceleration representations of the same unseen surface are 4.5x closer in response space than wrong-surface pairings, with the gap holding for all 19 held-out surfaces; unsealing withheld responses confirms that every branch predicts the physics better than the population chart. We then test ordered execution in a controlled elastoplastic system with complementary modality blind spots. At the pre-registered budget, the prerequisite refuses the stack because the frozen executor cannot advance even an exact chart coordinate through a held-out program. At a converged budget, the same rank-three chart executes those programs (oracle NMSE 0.18), fusion improves on both modalities, and 14 of 16 registered checks pass; the two failures arise because a diagonal restriction of the fused information matrix performs as well as the full one. Clearing the gate is a property of the executor, not the chart: an executor emitting whole programs instead of shared per-step dynamics is 38x worse than an entity-blind predictor on the same chart. A matching non-identifiability result explains why compression and fusion alone cannot determine an unseen composition law. These results separate attribute access, response substitution, fusion closure, and ordered execution into distinct, separately testable achievements.", "link": "https://arxiv.org/abs/2608.19492", "points": {"类别": "实证研究，提出物理语言的可验证性层级与认证框架。", "背景": "针对世界模型中多模态对齐不足及物理意义不可执行的问题。", "贡献": "引入 DBOSC 证书与操作层级，量化验证多模态表示的物理一致性与执行可靠性。", "合理性": "实验数据支撑力强，但依赖特定数据集，泛化至全新场景需进一步验证。", "清晰度": "逻辑结构严密，结论明确，技术细节丰富但不影响核心观点表达。"}, "kind": "paper", "abstract": "World models increasingly treat compact multimodal representations as interfaces between perception and physical interaction, yet existing probes do not establish whether different sensors carry the same executable meaning or whether that meaning survives a new action composition. We introduce an operational capability hierarchy and the Disjoint-Bridge Operator-Substitution Certificate (DBOSC), which asks whether independently trained modality compilers enter a frozen response chart interchangeably on evidence outside their training panels. On Cluster Haptic, audio and acceleration representations of the same unseen surface are 4.5x closer in response space than wrong-surface pairings, with the gap holding for all 19 held-out surfaces; unsealing withheld responses confirms that every branch predicts the physics better than the population chart. We then test ordered execution in a controlled elastoplastic system with complementary modality blind spots. At the pre-registered budget, the prerequisite refuses the stack because the frozen executor cannot advance even an exact chart coordinate through a held-out program. At a converged budget, the same rank-three chart executes those programs (oracle NMSE 0.18), fusion improves on both modalities, and 14 of 16 registered checks pass; the two failures arise because a diagonal restriction of the fused information matrix performs as well as the full one. Clearing the gate is a property of the executor, not the chart: an executor emitting whole programs instead of shared per-step dynamics is 38x worse than an entity-blind predictor on the same chart. A matching non-identifiability result explains why compression and fusion alone cannot determine an unseen composition law. These results separate attribute access, response substitution, fusion closure, and ordered execution into distinct, separately testable achievements.", "title_cn": "超越多模态对齐：通过响应替换和有序执行验证物理语言", "abstract_cn": "世界模型越来越多地将紧凑的多模态表示视为感知与物理交互之间的接口，然而现有探针尚未确立不同传感器是否承载相同的可执行含义，或该含义是否能经受新动作组合的检验。我们引入了一种操作能力层级以及“异构桥接算子 - 替换证书”（DBOSC），旨在验证独立训练的模态编译器是否在训练面板之外的证据上能够互换进入冻结的响应图表。在 Cluster Haptic 数据集上，对未见过表面的音频与加速度表示在响应空间中比错误表面配对更近 4.5 倍，且该差距在所有 19 个测试表面上一致成立；解锁被保留的响应证实，每个分支预测物理规律的能力均优于整体图表。随后，我们在具有互补模态盲区的可控弹塑性系统中测试了有序执行能力。在预注册的预算下，前提条件拒绝了该栈，因为冻结的执行器无法通过未见的程序推进任何精确的图表坐标。在收敛的预算下，同一秩三图表能够执行这些程序（oracle 均方根误差为 0.18），融合效果优于两种模态，16 项注册检测中有 14 项通过；两次失败源于融合信息矩阵的对角线限制与完整限制效果相当。“清除关卡”是执行器的属性而非图表的属性：一个输出完整程序而非分步动态的执行器，在同一样图上比仅输出实体盲预测的执行器差 38 倍。一个匹配的不可识别性结果解释了为何仅凭压缩和融合无法确定未见过的组成定律。这些结果将属性访问、响应替换、融合封闭和有序执行分离为四个可单独测试的成就。", "interpret": "世界模型正将多模态表征视为连接感知与物理交互的通用接口，但现有技术尚无法确认不同传感器是否具备统一的物理语义，或在组合新动作时保持这种一致性。为此，本研究提出了“操作能力层级”及\"DBOSC 证书”，旨在验证独立训练的模态编译器是否能在未见过的场景中对同一物理现象做出可互换的响应。实验发现，在集群触觉数据中，针对未见表面，音频与加速度信号的表征在响应空间中与正确配对的距离是错误配对的四倍半，且这一优势在所有未公开表面中均稳定存在；进一步解密封藏响应证实，每个分支对物理规律的预测精度均优于整体群体分布。该成果通过引入形式化的物理语言认证机制，解决了多模态系统中语义歧义与执行不一致的核心难题，为构建真正具备通用物理推理能力的智能体提供了关键验证标准。", "interpret_v": 3, "num": 38}, {"title": "Learning the Right Abstraction: Neural Reduced Dynamics for Complex Robot Control", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-20T02:41:27+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "High-fidelity embodied AI simulators provide realistic evaluation of complex robotic systems, but their computational cost limits their direct use for large-scale reinforcement learning campaigns. We advocate the use of less accurate but more expeditious simulations, which might draw on data-driven, e.g., neural dynamics, models. This contribution argues that the practical value of a neural dynamics model for complex robot control lies in learning the \\emph{right abstraction}: a reduced state that preserves the control-relevant physics of the high-fidelity system while enabling high-throughput policy learning. We develop a neural reduced dynamics (NRD) framework that separates the state the model propagates from what can be supplied as an input or recovered analytically, trains policies entirely inside the frozen learned model, and validates them back in the high-fidelity simulator. Two case studies instantiate it across three control tasks: terrain-aware HMMWV trajectory tracking on rigid, bumpy and deformable Continuum Representation Model (CRM) terrain; and goal reaching for a stock tracked vehicle and its front-mounted articulated arm. Every policy transfers back to the high-fidelity simulator. A single policy trained inside the terrain-conditioned dynamics model, and given no terrain input of its own, attains lower median and mean tracking error than both single-terrain specialists on all three terrains, including zero-shot bumpy terrain. Quantitatively, the tracked vehicle reaches 100 of 100 goals and the arm 97 of 100, with zero contacts or joint-limit violations. The NRD models advance roughly four orders of magnitude faster in simulated time than the high-fidelity simulator scenes they replace, making iterative on-policy learning practical and supporting neural reduced dynamics as a bridge between accurate but expensive physics simulation and scalable robot learning.", "link": "https://arxiv.org/abs/2608.19375", "points": {"背景": "高保真物理仿真计算开销大，限制了强化学习大规模训练的实际应用。", "贡献": "定义“恰当抽象”概念，实现从训练到验证的闭环，并在多地形与多任务任务中验证。", "合理性": "实验结果数据详实，转移成功率与速度提升显著，方案逻辑严谨且可信。", "清晰度": "摘要结构清晰，从问题定义到方法验证层层递进，表述专业准确易懂。"}, "kind": "paper", "abstract": "High-fidelity embodied AI simulators provide realistic evaluation of complex robotic systems, but their computational cost limits the
