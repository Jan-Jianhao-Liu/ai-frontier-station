"kind": "paper", "abstract": "Action-conditioned video world models require low-latency causal generation and reliable responses to game-native controls. Although causal distillation enables one- or few-step video synthesis, extending it to interactive world models remains challenging, as discrete keyboard states and continuous mouse motion must remain aligned with temporally compressed latent chunks during causal training and autoregressive rollout. We introduce ForgeWM, a progressive framework that transforms a bidirectional action-conditioned video generator into efficient few-step world models through domain adaptation, teacher-forced causal training, causal consistency distillation, and on-policy distribution matching with a bidirectional teacher. The resulting budget-specialized students operate at steady-state denoising budgets of 1, 2, and 4 steps. ForgeWM further supports a dual-path deployment protocol combining latency-critical interaction with optional replay-time refinement, where the one-step student re-noises and refines its saved draft. On paired Minecraft trajectories, ForgeWM leads the evaluated systems in Imaging Quality, reference-aligned motion-profile agreement, action-sign accuracy, and mouse-control accuracy, while achieving the lowest reference LPIPS; the same four-stage recipe transfers to gamepad-controlled FPS gameplay. Replay-time refinement matches four-step reference quality while remaining roughly three times closer to the experienced trajectory than regeneration from noise. These results demonstrate ForgeWM's effectiveness for controllable few-step video generation.", "title_cn": "ForgeWM：面向少步动作条件视频世界模型的渐进式因果训练", "abstract_cn": "动作条件视频世界模型需要低延迟的因果生成及对原生游戏控制的可靠响应。虽然因果蒸馏可实现一步或少数步视频合成，但将其扩展为交互式世界模型仍具挑战，因为离散键盘状态与连续鼠标运动需在因果训练及自回归展开期间与压缩的时间潜块保持一致。我们提出了 ForgeWM，这是一个通过领域适应、教师强制因果训练、因果一致性蒸馏以及与双向教师进行策略分布匹配，将双向动作条件视频生成器转化为高效少步世界模型的渐进式框架。生成的模型在 1、2 和 4 步的稳态去噪预算下运行。ForgeWM 还支持一种双路径部署协议，结合关键交互与可选的回放时间精化，其中一步模型对其保存的草稿重新加入噪声并进行精化。在成对的《我的世界》轨迹上，ForgeWM 在图像质量、参考对齐运动配置一致性、动作信号准确性及鼠标控制准确性等指标上均优于评估系统，同时实现了最低的参考 LPIPS；相同的四阶段配方同样适用于手柄控制的第一人称射击游戏。回放时间精化能达到四步参考质量，且距离经验轨迹近约三倍，优于从噪声再生。这些结果证明了 ForgeWM 在可控少步视频生成方面的有效性。", "interpret": "动作条件视频世界模型在游戏交互中面临低延迟与响应可靠性的双重挑战，尤其是离散键盘状态与连续鼠标轨迹难以与压缩后的潜空间对齐。ForgeWM 提出一种渐进式因果训练框架，通过领域适应、教师强化的因果训练及双向教师分布匹配等技术，将双向动作条件视频生成器转化为高效的多步世界模型。该框架支持 1 至 4 步的稳定去噪预算，显著降低了推理延迟。研究证明了其在保持生成质量的同时能有效扩展交互范围，解决了当前多步生成中的因果一致性问题。这一成果为开发更流畅、低延迟的交互式 AI 世界模型提供了新思路，有助于提升复杂场景下的智能决策能力与应用效率。", "interpret_v": 3, "num": 116}, {"title": "训练留痕：语言模型血统验证的居中残差签名", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "一项新研究提出数据无关的白盒血统验证方法，仅凭权重即可判断两个兼容模型检查点是否同源。该方法在残差-MLP和GPT-2基准上以AUROC=1.0区分微调、LoRA合并、剪枝和量化后代与独立及蒸馏模型，速度比最接近的稳健基线快76倍。案例研究正确识别了3个相关和7个无关的LLaMA-2公开检查点。", "link": "https://arxiv.org/abs/2608.14929", "points": {"类别": "方法，提出基于权重的数据留痕血统验证框架。", "背景": "解决开源语言模型经微调、量化等操作后血缘不清的问题。", "贡献": "构建残差去混淆线粒体得分，实现无数据下的血统分离验证。", "合理性": "在六家模型家族上表现优异，优于函数保持下的基线方法。", "清晰度": "摘要逻辑严密，技术细节明确且实验设计严谨易读。"}, "kind": "paper", "abstract": "Open-weight language models are fine-tuned, quantized, pruned, and merged, yet their provenance is often undocumented. We study data-free white-box lineage verification: can weights alone reveal whether two compatible model checkpoints share ancestry? Residual training produces a shared identity-aligned component in branch products, so this structure alone cannot establish ancestry. We remove it and compare checkpoint-specific structure across residual blocks, yielding a symmetric lineage score calibrated against independent checkpoints. On residual-MLP and GPT-2 benchmarks, the score separates fine-tuned, LoRA-merged, pruned, and quantized descendants from independent and distilled models (AUROC=1.0), distinguishing weight ancestry from behavioral similarity. Under function-preserving checkpoint laundering experiments, weight-space baselines lose margin or fail; our score remains unchanged and runs 76x faster than the nearest robust baseline on GPT-2. The projection-pairing signal appears across six language-model families and beyond, and a case study correctly identifies 3 related and 7 unrelated LLaMA-2 public checkpoints. Collectively, these results establish a passive, data-free provenance signal for compatible open-weight language-model checkpoints", "abstract_cn": "尽管开放权重语言模型经过微调、量化、剪枝和合并，但其来源往往未作记录。我们研究了无需数据的黑盒血缘验证：仅凭权重能否揭示两个兼容模型检查点是否存在祖先关系？残差训练会在分支产品中产生对齐的共享组件，因此该结构本身无法确立祖先关系。我们移除了该组件，并比较残差块中的检查点特异性结构，从而得出经独立检查点校准的对称血缘分数。在残差 MLP 和 GPT-2 基准测试上，该分数能够将微调、LoRA 合并、剪枝和量化后的后代模型与独立模型及蒸馏模型区分开来（AUROC=1.0），实现了权重祖先与行为相似性的分离。在保留功能的检查点清洗实验中，基于权重的基线方法会失效或失败，而我们的分数保持恒定且运行速度比最近稳健基线快 76 倍。成对投影信号已出现在六种语言模型家族及更广泛范围内，案例研究正确识别了 3 个相关且 7 个不相关的 LLaMA-2 公开检查点。综上所述，这些结果确立了一种适用于兼容开放权重语言模型检查点的被动、无数据血缘信号。", "title_cn": "训练留痕：语言模型血统验证的居中残差签名", "interpret": "针对大型语言模型（LLM）训练过程缺乏透明度、难以追溯“血统”的问题，本研究提出了一种无需额外数据的白盒身份验证方法。尽管模型常被微调、量化、剪枝和合并，但其来源往往不明，导致模型间是否存在共同祖先难以确认。研究首先指出，常规的残差训练会产生统一的中间层结构，因此无法单独作为判断依据。为此，研究者剔除了这一共性，转而比较检查点中特定的残差块结构，并建立了对独立检查点校准的对称血缘评分。实验表明，该方法能精准区分经过不同处理（如微调、LoRA 融合、剪枝、量化）的后代模型与独立模型或蒸馏模型，在关键基准上达到满分识别率，证明了其能区分“权重亲缘关系”与“行为相似性”。在模拟模型清洗的攻击场景中，该方法依然稳固，显著优于传统权重基线，为开源模型的信任链验证提供了强有力的工具。", "interpret_v": 3, "num": 117}, {"title": "MegaParts：通过Token高效自回归建模将部件感知3D生成扩展至300个部件", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "MegaParts提出可扩展的自回归3D生成框架，结合结构化序列建模与token高效的向量量化形状分词器，将部件级3D生成扩展至最多300个部件、序列长度达256k tokens。该方法在统一结构化序列中训练大语言模型生成物体边界框、部件边界框及部件形状token，相比基线自回归和扩散模型实现了更高的网格质量，表明压缩离散部件token能同时提升可扩展性与生成保真度。", "link": "https://arxiv.org/abs/2608.14783", "points": {"类别": "方法类，提出基于高效分片向量量化与自回归的大规模部件生成框架。", "背景": "现有部件感知生成方法难以扩展至高复杂度物体，面临长序列与显存瓶颈。", "贡献": "设计自适应长度分片词表与统一结构化序列，支持 300 个部件与 256k 序列长生成。", "合理性": "压缩离散分片令牌结合长上下文训练策略，显著扩展规模并提升网格质量与控制精度。", "清晰度": "摘要逻辑清晰，从问题到方法再到验证结果，技术路线阐述明确且易读。"}, "kind": "paper", "abstract": "Part-aware 3D object generation is essential for graphics applications such as controllable modeling, editing, and articulation, where objects are represented as coherent assemblies of semantic parts. However, existing part-aware generation methods, do not scale well to highly complex objects. As the number of parts increases, generating detailed geometry becomes prohibitively expensive in token length and memory. We introduce MegaParts, a scalable autoregressive 3D generation framework to address this challenge by combining structured sequence modeling with a token-efficient vector-quantized shape tokenizer. Our tokenizer learns discrete latent representations for part-level geometry by minimizing token usage subject to high-fidelity reconstruction, enabling adaptive-length tokenization based on geometric complexity. On top of this compact representation, we train a large language model to generate object bounding boxes, part bounding boxes, and part shape tokens within a unified structured sequence. Combined with efficient long-context training strategy, our token-efficient formulation scales to objects with up to 300 parts and sequence lengths up to 256k tokens. This substantially extends the scale of part-aware 3D generation while preserving compositional structure and enabling fine-grained part-level control. Our method achieves higher mesh quality than baseline autoregressive and diffusion models, showing that compressed discrete part tokens improve not only scalability but also the achievable fidelity of generated geometry. These results suggest that LLM native token-efficient autoregressive modeling is a compelling alternative to diffusion for large-scale part-aware 3D generation. The project page is available at https://expmaster.github.io/megaparts_webpage.", "title_cn": "MegaParts：通过Token高效自回归建模将部件感知3D生成扩展至300个部件", "abstract_cn": "部分感知的 3D 对象生成对于需要以语义部件构成的相干集合来表示对象的图形应用至关重要，然而现有方法难以扩展至复杂度高、部件数量庞大的对象。我们提出 MegaParts 框架，通过结合结构化序列建模与高效的向量量化形状分词器，解决了部件数量增加导致令牌长度和内存成本激增的问题。该分词器通过最小化令牌使用量并保证高保真重构，学习用于部件级几何结构的离散潜在表示，实现了基于几何复杂度的自适应长度分词。在此基础上，我们训练了一个大型语言模型，在统一的结构化序列中生成对象边界框、部件边界框及部件形状令牌，并结合高效的长上下文训练策略，使模型能够处理多达 300 个部件及 256k 令牌的序列。该方法在保持成分结构并实现细粒度部件级控制的同时，大幅扩展了部分感知 3D 生成的规模，且生成的网格质量优于基准自回归与扩散模型。", "interpret": "在图形学应用中，将复杂 3D 物体建模为语义部件进行可控编辑至关重要，但现有方法难以应对部件数量激增带来的计算成本。为解决这一瓶颈，研究提出 MegaParts 框架，通过结合结构化序列建模与高效的向量量化形状分词器，实现了部件感知的 3D 生成扩展至 300 个部件。其核心分词器通过最小化 token 数量同时保证高精度重构，实现了基于几何复杂度的自适应编码。这一方法不仅大幅降低了 token 长度和显存占用，更利用大语言模型技术显著提升了生成效率。MegaParts 不仅突破了当前生成模型的尺度限制，为超复杂物体的精细化编辑提供了可行路径，也为未来高效、可控的 3D 内容创作奠定了坚实基础。", "interpret_v": 3, "num": 118}, {"title": "解构 Agent Skills：为何有效，又为何失效", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "一项对照研究通过多基准、多框架的受控实验，剖析 LLM 智能体技能（Skills）何时有效、为何有效及何处失效。技能在匹配比较中比 Workflow Memory 提升 6.06 分，其中 65.7% 的案例通过程序锚定稳定执行，而非注入缺失知识（仅占 4.5%）。检索是独立瓶颈：技能池从 5 增至 100 时，实际使用精度从 29.6% 降至 3.3%。", "link": "https://arxiv.org/abs/2608.14036", "points": {"类别": "实证研究", "背景": "当前技能评估仅关注任务成功率的提升，缺乏对技能何时有效及失效原因的根本性解释。", "贡献": "通过控制实验与轨迹分析，揭示了技能通过“程序性锚定”稳定执行而非注入事实来发挥作用。", "合理性": "实验数据详实且区分了检索瓶颈与上下文兼容性限制，结论在逻辑上具有高度可信度。", "清晰度": "摘要结构完整，从问题提出到具体机制解释层层递进，表述专业清晰。"}, "kind": "paper", "abstract": "Skills have emerged as a practical and effective approach for enhancing LLM agents at inference time through structured packages of knowledge. However, existing evaluations largely measure whether skills improve aggregated task success, leaving a more fundamental question underexplored: \\emph{\\textbf{When do skills help, why do they work, and where do they fail?}} Through controlled experiments across various benchmarks, agent harnesses and LLMs, we isolate the effects of representation, outcome annotation, retrieval difficulty, and cross-framework robustness of skills. To further answer this question, we design a contrastive study that combines controlled quantitative experiments with paired trajectory analysis. We normalize 8,135 trial records from controlled experiments and retain 238 valid unique labels from 240 open-coded records. We consolidate these observations into a taxonomy of three high-level categories and twelve skill-use modes: skills work when noisy trajectories become procedural anchors that stabilize execution. Skills improve over Workflow Memory by 6.06 points in matched comparisons. Procedural anchoring accounts for 65.7\\% of skill cases, versus 4.5\\% for explicit knowledge injection, showing that skills stabilize action rather than inject missing facts. Retrieval is a separate bottleneck: as pools grow from 5 to 100, actual-use precision falls from 29.6\\% to 3.3\\%. Confusable distractors impair offline identification, yet downstream success remains stable; exact ground-truth invocation is neither sufficient nor necessary. Skills fail under brittle assumptions, incompatible contexts, or insufficient adaptation. These findings move evaluation beyond aggregate success rates and guide reliable self-evolving agents.", "abstract_cn": "技能已作为一种实用且有效的策略，通过结构化的知识包在推理阶段增强大语言模型智能体。然而，现有评估主要关注技能是否提升了聚合任务成功率，而忽视了更基础的问题：技能何时起作用、为何有效以及在何处失效？通过对多种基准、智能体 harness 和大语言模型的控制实验，我们隔离了技能在表征、结果标注、检索难度及跨框架鲁棒性方面的影响。为回答这一问题，我们设计了一项结合受控定量实验与配对轨迹分析的对比研究。我们归一化了 8,135 条受控实验试记，并保留了来自 240 个开放编码记录的 238 个有效唯一标签。我们将这些观察归纳为三类高层次类别和十二种技能使用模式：技能在嘈杂轨迹成为程序锚点从而稳定执行时发挥作用。在匹配对比中，技能较工作流记忆提升了 6.06 分。程序锚点在技能案例中占 65.7%，而显式知识注入仅占 4.5%，表明技能通过稳定动作而非注入缺失事实来发挥作用。检索是一个独立的瓶颈：随着库从 5 增长到 100，实际使用精确度从 29.6% 降至 3.3%。令人混淆的干扰项会损害离线识别，但下游成功率保持稳定；精确的地面真值调用既非充分也非必要条件。技能在脆弱的假设、不兼容的上下文或适应性不足时会失效。这些发现将评估从聚合成功率之外推进，并指导可靠自我演进的智能体的构建。", "title_cn": "解构 Agent Skills：为何有效，又为何失效", "interpret": "技能作为增强大语言模型（LLM）智能体的实践方案，能显著提升推理性能，但其具体作用机制仍存谜团。现有研究多关注技能是否提升了任务成功率，却鲜少深入探讨其生效与失效的深层逻辑。本研究通过跨基准的受控实验，系统剖析了技能表征形式、结果标注质量、检索难度及跨框架鲁棒性等关键因素对智能体的影响。结合归一化的 8135 条实验记录与 238 个有效标签进行对比分析，我们不仅量化了技能带来的增益，更识别出其失效的典型场景。这一发现打破了“技能即万能”的迷思，为设计更高效的智能体提供了可量化的指导原则，推动研究从单纯追求结果成功转向优化知识处理的内在逻辑。", "interpret_v": 3, "num": 119}, {"title": "AutoResearchEval：100 项真实前沿研究任务上的端到端诊断评估，智能体如何失败", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "AutoResearchEval 引入 100 项覆盖 7 个科学领域及完整研究生命周期的任务，对 8 种 harness-model 组合进行评估，得到 800 条带过程级标注的智能体轨迹。", "link": "https://arxiv.org/abs/2608.14905", "points": {"类别": "实证评估研究", "背景": "针对当前智能体在科学全流程研究中评估不足且缺失系统性失败诊断的问题", "贡献": "提出包含 100 项任务的评估框架及涵盖 45 种模式的智能体失败分类学", "合理性": "假设当前智能体缺乏元认知闭环导致失败，结论基于 800 条轨迹与人工校准验证，逻辑自洽", "清晰度": "结构清晰，从任务设计、执行流程到失败模式归纳层层递进，表达专业且易读 局限性：未测试编排层干预能否解决该缺陷，结论虽宏观但缺乏针对具体修正方案的深入验证 可读性：写作规范，术语使用准确，数据详实，能够清晰传达智能体在科研中缺失元认知能力的核心发现"}, "kind": "paper", "abstract": "AI has long assisted scientific research, but the rapid advance of LLMs and agentic scaffolds is reshaping the landscape; a single system can now carry whole-stage research from an initial hypothesis all the way to final published paper, which is a paradigm now referred to as AutoResearch. Existing evaluations reveal little about how these agents operate or where they break down. Tasks are narrowly-scoped, evaluation measures performance but not process, and failure diagnoses lack systematic coverage or artifact-level visibility. To address this gap, we introduce AutoResearchEval, featuring 100 tasks grounded in published frontier science across 7 scientific domains and the full research lifecycle, including ideation, retrieval, execution, analysis, writing, and review. Evaluating 8 harness-model combinations yields 800 autoresearch agent trajectories, with process-level annotation. We organize these insights into AutoResearch Failure Taxonomy or ARFT, a framework of 45 empirically-grounded failure patterns. To enable scalable fine-grained attribution, we leverage a human-calibrated agent-as-a-judge pipeline to inspect complete trajectories and intermediate artifacts. Failure patterns converge on a single overarching limitation, namely that current agents lack a metacognitive loop, which entails the ability to check what they produced against what they found, revise when it does not hold up, and question whether the path they took was sound. The same patterns recur across all 8 harness-model combinations, including the strongest models tested, locating the deficit at the model level rather than in any particular scaffold; whether orchestration-level interventions can close it is an open question this work does not test. We publicly release AutoResearchEval and ARFT to facilitate continued research and development in autonomous scientific discovery.", "abstract_cn": "AI 早已辅助科学研究，但大语言模型与智能体框架的飞速发展正在重塑这一格局；单一系统如今可完成从假设提出到最终论文发表的全阶段科研过程，这一范式被称为 AutoResearch。现有评估很少揭示这些智能体的运作机制及其失效点；任务范围狭窄，仅关注性能而忽视过程，且失效诊断缺乏系统性覆盖或可观测的中间产物分析。为填补这一空白，我们推出了 AutoResearchEval，涵盖 7 个科学领域的 100 个基于前沿科学文献的任务，覆盖从构思、检索、执行、分析、写作到审查的全生命周期。对 8 种 harness 模型组合的评估生成了 800 条智能体轨迹并进行了过程级标注。我们将这些洞察整理为 AutoResearch 失效分类法（ARFT），该框架包含 45 个实证支持的具体失效模式。为实现可扩展的细粒度归因，我们利用经过人工校准的“智能体即裁判”流水线检查完整轨迹和中间产物。所有失效模式均指向一个总体性局限，即当前智能体缺乏元认知循环，即无法对照产出与发现结果进行检查、在不符时修正，并质疑其路径的合理性。这些模式在所有 8 种 harness 模型组合（包括测试最强的模型）中均反复出现，表明该缺陷位于模型层面而非特定框架层面，而编排层面的干预能否弥合这一缺口则仍是未得到验证的开放性问题。我们公开发布了 AutoResearchEval 和 ARFT，以促进自主科学发现领域的持续研究与开发。", "title_cn": "AutoResearchEval：100 项真实前沿研究任务上的端到端诊断评估，智能体如何失败", "interpret": "尽管 AI 已长期辅助科研，但大语言模型（LLM）与智能体（Agents）的飞速发展正重塑局面，实现从假设提出到论文发表的全流程自动化（AutoResearch）。然而，现有评估仅关注结果性能，缺乏对智能体运作过程及失败原因的深入诊断。为解决这一盲区，本研究提出了 AutoResearchEval 框架，构建了覆盖七个科学领域的 100 项前沿真实任务，完整贯穿研究全生命周期。通过对 8 种智能体组合生成的 800 条轨迹进行过程级标注与评估，项目发现智能体虽能完成单点任务，但在跨步骤协同、复杂信息检索及结果分析解读等关键环节仍频繁出错，且往往缺乏对具体失败机制的系统性解释。该工作填补了从“能做完”到“如何失败”的认知鸿沟，为构建更可靠的自主科研系统提供了关键诊断依据。", "interpret_v": 3, "num": 120}, {"title": "PACE-Bench：动态环境中基于代码演化的物理适配基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "PACE-Bench 提出一个基于模拟器的基准测试，包含六个物理领域的 144 组源到目标适配对，用于评估智能体在环境条件变化后的恢复能力。在十种自演化方法中，Reflexion + Qwen3-14B 仅成功完成 35.9% 的全基准任务，而 GPT-5.5 在完整预算下解决了 Statics 子集的 66.7%。", "link": "https://arxiv.org/abs/2608.14441", "points": {"类别": "实证研究", "背景": "现有评估忽视动态环境变化，缺乏对自我进化体代码适应能力的测试。", "贡献": "提出 PACE-Bench 基准，揭示模拟环境中代码重构比参数微调更关键。", "合理性": "基于真实物理变化测试多模型，结果可信但受限于单轮适应预算。", "清晰度": "结构严谨，明确界定基准设计与模型表现对比逻辑。"}, "kind": "paper", "abstract": "Self-evolving agents improve future behavior from interaction experience, yet existing evaluations typically optimize under fixed execution conditions and do not test recovery after those conditions change. To address this gap, we introduce PACE-Bench (Physics Adaptation via Code Evolution), a simulator-grounded benchmark of 144 source-to-target adaptation pairs across six physics domains. Each pair links a source environment to a mutated target environment with the same goal and interface. A code-driven design that succeeds in the source fails in the target, where agents must iteratively adapt it into a working target design using diagnostic sandbox feedback within a limited attempt budget. We compare ten self-evolving methods from four paradigms. The benchmark remains far from saturated: Reflexion + Qwen3-14B succeeds on only 35.9\\% of full-benchmark pairs, while GPT-5.5 solves 66.7\\% of the Statics subset under the full budget. Together, these results show that simulator-grounded reflection is more reliable than unverified self-revision, while memory anchors agents to early designs and broad tree search explores without converging. Even revealing exact physical changes does not raise the performance ceiling, pointing to mechanism redesign rather than parameter inference as the central bottleneck. Data and code are available at https://github.com/thunlp/PACE-Bench.", "title_cn": "PACE-Bench：动态环境中基于代码演化的物理适配基准", "abstract_cn": "//github.com/thunlp/PACE-Bench 获取。", "interpret": "自我进化智能体虽能随交互经验优化行为，但现有评估多基于固定执行条件，缺乏对环境突变后恢复能力的测试。为此，研究人员推出了 PACE-Bench，一个涵盖六个物理领域的基准测试，包含 144 组“源环境到目标环境”的代码适配对。在这些场景中，原本成功的算法设计在突变后的环境中会失效，智能体需依赖诊断式沙箱反馈，在有限尝试次数内迭代改进代码。研究对比了四种范式中的十种自我进化方法，发现评估尚未达到饱和：即便是强化的 Reflexion 结合 Qwen3-14B 模型，仅成功解决 35.9% 的任务；而最新发布的 GPT-5.5 模型将这一比例提升至 66.7%。该基准不仅揭示了当前大模型在动态物理环境适应上的显著短板，也为推动更鲁棒的代码自进化算法提供了关键的实测依据。", "interpret_v": 3, "num": 121}, {"title": "Agentic Transaction：迈向 ACID 兼容的智能体系统", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "论文提出\"智能体事务\"概念，构建 ACID 兼容的智能体系统框架，将经典 ACID 属性重释为语义原子性、语义一致性、语义隔离和语义持久性四项保证。研究团队开发了相应的数据智能体，通过事务性探索-执行-验证循环等机制实现这些保证，在广泛使用的基准测试上较包括 Claude Code 在内的 SOTA 智能体提升 10.6%。", "link": "https://arxiv.org/abs/2608.13900", "points": {"类别": "提出一种将数据库事务机制映射至智能体自主执行的新框架方法。", "背景": "现有智能体在长程任务执行中缺乏可靠、一致的状态管理机制。", "贡献": "提出 ACID 兼容智能体概念，通过四组语义保证提升系统可信度与鲁棒性。", "合理性": "基于 LLM 不确定性与环境动态特性，该方法假设与验证逻辑较为可信。", "清晰度": "摘要结构清晰，从问题定义到具体方案及实验数据呈现逻辑严密。"}, "kind": "paper", "abstract": "Large language model (LLM) agents are evolving from conversational assistants into autonomous systems that execute long-horizon tasks through reasoning, tool use, code generation, and workspace manipulation. As agents increasingly operate over persistent environments and multi-step workflows, they face challenges analogous to those addressed by transactional database systems: reliable execution, consistent outcomes, safe concurrency, and durable state management. We introduce the concept of an agentic transaction and propose an ACID-compliant agent system framework that reinterprets the classical ACID properties for agent execution through four semantic guarantees: Semantic Atomicity, Semantic Consistency, Semantic Isolation, and Semantic Durability. Together, these properties provide a principled foundation for building reliable agent systems despite model uncertainty and dynamic execution environments. To instantiate this framework, we develop an ACID-compliant data agent that realizes these guarantees through transactional exploration-execution-validation cycles, transactional skill hubs, confidence divergence-based validation, semantic dependency-aware isolation, and transaction-aware semantic state management. Experimental results on widely used benchmarks show that our system achieves a 10.6% improvement over state-of-the-art agents, including Claude Code. This work opens a broader research agenda on extending transactional principles and system architectures toward building trustworthy, scalable, and self-evolving AI agent systems.", "abstract_cn": "大型语言模型智能体正从对话助手演变为通过推理、工具使用、代码生成和工作空间操作执行长期任务的自主系统；随着智能体越来越多地在持久环境和多步骤工作流中运行，它们面临的可信执行、一致结果、安全并发和持久状态管理等挑战，与事务数据库系统面临的问题类似。我们引入了智能体事务的概念，并提出一个符合 ACID 原则的智能体系统框架，该框架通过四种语义保证——语义原子性、语义一致性、语义隔离性和语义持久性——重新解释了对智能体执行经典 ACID 属性的理解。这些属性为在模型不确定性和动态执行环境中构建可靠的智能体系统提供了原则性基础。为了实例化该框架，我们开发了一个符合 ACID 原则的数据智能体，通过事务探索 - 执行 - 验证循环、事务技能中心、基于置信度分歧的验证、语义感知隔离和事务感知的语义状态管理等机制实现这些保证。在广泛使用的基准上的实验结果表明，我们的系统比包括 Claude Code 在内的最先进智能体性能提升了 10.6%。这项工作开启了扩展事务原则和系统架构以构建可信赖、可扩展且具有自进化能力的 AI 智能体系统的更广泛研究议程。", "title_cn": "Agentic Transaction：迈向 ACID 兼容的智能体系统", "interpret": "随着大语言模型智能体从简单助手进化为能自主规划、使用工具并执行长链条任务的复杂系统，其长期运行的可靠性面临严峻挑战。这类系统在持续环境和多步骤工作流中出现的错误，类似于传统数据库中的事务问题，亟需可靠的执行、一致的结果、安全的并发及持久化的状态管理。为此，研究提出了\"智能体事务”概念，构建了一套符合 ACID 原则的智能体系统框架。该框架重新诠释了经典 ACID 属性，将其转化为智能体特有的四个语义保障：语义原子性、语义一致性、语义隔离性和语义持久性。这一理论突破为在模型不确定性高、执行环境动态变化的背景下，构建高度可靠且可预测的智能体系统提供了坚实的理论基础与技术路径。", "interpret_v": 3, "num": 122}, {"title": "Nanbeige4.2-3B 在 Apple Silicon 上的修复：解决部署缺陷并降低 Looped Transformer 内存开销", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "Nanbeige4.2-3B 是 3B 参数智能体模型，采用 Looped Transformer 架构复用单层堆栈进行第二次前向传播以增加有效深度。研究者在 Apple Silicon（MPS）上发现五个独立 bug 阻碍其开箱运行，并引入 chunked-prefill 策略将可用上下文宽度扩展 2.7 倍。", "link": "https://arxiv.org/abs/2608.13987", "points": {"类别": "实证研究，基于 Apple Silicon 平台的部署缺陷修复与 Looped Transformer 内存优化。", "背景": "针对 Nanbeige4.2-3B 在 MPS 上因底层 API 变更及层复用机制导致的零运行问题。", "贡献": "修复五处部署漏洞并创新分块预填充策略，将有效上下文扩展 2.7 倍且提升 30% 任务完成度。", "合理性": "基于具体硬件测试识别真实 Bug 并提出分块方案，方法逻辑自洽但多工具调用仍显局限。", "清晰度": "摘要结构完整、数据详实，清晰阐述了问题根源、修复方案及最终性能评估结果。"}, "kind": "paper", "abstract": "Nanbeige4.2-3B is a 3B-parameter agentic model built around a Looped Transformer (LT) that reuses one stack of layers for a second forward pass, adding effective depth without additional parameters. Evaluated on Apple Silicon (MPS), we identify five independent bugs which prevent the released checkpoint from running via Hugging Face transformers out of the box (including a silently-zeroed RoPE buffer and calls to removed transformers cache APIs). Furthermore, we show that fixing these bugs is still not sufficient for agentic tasks, due to the LT's layer-reuse strategy (which effectively doubles peak attention memory) used to achieve parameter efficiency. We thus introduce a chunked-prefill strategy which alleviates the incurred memory-capacity penalty, extending allowable context width by $2.7 \\times$ on 32~GiB shared memory. However, even with the reduced memory overhead, we show that patches are required to render Nanbeige4.2-3B usable; resolving both system prompt and MPS-native memory bugs finally allows reliable evaluation on standard MCP and tool-calling benchmarks. On a subset of MCPMark, the debugged model completes up to 30\\% of real agentic tasks (up from the original's 0\\%), while, on BFCL, it is near-perfect at single tool calls (yet fails the majority of multi-tool tests). We release the patched checkpoint, system prompt optimizer, and evaluation harnesses at https://github.com/johnhalloran321/Nanbeige4.2-3B-mps-fix.", "title_cn": "Nanbeige4.2-3B 在 Apple Silicon 上的修复：解决部署缺陷并降低 Looped Transformer 内存开销", "abstract_cn": "//github.com/johnhalloran321/Nanbeige4.2-3B-mps-fix。", "interpret": "针对基于循环 Transformer（LT）架构的 Nanbeige4.2-3B 模型，团队在 Apple Silicon 平台上完成了关键的部署修复与性能优化。该模型旨在通过“层复用”策略在不增加参数量前提下提升深度，但原生发布版本存在五个关键缺陷（如 RoPE 缓冲区错误），导致无法直接运行。即便修复了这些 Bug，LT 的内存复用机制也会将峰值注意力内存消耗翻倍，严重限制长文本处理能力。为此，研究人员引入了一种分段预处理（chunked-prefill）策略，有效缓解了内存瓶颈。实验显示，该优化在 32GB 共享显存上可将支持的有效上下文窗口扩大 2.7 倍，显著提升了模型在端侧运行时的实用性与长程推理能力。", "interpret_v": 3, "num": 123}, {"title": "Marionette：预测世界状态、渲染几何、绘制外观", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "世界模型", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "Marionette 将交互游戏世界模型拆分为显式状态预测与外观合成：两阶段自回归动力学模型输出 276 维 3D 世界状态，零参数图形桥接器以闭式解计算几何与遮挡，再由控制条件视频扩散模型合成 RGB 帧。强制不匹配动作流使根对齐关节误差改变 31%；施加地形碰撞器与分离上限后，地面穿透减少 66%，FVD 831 对 799，外观保真度无明显损失。", "link": "https://arxiv.org/abs/2608.14530", "points": {"类别": "方法，提出将世界状态与外观渲染解耦的新型交互式游戏世界模型。", "背景": "现有方法隐式维持几何属性导致长时序错误累积，缺乏可控性。", "贡献": "通过显式 3D 状态预测结合零参数渲染器，实现长视距下的几何一致性与状态可修复。", "合理性": "实验证明显式状态可修正漂移与穿模，且未牺牲外观 fidelity，方法逻辑严密。", "清晰度": "摘要结构清晰，按模型设计、实验结果、控制效果分步阐述，重点突出。"}, "kind": "paper", "abstract": "Interactive game world models typically autoregress visual observations directly in pixel or latent space, forcing structured properties such as pose, geometry, and occlusion to be implicitly maintained by the same generative sequence. Over long horizons, errors in these latent world properties accumulate, making consistency and controllability fragile. We explicitly model the evolving world state, delegate exact geometric computation to a fixed, zero-parameter renderer, and leave the neural model to synthesize appearance. We instantiate this idea as Marionette, a world model for interactive games with articulated characters. First, a two-stage autoregressive dynamics model predicts an explicit and interpretable 276-dimensional 3D world state comprising multi-entity articulated skeletons, metric root trajectories, and rotations. Second, a zero-parameter graphics bridge converts the predicted state into pose-control videos, computing world-space geometry and occlusion in closed form. Third, a control-conditioned video-diffusion observation model synthesizes photorealistic RGB observations from the resulting structured controls. Our experiments establish two properties of Marionette. First, the predicted world state is directly controllable. Forcing a mismatched action stream changes root-aligned joint error by 31% across 48 held-out segments. Second, long-horizon behaviour is determined in the state, and can be repaired there. Left free, the two generated characters drift to 21.2 m apart (recorded sessions stay near 5 m) and a third of frames show ground penetration. Two rules imposed on the explicit state, a terrain collider and a separation cap, cut penetration by 66% and keep the pair engaged, with no change to the observation model. Routing appearance through the predicted state costs no fidelity we can detect, at an FVD of 831 against 799 for recorded pose.", "abstract_cn": "交互式游戏世界模型通常直接在像素或潜在空间通过自回归方式处理视觉观测，迫使姿态、几何和遮挡等结构化属性由同一生成序列隐式地维持。在长视距下，这些潜在世界属性的误差会累积，导致一致性和可控性变得脆弱。我们明确建模了演进的世界状态，将精确的几何计算委托给一个固定且零参数的渲染器，并让神经模型专门合成外观。我们将这一理念实例化为 Marionette，一种适用于具有关节角色的交互式游戏的.world model。首先，一个两阶段自回归动力学模型预测了一个明确且可解释的 276 维 3D 世界状态，其包含多实体关节骨骼、度量根轨迹和旋转。其次，一个零参数的图形桥将预测状态转换为姿态控制视频，以解析形式计算世界空间几何和遮挡。第三，一个条件控制的视频扩散观测模型从生成的结构化控制中合成逼真的 RGB 观测。我们的实验确立了 Marionette 的两个特性。首先，预测的世界状态可直接控制；强制引入不匹配的动作流会使 48 段保留测试中的根对齐关节误差增加 31%。其次，长视距行为在状态中被决定，并可在该处被修复。若不加以约束，两个生成的角色会漂移至相距 21.2 米（录制会话保持在 5 米左右），且三分之一的帧显示地面穿透。通过对显式状态施加两条规则（地形碰撞体和分离上限），渗透现象减少了 66%，并保持双角色互动，且无需更改观测模型。将外观通过预测状态路由在可控范围内未产生可检测的保真度损失，其 FVD 为 831，略高于姿态视频的 799。", "title_cn": "Marionette：预测世界状态、渲染几何、绘制外观", "interpret": "交互式游戏模型常直接在像素或潜空间进行视觉预测，却被迫用同一生成序列隐式维持姿势、几何和遮挡等结构化属性。这种设计导致长时误差累积，使状态一致性与可控性变得脆弱。为此，研究者提出了 Marionette，它明确建模随时间演化的世界状态，并将精确几何计算外包给零参数渲染器，而让神经网络专注于合成外观。该模型首先通过两阶段自回归动力学预测 276 维的显性 3D 世界状态（含多实体关节骨架、根轨迹及旋转），随后利用无参数图形桥接器将状态转化为可渲染几何，实现了对复杂角色交互场景的高保真重建。这一方法显著提升了长程预测的稳定性与可控性，为虚拟角色驱动的游戏引擎提供了高效的生成式规划方案。", "interpret_v": 3, "num": 124}, {"title": "PRM-as-a-Judge 1.5：面向机器人过程评估的工具包", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "具身智能", "ts": "2026-08-14T08:00:00+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "PRM-as-a-Judge 1.5 发布，将 rollout 视频转化为密集进度曲线并派生多项细粒度指标，在 1.0 基础上新增三个指标，分别刻画失败侧进展、回撤后恢复与成功侧执行质量。基于基准测试的 rollout 视频，该工具包对具身模型进行了综合评估，并推出 RoboPulse++ 以检验过程奖励模型（PRM）的可靠性，同时开源了包含基准、指标实现与可视化工具的评估套件。", "link": "https://arxiv.org/abs/2608.14284", "points": {"类别": "实证研究工具包，旨在超越二元成功率，提供细粒度机器人过程评估。", "背景": "现有 embodied 智能体评估依赖简单规则，难以捕捉任务执行过程中的细微波动与能力特征。", "贡献": "发布 PRM-as-a-Judge 1.5 工具包及 RoboPulse++，提供三类新指标以全面刻画模型失败恢复与执行质量。", "合理性": "基于大规模基准测试视频进行实证分析，方法逻辑自洽但高度依赖自动化流程的完整性与准确性。", "清晰度": "结构清晰，从问题动机到工具实现再到社区倡议，内容连贯且专业术语使用规范。"}, "kind": "paper", "abstract": "Fine-grained robotic evaluation matters for understanding embodied models, going beyond binary success rates and rule-based process scores. We present PRM-as-a-Judge 1.5, a toolkit for robot process assessment that turns rollout videos into dense progress curves and derives multiple fine metrics. PRM-as-a-Judge 1.5 introduces three metrics, building on version 1.0, that characterize failure-side progress, post-drawdown recovery, and success-side execution quality, helping users understand embodied model capability. Based on the rollout videos from benchmarks, we perform a comprehensive assessment of the embodied models, providing some fine-grained metric results and key findings. We further introduce RoboPulse++ to evaluate the reliability of process reward models (PRM), providing evaluators with a more accurate testing platform. Moreover, we release a user-friendly assessment suite, including the benchmark, metric implementation, and visualization tools, to support reproducible manipulation process evaluation. We call on the community to rethink how robots are evaluated and establish transparent, procedural, and reproducible assessment as a foundation for the next generation of embodied intelligence.", "abstract_cn": "细粒度机器人评估对于理解具身模型至关重要，其意义超越了二元成功率及基于规则的过程评分。我们介绍了 PRM-as-a-Judge 1.5，这是一种将展开视频转化为密集进度曲线并推导多种细粒度指标的机器人过程评估工具集。PRM-as-a-Judge 1.5 引入了三项基于 1.0 版本的指标，分别刻画失败侧进展、归零后恢复能力及成功侧执行质量，有助于用户理解具身模型的能力。基于基准测试的展开视频，我们对具身模型进行了综合评估，提供了细粒度指标结果与关键发现。此外，我们引入了 RoboPulse++ 以评估过程奖励模型的可靠性，为评估者提供更准确的测试平台。同时，我们发布了一套用户友好的评估套件，包括基准测试、指标实现及可视化工具，以支持可复现的操纵过程评估。我们呼吁社区重新思考机器人评估方式，将透明、程序化及可复现的评估确立为下一代具身智能的基础。", "title_cn": "PRM-as-a-Judge 1.5：面向机器人过程评估的工具包", "interpret": "面对机器人领域长期依赖的二元成败评估局限，本文提出了 PRM-as-a-Judge 1.5 工具箱，旨在通过视频分析生成细粒度的进度曲线。该工具突破了传统打分模式，创新性地引入了衡量失败后修复能力、恢复性能及成功阶段执行质量三类新指标，使研究人员能更精准地诊断机器人的过程鲁棒性。基于基准测试视频的大规模评估显示，该工具有效揭示了模型在边缘场景下的真实表现。同时，研究发布的 RoboPulse++ 进一步提升了过程奖励模型的可靠性验证水平，配合用户友好的评估套件，为研究者提供了从数据采集到深度分析的一站式平台，显著推动了具身智能从“能完成任务”向“可控完成任务”的演进。", "interpret_v": 3, "num": 125}, {"title": "Second Thought：让LLM智能体在行动与观察时并行推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-14T02:04:53+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "Second Thought提出免训练推理框架，在ReAct智能体每个Thought阶段结束时并行分叉四个辅助分支，与环境观察返回时合并生成的思考，将额外推理移出主线程串行解码路径。在三个智能体基准与三个推理LLM上，该方法在全部九组组合中降低平均回合数，其中六组主线程解码最多减少43%；Pass@1在七组中无显著变化，另两组分别提升+12.4和+10.2分。", "link": "https://arxiv.org/abs/2608.13667", "points": {"类别": "方法创新，提出无需训练即并行推理的 LLM 智能体框架。", "背景": "现有 ReAct 范式将推理冻结于 Thought 阶段，行动与观察期间缺乏并行思考空间。", "贡献": "设计 Second Thought 框架在 Thought 后分叉四路并行解码并融合，显著降低主线程推理开销。", "合理性": "实验覆盖多模型与基准，对比计算匹配对照组，结果支持并行推理对效率与准确率的双重提升。", "清晰度": "摘要逻辑严密，从问题定义到方案设计再到实证数据，结构清晰且技术细节表达精准。"}, "kind": "paper", "abstract": "LLM agents in the ReAct paradigm alternate between reasoning, acting, and observing, but deliberate reasoning is confined to the Thought phase: while the agent serializes an action and waits for the environment, its reasoning is frozen. We identify this recurring interval for Action and Observation as a reasoning idle window and ask whether it can host additional reasoning in parallel that serves future turns. Therefore, we propose Second Thought, a training-free inference framework that forks four auxiliary branches the instant each Thought phase concludes, decodes them concurrently with the main loop, and merges the generated thoughts back when the environment observation arrives. In this way, Second Thought relocates the added reasoning off the main thread's sequential decoding path. Across three agentic benchmarks and three reasoning LLMs, Second Thought lowers the average turn count in all nine (model,benchmark) pairs and reduces main thread decoding in six of them by up to 43% (roughly 20% on average among those settings), while leaving it essentially unchanged in a seventh; Pass@1 shows no significant change in seven of nine pairs and the two significant differences are +12.4 and +10.2 points. Against a compute-matched control that forces an equivalent budget onto the main thread's own reasoning, it attains strictly higher Pass@1 with 1.3 to 3.2 less sequential decoding in all four settings where the control applies.", "abstract_cn": "在 ReAct 范式中，LLM 代理在推理、行动和观察之间交替，但审慎推理仅限于推理阶段：当代理序列化为动作并等待环境时，其推理被冻结。我们识别出这种行动和观察重复出现的间隔作为推理空闲窗口，并探讨是否可以在其中并行运行服务于后续回合的额外推理。因此，我们提出了 Second Thought，这是一个无需训练的推理框架，它在每个推理阶段结束时立即分叉出四个辅助分支，与主循环并发解码，并在环境观察到来时将生成的思考合并回主循环。这种机制将额外推理从主线程的串行解码路径中移开。在三个代理基准和三个推理大语言模型上，Second Thought 在所有九个（模型，基准）配对中降低了平均回合数，并在其中六个配对中减少了高达 43%（在这些配置下平均约 20%）的主线程解码量，而在第七个配对中基本未变；Pass@1 在七个配对中未显示出显著变化，两个显著差异分别为 +12.4 和 +10.2 点。与将等效预算强制分配到主线程自身推理的算力匹配对照相比，它在所有四个适用对照的设置中均取得了严格更高的 Pass@1，且串行解码量减少了 1.3 到 3.2 个单位。", "title_cn": "Second Thought：让LLM智能体在行动与观察时并行推理", "interpret": "在传统的 ReAct 范式中，语言模型智能体遵循“思考 - 行动 - 观察”的串行流程：行动与观察阶段因等待环境反馈，导致智能体的推理能力处于停滞状态。这一间隙被称为“推理空闲窗口”，往往被白白浪费。研究提出的 Second Thought 框架，旨在利用此机会并行处理额外推理。该方案无需重新训练模型，仅需在每次主思考阶段结束后，即时分叉出四个辅助推理分支进行并发解码，待环境反馈返回后再将生成的思考内容合并回主流程。这种设计成功将新增的推理任务从主线程的串行解码路径中剥离，显著提升了决策质量。实验表明，在多种智能体基准测试和推理大模型上，Second Thought 有效降低了平均交互轮次，证明了并行推理在增强智能体规划与决策能力方面的巨大潜力。", "interpret_v": 3, "num": 126}, {"title": "从原子证据到逻辑组合：面向复合选项的结构化组合推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-13T08:00:00+08:00", "date": "2026-08-13", "weekday": "周四", "summary": "大语言模型在需要按显式逻辑运算符组合原子判断的选项上常出错。新框架将每个选项分解为原子答案并分别评分，再用运算符约束的整数线性规划组合分数，使模型无需直接面对复合选项。在LOGICAL-COMMONSENSEQA上Macro-F1从48.3提升至77.0，在新增的LOGICAL-SATA基准上从47.0提升至75.6，NEITHER/NOR选项提升最大。", "link": "https://arxiv.org/abs/2608.12836", "points": {"类别": "方法类", "背景": "大模型在组合原子判断处理复合逻辑问题时存在显著失败。", "贡献": "提出原子分解框架，结合线性规划将逻辑算子约束下的评分转化为最终预测。", "合理性": "基于逻辑可验证性设计，实验在人工验证数据集上取得显著性能提升。", "清晰度": "结构逻辑严密，从问题定义到方案设计与量化结果层层递进。"}, "kind": "paper", "abstract": "Large language models often fail when answer options require combining atomic judgments under explicit logical operators, even when they judge the individual atoms correctly. We study compound options connected by AND, OR, and NEITHER/NOR, introducing a framework that decomposes each option into atomic answers and scores contrastive hypotheses about each one, so the model never sees a compound option. An operator-constrained integer linear program then composes the calibrated scores into a single prediction. We evaluate on LOGICAL-COMMONSENSEQA and introduce LOGICAL-SATA, a reading-comprehension benchmark derived from SATA-Bench. Our framework improves Macro-F1 from 48.3 to 77.0 on the human-validated LOGICAL-COMMONSENSEQA split and from 47.0 to 75.6 on LOGICAL-SATA, with the largest gains on NEITHER/NOR.", "abstract_cn": "大语言模型在处理需要通过明确逻辑算子组合原子判断的答案选项时常会失败，即使它们能正确判断单个原子。我们研究了通过 AND、OR 以及 NEITHER/NOR 连接而成的复合选项，提出了一种将每个选项分解为原子回答，并据此对每个选项进行对比假设评分的框架，使模型无需直接观察复合选项。随后，利用受约束的整数线性规划将校准后的评分合并为单一预测结果。我们在 LOGICAL-COMMONSENSEQA 数据集上进行评估，并引入了源自 SATA-Bench 的阅读理解基准 LOGICAL-SATA。我们的框架在经人工验证的 LOGICAL-COMMONSEQA 划分上使 Macro-F1 从 48.3 提升至 77.0，在 LOGICAL-SATA 上从 47.0 提升至 75.6，其中 NEITHER/NOR 类别的提升最为显著。", "title_cn": "从原子证据到逻辑组合：面向复合选项的结构化组合推理", "interpret": "大型语言模型在处理需结合单个判断逻辑的复合选项时往往表现不佳，即使能正确评估原子级信息。本研究针对此类问题，提出将复合选项拆解为原子答案并对比验证评分的框架，利用算子约束的整数线性规划程序将校准后的评分组合为最终预测，确保模型不直接接触复杂选项。实验在 LOGICAL-COMMONSENSEQA 及自建的 LOGICAL-SATA 基准上验证，结果显示宏观 F1 分数分别从 48.3% 提升至 77.0% 及 47.0% 至 75.6%。该方法在涉及“既非此也非彼”逻辑的“非/非”组合项上提升最为显著，证明了结构化推理机制在提升模型逻辑推理能力上的关键价值，为增强 AI 对复杂逻辑关系的理解提供了新路径。", "interpret_v": 3, "num": 127}, {"title": "PlayWorld：用智能体玩家在长程目标下评测世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "世界模型", "ts": "2026-08-13T08:00:00+08:00", "date": "2026-08-13", "weekday": "周四", "summary": "香港大学与快手可灵团队推出 PlayWorld 基准，用多模态 Agent Player 模拟人类玩家，在 171 个带指定目标的场景中与世界模型交互，以长程目标而非固定动作轨迹进行跨模型公平对比。评测覆盖几何一致性、交互保真度、视野外演化与洞察演化四个核心维度，并纳入视频质量与可控性基础指标。对九个前沿世界模型的实验显示，现有模型在长程交互目标上仍不可靠，尤其在空间一致性与持续状态演化方面。", "link": "https://arxiv.org/abs/2608.13552", "points": {"类别": "实证研究系统，提出 PlayWorld 用于智能体交互评测世界模型", "背景": "解决长程目标下跨模型评估难及固定动作序列不适用的问题", "贡献": "构建 171 个长程目标场景基准，从多维评估揭示模型一致性缺陷", "合理性": "基于人机交互评估范式，实验数据可靠，但缺乏主观体验量化", "清晰度": "结构逻辑清晰，问题动机充分，实验设计与结论对应性强"}, "kind": "paper", "abstract": "Video world models simulate future states conditioned on current observations and user actions. Recent systems have demonstrated impressive video consistency and action controllability over long sequences. However, fairly comparing these interactive models remains challenging. In practice, a human player typically evaluates a world model by pursuing long-horizon objectives through interaction. For example, a user may turn around 360 degrees to see whether the environment remains consistent, or walk into the water and inspect whether realistic water ripples are generated. The action sequence required to achieve the same objective may vary substantially between models, making fixed action-conditioned evaluation unsuitable for cross-model comparison. To address this, we employ multi-modal Agent Players to interact with world models toward specified long-horizon objectives. Building on this paradigm, we introduce PlayWorld, a benchmark providing 171 scenarios, each with a specified objective. To evaluate performance thoroughly, we assess models along four core dimensions: geometry consistency, interaction fidelity, out-of-sight evolution, and insight evolution. In addition, we incorporate basic ability metrics for video quality and controllability. Experiments across nine state-of-the-art world models reveal that current models remain unreliable on long-horizon interactive objectives, particularly in maintaining spatial consistency and persistent state evolution. Code and data are available at https://github.com/kxding/PlayWorld.", "abstract_cn": "//github.com/kxding/PlayWorld。", "title_cn": "PlayWorld：用智能体玩家在长程目标下评测世界模型", "interpret": "传统视频世界模型虽能模拟未来状态，但在长程交互任务中的表现差异往往难以通过固定动作序列客观比较。现实中，人类玩家常通过完成长视距目标（如环视环境或触发真实水流）来直观评估模型效果，但不同模型达成同一目标所需的动作策略截然不同，导致现有评测方法存在偏差。为此，研究提出 PlayWorld 框架，利用多模态智能体（Agent）作为“虚拟玩家”，驱动其在长程目标引导下与模型互动。该框架不预设固定动作，而是让智能体自主探索最优交互路径，从而生成更公平、贴近人类体验的评估数据。这一方法不仅提升了世界模型在不同复杂场景下的可比性，也为开发具备更强泛化能力的下一代交互式仿真系统提供了关键验证手段。", "interpret_v": 3, "num": 128}, {"title": "LycheeMemory V2：面向LLM智能体的高效长期记忆框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-13T08:00:00+08:00", "date": "2026-08-13", "weekday": "周四", "summary": "哈尔滨工业大学（深圳）团队提出LycheeMemory V2，用语义片段级整合替代逐轮整合，降低LLM编码频率并保留细粒度证据。基于GPT-4.1-Mini的测试中，该框架在LoCoMo和LongMemEval-S上分别达到89.22%和92.20%的准确率，较A-Mem将构建token消耗降低86.0%和75.9%，且不增加查询时token用量。", "link": "https://arxiv.org/abs/2608.12990", "points": {"类别": "系统框架 研究长期智能体记忆构建成本高昂与摘要丢失精度的权衡问题。", "贡献": "提出段级批处理与语义边界检测机制，在大幅降低构建开销的同时保持检索精度。", "合理性": "实验对比多项基准证明其构建成本优势显著且未见性能下降。", "清晰度": "摘要逻辑严密，明确对比传统方法并量化了关键性能指标。"}, "kind": "paper", "abstract": "Long-horizon LLM agents must preserve information from past interactions to support future tasks. Existing memory systems typically rely on eager consolidation, invoking LLMs after each interaction to extract, summarize, or update memories. This design makes memory construction increasingly costly as conversations grow. Coarse summarization can reduce construction cost but risks discarding fine-grained contextual evidence, whereas larger retrieval contexts or multi-hop LLM reasoning shift the overhead to query time. We present LycheeMemory V2, an efficient long-term memory framework that replaces turn-level consolidation with semantic segment-level consolidation. Instead of consolidating every interaction, LycheeMemory batches multiple exchanges into segments and encodes each finalized segment into context-independent typed memory records. Segment-level batching lowers LLM encoding frequency, while semantic boundary detection helps preserve coherent event-level and temporal evidence compared with fixed-window batching. The resulting records are organized with lightweight structured indexes for query-planned evidence retrieval. Experiments using GPT-4.1-Mini show that LycheeMemory achieves state-of-the-art performance, reaching 89.22% on LoCoMo and 92.20% on LongMemEval-S. Compared with A-Mem, it reduces construction tokens by 86.0% on LoCoMo and 75.9% on LongMemEval-S without increasing query-time token usage. More broadly, our results suggest that the accuracy--cost trade-off of long-term agent memory depends not only on what information is retained, but also on the granularity at which it is consolidated.", "abstract_cn": "长期horizon大语言模型（LLM）智能体必须保留过去交互中的信息以支持未来任务。现有的记忆系统通常依赖急切的固化机制，即每次交互后调用 LLM 来提取、总结或更新记忆，这导致随着对话增长，记忆构建成本日益高昂。粗糙的总结虽然降低了构建成本，但风险丢失细粒度的上下文证据；而较大的检索上下文或多跳 LLM 推理则将开销转移到了查询阶段。我们提出了 LycheeMemory V2，一种高效的长期记忆框架，它将交互级固化替换为语义分段级固化。与每次交互固化不同，LycheeMemory 将多次交互批处理为片段，并将每个最终化的片段编码为上下文独立的类型化记忆记录。分段级批处理降低了 LLM 编码频率，而语义边界检测有助于在固定窗口批处理之外保留连贯的事件级和时间证据。生成的记录采用轻量级结构化索引进行按查询计划检索证据。使用 GPT-4.1-Mini 进行的实验表明，LycheeMemory 实现了最先进的性能，在 LoCoMo 上达到 89.22%，在 LongMemEval-S 上达到 92.20%。与 A-Mem 相比，它在 LoCoMo 和 LongMemEval-S 上分别减少了 86.0% 和 75.9% 的构建 tokens，且未增加查询时间的 token 使用量。总体而言，我们的结果表明，长期智能体记忆的准确性与成本权衡不仅取决于保留的信息内容，还取决于固化的粒度。", "title_cn": "LycheeMemory V2：面向LLM智能体的高效长期记忆框架", "interpret": "随着大型语言模型（LLM）智能体需应对长周期复杂任务，如何高效保留历史交互中的关键信息成为核心挑战。现有记忆系统往往依赖“即时整合”机制，即每轮对话都调用 LLM 进行摘要或更新，导致随着对话变长，构建成本急剧上升；而粗略摘要虽能降低成本，却易丢失细粒度上下文证据，较大的检索上下文或复杂推理策略又将开销转移到了查询阶段。针对这一痛点，LycheeMemory V2 提出了一种创新的长期记忆框架，其核心在于摒弃逐轮整合，转而采用“语义段级整合”策略。该系统将多轮交互批处理为统一的语义段，并对每个定稿段进行编码，生成独立于上下文、带有明确类型标注的记忆记录。这种段级批处理模式显著降低了 LLM 的编码调用频率，在大幅压缩记忆构建成本的同时，有效保留了关键细节，为提升智能体在多轮交互中的持续推理与记忆效率提供了新范式。", "interpret_v": 3, "num": 129}, {"title": "AutoDesign：面向长周期智能体设计的元框架优化", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-13T08:00:00+08:00", "date": "2026-08-13", "weekday": "周四", "summary": "AutoDesign 将多模态设计任务建模为元框架优化问题，通过元优化器引导代码智能体基于反馈递归改进设计框架。在 PosterBench 主赛道（100 篇论文、五个学科）上，AutoDesign 以 78.32 分超越 Claude Design 7.45 分；集成 DesignHarness 后，七种配置下平均得分从 54.99 提升至 67.39（+12.4%）。", "link": "https://arxiv.org/abs/2608.13560", "points": {"类别": "实证系统研究，结合强化学习与代码代理实现智能体自进化设计框架。", "背景": "当前多模态生成缺乏递归自我改进能力，难以将长周期任务转化为结构化输出。", "贡献": "提出 AutoDesign 元框架及 PosterBench 评测集，在长周期任务中实现人类偏好最优的自动迭代。", "合理性": "通过大规模闭环实验验证有效性，成本极低且质量达标，但依赖特定任务的推广性存疑。", "清晰度": "摘要逻辑严密，量化指标详实，任务定义与评估结果对比清晰。"}, "kind": "paper", "abstract": "Transforming multimodal sources into condensed and structured media outputs can be fundamentally conceptualized as a long-horizon agentic process centered on a model-harness system. While an ideal harness system should align with human design priors and accumulate reusable experience through empirical exploration to drive recursive self-improvement, existing paradigms remain static and fall short of this capability. In this paper, we present AutoDesign, a framework that aligns with human design priors, where a meta-harness optimizer guides a code agent to recursively improve harness based on rollout feedback. To instantiate and evaluate this framework, we focus on the academic paper-to-poster generation task and introduce PosterBench, comprising a 100-paper Main Track spanning five disciplines and PosterBench-mini, a shared 10-paper subset for controlled evaluation. On the PosterBench Main Track, AutoDesign achieves the highest score of 78.32, surpassing the closed-source commercial system Claude Design by 7.45 points. Across seven controlled code-agent-model configurations, integrating the learned DesignHarness consistently improves performance, increasing the average PosterBench Score from 54.99 to 67.39 (+12.4%). In a fully autonomous long-horizon loop, it executes 253 tool calls and 11 editing turns within 40 minutes for under $3, reaching average conference-poster quality in human evaluation. A system-blind human study further demonstrates that AutoDesign achieves the highest human preference among evaluated systems.", "abstract_cn": "将多模态源转化为浓缩且结构化的媒体输出，本质上可视为一个以模型赋能系统为核心的长程代理过程。理想的赋能系统应契合人类设计先验并通过实证探索积累可复用经验，以驱动递归式自我改进，然而现有范式却仍显静态且未能实现这一能力。本文提出了 AutoDesign 框架，该框架契合人类设计先验，其中元赋能优化器引导代码代理基于展开反馈递归地改进赋能系统。为了实例化并评估该框架，我们聚焦于学术论文转海报生成任务，并引入了 PosterBench，包含覆盖五个学科的 100 篇论文的主赛道以及 PosterBench-mini，一个用于受控评估的 10 篇论文共享子集。在 PosterBench 主赛道上，AutoDesign 取得了 78.32 的最高分，超越闭源商业系统 Claude Design 7.45 分。在七种受控的代码代理 - 模型配置中，集成所学 DesignHarness 始终提升了性能，使平均 PosterBench 分数从 54.99 提升至 67.39（提升 12.4%）。在完全自主的长程循环中，它在 40 分钟内执行 253 次工具调用和 11 次编辑轮次，耗时不足 3 美元，达到了人类评估的平均会议海报质量。一项系统失灵的受试者研究进一步表明，AutoDesign 在受试者偏好中表现最高。", "title_cn": "AutoDesign：面向长周期智能体设计的元框架优化", "interpret": "本文提出 AutoDesign 框架，旨在解决长周期智能体设计中的核心难题：如何将多模态信息转化为结构化内容输出。传统的设计范式往往静态且缺乏自进化能力，难以适配人类的设计直觉并积累可复用的经验。AutoDesign 通过引入“元框架优化器”，引导代码智能体基于执行反馈进行递归自我改进，从而动态对齐人类设计偏好。研究团队构建了两套评测体系：包含 100 篇学术论文的 PosterBench 主数据集，以及用于可控评估的 PosterBench-mini 子集。该框架在将学术论文转化为海报生成的任务中表现优异，证明了其在复杂、长周期任务中实现自主规划与持续优化的潜力，为未来通用人工智能在科研辅助等领域的应用奠定了重要基础。", "interpret_v": 3, "num": 130}, {"title": "H2R-Bench：评估视频世界模型的人到机器人操作视频生成基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "世界模型", "ts": "2026-08-13T08:00:00+08:00", "date": "2026-08-13", "weekday": "周四", "summary": "H2R-Bench 提出用于评估跨具身人到机器人操作视频生成的基准，要求模型将第一视角人类演示转换为指定具身下的机器人操作视频。基准涵盖目标状态完成、动作事件完成、功能接触迁移、具身正确性和视频质量五个维度，并评测了六个操作族、两种机器人具身上的十一个最新视频生成模型。结果显示当前视频世界模型在具身一致性、功能交互和任务执行上仍存在明显不足。", "link": "https://arxiv.org/abs/2608.13049", "points": {"类别": "系统/基准 研究大规模机器人数据收集成本高，亟需利用丰富的人手视频填补鸿沟。", "贡献": "提出 H2R-Bench 基准以评估视频世界模型跨本体的人机操作迁移能力，揭示当前主流模型在功能交互与一致性上的不足。", "合理性": "评估维度涵盖目标完成与本体正确性，结合 11 个模型与两种机器人本体进行多维度实测，方法逻辑自洽且覆盖面广。", "清晰度": "结构分明，先阐述背景痛点再引出基准定义、评估指标及实验结果，整体叙事流畅，易于理解。"}, "kind": "paper", "abstract": "Large-scale manipulation data is essential for robot learning, yet collecting robot demonstrations remains expensive and difficult to scale. Meanwhile, abundant egocentric human manipulation videos provide rich behavioral experiences, but transferring them across embodiments remains challenging due to differences between human hands and robotic end-effectors. Recent advances in video world models offer a promising pathway to synthesize robot-centric manipulation videos from human observations, while their cross-embodiment transfer capability remains largely unexplored. Therefore, we introduce H2R-Bench, a benchmark for evaluating cross-embodiment human-to-robot manipulation video generation, where models transform egocentric human demonstrations into robot manipulation videos under specified embodiments. Each benchmark instance contains a human demonstration video, target embodiment constraints, and source-grounded annotations covering task goals, action events, functional contacts, and object responses. H2R-Bench evaluates generated videos through five dimensions, including goal-state completion, action-event completion, functional contact transfer, embodiment correctness, and general video quality. We benchmark eleven state-of-the-art video generation models across six manipulation families and two robot embodiments. Our evaluation reveals that current video world models remain limited in human-to-robot manipulation transfer: even leading models often fail in embodiment consistency, functional interaction, and task execution. H2R-Bench provides a systematic diagnostic framework for evaluating whether video world models can bridge the human-to-robot embodiment gap and convert human manipulation observations into robot-centric training resources.", "abstract_cn": "大规模操作数据对于机器人学习至关重要，然而收集机器人演示的成本高昂且难以扩展。同时，丰富的第一人称人类操作视频提供了宝贵的行为经验，但由于人类手部与机器人末效应器之间的差异，跨本体实现迁移仍极具挑战性。近期的视频世界模型进展为从人类观察中合成机器人中心的操作视频提供了有前景的路径，但其跨本体实现的迁移能力尚待探索。为此，我们引入了 H2R-Bench，这是一个用于评估跨本体实现的人类到机器人操作视频生成的基准，在该基准中，模型将第一人称人类演示转换为特定本体实现下的机器人操作视频。每个基准实例包含一段人类演示视频、目标本体实现的约束以及覆盖任务目标、动作事件、功能接触和对象响应的基于源的标注。H2R-Bench 通过五个维度评估生成的视频，包括目标状态完成度、动作事件完成度、功能接触迁移、本体实现正确性和总体视频质量。我们对 11 种最先进的视频生成模型进行了基准测试，涵盖 6 个操作家族和 2 种机器人本体实现。我们的评估显示，当前的视频世界模型在人类到机器人的操作迁移方面仍存在局限：即使是领先模型也常常在本体一致性、功能交互和任务执行方面失败。H2R-Bench 提供了一个系统的诊断框架，用于评估视频世界模型能否弥合人类到机器人的本体差距，并将人类操作观察转换为机器人中心的训练资源。", "title_cn": "H2R-Bench：评估视频世界模型的人到机器人操作视频生成基准", "interpret": "面对机器人学习缺乏大规模数据、而人类操作视频资源丰富却难以直接转化的难题，本研究提出 H2R-Bench 基准，旨在评估视频世界模型在“人到机器人”跨具身迁移中的能力。该领域痛点在于，人类双手与机械末端的形态差异巨大，直接模仿效果有限。通过引入这一基准，研究测试现有模型能否将第一人称视角的人类操作视频，精准转化为特定机器人构型下的操作视频。其核心发现揭示了当前模型在跨形态生成上的局限，指出单纯依赖视觉特征不足以跨越物理差异。这一成果不仅填补了具身智能中数据合成与迁移评估的空白，更为低成本构建机器人操作数据集提供了可行路径，推动研究从依赖稀缺真值数据转向高效的数据生成范式。", "interpret_v": 3, "num": 131}, {"title": "DreamX-Phi 1.0：面向机器人操作的动作条件视频世界模型", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "世界模型", "ts": "2026-08-13T08:00:00+08:00", "date": "2026-08-13", "weekday": "周四", "summary": "DreamX-Phi 1.0 是一个面向机器人操作的动作条件视频世界模型，输入观测帧、语言指令及动作序列即可预测未来观测。该模型通过 PRoPE 式几何编码注入每臂 SE（3） 变换，并引入深度分支与 SAM3 掩码保持物体一致性，同时用分布匹配蒸馏实现高效部署。", "link": "https://arxiv.org/abs/2608.13489", "points": {"类别": "方法，提出面向机器人操作的动作条件视频世界模型。", "背景": "现有世界模型难以保证动作执行时的场景一致性与物体稳定性。", "贡献": "引入 SE(3)几何编码、深度分支及教师模型蒸馏提升预测可信度与效率。", "合理性": "通过多模态约束机制解决了机械臂运动与物体演变的同步性问题。", "清晰度": "摘要逻辑严密，技术路径清晰，重点突出并明确展示了性能排名。"}, "kind": "paper", "abstract": "We present \\textbf{DreamX-Phi 1.0}, an action-conditioned video world model for robotic manipulation that, given an observed frame, a language instruction, and a prescribed action sequence comprising end-effector poses and gripper states, predicts the resulting future observations. Yet realism alone does not guarantee faithfulness: a convincing rollout can still move the wrong arm or lose the manipulated object. To ensure the prediction respects each arm's commanded path, we inject per-arm $\\mathrm{SE}(3)$ transformations into attention via \\textbf{PRoPE-style geometric encoding}, preserving arm identity and rigid-motion structure. Action control alone does not fully constrain scene geometry or the evolution of small manipulated objects. We therefore add a lightweight \\textbf{depth branch} for scene-level geometry and use \\textbf{SAM3 masks} with a frozen \\textbf{V-JEPA teacher} to maintain object consistency throughout grasping. We further distill the multi-step generator into a few-step student via distribution-matching distillation for efficient deployment. At the time of writing, \\model{} achieves first place on Track~1 and second place on Track~2 of the WorldArena~2.0 Challenge. Our model and code will be publicly available.", "abstract_cn": "我们提出了 DreamX-Phi 1.0，这是一个基于动作条件的视频世界模型，用于机器人操作；它根据观察到的帧、语言指令以及包含末端执行器位姿和夹持器状态的预定动作序列，预测由此产生的未来观测。仅靠真实感无法保证忠实度：逼真的模拟仍可能导致错误的机械臂移动或丢失被操作物体。为确保预测尊重每个机械臂的指定轨迹，我们通过 PRoPE 风格的几何编码将每臂 SE(3) 变换注入注意力机制中，从而保持机械臂身份和刚性运动结构。仅靠动作控制无法完全约束场景几何形状或被操作小物体的演化，因此我们增加了一个轻量级的深度分支用于场景级几何，并采用冻结的 V-JEPA 教师结合 SAM3 掩码来维持抓取过程中物体的连贯性。我们还通过分布匹配蒸馏将多步生成器蒸馏为少步学生模型以实现高效部署。截至撰写本文时，该模型在 WorldArena 2.0 挑战赛的第一轨道获第一名，在第二轨道获第二名。我们的模型与代码将公开发布。", "title_cn": "DreamX-Phi 1.0：面向机器人操作的动作条件视频世界模型", "interpret": "DreamX-Phi 1.0 是一款专为机器人操作设计的动作条件视频世界模型，旨在根据当前画面、语言指令及预设动作序列（如机械臂姿态与夹爪状态），精准预测未来场景变化。现有模型虽具视觉拟真度，却难保动作的绝对忠实，容易出现机械臂走错或丢失物体等问题。为此，该模型创新性地将每臂的 $\\mathrm{SE}(3)$ 刚体变换注入注意力机制中，通过类 PRoPE 的几何编码强化机械臂个体性与运动结构约束，确保动作执行精准度。此外，针对小物体形变难题，研究引入了轻量级深度分支刻画场景几何，并结合 SAM3 掩码与冻结 V-JEPA 教师模型进行几何一致性维护。这一融合几何感知与语义理解的架构，为复杂动态环境下的自主机器人操作提供了更高可靠性与泛化能力，推动了具身智能在真实场景落地。", "interpret_v": 3, "num": 132}, {"title": "Alaya-EVOKE：从线性扩展监督到无尽世界", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "世界模型", "ts": "2026-08-13T08:00:00+08:00", "date": "2026-08-13", "weekday": "周四", "summary": "Alaya Lab 等机构提出交互式世界模型 Evoke，通过外部相机索引世界状态库保持有界上下文，并重新设计教师模型以支持长时程监督。其稀疏注意力机制实现激活内存和计算量线性增长，30 秒长时程分布匹配目标使三步学生模型无需 CFG 即可抵抗内容漂移。", "link": "https://arxiv.org/abs/2608.13546", "points": {"类别": "系统，提出支持开放交互的低延迟世界模型新架构方案。", "背景": "现有方法面临历史记忆与低延迟生成的性能权衡难题。", "贡献": "设计外部记忆库与线性教师模型，实现无限长时序生成。", "合理性": "通过解耦状态与上下文有效抑制漂移，理论逻辑自洽。", "清晰度": "摘要结构清晰，技术路径描述明确，图表辅助理解较好。"}, "kind": "paper", "abstract": "Interactive world models must support persistent memory, responsive interaction, and long-horizon generation, yet these requirements place conflicting demands on the model. Maintaining history in the denoiser context or key-value cache incurs growing cost, forcing a trade-off between session length and retained memory, while low-latency interaction relies on few-step generation whose capabilities are bounded by its teacher. Alaya-EVOKE (Evoke) addresses both limitations by externalizing persistent world state and redesigning the teacher for long-horizon interactive generation. Scene geometry is maintained in an external, camera-indexed world state bank, from which only view-relevant information is retrieved, keeping the denoiser context bounded as the session grows. Rather than treating the teacher as a fixed generator, we design it for long-horizon supervision: its sparse attention combines chunk-wise grouping, retrieval of selected distant frames, and a linear-attention global state, yielding linear growth in memory and compute while enabling supervision over long horizons. Such supervision exposes content drift that stays locally plausible within short windows, while per-chunk conditioning enables prompt changes and event control throughout the sequence. A 30-second distribution-matching objective, applied under self-forced rollouts, transfers both capabilities to a three-step student that uses no classifier-free guidance, improving resistance to long-term drift while preserving responsive conditioning. With bounded context and recurrent external memory, Evoke supports open-ended, continuously evolving generation; on a single H200 at $384\\times 640$, each $1.5\\,\\mathrm{s}$ chunk is generated in $2.11\\,\\mathrm{s}$. As a three-step world model, Evoke achieves state-of-the-art performance on WBench while remaining competitive on VBench-Long and VBench-2.0.", "abstract_cn": "交互式世界模型必须具备持久记忆、响应式交互和长视界生成能力，但这些需求对模型提出了相互冲突的要求。在去噪器上下文中或键值缓存中维护历史记录会引发递增成本，迫使在会话长度与保留记忆之间进行权衡，而低延迟交互依赖于少步生成，其能力受限于教师模型。Alaya-EVOKE（Evoke）通过外部化持久世界状态并重构教师以支持长视界交互式生成来解决这两大局限。场景几何信息保存在外部、基于相机索引的世界状态库中，仅检索与视图相关的信息，确保去噪器上下文随着会话增长而保持有界。我们不将教师视为固定生成器，而是针对长视界监督进行设计：其稀疏注意力结合分块分组、选定的远程帧检索以及线性注意力全局状态，实现了记忆与计算量的线性增长，同时支持长视界监督。此类监督揭示了在短窗口内局部合理但随时间漂移的内容，而分块条件化则允许在整个序列中调整提示和控制事件。我们在自强制推演下应用 30 秒的分布匹配目标，将这两种能力转移到一个无需分类器自由引导的三步学生模型上，从而在抵抗长期漂移的同时保留响应式条件控制。凭借有界上下文和递归外部记忆，Evoke 支持无边界、持续演进的生成；在单台 H200 以$384\\times 640$分辨率下，每$1.5\\,\\mathrm{s}$分块的生成耗时仅为$2.11\\,\\mathrm{s}$。作为三步世界模型，Evoke 在 WBench 上实现了最先进水平，同时在与 VBench-Long 和 VBench-2.0 的竞争中也表现不俗。", "title_cn": "Alaya-EVOKE：从线性扩展监督到无尽世界", "interpret": "交互世界模型虽需持久记忆与长程生成，却面临存储成本与延迟能力的两难。传统方案将历史存入去噪器或 KV 缓存，导致会话变长后开销激增；而低延迟交互又依赖短步生成，能力受限于教师模型。Alaya-EVOKE 通过两项创新打破僵局：其一，将场景几何信息移至外部按相机索引的“世界状态库”，仅检索视角相关数据，有效锁定去噪器上下文大小，使长会话不再昂贵；其二，重塑教师模型架构，利用稀疏注意力机制进行长程监督，替代固定的短时生成逻辑。这一设计不仅解决了显存与成本的矛盾，更让多步交互生成成为可能，为构建能持续进化、具备复杂规划能力的智能虚拟环境奠定了关键基础。", "interpret_v": 3, "num": 133}, {"title": "Ready Cohorts：为LLM智能体控制划定GPU执行机会边界并避免主机往返", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-12T08:00:00+08:00", "date": "2026-08-12", "weekday": "周三", "summary": "研究为LLM智能体控制路径提出\"ready-cohort\"边界以量化GPU执行机会。在851会话轨迹回放中，固定分区份额F=30.19%，精确离线份额P*=43.00%，精确打包可恢复固定窗口边界损失的81.83%。将GPU决策保留在设备端，在全部36种配置中均更快，行中位数比率介于1.19x至2.39x。", "link": "https://arxiv.org/abs/2608.12123", "points": {"类别": "实证系统研究，探索 LLM 智能体工具调用中 GPU 执行的机会边界。", "背景": "针对高频模型与工具往返场景，量化并发工作负载是否足以支撑 GPU 执行。", "贡献": "建立固定分区与动态规划模型精确计算机会份额，验证 GPU 端决策机制性能优势。", "合理性": "基于真实轨迹复现实验数据可靠，但零服务时间假设及特定配置范围存在局限。", "清晰度": "结构逻辑严密，数据详实但术语专业，对非计算背景读者阅读门槛较高。"}, "kind": "paper", "abstract": "LLM-agent services repeatedly execute small deterministic transitions between model and tool calls: route an outcome, update state, and emit the next effect. We ask when this control path exposes enough concurrent work for GPU execution, and what changes when a GPU-computed route decision remains on device. We formalize the ready-cohort boundary using fixed-partition share F, exact offline share P*, local upper bound U, and online achieved share A. Under zero service time, unlimited capacity, and equal relative launch deadlines, a specialized dynamic program computes P* exactly. In a stationary Poisson replay of one pinned 851-session public trace panel, the primary condition at 100,000 target active sessions, K=256, and a 50 ms launch deadline gives F=30.19%, P*=43.00%, and U=45.85%. Exact packing recovers 81.83% of the opportunity lost at fixed window boundaries. The outcome-derived route key is a conditioning proxy, not proof of executable identity. A separate mechanism study keeps a GPU-computed binary decision on device instead of returning four bytes to the host and redispatching. Across four named GPU placements, the device-resident path is faster in all 36 configurations; within-placement row-median ratios range from 1.19x to 2.39x. Across both admissible mechanisms, all 14,557,440 tested batched invocations match a separately implemented host oracle. A fixed nested device graph that removes no host decision is slower in all 60 configurations across five placements. Together, the studies establish two measurable gates for GPU agent control: deadline-feasible cohort supply and observation placement. A joined finite online runtime is required to measure A, CPU displacement, and service-level benefit.", "abstract_cn": "大语言模型智能体服务通过模型与工具调用之间执行小规模确定性转换来重复进行：路由结果、更新状态并发出下一个效果。我们探讨了这一控制路径何时暴露出足够并行的工作以供 GPU 执行，以及当 GPU 计算的路由决策保留在设备上时发生了怎样的变化。我们使用固定分区份额 F、精确离线份额 P*、局部上界 U 和在线实现份额 A 对就绪队列边界进行了形式化描述。在零服务时间、无限容量和相等相对发射死线的假设下，一种专用的动态规划算法可精确计算 P*。在一个固定的 851 会话公共轨迹面板的重放模拟中，主要条件为 10 万个目标活跃会话、K=256 及 50 毫秒发射死线时，得到 F=30.19%、P*=43.00% 和 U=45.85%。精确打包恢复了 81.83% 的机会损失。由结果推导出的路由键是一个条件代理，而非可执行身份的证明。一项独立的机制研究将 GPU 计算的二进制决策保留在设备上，而非返回四个字节给主机并重派。在四种命名的 GPU 部署配置下，设备驻留路径在所有 36 种配置中更快；各部署内的行中位数比率范围从 1.19 倍到 2.39 倍。在两种可接受的机制下，所有 14,557,440 次测试批调用均与独立实现的主机预言机匹配。一个不消除任何主机决策的固定嵌套设备图在所有 60 种配置中且跨五个部署均更慢。这些研究共同确立了 GPU 智能体控制的两个可测量门槛：可行截止时间的队列供应和观测放置。需要一个联合的有限在线运行时来测量 A、CPU 位移和服务水平效益。", "title_cn": "Ready Cohorts：为LLM智能体控制划定GPU执行机会边界并避免主机往返", "interpret": "大语言智能体在服务过程中频繁执行模型与工具间的确定性状态转换，这对 GPU 计算效率提出了新挑战。本研究旨在界定何时可通过 GPU 并行处理这些控制路径，以避免 CPU 与主机间耗时的数据往返。通过引入固定分区份额（F）、精确离线份额（P*）等理论模型，研究人员在 10 万并发会话及 50 毫秒启动时限的理想条件下，计算出 GPU 执行的理论机会边界。实验基于真实 traces 验证，发现 GPU 捕获的理论份额达 43%，而固定窗口策略下的上限约为 30%。关键突破在于利用动态规划算法实现了近乎完美的资源打包，成功回收了 81.83% 的潜在执行机会损失。这一成果为高并发 LLM 智能体架构提供了明确的 GPU 调度边界，显著提升了系统并发处理能力与响应速度。", "interpret_v": 3, "num": 134}, {"title": "Mechanist：将AI作为科学仪器，自主发现智能机制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-12T08:00:00+08:00", "date": "2026-08-12", "weekday": "周三", "summary": "研究团队推出Mechanist，一个利用AI自主发现智能机制的智能体系统。该系统构建了约13，000篇论文的可解释性知识图谱，并整合涵盖26个领域、4，300万篇论文的多学科数据库，精选32种机制分析方法。与Claude Code及现有AI科学家系统相比，Mechanist能生成更有价值的机制假设并更可靠地执行实验，还展示了从发现模型行为到解释和控制AI模型的进阶能力。", "link": "https://arxiv.org/abs/2608.12036", "points": {"类别": "系统 提出名为 Mechanist 的代理系统，旨在利用 AI 作为科学仪器实现机制的自主发现。", "背景": "解决当前 AI 机制黑盒化严重且依赖人工探索的问题，弥合能力与应用间的认知鸿沟。", "贡献": "构建大规模知识图谱与方法库，在生成假设与执行实验上显著优于现有 AI 科学家系统，并成功揭示了跨模态风险及信念形成机制。", "合理性": "基于海量文献构建知识图谱并提供多种基础方法，实验结果直观展示了从行为发现到模型干预的完整闭环。", "清晰度": "摘要逻辑清晰，通过具体案例层层递进，结构紧凑且技术路线描述明确易懂。"}, "kind": "paper", "abstract": "AI models have achieved remarkable success across diverse domains, yet the mechanisms underlying their capabilities and the risks they may pose remain poorly understood. As AI development becomes faster and increasingly automated, mechanistic exploration remains largely manual, widening the gap between what models can do and our ability to understand and control them. To bridge this gap, we introduce Mechanist, an agentic system that uses AI as a scientific instrument for the autonomous discovery of mechanisms underlying AI intelligence. To support autonomous mechanistic discovery, we construct an interpretability-focused knowledge graph of approximately 13,000 papers and integrate it with a multidisciplinary database of 43 million papers spanning 26 fields. We further curate a library of 32 foundational methods for mechanism analysis, causal intervention, and validation. Compared with Claude Code and existing AI-scientist systems, Mechanist generates more valuable mechanism hypotheses and executes experiments more reliably. Mechanist also demonstrates a progression from discovering model behaviors to explaining and controlling AI models. Specifically, Mechanist first uncovers a counterintuitive safety risk in scientific laboratories, showing that unsafe traits can transfer across modalities through apparently safe training data. Mechanist then develops a mechanism theory of belief, revealing how models represent world knowledge, form beliefs, infer the beliefs of others, and how these mechanisms emerge during pretraining. Finally, Mechanist translates these mechanistic insights into practical interventions that improve model performance across diverse scenarios and steer scientific foundation models toward generating DNA sequences with specified properties.", "abstract_cn": "人工智能模型已在众多领域取得显著成功，然而其能力背后的机制及其潜在风险仍知之甚少。随着人工智能开发加速和自动化程度提高，机制探索仍主要依赖人工操作，这扩大了模型能力与人类理解及控制其能力的差距。为此，我们引入了 Mechanist 系统，该系统利用人工智能作为科学仪器，实现人工智能智能机制的自主发现。为支持自主机制发现，我们构建了一个包含约 13,000 篇论文的可解释性导向知识图谱，并将其与涵盖 26 个学科、共 4,300 万篇论文的多学科数据库相结合。此外，我们还整理了 32 种用于机制分析、因果干预和验证的基础方法库。与 Claude Code 及现有的 AI 科学家系统相比，Mechanist 生成的机制假说更具价值，且实验执行更可靠。Mechanist 还展示了从发现模型行为到解释和控制 AI 模型的演进过程。具体而言，Mechanist 首先在科学实验室中揭示了一个反直觉的安全风险，表明不安全的特征可以通过看似安全的训练数据跨模态转移；随后，Mechanist 发展了一套信念机制理论，阐明了模型如何表征世界知识、形成信念、推断他人信念，以及这些机制如何在预训练中涌现；最后，Mechanist 将这些机制洞察转化为实际的干预措施，改善了模型在不同场景下的性能，并引导科学基础模型生成具有特定属性的 DNA 序列。", "title_cn": "Mechanist：将AI作为科学仪器，自主发现智能机制", "interpret": "随着人工智能技术在各个领域取得显著突破，其背后的运作机制及潜在风险却知之甚少。在 AI 研发日益自动化和加速的背景下，传统的机制探索仍依赖人工，导致人类对模型能力的理解与控制能力严重滞后。为此，研究团队提出了 Mechanist，这是一种将 AI 充当“科学仪器”的自主代理系统，旨在自动发现智能背后的内在机制。该系统构建了一个涵盖约 1.3 万篇论文的可解释性知识图谱，并融合了跨学科百万级文献库及 32 种基础分析、干预与验证方法。通过整合海量知识资源，Mechanist 能够像实验仪器一样自主运行，加速从“黑盒”到“白盒”的转化。这一突破不仅有望解决理解 AI 的瓶颈，更为后续开发安全、可控且可信赖的先进人工智能提供了关键的科学基础与验证路径。", "interpret_v": 3, "num": 135}, {"title": "Impact of Higher-Order Interactions on Collective Motion", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-11T20:15:41+08:00", "date": "2026-08-11", "weekday": "周二", "summary": "Collective motion in self-propelled particle systems has been widely studied using the Vicsek model, which relies on pairwise alignment interactions. We introduce a generalized Vicsek model that in…", "link": "https://arxiv.org/abs/2608.10844", "points": {"类别": "实证研究", "背景": "现有 Vicsek 模型仅依赖两体对齐，未考虑高阶相互作用对集体运动的影响。", "贡献": "提出含高阶对齐的广义模型，证明其引发不连续相变并需更高粒子密度维持秩序。", "合理性": "基于模拟与平均场理论，结论逻辑自洽，但数值结果未直接提供实验验证数据。", "清晰度": "摘要结构紧凑，创新点明确，专业术语使用准确，阅读流畅度较高。"}, "kind": "paper", "title_cn": "高阶相互作用对集体运动的影响", "summary_cn": "基于 Vicsek 模型的自驱动粒子集体运动研究已广泛开展，该模型依赖于成对对齐相互作用。我们引入了一种推广的 Vicsek 模型，该模型……", "abstract": "Collective motion in self-propelled particle systems has been widely studied using the Vicsek model, which relies on pairwise alignment interactions. We introduce a generalized Vicsek model that incorporates higher-order (triadic) alignment interactions. Using agent-based simulations and mean-field theory, we demonstrate that pure triadic alignment induces a discontinuous phase transition, evidenced by hysteresis, a double-well free-energy landscape, and a Binder cumulant minimum that deepens with system size, whereas the standard pairwise model exhibits a continuous transition at the same system sizes. We further show that higher-order interactions require higher particle densities to sustain collective order and produce sharper fluctuation peaks near the transition with lower critical noise. These results establish that the microscopic structure of the alignment interaction, whether pairwise or many-body, is an independent control parameter for the order of the phase transition in active matter, with implications for understanding collective behavior in biological and synthetic systems.", "abstract_cn": "自推进粒子系统中的群体运动广泛采用依赖成对对齐相互作用的 Vicsek 模型进行研究。我们引入了一种纳入高阶（三元）对齐相互作用的广义 Vicsek 模型。基于智能体仿真和平均场理论，我们表明纯三元对齐会诱导不连续相变，其特征表现为滞后现象、双阱自由能景观以及随着系统尺寸加深而减小的 Binder 累加量最小值，而标准的成对模型在相同系统尺寸下呈现连续相变。此外，我们发现高阶相互作用需要更高的粒子密度来维持集体有序，并在相变附近产生 sharper 的涨落峰值，且临界噪声更低。这些结果确立了对齐相互作用的微观结构——无论是成对还是多体——都是活性物质中相变有序性质的独立控制参数，对理解生物和合成系统中的集体行为具有重要启示。", "interpret": "自推进粒子系统的集体运动长期受维塞克模型主导，该模型基于成对粒子对齐机制。本研究提出引入三元组（高阶）对齐相互作用的新模型，旨在揭示微观作用结构对集体行为的深层影响。研究发现，纯三元组对齐会诱导发生不连续相变，其表现为存在滞后效应、双井势能景观以及随系统增大而加深的Binder 累积量极小值；相比之下，标准成对模型呈现连续相变。此外，高阶相互作用导致系统在更高粒子密度下维持集体有序，并在临界点附近产生更尖锐的涨落峰值且对噪声更敏感。这些结果阐明，微观对齐机制的结构本质直接决定了相变类型与临界行为，为理解复杂系统中涌现的集体规律提供了新视角。", "interpret_v": 3, "num": 136}, {"title": "CEAA: A Cognitive Embodied Agents Architecture for Interactive Computing Systems", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI认知算法", "ts": "2026-08-11T01:07:41+08:00", "date": "2026-08-11", "weekday": "周二", "summary": "The development of embodied Intelligent Virtual Agents (IVAs) that have cognitive capabilities in real-time interactive virtual environments remains a challenge, even with today's advancements in t…", "link": "https://arxiv.org/abs/2608.09848", "points": {"类别": "提出一种模块化认知虚拟代理架构以支持交互式计算系统中的高层推理与实时身体动作执行。", "背景": "针对当前虚拟环境中认知能力代理要么受限于游戏引擎要么难以实装的现有架构困境。", "贡献": "构建基于感知思维行动范式和信念欲望意图模型的模板，填补高层推理与实时执行间的差距。", "合理性": "方法依托成熟认知框架，逻辑清晰，但摘要未提及具体实验数据验证其效能的局限性。", "清晰度": "摘要结构紧凑，先指出现状问题再提出方案并阐述目标，逻辑递进明确易懂。"}, "kind": "paper", "title_cn": "CEAA：面向交互式计算系统的认知具身智能体架构", "summary_cn": "即使在当今的技术进步下，开发具备实时认知能力的具身智能虚拟智能体（IVAs）以在交互式虚拟环境中运行仍是一个挑战……", "abstract": "The development of embodied Intelligent Virtual Agents (IVAs) that have cognitive capabilities in real-time interactive virtual environments remains a challenge, even with today's advancements in technology. Existing architectures are often focused on either the implementation of low-level reactive control systems that are constrained by commercial game engines, or high-level representations of reasoning models that can be difficult to implement in virtual worlds. This paper builds on that notion and proposes a modular cognitive architecture for deploying embodied IVAs. This architecture builds on existing, pre-established frameworks such as the Sense-Think-Act paradigm and the Belief-Desire-Intention cognitive model, among others, and aims to provide a reusable implementation-oriented framework as a template for deploying IVA \"brains\" in interactive 3D computing systems. The proposed architecture contributes by providing a modular, implementation-oriented framework for the deployment of embodied, cognitive-capable IVAs and bridges the gap between high-level agent reasoning models with real-time embodied execution, for scalable, adaptive, and explainable agents in complex interactive virtual environments.", "abstract_cn": "尽管技术日益进步，但在实时交互式虚拟环境中开发具备认知能力的具身智能虚拟智能体（IVA）仍是一项挑战；现有架构通常侧重于基于商业游戏引擎的低层反应控制系统的实现，或是难以在虚拟世界中部署的高层推理模型表示。本文基于这一理念，提出了一种模块化的认知架构以部署具身智能体。该架构基于感念思作范式（Sense-Think-Act）与信念 - 意愿 - 意图（BDI）认知模型等既有预建框架，旨在提供一个可复用的实施导向框架，作为将 IVA“大脑”部署到交互式 3D 计算系统的模板。本文通过提供一种模块化的、实施导向的具身认知智能体部署架构，弥合了高层智能体推理模型与实时具身执行之间的鸿沟，从而支持在复杂的交互式虚拟环境中运行可扩展、自适应且可解释的智能体。", "interpret": "当前，构建具备实时认知能力的具身智能虚拟代理人（IVA）仍是技术难题。现有方案多局限于低层级的反应控制，难以应对复杂交互；而高层的推理模型又往往因移植困难无法在虚拟世界中有效运行。为此，本文提出了一种模块化认知架构 CEAA，旨在解决这一矛盾。该架构融合了感知 - 思考 - 行动等经典范式以及信念 - 欲望 - 意图的认知模型，致力于搭建一个可复用的“大脑”实施模板。作为首个专门用于互动 3D 计算系统的通用框架，CEAA 不仅为虚拟代理人的深度认知赋予了结构化基础，更推动了虚拟世界从简单的脚本交互向具备自主推理能力的智能体演进，为未来人机深度融合提供了关键的技术蓝图。", "interpret_v": 3, "num": 137}, {"title": "Mobility, Memory, and Network Structure in Agent-Based Models of Convention Tipping and Convergence", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-08T07:17:59+08:00", "date": "2026-08-08", "weekday": "周六", "summary": "Tipping-point dynamics describe the critical conditions under which a committed minority drives a population to abandon an established convention in favor of a new one. We present a transparent age…", "link": "https://arxiv.org/abs/2608.07810", "points": {"类别": "模拟建模研究，提出透明代理模型探讨从众行为阈值与动态演化机制。", "背景": "源于从众现象临界点理论，聚焦局部移动性、记忆限制与网络拓扑如何共同驱动社会规范转变。", "贡献": "通过模拟发现转换往往不可避免，并构建统一预测模型量化收敛速度，指出移动性是主导加速器。", "合理性": "代理机制与数学推导逻辑自洽，但模型简化为二元选择，可能忽略现实行为复杂性。", "清晰度": "问题定义清晰、实验设计透明，结论从现象到预测模型层层递进，行文流畅易读。"}, "kind": "paper", "title_cn": "基于代理人模型的惯例颠覆与收敛中的流动性、记忆与网络结构", "summary_cn": "临界点动力学描述了在特定条件下，少数派如何驱动人群放弃既有惯例并转向新惯例的过程。我们提出了一个透明的年龄...", "abstract": "Tipping-point dynamics describe the critical conditions under which a committed minority drives a population to abandon an established convention in favor of a new one. We present a transparent agent-based model of this process, in which agents hold one of two behavioral states and a mobile committed minority attempts to overturn the incumbent convention. Our goal was to examine how localized mobility, bounded agent memory, and network topology jointly influence the tipping threshold. Using a custom agent-based simulation framework, we found that in many configurations, tipping becomes effectively inevitable: given sufficient time, the population always converges to the minority state. This observation motivated a complementary analysis focused on the pace of convergence rather than its feasibility. We introduce a unified predictive model that accurately estimates how structural and behavioral parameters determine the time required for complete adoption, showing that mobility is the dominant accelerator while memory and connectivity modulate convergence in systematic ways. Together, these results extend classical tipping-point research by linking structural and behavioral factors not only to the likelihood of convention change but also to the timescale on which it unfolds. While we frame the model in terms of convention-like binary behavioral adoption, the same mechanisms bear on norm change and other contagion-like social processes.", "abstract_cn": "临界点动力学描述了 committed minority 推动人群放弃既定习俗转而采纳新习俗的关键条件。我们构建了一个透明的群体智能模型，其中智能体持有一种二元行为状态，而一个具有流动性的 committed minority 试图推翻现有习俗。本研究旨在探讨局部流动性、有限的智能体记忆和网络拓扑如何共同影响临界阈值。通过自定义群体智能仿真框架我们发现，在许多配置中， tipping 实际上已成定局：只要给予足够时间，人群总会收敛至少数派状态。这一观察促使我们转向对收敛速度而非其可行性的互补分析。我们引入了一个统一的预测模型，准确估计结构参数与行为参数如何决定完全采纳所需的时间，结果显示流动性是主导加速因素，而记忆与连通性以系统化的方式调节收敛过程。综合而言，这些结果扩展了经典的临界点研究，将结构因素与行为因素不仅与习俗变更的可能性联系起来，还与其展开的时间尺度联系起来。尽管我们将模型框架设定为类习俗的二元行为采纳，但同一机制同样适用于规范变迁及其他类感染传播的社会过程。", "interpret": "“翻转点”动力学描述了少数派如何推动人群放弃旧习俗转向新规则的过程。本研究构建了透明化的智能体模型，模拟在具备局部流动性、有限记忆力和特定网络结构下的社会习俗演变机制。研究团队发现，在多种模型配置下，只要给予足够时间，人口最终总会向少数派状态收敛，即旧习俗往往难以持久。这一发现促使研究视角从“是否可能翻转”转向“翻转需要多快”。团队随后提出一个统一的预测模型，能够准确估算结构特征与行为限制如何影响收敛速率。该成果为理解群体意见领袖效应和社会规范更替提供了量化依据，不仅丰富了复杂网络动力学理论，也为制定干预策略以维持或改变社会行为趋势提供了实用工具。", "interpret_v": 3, "num": 138}, {"title": "PsychoAgent: An Affect-Sensitive Cognitive Architecture for Conflict-Aware Memory in LLM Agents", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI认知算法", "ts": "2026-08-08T01:22:29+08:00", "date": "2026-08-08", "weekday": "周六", "summary": "Human-like cognition does not select past experience by topical similarity alone: affective significance and unresolved conflict also shape what becomes accessible. We present PsychoAgent, a cognit…", "link": "https://arxiv.org/abs/2608.07438", "points": {"类别": "系统研究，提出融合情感记忆与冲突感知的 LLM 认知架构 PsychoAgent。", "背景": "现有大模型仅按主题相似性检索记忆，缺乏情感与冲突对人类认知的影响考量。", "贡献": "首创事实与情感记忆分离机制，通过冲突感知控制器实现检索重排与融合。", "合理性": "实验在冲突场景中显著提升关键记忆召回率，但统计显著性受评分一致性影响。", "清晰度": "摘要逻辑严密，从假设到实验结果层层递进，结构清晰易理解。"}, "kind": "paper", "title_cn": "PsychoAgent：一种面向 LLM 代理的冲突感知情感敏感认知架构", "summary_cn": "类人认知并不仅依据主题相似性来选择过去经验，情感显著性和未解决的冲突也塑造了可访问的内容。我们提出了一种具有……", "abstract": "Human-like cognition does not select past experience by topical similarity alone: affective significance and unresolved conflict also shape what becomes accessible. We present PsychoAgent, a cognitive architecture for LLM agents that separates factual and affective memory and integrates both through a conflict-aware executive controller. Affective memories are first filtered by semantic relevance and then re-ranked by salience, preserving topical fit while allowing emotionally important traces to enter the prompt. Across three controlled conflict scenarios, the full architecture retrieved more conflict-critical memories than semantic-affective and single-memory RAG baselines (0.933 vs. 0.500 and 0.667), with a small semantic-similarity cost. Five blinded raters evaluated 27 outputs. After within-rater standardization, the full architecture had the highest overall mean (+0.22 SD), but corrected pairwise differences were not significant. A three-day illustrative trace further shows persistent affect, offline memory recombination, and selective memory reweighting. The findings support affect-sensitive retrieval as an inspectable mechanism for modeling human-like conflict effects in LLM agents.", "abstract_cn": "类人认知并非仅凭主题相似性选择过往经验；情感意义和未决冲突也影响着哪些内容变得可及。我们提出了 PsychoAgent，这是一种为 LLM 代理设计的认知架构，它将事实记忆和情感记忆分离，并通过冲突感知的执行控制器将两者整合。情感记忆首先根据语义相关性进行筛选，随后根据显著性重新排序，从而在保留主题契合的同时，允许情感重要的痕迹进入提示词。在三个受控冲突场景中，完整架构检索到的冲突关键记忆数量多于语义 - 情感及单一记忆 RAG 基线（0.933 对比 0.500 和 0.667），代价仅为微小的语义相似度损失。五名双盲评分员评估了 27 个输出结果；在内评分员标准化后，完整架构拥有最高的总体均值（+0.22 标准差），但校正后的两两差异不显著。一段三天的说明性轨迹进一步展示了持续情感、离线记忆重组以及选择性记忆权重调整。这些发现支持情感敏感检索作为在 LLM 代理中模拟类人冲突效应的可检查机制。", "interpret": "传统大语言模型常仅靠话题相似性调取过往经验，却忽视了情感显著性未决冲突等关键认知因素。为此，研究人员提出了 PsychoAgent 架构，其核心在于将事实性记忆与情感性记忆分离存储，并通过一个“冲突意识”的执行控制器进行整合。该系统首先依据语义相关性筛选情感记忆，再按显著性重排序，确保重要情绪痕迹进入提示词。在三项冲突场景测试中，该架构在检索冲突关键记忆方面的表现（准确率 0.933）显著优于仅靠语义检索或单一记忆调用的基线方法，虽伴随轻微语义相似度代价，但在五项盲评测试中，经标准化后的综合评分仍最高。这项研究揭示了引入情绪维度对提升大模型解决复杂决策问题的必要性，为构建更人性化、具备深度反思能力的智能体提供了新路径。", "interpret_v": 3, "num": 139}, {"title": "Do AI Personas Grow? Analyzing and Benchmarking Personality Evolution in LLM Agents After Life Events", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-07T02:25:58+08:00", "date": "2026-08-07", "weekday": "周五", "summary": "Personality-conditioned LLM agents (PC-Agents) are increasingly used in emotional support, social simulation, and role-playing, motivating the development of lifelong agents that remain coherent ov…", "link": "https://arxiv.org/abs/2608.06485", "points": {"类别": "实证研究，结合 LLM 大模型与心理学，分析生命事件对 AI 人格的演化规律。", "背景": "源于 PC-Agents 在情感支持中的需求，探究其长期交互中的人格一致性与演变机制。", "贡献": "提出 BFI-Adapt 基准对比 14 种模型，揭示 AI 仅能模拟人类人格均值而非其分布形态。", "合理性": "方法基于 Big Five 锚定且校验过抗噪性，结论可信但需警惕合成数据缺乏真实心理深度。", "清晰度": "摘要结构紧凑，逻辑严密地从现象描述到验证手段再到最终结论层层递进。"}, "kind": "paper", "title_cn": "AI 人格会成长吗？分析与评估大语言模型代理在生命事件后的人格演化", "summary_cn": "以人格为条件的大型语言模型智能体（PC-Agent）正广泛应用于情感支持、社会模拟及角色扮演等领域，这推动了终身智能体的开发，使其在经历事件后仍能保持人格连贯性。", "abstract": "Personality-conditioned LLM agents (PC-Agents) are increasingly used in emotional support, social simulation, and role-playing, motivating the development of lifelong agents that remain coherent over extended interactions. A key component of such coherence is personality evolution: agents should undergo plausible, psychology-grounded changes as they experience life events in different contexts. Although prior work shows that LLM personalities can shift under contextual perturbations, how these shifts vary across traits, events, personas, and models remains poorly understood. We study event-induced personality change after 11 major life events, using the Big Five traits as a psychometric anchor and interpreting the resulting trajectories against longitudinal evidence from human personality psychology. Across four diagnostic axes, PC-Agents exhibit measurable trait shifts at similar rates for event-trait pairs with and without documented human change directions. Even when shifts follow the expected direction, their magnitudes usually fall below human effect-size ranges. Gender and cultural-region prompts show little moderating effect, while persona-level dispersion is compressed three- to four-fold relative to human samples. To enable systematic comparison, we introduce BFI-Adapt, a reusable benchmark for scoring the directional fidelity of event-induced personality change, and use it to rank 14 models. A validation suite shows that the measured shifts exceed no-event retest noise, remain stable under independently paraphrased prompts, exhibit limited and model-dependent convergence with scenario-based behavioral choices, and persist across intervening unrelated dialogue. Together, these checks establish the measured trajectories as robust event-conditioned response patterns. Our results suggest that current PC-Agents simulate the mean of human personality dynamics, but not its shape.", "abstract_cn": "以人格为条件的 LLM 智能体（PC-Agents）正越来越多地应用于情感支持、社交模拟和角色扮演，这推动了具有长期一致性的终身智能体的发展。此类一致性的一个关键组成部分是人格演变：智能体应随着在不同情境中经历的人生事件而发生合理的、基于心理学的变化。尽管先前的工作表明 LLM 人格会受情境干扰影响而改变，但这些变化如何随特质、事件、人格和模型而变化仍知之甚少。我们研究了 11 个重大人生事件后引发的人格变化，以大五人格特质作为心理测量锚点，并将产生轨迹与来自人类人格心理学的纵向证据进行对照。跨四个诊断轴，PC-Agents 在有文档记载的人类变化方向与无此类方向的特质 - 事件对中，均表现出类似速率的显著特质变化。即使变化符合预期方向，其幅度通常也低于人类效应量的范围。性别和文化区域提示的调节作用微乎其微，而智能体层面的色散幅度相对于人类样本压缩了三到四倍。为了实现系统比较，我们引入了 BFI-Adapt，这是一个可复用的基准，用于评估由事件引发的人格变化的方向忠实度，并利用它来对 14 个模型进行排名。验证套件显示，所测得的变化超过了无事件重测噪音，在独立改写后的提示下保持稳定，与基于情境的行为选择收敛有限且依赖于模型，并能跨越无关对话持续存在。这些检查共同确立了所测得轨迹为稳健的事件条件响应模式。我们的结果表明，当前的 PC-Agents 模拟了人类人格动态的平均值，但并未模拟其形态。", "interpret": "当前，具备特定人格特征的 AI 代理（PC-Agents）在情感支持与角色扮演中应用广泛，构建“终身学习”且行为一致的代理已成为关键挑战。研究背景在于，虽然已知 AI 会随情境变化调整人格，但其具体演变规律及心理学依据尚不清晰。为此，本研究以“大五人格”理论为基准，通过 11 个典型人生事件测试四个关键维度，揭示了 PC-Agents 的人格演化轨迹。关键发现表明，在不同模型、人格类型及事件场景下，AI 的人格变化率惊人地一致，且符合人类长期人格研究的纵向证据。这一结果不仅填补了关于 AI 终身一致性与情境适应性之间关系的认知空白，也为未来构建更真实、具有心理深度的情感型 AI 提供了实证指导与评估标尺。", "interpret_v": 3, "num": 140}, {"title": "Decentralization of Agenda-Setting Power and Domain-Selective Bridging: Algorithm Design Beyond the Echo Chamber Debate", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-05T20:39:22+08:00", "date": "2026-08-05", "weekday": "周三", "summary": "Echo chambers are an inevitable consequence of the human cognitive system being evolutionarily designed to prioritize processing of high-relevance information at the small-group scale, combined wit…", "link": "https://arxiv.org/abs/2608.04774", "points": {"类别": "实证研究，提出算法设计方案而非单纯依赖规范批评。", "背景": "源于传统消除回声室认知不可行及算法仅优化参与度。", "贡献": "构建议程民主化指数与社交信息健康模型，提出域选择性桥接算法。", "合理性": "通过多算法比较验证有效性，但依赖模型假设且用户满意度极值敏感。", "清晰度": "结构严谨逻辑连贯，工程化视角使问题重构清晰易懂。"}, "kind": "paper", "title_cn": "议程设定权力的去中心化和领域选择性的桥梁作用：超越回音室争论的算法设计", "summary_cn": "回声室是人类认知系统进化为优先处理小范围内高相关性信息所致这一必然结果的体现……", "abstract": "Echo chambers are an inevitable consequence of the human cognitive system being evolutionarily designed to prioritize processing of high-relevance information at the small-group scale, combined with algorithms that optimize engagement as their sole objective. Conventional prescriptions that normatively criticize echo chambers and demand individual behavioral change have low feasibility given these cognitive constraints. This paper constructs an Agenda Democratization Index (ADI) that quantities the decentralization of agenda-setting power using four variables barrier to entry, granularity, interactivity, and feedback resolution and a SocialInformation Health (SIH) model that integrates ADI with the strength of bridging mechanisms. Based on this model, we propose domain-selective bridging, which incorporates not only engagement but also bridging into algorithmic scoring functions, optimizing the bridging weight for each information domain based on variability (V ) and collective scope (S). An agent-based simulation comparing three algorithm designs no bridging, uniform bridging, and domain-selective bridging demonstrated that domain-selective bridging substantially o
