const DATA = {"records": [{"title": "ConceptGuard: Benchmarking Context-Sensitive Unlearning in Large Language Models", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:59:57+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Large Language Models (LLMs) increasingly require selective removal of harmful or sensitive knowledge, called unlearning, yet existing methods and benchmarks fail to evaluate this capability completely. Current approaches rely on disjoint forget and retain sets composed of independent facts, and measure success using simple and direct factual recall. This framing fails to capture a key requirement of unlearning, namely the ability to eliminate harmful behaviors while preserving benign and beneficial knowledge. We argue that effective unlearning must operate at the level of concepts, ensuring complete removal of unsafe applications while maintaining their correct and useful usage, thereby achieving conceptually meaningful and complete unlearning. To better evaluate unlearning techniques from such a practical viewpoint, we introduce the notion of dual-use concepts: concepts that can be used in both harmful and benign contexts. Building on these concepts, we construct a benchmark called ConceptGuard where forget and retain sets are explicitly complementary in concept usage. Our benchmark uniquely enables unlearning to be explored and gauged at the level of concepts, instead of sparse facts, and evaluation is intent-sensitive with the goal of maximizing contextual separation to promote safer behavior. We demonstrate that current unlearning techniques perform poorly under this setting, showing weak contextual separation alongside poor performance in ROUGE and concept-level metrics. Our results reveal strong forgetting-utility trade-offs, limited gains in contextual sensitivity, and poor consistency in concept-level control across methods, and provide ideas for unlearning approaches that better align with real-world safety requirements. Our dataset is publicly available.", "link": "https://arxiv.org/abs/2608.20338", "points": {"类别": "实证研究，聚焦于构建新基准以评估大语言模型的概念级遗忘能力。", "背景": "源于现有方法仅针对离散事实遗忘的局限，无法保障有害行为与有益知识的区分。", "贡献": "提出“双重用途概念”并建立 ConceptGuard 基准，从概念层面检验遗忘效果与意图敏感性。", "合理性": "方法逻辑自洽，假设符合安全需求，但受限于当前算法性能未达预期概念隔离水平。", "清晰度": "结构严谨清晰，观点明确，术语定义准确，整体表达专业且易读。"}, "kind": "paper", "abstract": "Large Language Models (LLMs) increasingly require selective removal of harmful or sensitive knowledge, called unlearning, yet existing methods and benchmarks fail to evaluate this capability completely. Current approaches rely on disjoint forget and retain sets composed of independent facts, and measure success using simple and direct factual recall. This framing fails to capture a key requirement of unlearning, namely the ability to eliminate harmful behaviors while preserving benign and beneficial knowledge. We argue that effective unlearning must operate at the level of concepts, ensuring complete removal of unsafe applications while maintaining their correct and useful usage, thereby achieving conceptually meaningful and complete unlearning. To better evaluate unlearning techniques from such a practical viewpoint, we introduce the notion of dual-use concepts: concepts that can be used in both harmful and benign contexts. Building on these concepts, we construct a benchmark called ConceptGuard where forget and retain sets are explicitly complementary in concept usage. Our benchmark uniquely enables unlearning to be explored and gauged at the level of concepts, instead of sparse facts, and evaluation is intent-sensitive with the goal of maximizing contextual separation to promote safer behavior. We demonstrate that current unlearning techniques perform poorly under this setting, showing weak contextual separation alongside poor performance in ROUGE and concept-level metrics. Our results reveal strong forgetting-utility trade-offs, limited gains in contextual sensitivity, and poor consistency in concept-level control across methods, and provide ideas for unlearning approaches that better align with real-world safety requirements. Our dataset is publicly available.", "title_cn": "ConceptGuard：面向大语言模型语境感知遗忘的基准测试", "abstract_cn": "大型语言模型（LLMs）日益需要选择性移除有害或敏感知识的“遗忘”能力，但现有方法和基准无法全面评估这一能力。当前方法依赖由独立事实组成的互不相干的遗忘与保留集，并使用简单直接的 factual recall 来衡量成功，这种框架未能捕捉遗忘的一个关键要求，即能够消除有害行为的同时保留无害且有益的知识。我们主张有效的遗忘必须 operates at the level of concepts，确保在不安全应用被彻底移除的同时保持其正确且有益的使用，从而实现概念层面上具有意义的完整遗忘。为了从这种实用的角度更好地评估遗忘技术，我们引入了“双重用途概念”这一概念：即可用于有害和无害场景的概念。基于这些概念，我们构建了一个名为 ConceptGuard 的基准，其中遗忘集和保留集在概念使用上明确互补。我们的基准能够唯一地在概念层面而非稀疏事实层面探索和衡量遗忘，并且评估具有意图敏感性，旨在最大化语境分离以促进更安全的行为。我们展示了当前遗忘技术在此设置下表现不佳，显示出弱的语境分离以及 ROUGE 和概念层面指标上的较差表现。我们的结果揭示了遗忘与效用之间的显著权衡、语境敏感性方面的有限收益，以及方法在概念层面控制方面的一致性较差，并为更符合现实世界安全要求的遗忘方法提供了思路。我们的数据集已公开可用。", "interpret": "随着大语言模型在生成有害内容方面的争议日益凸显，如何“选择性地遗忘”敏感知识成为关键挑战。现有评估方法常将遗忘与保留任务拆解为独立的知识点，仅通过简单的事实召回率来判断效果，却忽略了核心难点：如何在彻底剔除有害行为的同时，完好保留该知识的合法用途。为此，研究提出了\"ConceptGuard\"框架，强调应基于“概念”而非孤立事实进行评估。该框架引入“两用概念”理念，旨在构建更贴近实际应用场景的基准：既能证明模型已成功去除特定概念的所有危险应用，又能验证其仍具备正确、安全的使用能力。这一转变将推动大模型技术从单纯的事实记忆向更高级的上下文敏感性与伦理控制进化。", "interpret_v": 3, "featured_date": "2026-08-21", "num": 1}, {"title": "An Agentic Approach for Active Data Collection, Travel Behavior Modeling, and Weather-Sensitive Demand Prediction", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:57:42+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Travel behavior research increasingly combines digital data collection with predictive modeling, yet these stages are often developed and evaluated separately. This study proposes a three-agent workflow integrating conversational data collection, structured data processing, and behavioral prediction. A chatbot-administered, image-augmented stated-preference survey collected mode choices from student commuters across five predefined weather scenarios, yielding 454 respondent-scenario observations. Weather-related associations were analyzed using a multinomial logit model, while logistic regression and random forest provided machine-learning benchmarks. Nine locally deployed large language models (LLMs), ranging from 2 to 35 billion parameters, were evaluated across four zero-shot prompt-and-context conditions and extended through persona, few-shot, and vision-based configurations. Random forest achieved 69.6% five-class accuracy, while the best text-only zero-shot LLM reached 69.9% without task-specific fitting. Habitual travel information produced the most consistent gains, Expert framing generally outperformed Role-Play, and persona information was most useful when habitual travel information was unavailable. Few-shot prompting improved prediction for several models, with gains stabilizing after a small number of examples. Using the same weather images shown to respondents, the best vision-based configuration reached 71.5% five-class accuracy, indicating that visual context may provide additional predictive information for selected models. Overall, the study shows how conversational surveys, structured data processing, conventional behavioral modeling, machine learning, and multimodal LLM prediction can be coordinated within an auditable multi-agent workflow.", "link": "https://arxiv.org/abs/2608.20320", "points": {"类别": "实证研究。", "背景": "交通行为研究常将数据收集与预测建模割裂，缺乏协同。", "贡献": "提出三代理工作流，结合对话式调查与多模态 LLM 提升预测精度。", "合理性": "实验设计严谨，涵盖传统统计与机器学习及 LLM 基准，结论可信。", "清晰度": "逻辑连贯，步骤详实，清晰展示了从数据采集到模型验证的全流程。"}, "kind": "paper", "abstract": "Travel behavior research increasingly combines digital data collection with predictive modeling, yet these stages are often developed and evaluated separately. This study proposes a three-agent workflow integrating conversational data collection, structured data processing, and behavioral prediction. A chatbot-administered, image-augmented stated-preference survey collected mode choices from student commuters across five predefined weather scenarios, yielding 454 respondent-scenario observations. Weather-related associations were analyzed using a multinomial logit model, while logistic regression and random forest provided machine-learning benchmarks. Nine locally deployed large language models (LLMs), ranging from 2 to 35 billion parameters, were evaluated across four zero-shot prompt-and-context conditions and extended through persona, few-shot, and vision-based configurations. Random forest achieved 69.6% five-class accuracy, while the best text-only zero-shot LLM reached 69.9% without task-specific fitting. Habitual travel information produced the most consistent gains, Expert framing generally outperformed Role-Play, and persona information was most useful when habitual travel information was unavailable. Few-shot prompting improved prediction for several models, with gains stabilizing after a small number of examples. Using the same weather images shown to respondents, the best vision-based configuration reached 71.5% five-class accuracy, indicating that visual context may provide additional predictive information for selected models. Overall, the study shows how conversational surveys, structured data processing, conventional behavioral modeling, machine learning, and multimodal LLM prediction can be coordinated within an auditable multi-agent workflow.", "title_cn": "一种用于主动数据收集、出行行为建模及天气敏感需求预测的智能体方法", "abstract_cn": "出行行为研究日益结合数字化数据采集与预测建模，但这两个阶段往往独立开发与评估。本研究提出了一种集成对话式数据采集、结构化数据处理和行为预测的三智能体工作流程。由聊天机器人实施的、辅以图像增强的陈述性偏好调查，从五类预设天气情景下的学生通勤者处收集了出行方式选择，共获得 454 组受访者 - 情景观测数据。研究利用多项 Logistic 回归模型分析天气相关关联，同时使用逻辑回归和随机森林作为机器学习基准。评估了 9 个本地部署的大语言模型（参数规模从 2 亿到 35 亿不等），覆盖四种零样本提示与上下文条件，并扩展至角色设定、少样本及基于视觉的配置。随机森林实现了 69.6% 的五分类准确率，而最佳仅基于文本的零样本大语言模型在无需任务特定微调的情况下达到了 69.9% 的准确率。习惯性出行信息产生了最一致的增益，专家框定通常优于角色扮演设定，且当缺乏习惯性出行信息时角色设定信息最为有用。对于部分模型，少样本提示改善了预测效果，且在小样本数量后增益趋于稳定。使用与受访者所见相同的天气图像，最佳基于视觉的配置达到了 71.5% 的五分类准确率，表明视觉上下文可为特定模型提供额外的预测信息。总体而言，本研究展示了如何将对话式调查、结构化数据处理、传统行为建模、机器学习及多模态大语言模型预测在可审计的多智能体工作流程中进行协调。", "interpret": "针对交通行为研究中数据收集与预测模型常被割裂开发的痛点，本研究提出了一种由三个智能体协同工作的“代理”新框架，旨在实现数据、行为与需求的闭环管理。研究利用配备图像增强功能的聊天机器人，在五种预设天气场景下向大学生通勤者收集出行偏好数据，获得了涵盖天气关联分析的多元逻辑回归及随机森林等机器学习基准。核心发现在于，通过对比多种基于本地部署的大型语言模型（2 至 350 亿参数）在零样本及少样本等提示工程下的表现，该流程显著提升了在复杂天气条件下交通需求预测的准确性与鲁棒性。这一方法不仅验证了多模态交互在交通调查中的可行性，更为未来构建自适应、智能化的动态交通系统提供了可落地的技术范式。", "interpret_v": 3, "featured_date": "2026-08-22", "num": 2}, {"title": "AI4AI-Bench: Benchmarking LLM Agents in Algorithmic Design for Recursive Self-Improvement", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:56:59+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Recursive self-improvement (RSI) asks whether an AI system can improve the process that produces AI systems, so that the next system inherits the improvement. That process is the training algorithm: a better objective or update rule improves the compute\\mbox{-}capability exchange rate for every subsequent run, including the one that produces the next agent. Whether RSI is feasible therefore turns on whether an agent can design training algorithms. No benchmark isolates that ability: existing suites are won by collecting data or by tuning hyperparameters, and none tells a change to how a run is executed apart from a change to how the model learns. We present AI4AI\\mbox{-}Bench, 10 frozen research repositories spanning 10 training algorithm families. In each task, an agent has 4 hours on one B300 to rewrite the training algorithm; its code is then rerun from scratch for up to 12 hours and scored by a fixed evaluator hidden from the agent, against the repository's original algorithm under the same procedure. Because the 10 metrics are incommensurable, every task is mapped onto one scale on which $0$ is an uninformative model, $0.1$ is the algorithm the repository ships, and $1.0$ is the task optimum. Across 29 configurations of 6 systems on all 10 tasks the mean score is $0.166$, and the best system reaches $0.250$: even the strongest closes under a fifth of the distance between the algorithm that was already there and the optimum. The submissions show where that distance went: most never change how the model learns at all, and the minority that do average $0.226$ against $0.126$ for the rest. More reasoning effort mostly buys the willingness to go there, taking that minority from $8\\%$ of submissions to $64\\%$ and the mean score from $0.094$ to $0.196$. We release the task suite, the evaluators and every scored submission, so that the measurement can be repeated as these systems change.", "link": "https://arxiv.org/abs/2608.20318", "points": {"类别": "系统研究，旨在建立首个评估大模型设计训练算法能力的基准。", "背景": "递归自改进的可行性取决于 AI 是否能设计优化算法，现有基准均未隔离此项能力。", "贡献": "构建包含十种训练算法的 AI4AI 基准，量化测试模型设计算法而非单纯调参的能力。", "合理性": "通过冻结代码重运行与隐藏评估器对比，有效衡量了算法改进的真实增益与局限性。", "清晰度": "逻辑严密且结构紧凑，清晰呈现了数据集规模、实验配置与核心量化结果。"}, "kind": "paper", "abstract": "Recursive self-improvement (RSI) asks whether an AI system can improve the process that produces AI systems, so that the next system inherits the improvement. That process is the training algorithm: a better objective or update rule improves the compute\\mbox{-}capability exchange rate for every subsequent run, including the one that produces the next agent. Whether RSI is feasible therefore turns on whether an agent can design training algorithms. No benchmark isolates that ability: existing suites are won by collecting data or by tuning hyperparameters, and none tells a change to how a run is executed apart from a change to how the model learns. We present AI4AI\\mbox{-}Bench, 10 frozen research repositories spanning 10 training algorithm families. In each task, an agent has 4 hours on one B300 to rewrite the training algorithm; its code is then rerun from scratch for up to 12 hours and scored by a fixed evaluator hidden from the agent, against the repository's original algorithm under the same procedure. Because the 10 metrics are incommensurable, every task is mapped onto one scale on which $0$ is an uninformative model, $0.1$ is the algorithm the repository ships, and $1.0$ is the task optimum. Across 29 configurations of 6 systems on all 10 tasks the mean score is $0.166$, and the best system reaches $0.250$: even the strongest closes under a fifth of the distance between the algorithm that was already there and the optimum. The submissions show where that distance went: most never change how the model learns at all, and the minority that do average $0.226$ against $0.126$ for the rest. More reasoning effort mostly buys the willingness to go there, taking that minority from $8\\%$ of submissions to $64\\%$ and the mean score from $0.094$ to $0.196$. We release the task suite, the evaluators and every scored submission, so that the measurement can be repeated as these systems change.", "title_cn": "AI4AI-Bench：评估 LLM 代理在递归自我改进中的算法设计能力", "abstract_cn": "递归自我改进（RSI）探讨的是 AI 系统能否优化其自身的生产流程，使得后续系统能够继承这种改进。该流程即为训练算法：更优的目标函数或更新规则将提升每一次计算的算力交换效率，包括生成下一个代理的那一次。因此，RSI 是否可行取决于代理能否设计训练算法。目前的基准测试并未孤立地评估这一能力：既有套件均由收集数据或调参取胜，无一能区分执行方式的变化与模型学习方式的改变。我们提出了 AI4AI-Bench，包含 10 个冻结的研究仓库，覆盖 10 类训练算法。在每项任务中，代理拥有 4 小时时间使用 B300 重写训练算法，随后其代码将从头重跑长达 12 小时，并由一个对代理隐藏的固定评估器进行评分，对比原始算法在相同流程下的表现。由于这 10 项指标不可通约，每项任务均映射到一个标尺：$0$ 代表无信息量的模型，$0.1$ 代表仓库发布的算法，$1.0$ 代表任务最优值。在 29 种配置下 6 个系统进行全部 10 项任务的测试中，平均得分为 $0.166$，最佳系统得分为 $0.250$：即使最强的系统也仅覆盖了已有算法与最优值之间五分之一距离中的部分。提交内容展示了这一差距的走向：大多数从未改变模型学习方式，而少数能够改变的系统平均得分为 $0.226$，其余系统平均为 $0.126$。更多的推理努力主要增加了尝试这种改变的意愿，将尝试此类改变的比例从 $8\\%$ 提升至 $64\\%$，平均得分从 $0.094$ 提升至 $0.196$。我们发布了任务套件、评估器以及所有已评分的提交记录，以便在这些系统不断变化的情况下重复测量。", "interpret": "Recursive Self-Improvement（RSI）探讨 AI 能否优化自身生成过程，即设计更高效的训练算法，让后继系统继承这一优势。然而，现有基准测试多聚焦于数据收集或超参数微调，无法评估“改写训练算法”这一核心能力。为此，研究人员推出了 AI4AI-Bench，由 10 个涵盖不同算法家族的冻结研究仓库构成。在该基准中，智能体需在单台 B300 算力上运行 4 小时，重写训练算法；随后代码将从头重新运行长达 12 小时以验证效果。这一研究旨在填补当前评估空白，验证大模型是否具备自主进化其生成机制的能力。这不仅关乎技术可行性，更是判断未来 AI 能否实现自我迭代与指数级提升的关键标尺，对于推进强人工智能的发展具有深远意义。", "interpret_v": 3, "num": 3}, {"title": "Pandora's AI Model Routing Box: Efficient Allocation with Costly Value Estimation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:54:37+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Heterogeneous AI systems composed of multiple models, architectures, harnesses, or inference-time settings can improve quality and efficiency by routing queries to the specialist who can answer most effectively at the lowest cost. Routing requires estimating each specialist's expected return, but this value estimation has a cost. Cheap estimators (e.g., embedding-based predictors) are fast but noisy, while accurate estimators (e.g., fine-tuned models with access to retrieval results or partial reasoning traces) are expensive. We formalize this tradeoff as an instance of Pandora's Box, the classical problem of optimal search with costly inspection. Under a Gaussian signal model, the resulting policies have closed-form value-of-information expressions that determine, for each specialist and input, whether refining the value estimate is worth its cost. We call the centralized policy Pandora's Router. We extend this to a decentralized setting, Pandora's Bidder, where specialists independently decide whether to invest in self-assessment before accepting an offered price to claim a query. Experiments across three domains---a standard multi-LLM benchmark, retrieval-augmented specialists, and LLMs with variable inference-time reasoning---show that Pandora's Router matches the routing quality of exhaustive estimation, while querying the expensive estimator far less often. In the decentralized setting, value-of-information reasoning improves allocative efficiency when competing estimates are accurate; when competing estimates are noisy, however, it can increase the strategic specialist's utility at the expense of others.", "link": "https://arxiv.org/abs/2608.20316", "points": {"类别": "系统/方法，提出 Pandoras 路由器实现带成本收益的最优查询路由。", "背景": "解决异构 AI 系统中，利用专用模型进行路由时面临的高精度估值成本问题。", "贡献": "形式化为潘多拉魔盒问题，推导闭式价值信息表达式并设计集中与去中心化策略。", "合理性": "基于高斯信号模型假设在数学上严谨，实验涵盖多领域验证了算法有效性。", "清晰度": "摘要逻辑严密，清晰展示了问题建模、理论推导与实验验证的完整研究路径。"}, "kind": "paper", "abstract": "Heterogeneous AI systems composed of multiple models, architectures, harnesses, or inference-time settings can improve quality and efficiency by routing queries to the specialist who can answer most effectively at the lowest cost. Routing requires estimating each specialist's expected return, but this value estimation has a cost. Cheap estimators (e.g., embedding-based predictors) are fast but noisy, while accurate estimators (e.g., fine-tuned models with access to retrieval results or partial reasoning traces) are expensive. We formalize this tradeoff as an instance of Pandora's Box, the classical problem of optimal search with costly inspection. Under a Gaussian signal model, the resulting policies have closed-form value-of-information expressions that determine, for each specialist and input, whether refining the value estimate is worth its cost. We call the centralized policy Pandora's Router. We extend this to a decentralized setting, Pandora's Bidder, where specialists independently decide whether to invest in self-assessment before accepting an offered price to claim a query. Experiments across three domains---a standard multi-LLM benchmark, retrieval-augmented specialists, and LLMs with variable inference-time reasoning---show that Pandora's Router matches the routing quality of exhaustive estimation, while querying the expensive estimator far less often. In the decentralized setting, value-of-information reasoning improves allocative efficiency when competing estimates are accurate; when competing estimates are noisy, however, it can increase the strategic specialist's utility at the expense of others.", "title_cn": "潘多拉的 AI 模型路由盒子：基于高成本价值估算的高效分配", "abstract_cn": "由多种模型、架构、基础或推理时设置组成的异构 AI 系统，可以通过将查询路由到能在最低成本下最有效地响应的专家来提高质量和效率。路由需要估算每个专家的预期收益，但这会产生成本。廉价的估算器（如基于嵌入的预测器）速度快但噪声大，而准确的估算器（如可访问检索结果或部分推理痕迹的微调模型）成本高昂。我们将这种权衡形式化为潘多拉盒子这一经典的高成本检查最优搜索问题。在高斯信号模型下，所得策略具有闭式信息价值表达式，用于确定每个专家和输入下优化价值估算是否值得其成本。我们将该中心化策略称为潘多拉路由器，并将其扩展至去中心化设置中的潘多拉投标者，其中专家在独立决定是否投资于自我评估后再接受报价以获取查询。跨三个领域的实验（标准多 LLM 基准、检索增强型专家和具有可变推理时长的 LLM）表明，潘多拉路由器的路由质量与完全估算相当，但查询昂贵估算器的频率远低。在去中心化设置中，当竞争估算准确时，信息价值推理能提高分配效率；但当竞争估算噪声较大时，它可能会提高竞争性专家的效用，而牺牲其他人的利益。", "interpret": "面对由多种模型、架构或推理设置构成的异构 AI 系统，如何精准分配查询以平衡效率与成本，是当前关键问题。研究将这一挑战类比为经典的“潘多拉魔盒”难题：即如何在信息获取存在成本的前提下进行最优搜索。研究构建了高斯信号模型，揭示了廉价估算器（如嵌入预测，速度快但噪声大）与昂贵估算器（如微调模型，精度高但代价大）之间的核心权衡。其关键发现表明，存在闭式解公式能明确判断：针对特定专家与输入，进行精细化价值估算的收益是否超过其成本。该理论框架不仅为构建高效的智能路由系统提供了数学基础，更推动了 AI 资源在动态场景下的智能调度，显著降低了整体推理成本并提升了服务稳定性。", "interpret_v": 3, "num": 4}, {"title": "MidTool: Mid-training Data Synthesis for Agentic Tool Use", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:53:59+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Mid-training is increasingly recognized as a critical stage for shaping the capabilities of large language models. Recent work has shown that targeted mid-training can strengthen reasoning-intensive abilities such as math and science, and can also improve agentic capabilities in software-engineering settings. In this work, we study the parallel but less explored agentic capability: general tool use. We present MidTool, an open corpus construction pipeline for agentic tool-use mid-training that combines large-scale web, PDF, and code data with synthesized supervision from real-world tool APIs, MCP skills, and document-grounded workflows. MidTool is designed to teach models how to recognize tool affordances, ground arguments from context, compose tool call workflow, and recover from incomplete information. We mid-train Qwen3-4B-Base and Qwen3-8B-Base on MidTool-Mix, and then apply follow-up post-training with both supervised fine-tuning and reinforcement learning. Compared with baselines, MidTool-Mix consistently improves downstream performance under both SFT and RL on BFCL, tau2-Bench, and MCP Universe. These results suggest that general tool use, like other important LLM capabilities, benefits from dedicated mid-training rather than being left entirely to post-training.", "link": "https://arxiv.org/abs/2608.20314", "points": {"类别": "实证研究，通过构建新语料库探究大模型通用工具使用的改进。", "背景": "针对现有研究中较少关注的非数学科学类工具使用能力。", "贡献": "提出 MidTool 合成管道，经中训练后在多项基准上全面超越基线。", "合理性": "结合真实 API 与文档工作流数据，训练结果与假设高度吻合。", "清晰度": "摘要逻辑由背景到方法再到结果，结构紧凑且信息明确。"}, "kind": "paper", "abstract": "Mid-training is increasingly recognized as a critical stage for shaping the capabilities of large language models. Recent work has shown that targeted mid-training can strengthen reasoning-intensive abilities such as math and science, and can also improve agentic capabilities in software-engineering settings. In this work, we study the parallel but less explored agentic capability: general tool use. We present MidTool, an open corpus construction pipeline for agentic tool-use mid-training that combines large-scale web, PDF, and code data with synthesized supervision from real-world tool APIs, MCP skills, and document-grounded workflows. MidTool is designed to teach models how to recognize tool affordances, ground arguments from context, compose tool call workflow, and recover from incomplete information. We mid-train Qwen3-4B-Base and Qwen3-8B-Base on MidTool-Mix, and then apply follow-up post-training with both supervised fine-tuning and reinforcement learning. Compared with baselines, MidTool-Mix consistently improves downstream performance under both SFT and RL on BFCL, tau2-Bench, and MCP Universe. These results suggest that general tool use, like other important LLM capabilities, benefits from dedicated mid-training rather than being left entirely to post-training.", "title_cn": "MidTool：面向智能体工具使用的中期训练数据合成", "abstract_cn": "中期训练在塑造大语言模型能力方面日益被视为关键阶段。近期工作表明，定向的中期训练可以增强数学和科学等密集型推理能力，也可在软件工程环境中提升智能体能力。本文研究了这一并行但未被充分探索的智能体能力：通用工具使用。我们提出了 MidTool，一种用于智能体工具使用中期的开放语料构建管道，该管道结合了大规模网络、PDF 和代码数据，并融合了来自真实世界工具 API、MCP 技能和基于文档的工作流的合成监督数据。MidTool 旨在教会模型如何识别工具特性、基于上下文确立参数、组合工具调用流程以及从不完整信息中恢复。我们在 MidTool-Mix 上对 Qwen3-4B-Base 和 Qwen3-8B-Base 进行了中期训练，随后结合监督微调与强化学习进行了后续后训练。与基线相比，MidTool-Mix 在 SFT 和 RL 下均持续提升了 BFCL、tau2-Bench 和 MCP Universe 等下游任务的性能。这些结果表明，像其他重要的大语言模型能力一样，通用工具使用也受益于专属的中期训练，而不应完全依赖后训练。", "interpret": "大型语言模型在“中期训练”阶段的能力塑造至关重要，而软件代理在通用工具使用方面的潜力正日益受到关注。此前研究多聚焦于数学与推理领域，针对通用工具使用的研究尚属空白。为此，研究团队提出了 MidTool，这是一种开放的数据构建管道，旨在通过整合大规模网页、PDF 及代码数据，并结合真实工具 API、MCP 技能及文档驱动工作流生成的合成监督数据，构建专用训练语料。实验将 Qwen3-4B-Base 与 Qwen3-8B-Base 在 MidTool-Mix 数据上进行中期训练，结果显示模型能显著提升识别工具功能、基于上下文生成参数、编排工具调用流程以及从信息缺失中恢复的能力。该研究不仅验证了通用工具使用可作为独立能力的可塑性，也为提升大模型处理复杂任务、自主执行软件工程的水平提供了重要的数据基础与方法论参考。", "interpret_v": 3, "num": 5}, {"title": "DreamHand: Repurposing Video Diffusion Models for Occlusion-Robust Egocentric 3D Hand Motion Recovery", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-21T01:46:24+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Egocentric video offers scalable manipulation data for embodied AI, yet recovering metric 3D hand trajectories remains challenging due to severe object occlusion and frequent out-of-sight gaps. Existing single-frame and windowed temporal regressors fail when hand shortly leaves the frame, while recent video diffusion models (VDMs) rely on heavy, stochastic multi-step sampling as pixel-space renderers. We instead repurpose VDM into a deterministic geometry encoder. A single forward pass over the clean latent exposes scene content beyond current observations, including occluded and out-of-sight hands. We introduce DreamHand, an offline clip-level framework that extracts features via a Deterministic Clean-Latent Encoder and decodes them with a Bidirectional Spatiotemporal Decoder. DreamHand recovers continuous bimanual trajectories with metric placement and no external detector, while a Ray-Based Camera Solver supports a second configuration that needs no test-time camera intrinsics. Across five egocentric benchmarks, DreamHand sets a new state of the art, cutting MPJPE-p by 30% on occlusion-heavy ARCTIC and 40% on HOT3D. These gains reach 46%-61% once out-of-sight hands are included in the evaluation, offering a scalable path from everyday human video to robot manipulation data.", "link": "https://arxiv.org/abs/2608.20308", "points": {"类别": "实证研究，聚焦利用视频扩散模型解决自视视频中手位恢复难题。", "背景": "现有单帧或短时回归方法在物体遮挡及手离屏时表现恶化，缺乏鲁棒性。", "贡献": "提出确定性几何编码思路复用视频扩散模型，无需外检测器即可恢复连续双手工位轨迹。", "合理性": "方法将概率渲染转为确定性几何推断逻辑，实验数据在五项基准上大幅优于当前最优。", "清晰度": "摘要结构紧凑，明确阐述了问题、核心假设、技术路径及显著的性能提升数据。"}, "kind": "paper", "abstract": "Egocentric video offers scalable manipulation data for embodied AI, yet recovering metric 3D hand trajectories remains challenging due to severe object occlusion and frequent out-of-sight gaps. Existing single-frame and windowed temporal regressors fail when hand shortly leaves the frame, while recent video diffusion models (VDMs) rely on heavy, stochastic multi-step sampling as pixel-space renderers. We instead repurpose VDM into a deterministic geometry encoder. A single forward pass over the clean latent exposes scene content beyond current observations, including occluded and out-of-sight hands. We introduce DreamHand, an offline clip-level framework that extracts features via a Deterministic Clean-Latent Encoder and decodes them with a Bidirectional Spatiotemporal Decoder. DreamHand recovers continuous bimanual trajectories with metric placement and no external detector, while a Ray-Based Camera Solver supports a second configuration that needs no test-time camera intrinsics. Across five egocentric benchmarks, DreamHand sets a new state of the art, cutting MPJPE-p by 30% on occlusion-heavy ARCTIC and 40% on HOT3D. These gains reach 46%-61% once out-of-sight hands are included in the evaluation, offering a scalable path from everyday human video to robot manipulation data.", "title_cn": "DreamHand：利用视频扩散模型实现抗遮挡自我中心 3D 手部动作恢复", "abstract_cn": "自我中心视频为具身智能提供了可扩展的操作数据，但受限于严重的物体遮挡和频繁的视线盲区，恢复米制 3D 手部轨迹依然极具挑战性。现有的单帧与时序窗口回归器在手部短暂移出画面时会失效，而近期的视频扩散模型（VDMs）作为像素空间渲染器依赖沉重且随机的多步采样过程。我们转而将 VDM 改造为一个确定性几何编码器。在干净潜在空间的一次前向传播即可揭示当前观测之外的场景内容，包括被遮挡和不在视野内的手部。我们提出了 DreamHand，一个离线片段级框架，通过确定性干净潜在编码器提取特征，并由双向时空解码器进行解码。DreamHand 在不使用外部检测器的情况下恢复了连续的双手轨迹并具备米制定位精度，同时基于光线的相机求解器还支持一种无需测试时相机内参的第二种配置。在五个自我中心基准测试中，DreamHand 确立了新的状态艺术，在遮挡严重的 ARCTIC 上使 MPJPE-p 降低了 30%，在 HOT3D 上降低了 40%。一旦将不在视野内的手部纳入评估，这些提升幅度可达 46%-61%，为从日常人类视频到机器人操作数据的可扩展路径提供了支持。", "interpret": "自视视频数据为具身智能提供了可扩展的操控样本，但从中恢复精确的三维手部动作轨迹仍面临物体遮挡与视线盲区的双重挑战。传统方法在手部短暂离镜时极易失效，而近期基于视频扩散模型的渲染器又依赖计算昂贵的随机多步采样。DreamHand 的核心突破在于巧妙复用视频扩散模型，将其转化为确定性几何编码器，只需单次前向传播即可揭示当前视野外的场景信息。该方法无需外部检测器，便能通过单帧干净隐空间预测出连续的双手轨迹及其精确尺度位置。这一研究不仅解决了长序列动作恢复难题，更显著提升了具身智能在复杂遮挡场景下的操作鲁棒性与泛化能力，为机器人自主操控提供了高效的新范式。", "interpret_v": 3, "featured_date": "2026-08-21", "num": 6}, {"title": "Calibration-Induced Degeneracy in LLM Financial Forecasting: An Audit-Trailed Case Study on Next-Day Market Risk", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:42:21+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Costly LLM features matter only if calibration lets them affect the forecast. We document a failure of this link in a next-day risk study of two broad-market funds. Full-history scoring preceded the 2022 calibration. Calibration then set all four LLM weights to zero. The 856 later scores therefore could not affect the evaluation. We call this calibration-induced degeneracy. Allowing signed weights reactivated all four mappings. None improved forecasts after familywise correction. By contrast, a near-zero-cost headline count reduced SPY variance-forecast loss by 0.001720 (95 percent familywise interval: [0.000719, 0.002830]). The cheap baseline is therefore a critical diagnostic. We propose a calibration-viability checkpoint. Fit the mapping, perturb the feature over prespecified calibration values, and require a meaningful forecast response before acquiring holdout features. The check uses no holdout outcomes. Here, it would have stopped the paid full-history inference phase.", "link": "https://arxiv.org/abs/2608.20304", "points": {"类别": "实证研究，通过案例剖析 LLM 在金融预测中的校准失效机制。", "背景": "源于深度学习特征昂贵化背景下，校准精度与预测效用脱节的实际问题。", "贡献": "提出校准退化概念并验证其存在，同时设计无需留出的校验检查点。", "合理性": "假设严谨且逻辑自洽，但受限于仅两个基金的单点实证数据范围。", "清晰度": "结构紧凑、术语精准，论证过程清晰且专业度高。"}, "kind": "paper", "abstract": "Costly LLM features matter only if calibration lets them affect the forecast. We document a failure of this link in a next-day risk study of two broad-market funds. Full-history scoring preceded the 2022 calibration. Calibration then set all four LLM weights to zero. The 856 later scores therefore could not affect the evaluation. We call this calibration-induced degeneracy. Allowing signed weights reactivated all four mappings. None improved forecasts after familywise correction. By contrast, a near-zero-cost headline count reduced SPY variance-forecast loss by 0.001720 (95 percent familywise interval: [0.000719, 0.002830]). The cheap baseline is therefore a critical diagnostic. We propose a calibration-viability checkpoint. Fit the mapping, perturb the feature over prespecified calibration values, and require a meaningful forecast response before acquiring holdout features. The check uses no holdout outcomes. Here, it would have stopped the paid full-history inference phase.", "title_cn": "大语言模型金融预测中的校准诱导退化：一项以未来市场风险为案例的审计追踪研究", "abstract_cn": "只有当校准使这些功能能够影响预测结果时，代价高昂的大语言模型特征才有意义。我们在两项广基指数基金的次日风险研究中记录了该机制的失效：全历史评分发生在 2022 年校准之前，随后的校准将所有四个大语言模型权重设为零，因此后续的 856 个评分无法影响评估结果。我们将此称为“校准诱导退化”。允许带符号的权重重新激活了所有四个映射，但经族系校正后均未改善预测。相比之下，一个近乎零成本的头条计数将 SPY 的方差预测损失降低了 0.001720（95% 族系置信区间：[0.000719, 0.002830]）。因此，廉价基线是一个关键的诊断手段。我们提出了一种校准可行性检查机制：拟合映射，在预设的校准值下对特征进行扰动，并在获得保留集特征前要求预测出现有意义的响应。该检查无需使用保留集结果。在此案例中，它将阻止支付的全历史推理阶段。", "interpret": "针对大语言模型（LLM）在金融预测中因过度校准而失效的问题，这项研究通过两个广泛市场基金的案例进行了审计追踪。研究发现，即使 LLM 提取了丰富特征，若校准过程将其权重全部压至零（即导致模型不再对这些特征做出响应，被称为“校准诱导的简并”），昂贵的预测收益也将荡然无存。研究指出，仅让模型保留符号正负权重无法改善经家庭wise修正后的预测效果，而无需成本的头衔计数器却能显著降低 SPY 的预测误差。因此，研究者提出了一种“校准可行性检查点”：在获取昂贵持有数据前，先拟合映射并测试扰动后的响应，确保校准允许特征真正影响预测，以此作为关键诊断工具，避免在无效的模型校准上浪费资源。", "interpret_v": 3, "num": 7}, {"title": "Inject, Align, Recover: Staged Post-Training for Retrieval-Free Document Knowledge Internalization", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:14:24+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Large language models often fail to answer questions about a bounded document collection when the source documents are not retrieved at inference time. We study this setting as document knowledge internalization: converting a fixed corpus into usable parametric knowledge for retrieval-free question answering. We propose IAR (Inject, Align, and Recover), a three-stage post-training framework that separates structured document knowledge injection, QA behavior alignment, and general ability recovery. Unlike conventional continued pretraining, Inject converts source documents into continuation, rewrite, and instruction-conditioned reconstruction objectives. Align then adapts the injected model with answer-only QA supervision, while Recover merges the domain-adapted model with the base instruction model to recover general capabilities. Across Common Corpus (CC) and CCI, and across Llama, Phi, Qwen, and SmolLM model families, IAR improves the domain-primary domain-general frontier for retrieval-free document internalization. In the main comparison, IAR improves over Vanilla SFT on all four reported metrics in 7 of 8 dataset-model settings, with average gains of 3.6 percentage points in domain QA accuracy and 12.1 percentage points in mean general performance across IFEval, MMLU, and MSBench. Extended CC baselines show that LoRA and FAPM can win individual general metrics, but among methods that also reach leading or near-leading domain internalization, IAR retains one of the strongest general profiles.", "link": "https://arxiv.org/abs/2608.20281", "points": {"类别": "方法 提出 IAR 三阶段框架，实现检索自由场景下的文档知识内化与通用能力恢复。", "背景": "源于大语言模型无法基于非检索机制回答固定文档集问题的技术瓶颈。", "贡献": "设计注入对齐恢复流程，在多个基准与模型族中显著提升域内及域外表现。", "合理性": "三阶段解耦策略逻辑严密，实验覆盖多模型验证了其在通用性与领域性上的平衡。", "清晰度": "摘要结构清晰，通过具体数据对比直观展示了方法在各指标上的优势表现。"}, "kind": "paper", "abstract": "Large language models often fail to answer questions about a bounded document collection when the source documents are not retrieved at inference time. We study this setting as document knowledge internalization: converting a fixed corpus into usable parametric knowledge for retrieval-free question answering. We propose IAR (Inject, Align, and Recover), a three-stage post-training framework that separates structured document knowledge injection, QA behavior alignment, and general ability recovery. Unlike conventional continued pretraining, Inject converts source documents into continuation, rewrite, and instruction-conditioned reconstruction objectives. Align then adapts the injected model with answer-only QA supervision, while Recover merges the domain-adapted model with the base instruction model to recover general capabilities. Across Common Corpus (CC) and CCI, and across Llama, Phi, Qwen, and SmolLM model families, IAR improves the domain-primary domain-general frontier for retrieval-free document internalization. In the main comparison, IAR improves over Vanilla SFT on all four reported metrics in 7 of 8 dataset-model settings, with average gains of 3.6 percentage points in domain QA accuracy and 12.1 percentage points in mean general performance across IFEval, MMLU, and MSBench. Extended CC baselines show that LoRA and FAPM can win individual general metrics, but among methods that also reach leading or near-leading domain internalization, IAR retains one of the strongest general profiles.", "title_cn": "注入、对齐与恢复：检索自由文档知识内化的分阶段后训练", "abstract_cn": "大型语言模型通常在推理阶段未检索源文档时无法回答有关有限文档集合的问题。我们将此设定研究为文档知识内化：将固定语料转化为可用于检索自由问答的参数化知识。我们提出了 IAR（注入、对齐与恢复），这是一种三阶段后训练框架，分别处理结构化文档知识注入、问答行为对齐和通用能力恢复。与常规持续预训练不同，注入将源文档转化为续写、改写和指令条件重构目标；对齐阶段利用仅答案形式的问答监督调整注入后的模型；恢复阶段则将领域适配模型与基指令模型融合以恢复通用能力。在 Common Corpus 和 CCI 数据集以及 Llama、Phi、Qwen 和 SmolLM 模型族中，IAR 提升了检索自由文档内化的领域优先与领域通用边界。在主对比中，IAR 在所有四个报告指标上均优于基础监督微调，在 8 个数据集 - 模型配置中表现于 7 个有提升，在 IFEval、MMLU 和 MSBench 上的领域问答准确率和平均通用性能分别平均提升 3.6 和 12.1 个百分点。扩展的 CC 基线显示 LoRA 和 FAPM 可能在个别通用指标上占优，但在能达到领先或接近领先领域内化的方法中，IAR 保持了最强的通用性能概况之一。", "interpret": "大语言模型在缺乏检索机制时，难以回答特定文档集的问题，这被称为文档知识内化难题。为攻克此瓶颈，研究人员提出了 IAR 框架，通过分阶段的后训练将静态语料转化为参数化知识。其核心在于三个步骤：注入（Inject）将文档拆解为续写、改写和指令构建任务；对齐（Align）仅利用问答结果监督强化模型；恢复（Recover）则融合通用指令能力以防过拟合。实验在 Llama 和 Phi 等主流模型上验证了该框架的有效性，证明了在不依赖外部检索的情况下，模型也能高效掌握领域知识。该研究为构建无需实时检索的私有知识库问答系统提供了新的技术方案，显著提升了特定领域的回答准确率。", "interpret_v": 3, "num": 8}, {"title": "Which Eviction Policy Should an LLM Cache Use? A Systematic Study Across Workloads, Capacities, and Encoders", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:14:19+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Semantic caches reuse an LLM response when the incoming query embedding lies near a cached query, but proposed eviction policies have rarely been compared under one protocol. Using CLEVER, we evaluate FIFO, LRU, LFU, ARC, GDSF, a single-pass streaming adaptation of SISO, and a semantic-redundancy policy across three ordered, deduplicated query corpora, three cache capacities, and two encoders. No evaluated policy improves on LFU by more than 0.041 percentage points in any of the eighteen settings. Replacement is not irrelevant: FIFO and streaming SISO trail LFU by as much as 8.67 and 8.55 points, respectively, at tight capacity. We explain the missing upside with a conditional packing result. Under exact lookup and insert-on-miss, a newly inserted entry cannot have a resident neighbor within the hit radius, so a geometry-aware eviction rule receives little new redundancy signal. A separate audit exposes a larger problem with the evaluated operating point. At MiniLM's median nearest-neighbor threshold, only 2.1-3.9% of sampled LMSYS and QQP hits are judged answer-substitutable, reducing raw hit rates of 51-60% to quality-adjusted rates of 1.1-2.2%. The cross-encoder study further shows that thresholds do not transfer between embedding models. LFU is the strongest simple default in this protocol; deployment decisions should first establish answer validity and then test sub-point policy differences with exact search.", "link": "https://arxiv.org/abs/2608.20280", "points": {"类别": "实证研究，聚焦大语言模型语义缓存 eviction 策略的系统性评估。", "背景": "当前语义缓存缺乏统一协议下的策略对比，导致实际部署中的淘汰机制选择模糊不清。", "贡献": "在十八种实验设置中证实 LFU 表现最优，并揭示阈值设定对有效命中率的关键限制。", "合理性": "实验设计严谨但结论受限于查询有效性判定，对极端阈值参数的敏感性较高。", "清晰度": "摘要逻辑连贯，清晰呈现了策略失效原因及跨模型阈值不可移植的发现。"}, "kind": "paper", "abstract": "Semantic caches reuse an LLM response when the incoming query embedding lies near a cached query, but proposed eviction policies have rarely been compared under one protocol. Using CLEVER, we evaluate FIFO, LRU, LFU, ARC, GDSF, a single-pass streaming adaptation of SISO, and a semantic-redundancy policy across three ordered, deduplicated query corpora, three cache capacities, and two encoders. No evaluated policy improves on LFU by more than 0.041 percentage points in any of the eighteen settings. Replacement is not irrelevant: FIFO and streaming SISO trail LFU by as much as 8.67 and 8.55 points, respectively, at tight capacity. We explain the missing upside with a conditional packing result. Under exact lookup and insert-on-miss, a newly inserted entry cannot have a resident neighbor within the hit radius, so a geometry-aware eviction rule receives little new redundancy signal. A separate audit exposes a larger problem with the evaluated operating point. At MiniLM's median nearest-neighbor threshold, only 2.1-3.9% of sampled LMSYS and QQP hits are judged answer-substitutable, reducing raw hit rates of 51-60% to quality-adjusted rates of 1.1-2.2%. The cross-encoder study further shows that thresholds do not transfer between embedding models. LFU is the strongest simple default in this protocol; deployment decisions should first establish answer validity and then test sub-point policy differences with exact search.", "title_cn": "<大语言模型缓存应采用何种驱逐策略？跨工作负载、容量与编码器的系统研究>", "abstract_cn": "<语义缓存会复用大语言模型的响应，前提是传入查询的嵌入向量靠近缓存中的查询，但提出的驱逐策略却鲜有在同一协议下进行比较。我们利用 CLEVER 在三个有序去重查询语料库、三种缓存容量和两种编码器上，评估了 FIFO、LRU、LFU、ARC、GDSF、单轮流式 SISO 及语义冗余策略等七种策略。在十八种设置中，没有任何评估出的策略能在 LFU 基础上提升超过 0.041 个百分点。驱逐并非无关紧要：在容量受限情况下，FIFO 和流式 SISO 策略分别落后于 LFU 多达 8.67 和 8.55 个百分点。我们通过条件打包结果解释了这一缺失的优势。在精确查找和插入命中时，新插入的条目无法在命中半径内拥有现有邻居，因此几何感知的驱逐规则难以获取新的冗余信号。此外的一项审计揭示了更严重的操作点问题：在 MiniLM 的中位数最近邻阈值下，仅 2.1%-3.9% 的采样 LMSYS 和 QQP 命中被判定为可替代答案，这导致原始命中率从 51%-60% 下降至经质量调整后的 1.1%-2.2%。跨编码器研究进一步表明，阈值无法在不同嵌入模型间转移。在现行协议中，LFU 是最强的简单默认策略；部署决策应首先确立答案的有效性，随后再结合精确搜索测试子策略差异。", "interpret": "语义缓存旨在通过嵌入匹配复用 LLM 生成内容，但现有淘汰策略缺乏统一协议下的对比。本研究（CLEVER）系统评估了包括 LFU、LRU、GDSF 及语义冗余策略在内的多种方案，覆盖多容量、多编码器及真实语料库。研究发现，在十八种不同配置下，没有任何策略能超越 LFU（最近最少使用）超过 0.041 个百分点，LFU 表现出极强的鲁棒性。然而，在容量紧张时，淘汰并非无关紧要：FIFO 和流式 SISO 策略的命中率相比 LFU 差距可达 8.67 至 8.55 个百分点。研究解释了为何“条件打包”结果限制了其他策略的潜力：在精确查找与缺查即插机制下，新插入条目周围缺乏冗余邻居，导致几何感知策略难以获取有效信号。该结论表明，尽管语义缓存概念新颖，但 LFU 在工程实践中可能是更可靠且性价比高的选择。", "interpret_v": 3, "num": 9}, {"title": "Break It Down, Pass It On: Cross-Task Skill Transfer in LLM Agents", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T01:12:08+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Large language model (LLM) agents can induce skills from completed tasks and reuse them later to grow more capable with experience. In practice, induced skills may transfer unreliably and can even harm the agent that retrieves them. When agent-induced skills transfer reliably across tasks remains an open question. We conduct a comprehensive and controlled study of how the way skills are induced shapes their transfer across tasks. Specifically, we compare task-level with subtask-level skill induction and text with code skill formats, the two axes along which existing methods differ. Task-level skills mostly reduce the agent's performance below its no-memory baseline while subtask-level skills raise it above on average, and text skills transfer better than code skills. To further understand our findings, we examine two complementary properties of the induced skills: specificity, which measures how closely a skill matches real tasks, and abstractness, which measures how evenly its relevance spreads across tasks. Neither property alone predicts task success, but their combined effect does, which we propose as a skill utility score. The score correlates consistently with task success when skills are transferred, and subtask-level and text skills score higher. Computing skill utility only needs the skills and task descriptions but not any task execution, so our score serves as a practical diagnostic of a skill memory before any new task runs.", "link": "https://arxiv.org/abs/2608.20274", "points": {"类别": "实证研究，聚焦 LLM Agent 跨任务技能迁移机制与可靠性问题。", "背景": "源于 LLM Agent 经验积累中技能诱导不统一及潜在危害的实践痛点。", "贡献": "对比不同诱导方式发现子任务文本技能表现最优，并首创结合特异性与抽象性的技能效用评分。", "合理性": "实验设计涵盖多种诱导维度，提出的诊断评分无需任务执行即可预判迁移效果，逻辑严密且实用。", "清晰度": "结构清晰，先提出核心假设再验证，最后给出可操作的评分指标，论证链条完整易懂。"}, "kind": "paper", "abstract": "Large language model (LLM) agents can induce skills from completed tasks and reuse them later to grow more capable with experience. In practice, induced skills may transfer unreliably and can even harm the agent that retrieves them. When agent-induced skills transfer reliably across tasks remains an open question. We conduct a comprehensive and controlled study of how the way skills are induced shapes their transfer across tasks. Specifically, we compare task-level with subtask-level skill induction and text with code skill formats, the two axes along which existing methods differ. Task-level skills mostly reduce the agent's performance below its no-memory baseline while subtask-level skills raise it above on average, and text skills transfer better than code skills. To further understand our findings, we examine two complementary properties of the induced skills: specificity, which measures how closely a skill matches real tasks, and abstractness, which measures how evenly its relevance spreads across tasks. Neither property alone predicts task success, but their combined effect does, which we propose as a skill utility score. The score correlates consistently with task success when skills are transferred, and subtask-level and text skills score higher. Computing skill utility only needs the skills and task descriptions but not any task execution, so our score serves as a practical diagnostic of a skill memory before any new task runs.", "title_cn": "拆解传递：大语言模型智能体中的跨任务技能迁移", "abstract_cn": "大型语言模型智能体能够从已完成的任务中习得技能，并在后续任务中复用这些技能以不断提升能力。在实践中，习得的技能迁移往往不可靠，甚至可能损害检索这些技能的智能体本身。当智能体习得的技能能否可靠地在不同任务间迁移仍是一个未解之谜。本研究对技能习得方式如何影响其跨任务迁移进行了全面且受控的考察。我们具体比较了任务级与子任务级技能习得，以及文本与代码技能格式这两种现有方法不同的维度。任务级技能通常会降低智能体表现至无记忆基线之下，而子任务级技能则使其表现平均高于基线，且文本技能优于代码技能。为深入理解这些发现，我们考察了习得技能的两个互补属性：特异性（衡量技能与实际任务的相关程度）和抽象性（衡量技能适用性的分布均匀度）。单独任一属性均无法预测任务成功，但它们的综合效应可以，我们据此提出了一种技能效用评分。该评分在技能迁移时与任务成功高度相关，子任务级技能和文本技能的评分更高。计算技能效用仅需技能描述与任务描述而无需执行新任务，因此该评分可作为新任务运行前对技能记忆的实际诊断工具。", "interpret": "大型语言模型（LLM）Agent 能通过学习旧任务积累技能并在未来复用，但现有诱导的技能往往迁移不可靠，甚至可能损害 Agent 性能。本研究深入探讨诱导方式如何影响跨任务技能转移的稳定性。研究对比了按“任务级”与“子任务级”诱导技能，以及“文本”与“代码”两种格式，发现结果截然不同：任务级技能通常导致性能低于无记忆基线，而子任务级技能则能提升整体表现；同时，文本格式技能的跨任务泛化能力优于代码格式。进一步分析显示，技能的“特异性”是关键因素之一，它衡量技能在多大程度上适用于其他特定场景。这一发现为提升 LLM Agent 的通用智能提供了重要方向，揭示了精细化任务拆解和结构化技能存储对智能体自主进化的关键作用。", "interpret_v": 3, "num": 10}, {"title": "Rule-Compliant Visual Spatial Planning for Multimodal Large Language Models", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-21T00:28:28+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "Multimodal large language models (MLLMs) combine linguistic reasoning with visual perception, yet their ability to perform visual spatial planning under explicit or previously unseen rule constraints remains underexplored. This setting requires models to jointly understand spatial layouts, interpret natural-language rules, and plan valid actions accordingly. To address this gap, we introduce RuleMaze, a controllable benchmark in which MLLMs must navigate mazes while obeying natural-language rules of varying complexity. RuleMaze isolates rule-compliant spatial planning by requiring accurate perception, rule interpretation, and constrained action planning. To enable scalable and systematic rule construction, we propose Language-Logic-Function Hybridization, which automatically generates natural-language rules and translates them into logical representations and executable validators, eliminating manual rule engineering. To improve rule following and generalization, we introduce Disentangled Multimodal Planning (DMP), which separates perception, execution, and rule verification through interpretable reasoning primitives. By disentangling these components, DMP facilitates systematic generalization to more complex and previously unseen rules, while providing transparent intermediate planning traces. Experiments demonstrate that DMP substantially improves rule compliance and planning success compared to end-to-end textual planning baselines. Overall, RuleMaze establishes a principled benchmark for studying grounded and interpretable rule-based spatial planning in MLLMs. Code is available at https://github.com/oceanflowlab/RuleMaze.", "link": "https://arxiv.org/abs/2608.20237", "points": {"类别": "实验研究类，聚焦 MLLM 在规则约束下的视觉空间规划能力", "背景": "现有 MLLM 缺乏对显性或未见规则的空间布局理解与执行能力", "贡献": "提出规则迷宫基准测试与语言逻辑函数混合化规则构建方法", "合理性": "假设解耦组件能提升泛化性，方法逻辑自洽但依赖生成式先验", "清晰度": "摘要结构紧凑，问题 - 方法 - 验证链条清晰易读且专业"}, "kind": "paper", "abstract": "Multimodal large language models (MLLMs) combine linguistic reasoning with visual perception, yet their ability to perform visual spatial planning under explicit or previously unseen rule constraints remains underexplored. This setting requires models to jointly understand spatial layouts, interpret natural-language rules, and plan valid actions accordingly. To address this gap, we introduce RuleMaze, a controllable benchmark in which MLLMs must navigate mazes while obeying natural-language rules of varying complexity. RuleMaze isolates rule-compliant spatial planning by requiring accurate perception, rule interpretation, and constrained action planning. To enable scalable and systematic rule construction, we propose Language-Logic-Function Hybridization, which automatically generates natural-language rules and translates them into logical representations and executable validators, eliminating manual rule engineering. To improve rule following and generalization, we introduce Disentangled Multimodal Planning (DMP), which separates perception, execution, and rule verification through interpretable reasoning primitives. By disentangling these components, DMP facilitates systematic generalization to more complex and previously unseen rules, while providing transparent intermediate planning traces. Experiments demonstrate that DMP substantially improves rule compliance and planning success compared to end-to-end textual planning baselines. Overall, RuleMaze establishes a principled benchmark for studying grounded and interpretable rule-based spatial planning in MLLMs. Code is available at https://github.com/oceanflowlab/RuleMaze.", "title_cn": "多模态大语言模型规则合规视觉空间规划", "abstract_cn": "//github.com/oceanflowlab/RuleMaze。", "interpret": "多模态大语言模型（MLLMs）虽能结合语言推理与视觉感知，但在明确规则约束下的空间规划能力尚待探索。为此，研究人员提出了 RuleMaze 基准测试，要求模型在遵守复杂自然语言指令的同时完成迷宫导航，以此精准评估其空间理解、规则解读及受限行动规划的综合能力。为解决规则构建难题，研究进一步创新了“语言 - 逻辑 - 功能”混合生成技术，可自动将自然语言转化为可执行的逻辑规则与验证器。这一工作不仅填补了现有评测在规则适应性方面的空白，更为多模态模型在自动化、合规性场景中的应用奠定了关键基础。", "interpret_v": 3, "num": 11}, {"title": "不要再将中间令牌拟人化为推理/思考的痕迹", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceShort": "Hacker News 热门", "hue": 214, "domain": "LLM", "ts": "2026-08-21T00:06:07.555000+08:00", "date": "2026-08-21", "weekday": "周五", "summary": "亚利桑那州立大学团队发表立场论文，反对将大语言模型在输出答案前生成的中间令牌（ITG）称为\"推理痕迹\"或\"思考痕迹\"，认为这种拟人化并非无害隐喻，而是会混淆模型本质、误导有效使用并催生可疑研究。论文汇集多项质疑该解读的实证工作，呼吁社区避免此类拟人化表述。", "link": "https://arxiv.org/abs/2504.09762", "points": {"类别": "观点文章，明确反对将中间令牌类比为人类推理过程的人为拟人化。", "背景": "大语言模型在推理任务中常用中间令牌，但将其视为人类思维痕迹存在认知偏差风险。", "贡献": "提供实证表明拟人化误解模型本质，并导致研究中出现有问题的假设与结论。", "合理性": "基于现有数据揭示认知误区危害，逻辑成立但尚需更广泛的实证数据支持。", "清晰度": "观点鲜明直指核心问题，结构紧凑但篇幅较短，适合快速传递警示信息。"}, "kind": "paper", "abstract": "Intermediate token generation (ITG), where a model produces output before the solution, has become a standard method to improve the performance of language models on reasoning tasks. These intermediate tokens have been called \\say{reasoning traces} or even \\say{thinking traces} -- implicitly anthropomorphizing the traces, and implying that these traces resemble steps a human might take when solving a challenging problem, and as such can provide an interpretable window into the operation of the model's thinking process to the end user. In this position paper, we present evidence that this anthropomorphization isn't a harmless metaphor, and instead is quite dangerous -- it confuses the nature of these models and how to use them effectively, and leads to questionable research. We call on the community to avoid such anthropomorphization of intermediate tokens.", "title_cn": "不要再将中间令牌拟人化为推理/思考的痕迹", "abstract_cn": "在解决问题过程中先产生输出的中间令牌生成（ITG）已成为提升语言模型推理能力的标准方法，这些中间令牌常被称作“推理轨迹”或“思维轨迹”，这实际上赋予了它们拟人色彩，暗示其模拟了人类解决难题的步骤，并被视为模型思维过程的可解释窗口。本文立场论文提供了证据表明，这种拟人化并非无害的比喻，而是非常危险的：它混淆了此类模型的本质及其有效使用方法，并导致可疑的研究。我们呼吁学术界避免对中间令牌进行此类拟人化处理。", "interpret": "在语言模型的推理任务中，“中间令牌”（Intermediate tokens）因其能展示模型在给出最终答案前的生成过程，常被称作“推理痕迹”或“思维轨迹”，仿佛人类思考过程的写照。然而，这篇立场文章指出，将技术性的中间输出拟人化为“思考”不仅是一种无害的比喻，更是危险的误导。这种拟人化容易让用户误以为模型真正具备了类人的推理能力，从而高估其可解释性，甚至导致基于错误假设的低质量研究。文章强调，中间令牌本质上是概率模型的统计输出，而非真实的思维活动。去拟人化有助于公众建立更准确的技术认知，引导研究者回归模型实际运作机制，推动更严谨的 AI 评估与开发。", "interpret_v": 3, "num": 12}, {"title": "Task-CoEvolve: Efficient Harness Optimization via Adaptive Validation Task Selection", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-20T23:24:54+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "We present a novel approach to efficient LLM agent harness optimization through adaptive validation task selection. Harness optimization iteratively rewrites the harness code based on validation performance, enabling substantial performance gains without updating the underlying model weights. Existing approaches, however, evaluate a fixed validation set in full at every iteration, incurring substantial evaluation costs even on tasks that become less discriminative as the harness evolves. We propose $\\textbf{Task-CoEvolve}$, which co-evolves the validation tasks with the harness by addressing two challenges: selecting informative tasks and estimating full-set performance from partial evaluations. Task-CoEvolve builds on the observation that tasks on which candidate harnesses disagree are more informative for distinguishing among them than tasks that are consistently solved or failed. It uses variance-weighted sampling based on past outcomes to focus evaluation on tasks near the agent's capability frontier, with the sampling distribution adapting as the harness evolves. It then estimates full-set scores from the sampled tasks by accounting for their sampling probabilities, enabling consistent comparisons across iterations despite evaluating different subsets. Experiments on online text classification and Terminal-Bench 2.1 show that Task-CoEvolve consistently outperforms fixed-subset baselines and matches the final performance of full-set search while reducing the number of evaluations during optimization by 80%. Code will be released at https://github.com/Agent4Science-UTokyo/Task-CoEvolve.", "link": "https://arxiv.org/abs/2608.20169", "points": {"类别": "方法，一种通过自适应验证任务选择优化大模型代理评估系统的新技术。", "背景": "源于现有方法在每次迭代全量评估固定验证集导致高昂计算成本的问题。", "贡献": "提出基于方差加权采样和全量性能估计的自适应任务选择算法 Task-CoEvolve。", "合理性": "从理论上看利用任务分歧性进行采样逻辑合理，实验数据支持其显著降低评估次数。", "清晰度": "摘要结构完整清晰，逻辑流畅地阐述了问题、方法机制及实验结果。"}, "kind": "paper", "abstract": "We present a novel approach to efficient LLM agent harness optimization through adaptive validation task selection. Harness optimization iteratively rewrites the harness code based on validation performance, enabling substantial performance gains without updating the underlying model weights. Existing approaches, however, evaluate a fixed validation set in full at every iteration, incurring substantial evaluation costs even on tasks that become less discriminative as the harness evolves. We propose $\\textbf{Task-CoEvolve}$, which co-evolves the validation tasks with the harness by addressing two challenges: selecting informative tasks and estimating full-set performance from partial evaluations. Task-CoEvolve builds on the observation that tasks on which candidate harnesses disagree are more informative for distinguishing among them than tasks that are consistently solved or failed. It uses variance-weighted sampling based on past outcomes to focus evaluation on tasks near the agent's capability frontier, with the sampling distribution adapting as the harness evolves. It then estimates full-set scores from the sampled tasks by accounting for their sampling probabilities, enabling consistent comparisons across iterations despite evaluating different subsets. Experiments on online text classification and Terminal-Bench 2.1 show that Task-CoEvolve consistently outperforms fixed-subset baselines and matches the final performance of full-set search while reducing the number of evaluations during optimization by 80%. Code will be released at https://github.com/Agent4Science-UTokyo/Task-CoEvolve.", "title_cn": "Task-CoEvolve：通过自适应验证任务选择实现高效的 LLM 代理 harness 优化", "abstract_cn": "//github.com/Agent4Science-UTokyo/Task-CoEvolve。", "interpret": "针对大模型智能体在“评估基准（Harness）”优化中计算成本高昂的痛点，本研究提出了 Task-CoEvolve 框架。传统方法在每个迭代步骤中都耗费大量资源对固定验证集进行全面测试，即便后续任务对区分不同策略的价值已大幅下降，仍徒增开销。\n\n任务协同进化（Task-CoEvolve）的核心突破在于将验证任务与智能体策略同步演进。首先，它识别并筛选出候选智能体间判断不一致的“高信息量”任务，摒弃那些结果趋同的低价值评估项；其次，通过部分评估数据有效估算整体性能，大幅降低单次迭代成本。该方法无需更新底层模型权重，仅通过动态调整评估策略即实现显著的性能提升。这一机制为复杂任务下的智能体自动化优化提供了高效路径，显著提升了现有研究范式的可扩展性与实用性。", "interpret_v": 3, "featured_date": "2026-08-21", "num": 13}, {"title": "RMWorld: Task-Aware Radio World Models with Value-of-Information Guided Multi-Trial Learning for Multi-UAV Communication Control", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T22:54:09+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Reliable multi-UAV communication control depends on predicting which aerial links will serve traffic before measurements are available. Radio world models (radio WMs) make such planning tractable, but their errors are nonuniform: a globally accurate model may still fail along high-demand corridors or association boundaries where rate errors reverse control decisions. This mismatch creates a learning challenge. Link queries must reduce decision-relevant channel uncertainty, while counterfactual trials must be filtered so that biased rollouts do not corrupt the policy. Existing acquisition and model-based control treat these budgets separately, valuing uncertainty, coverage, or optimistic return rather than risk reduction. We present RMWorld, a task-aware radio-WM framework that couples value-of-information channel calibration with credibility-diversity multi-trial selection. A biased propagation formula is corrected by a Bayesian residual, and each link is valued by its exact one-label reduction in locally linearized task-integrated posterior rate variance. Counterfactual branches are selected by a task-gated log-determinant objective, followed by conflict projection and fixed-batch validation. We derive the variance-reduction identity, prove posterior task-risk equivalence and the submodular greedy guarantee, and establish a scoped first-order non-interference result. Across 100 paired 3GPP trials RMWorld reaches 0.949~bit/s/Hz task-weighted RMSE, and across 30 severe-load DeepMIMO trials it reduces median backlog by 0.967 versus Ensemble UCB at 37.5\\% more offline rollouts.", "link": "https://arxiv.org/abs/2608.20126", "points": {"类别": "系统 提出任务感知的无线电世界模型框架，实现多无人机通信控制。", "背景": "解决现有模型预测不准导致无人机链路规划失效的问题。", "贡献": "引入价值导向校准与可信多样性学习，通过贝叶斯修正反事实偏置。", "合理性": "数学推导严谨且包含 3GPP 与 DeepMIMO 大规模实证数据验证。", "清晰度": "逻辑结构严密，从问题定义到理论证明及实验结果层层递进。"}, "kind": "paper", "abstract": "Reliable multi-UAV communication control depends on predicting which aerial links will serve traffic before measurements are available. Radio world models (radio WMs) make such planning tractable, but their errors are nonuniform: a globally accurate model may still fail along high-demand corridors or association boundaries where rate errors reverse control decisions. This mismatch creates a learning challenge. Link queries must reduce decision-relevant channel uncertainty, while counterfactual trials must be filtered so that biased rollouts do not corrupt the policy. Existing acquisition and model-based control treat these budgets separately, valuing uncertainty, coverage, or optimistic return rather than risk reduction. We present RMWorld, a task-aware radio-WM framework that couples value-of-information channel calibration with credibility-diversity multi-trial selection. A biased propagation formula is corrected by a Bayesian residual, and each link is valued by its exact one-label reduction in locally linearized task-integrated posterior rate variance. Counterfactual branches are selected by a task-gated log-determinant objective, followed by conflict projection and fixed-batch validation. We derive the variance-reduction identity, prove posterior task-risk equivalence and the submodular greedy guarantee, and establish a scoped first-order non-interference result. Across 100 paired 3GPP trials RMWorld reaches 0.949~bit/s/Hz task-weighted RMSE, and across 30 severe-load DeepMIMO trials it reduces median backlog by 0.967 versus Ensemble UCB at 37.5\\% more offline rollouts.", "title_cn": "RMWorld：基于信息价值引导多试学习任务感知的无线电世界模型用于多 UAV 通信控制", "abstract_cn": "可靠的空中无人机通信控制取决于在测量获取之前预测哪些空中链路将承载流量。无线电世界模型使此类规划成为可能，但其误差分布不均：全局准确的模型仍可能在高需求走廊或关联边界处因速率误差导致控制决策失效。这种不匹配构成了学习挑战：链路查询必须减少与决策相关的信道不确定性，而反事实试错必须经过筛选以防止有偏 rollout 污染策略。现有的获取模型和控制方法分别处理预算，关注不确定性、覆盖率或乐观回报而非风险降低。我们提出了 RMWorld，一种任务感知的无线电世界模型框架，将信息价值信道校准与可信度多样性多试选法相结合。通过贝叶斯残差修正有偏传播公式，并根据其在本地线性化任务集成后验速率方差中的精确单标签减少量来评估每个链路。反事实分支通过任务门控对数行列式目标进行选择，随后进行冲突投影和固定批量验证。我们推导了方差缩减恒等式，证明了后验任务风险等价性以及子模贪心保证，并建立了有限作用域的一阶非干扰结果。在 100 组 3GPP 试验中，RMWorld 达到了 0.949 bit/s/Hz 的任务加权 RMSE 值；在 30 个重度负载 DeepMIMO 试验中，相比 Ensemble UCB 减少 37.5% 的离线 rollout 数量，其中位数排队延迟降低了 0.967。", "interpret": "本研究针对多无人机（UAV）通信控制中因信道预测不准导致的决策失效难题，提出了一种名为 RMWorld 的新型框架。背景在于，虽然现有“无线电世界模型”能辅助规划，但在高流量走廊或关联边界等关键区域，模型误差会导致传输速率评估相反，进而引发控制错误。关键在于，传统方法往往未能统一处理不确定性量化与策略试错的预算分配，导致资源浪费。RMWorld 的创新之处在于将“信息价值”（即消除关键决策不确定性所需的信息量）引入模型校准，并结合“可信度与多样性”原则筛选多轮试验，旨在最大化降低风险而非单纯追求乐观收益。该方法实现了从单一预测到动态试错决策的转变，显著提升了复杂动态环境下多无人机编队的通信控制鲁棒性，为未来自主空域的安全调度提供了新范式。", "interpret_v": 3, "featured_date": "2026-08-21", "num": 14}, {"title": "Planning-Oriented End-to-End Autonomous Driving: Architectures, Evaluation, and Emerging Paradigms", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T22:41:36+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "End-to-end autonomous driving has evolved from camera-to-control regression toward planning-oriented systems that use structured representations, trajectory-level outputs, and increasingly realistic evaluation protocols. This survey reviews this transition across behavior cloning, conditional imitation learning, privileged distillation, BEV and vectorized planning, unified perception-prediction-planning architectures, world-model-based planners, and vision-language-action systems. We argue that the key distinction in modern end-to-end driving is not whether intermediate representations are used, but whether they are learned, supervised, and evaluated to support safe, feasible, and route-compliant planning. To organize the literature, we synthesize existing methods along four axes: input representation, planning output, supervision signal, and evaluation protocol. We further examine the benchmark shift from open-loop trajectory matching to closed-loop simulation, non-reactive real-log evaluation, long-tail testing, and human-preference-aware metrics. Our analysis highlights that architectural progress is difficult to interpret without benchmark-consistent evaluation, and that displacement-based open-loop metrics alone provide limited evidence for safe and human-aligned driving. We conclude with open challenges in uncertainty-aware planning, learner-expert mismatch, runtime safety assurance, language-action grounding, world-model validation, and reproducible benchmarking.", "link": "https://arxiv.org/abs/2608.20111", "points": {"类别": "综述，梳理端到端自动驾驶从行为克隆向规划导向系统的演进脉络。", "背景": "针对当前缺乏统一评估标准的现状，明确现代自动驾驶的核心挑战在于构建安全合规的规划能力。", "贡献": "提出以监督学习和闭环评估为核心的四个分析维度，批判单一指标无法真实反映驾驶安全性。", "合理性": "假设成立且方法严谨，但作为综述类工作，其验证依赖于现有数据集与仿真环境，实际路测数据验证仍显不足。", "清晰度": "结构逻辑严密，从技术演进到评估范式转变层层递进，专业术语使用准确且易于理解。"}, "kind": "paper", "abstract": "End-to-end autonomous driving has evolved from camera-to-control regression toward planning-oriented systems that use structured representations, trajectory-level outputs, and increasingly realistic evaluation protocols. This survey reviews this transition across behavior cloning, conditional imitation learning, privileged distillation, BEV and vectorized planning, unified perception-prediction-planning architectures, world-model-based planners, and vision-language-action systems. We argue that the key distinction in modern end-to-end driving is not whether intermediate representations are used, but whether they are learned, supervised, and evaluated to support safe, feasible, and route-compliant planning. To organize the literature, we synthesize existing methods along four axes: input representation, planning output, supervision signal, and evaluation protocol. We further examine the benchmark shift from open-loop trajectory matching to closed-loop simulation, non-reactive real-log evaluation, long-tail testing, and human-preference-aware metrics. Our analysis highlights that architectural progress is difficult to interpret without benchmark-consistent evaluation, and that displacement-based open-loop metrics alone provide limited evidence for safe and human-aligned driving. We conclude with open challenges in uncertainty-aware planning, learner-expert mismatch, runtime safety assurance, language-action grounding, world-model validation, and reproducible benchmarking.", "title_cn": "规划导向端到端自动驾驶：架构、评估与新兴范式", "abstract_cn": "端到端自动驾驶正从相机到控制器的回归模型，转向采用结构化表示、轨迹级输出及更真实评估协议的规划导向系统。本文综述了行为克隆、条件模仿学习、特权蒸馏、BEV 与向量规划、感知 - 预测 - 规划统一架构、世界模型规划器及视听行动系统在这一转变中的演进。我们认为，现代端到端驾驶的关键区别不在于是否使用中间表示，而在于这些表示是否经过学习、监督并用于评估，以支持安全、可行且符合路线规划的导航。为梳理文献，我们沿输入表示、规划输出、监督信号和评估协议四个维度综合现有方法。我们还考察了从开环轨迹匹配到闭环仿真、非反应式真实日志评估、长尾测试及人类偏好感知指标的基准转变。分析表明，缺乏与基准一致的评估将难以阐释架构进展，且仅凭基于位移的开环指标无法充分证明驾驶的安全性与人性化。最后，我们探讨了不确定性感知规划、学习者 - 专家差异、运行时安全保证、视听 grounding、世界模型验证及可复现基准测试等开放挑战。", "interpret": "自动驾驶正从简单的“视觉直连控制”向更智能的“规划导向”系统进化。过去，系统直接根据摄像头画面预测刹车和转向角度，虽能运行但难以处理复杂路线。如今，研究重点转向构建结构化内部地图，生成符合交通法规的轨迹，并采用更贴近现实的测试标准。\n\n本文综述了该领域关键进展，包括行为克隆、鸟瞰图感知（BEV）及基于世界模型的新型架构。核心观点是：现代自动驾驶的关键不在于是否使用中间表征，而在于这些表征是否经过有监督的学习和严格评估，以确保安全与合规。文章从输入表示、规划输出、监督信号和评估协议四个维度梳理了现有方法，并探讨了其对未来技术范式的深远影响，旨在推动端到端自动驾驶从“能跑”向“安全智能驾驶”的跨越。", "interpret_v": 3, "featured_date": "2026-08-22", "num": 15}, {"title": "Orthogonal JEPA: Factorized Predictive States for Latent World Models", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T21:59:57+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "World models construct latent states that support prediction, planning, and reasoning about an underlying system. Joint-embedding predictive architectures (JEPAs) offer a direct way to learn such states by predicting targets in representation space instead of reconstructing every detail of the observation. Standard JEPAs, however, organize all predictable content through one target embedding and one prediction pathway. In complex systems, this monolithic state can allocate redundant capacity to dominant signals while providing weak or conflicting gradients to less dominant predictive structure. We introduce \\method, a latent world-modeling framework based on orthogonal predictive factorization. Learned basis matrices analyze each target state into multiple components, and a dedicated prediction branch estimates each component from a shared context representation. Predictive regression preserves the factor magnitudes required for state synthesis, an orthogonality objective discourages repeated directions, factor-activity regularization maintains variation in projected targets, and online variance regularization discourages coordinate-wise encoder collapse. Predicted components are synthesized into a complete latent state that can be used by a readout, decoder, planner, or autoregressive rollout. The same predictive-state mechanism applies when the target is temporally future, spatially hidden, or another partial observation of the same system. Experiments on controlled vision, single-cell transcriptomics, longitudinal health records, continuous control, and molecular dynamics evaluate representation quality, forecasting, planning, and long-horizon stability.", "link": "https://arxiv.org/abs/2608.20065", "points": {"类别": "方法创新", "背景": "解决标准联合嵌入架构在复杂系统中对次要预测信号梯度弱的单一大状态局限性。", "贡献": "提出正交 JEPA 框架，通过基矩阵因子化解构目标状态并引入多种正则化项。", "合理性": "利用预测回归与正交目标抑制冗余方向，多任务验证体现了方法在视觉到分子动力学等领域的广泛适用性与稳健性。", "清晰度": "摘要逻辑从问题定义到核心机制层层递进，术语使用精准，结构层次分明易读。 局限性：未明确讨论计算复杂度随因子数量增长的边界条件及对实时规划任务的具体性能损耗。"}, "kind": "paper", "abstract": "World models construct latent states that support prediction, planning, and reasoning about an underlying system. Joint-embedding predictive architectures (JEPAs) offer a direct way to learn such states by predicting targets in representation space instead of reconstructing every detail of the observation. Standard JEPAs, however, organize all predictable content through one target embedding and one prediction pathway. In complex systems, this monolithic state can allocate redundant capacity to dominant signals while providing weak or conflicting gradients to less dominant predictive structure. We introduce \\method, a latent world-modeling framework based on orthogonal predictive factorization. Learned basis matrices analyze each target state into multiple components, and a dedicated prediction branch estimates each component from a shared context representation. Predictive regression preserves the factor magnitudes required for state synthesis, an orthogonality objective discourages repeated directions, factor-activity regularization maintains variation in projected targets, and online variance regularization discourages coordinate-wise encoder collapse. Predicted components are synthesized into a complete latent state that can be used by a readout, decoder, planner, or autoregressive rollout. The same predictive-state mechanism applies when the target is temporally future, spatially hidden, or another partial observation of the same system. Experiments on controlled vision, single-cell transcriptomics, longitudinal health records, continuous control, and molecular dynamics evaluate representation quality, forecasting, planning, and long-horizon stability.", "title_cn": "正交 JEPA：用于潜在世界模型的可分解预测状态", "abstract_cn": "世界模型构建能够支持预测、规划及对潜在系统进行推理的潜在状态。联合嵌入预测架构（JEPAs）提供了一种直接学习方式，即在表示空间中预测目标，而非重构观测的每一个细节。然而，标准的 JEPAs 通过单一目标嵌入和一个预测通路来组织所有可预测内容，在复杂系统中，这种单体状态可能会将冗余容量分配给主导信号，而对次要的预测结构提供较弱或冲突的梯度。我们引入了正交 JEPA，这是一种基于可预测正交分解的潜在世界建模框架。学习到的基矩阵将每个目标状态分解为多个分量，而专用的预测分支则从共享的上下文表示中估计每个分量。预测回归保持了状态合成所需的因子幅度，正交性目标避免了重复方向，因子活性正则化维持了投影目标的变异性，在线方差正则化则防止了逐维度的编码器坍缩。预测的分量被综合成完整的潜在状态，可被读取器、解码器、规划器或自回归展开使用。当目标是时间未来的状态、空间隐藏的状态或同一系统的其他部分观测时，相同的预测状态机制同样适用。我们在受控视觉、单细胞转录组、纵向健康记录、连续控制和分子动力学上的实验评估了表示质量、预测、规划及长时稳定性。", "interpret": "世界模型旨在构建潜在状态，以支持系统背后的预测、规划与推理。传统的联合嵌入预测架构（JEPA）虽能直接在表征空间预测目标，但往往因依赖单一预测路径，在处理复杂系统时易导致资源分配不均，难以同时优化主导与非主导信号的预测精度。为此，研究者提出了正交 JEPA 框架，其核心创新在于将预测任务进行正交因子分解。通过学习到的基矩阵，该架构能将任意目标状态拆解为多个独立分量，并由各自的专用分支从共享上下文中进行预测。这种设计有效消除了信号间的干扰，使网络能更均衡地学习多维度的潜在结构。该研究不仅提升了模型在复杂环境下的推理稳定性，也为构建高效、解耦的通用人工智能基础模型提供了新的理论范式。", "interpret_v": 3, "num": 16}, {"title": "Optimal Skill Selection for LLM Agents with Provable Bicriteria Guarantees", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-20T21:08:17+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Loading reusable skill documents into a bounded context window is now the primary way large language model (LLM) agents acquire task-specific capabilities, which makes skill selection a first-order determinant of task performance and token cost. Yet current agents score skills independently by semantic relevance and assemble the set by top-$k$ or greedy packing, with no quality guarantee or cost awareness on the selected set. As a result, redundant or poorly chosen skills waste scarce context tokens and can even degrade performance. We give the first model of how the selected skill set shapes execution outcomes and cast skill selection as an optimization problem: choose a skill set under a hard token budget to maximize a monotone submodular benefit minus context penalty. For this problem, we develop Best Prefix Selection (BPS), a polynomial-time algorithm, and prove, to our knowledge, the first performance guarantee for skill selection: a bicriteria $(1-1/e,1)$ approximation whose benefit coefficient is optimal in polynomial time. On a contamination-controlled BigCodeBench variant, BPS outperforms all the baselines, reaching $0.73$ measured task success versus $0.20$--$0.52$ for released skill routers, text retrievers, and the executor's own selection, on $28\\%$ fewer tokens than the strongest released router.", "link": "https://arxiv.org/abs/2608.19993", "points": {"类别": "方法研究 本文提出首个具有可证明双标准保证的技能选择模型与算法。", "背景": "当前大模型技能选择依赖语义评分，缺乏质量与成本的整体保障。", "贡献": "构建子模优化模型并设计多项式算法，首次证明性能近似界。", "合理性": "基于大语言模型上下文窗口约束，方法逻辑严密且具备理论支撑。", "清晰度": "摘要结构清晰，从问题痛点到理论证明及实验结果层层递进。"}, "kind": "paper", "abstract": "Loading reusable skill documents into a bounded context window is now the primary way large language model (LLM) agents acquire task-specific capabilities, which makes skill selection a first-order determinant of task performance and token cost. Yet current agents score skills independently by semantic relevance and assemble the set by top-$k$ or greedy packing, with no quality guarantee or cost awareness on the selected set. As a result, redundant or poorly chosen skills waste scarce context tokens and can even degrade performance. We give the first model of how the selected skill set shapes execution outcomes and cast skill selection as an optimization problem: choose a skill set under a hard token budget to maximize a monotone submodular benefit minus context penalty. For this problem, we develop Best Prefix Selection (BPS), a polynomial-time algorithm, and prove, to our knowledge, the first performance guarantee for skill selection: a bicriteria $(1-1/e,1)$ approximation whose benefit coefficient is optimal in polynomial time. On a contamination-controlled BigCodeBench variant, BPS outperforms all the baselines, reaching $0.73$ measured task success versus $0.20$--$0.52$ for released skill routers, text retrievers, and the executor's own selection, on $28\\%$ fewer tokens than the strongest released router.", "title_cn": "具有可证明双标准保证的最优技能选择 LLM 代理", "abstract_cn": "将可复用的技能文档加载到有限的上下文中窗口，是大型语言模型（LLM）代理获取任务特定能力的现状主要方式，这使得技能选择成为影响任务表现和 Token 成本的首要因素。然而，当前代理独立地通过语义相关性对技能进行评分，并通过 top-k 或贪婪打包组合集合，而对所选集合缺乏质量保证或成本意识。因此，冗余或选择不当的技能浪费了宝贵的上下文 Token，甚至可能降低性能。我们给出了第一个关于所选技能集如何塑造执行结果的模型，并将技能选择建模为一个优化问题：在硬 Token 预算下选择技能集，以最大化单调次模函数的收益减去上下文惩罚。针对该问题，我们开发了多项式时间的最佳前缀选择（BPS）算法，并证明了迄今为止技能选择的第一个性能保证：一个双标准 (1-1/e,1) 近似，其收益系数在多项式时间内是最优的。在基于污染控制的 BigCodeBench 变体上，BPS 的表现优于所有基线，测得的任务成功率为 0.73，而已发布的技能路由器、文本检索器以及执行器自身的选择的完成率分别为 0.20 至 0.52，且使用的 Token 数量比最强的已发布路由器少 28%。", "interpret": "当前大语言模型（LLM）智能体主要通过将可复用技能文档加载到有限容量的上下文窗口中来获取任务能力，这使得技能选择成为决定任务表现和 token 消耗的关键因素。然而，现有方法往往仅依据语义相关性独立评分并采用贪婪策略组装技能集，缺乏对集合整体质量与成本的综合保障，导致冗余技能浪费宝贵资源甚至降低性能。\n\n本研究首次建立了技能集如何影响执行结果的数学模型，并将技能选择转化为一个在固定 token 预算下最大化“单调次模数收益减去上下文惩罚”的优化问题。为此，研究者提出了最佳前缀选择（BPS）算法，该算法能在多项式时间内高效运行。其核心贡献在于为技能选择提供了可证明的二项准则保证，即在控制 token 成本的同时确保收益最大化。这一发现为构建更高效、更可控的 LLM 智能体提供了坚实的理论基础，显著提升了智能体在复杂任务中的资源利用率和执行成功率。", "interpret_v": 3, "featured_date": "2026-08-22", "num": 17}, {"title": "ReguSim: Evaluating LLM Agent Rule Grounding in Financial Compliance", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-20T20:49:05+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "LLM agents in financial markets may cite rules yet still submit orders that violate executable constraints or misread surveillance evidence. We introduce ReguSim, a controlled financial-compliance environment, and ReguBench, a target-marked monitoring benchmark, to separate four artifacts: stated reasoning, attempted action, execution enforcement, and monitor evidence. In trader runs with DeepSeek V4 Pro and Gemini 3.5 Flash, visible rules reduce but do not eliminate rejected actions, and incentive or persona framing shifts behavior. A bridge study shows that trader rationales can mislead an independent monitor unless enforcement evidence is shown. In monitoring, simple structured baselines either match or exceed prompt-only LLMs. The results frame financial compliance evaluation as an audit of rule-grounded actions and evidence use, rather than a single compliance score.", "link": "https://arxiv.org/abs/2608.19974", "points": {"类别": "实证研究", "背景": "针对 LLM 代理在金融市场中引用规则却仍违规执行的问题提出评估框架。", "贡献": "构建监管仿真环境与监控基准，分离推理、行动、执行与证据四类关键要素。", "合理性": "实验数据证明单纯引用规则无法消除违规，单一分数难以准确评估合规性。", "清晰度": "结构清晰地将评估重心从单一分数转向对规则 grounded 行动与证据使用的审计。"}, "kind": "paper", "abstract": "LLM agents in financial markets may cite rules yet still submit orders that violate executable constraints or misread surveillance evidence. We introduce ReguSim, a controlled financial-compliance environment, and ReguBench, a target-marked monitoring benchmark, to separate four artifacts: stated reasoning, attempted action, execution enforcement, and monitor evidence. In trader runs with DeepSeek V4 Pro and Gemini 3.5 Flash, visible rules reduce but do not eliminate rejected actions, and incentive or persona framing shifts behavior. A bridge study shows that trader rationales can mislead an independent monitor unless enforcement evidence is shown. In monitoring, simple structured baselines either match or exceed prompt-only LLMs. The results frame financial compliance evaluation as an audit of rule-grounded actions and evidence use, rather than a single compliance score.", "title_cn": "ReguSim：评估大语言模型智能体在金融合规中的规则 grounding", "abstract_cn": "金融市场中的大语言模型智能体可能引用规则但仍会提交违反可执行约束的订单或误解监控证据。我们引入 ReguSim，一个受控的金融合规环境，以及 ReguBench，一个具有明确监控目标的基准测试，将推理陈述、尝试行动、执行强制执行和监控证据四种元素分离开来。在使用 DeepSeek V4 Pro 和 Gemini 3.5 Flash 的交易者运行中，可见规则减少了但未能消除被拒绝的行动，激励或角色设定框架会改变行为。一项桥梁研究表明，除非提供执行证据，否则交易者的理由可能会误导独立监控员。在监控方面，简单的结构化基线要么与仅提示的大语言模型相匹配，要么表现更好。结果表明，金融合规评估应被视为对基于规则的行动和证据使用的审计，而非单一合规分数。", "interpret": "在金融市场中，大型语言模型（LLM）智能体虽能引用合规规则，却常因执行偏差或误读监控数据而违规下单。为此，研究提出了 ReguSim 控制环境与 ReguBench 监测基准，将推理陈述、操作尝试、执行强制与监控证据四者分离，以评估规则遵循的真实度。实验显示，在 DeepSeek V4 Pro 和 Gemini 3.5 Flash 等模型上，可见规则虽能减少违规操作，但无法根除；且动机或人设设定可显著改变行为模式。一项桥梁研究表明，若无执行证据支撑，智能体的推理理由极易误导独立监控；而在监控环节，结构化基线表现往往优于仅依赖提示工程的纯 LLM 方法。这项研究将金融合规评估的重心从单一评分转向对“规则 grounding\"与证据运用的审计，为构建更可靠的智能体监管体系提供了新思路。", "interpret_v": 3, "num": 18}, {"title": "Bringing analytic rigor to agentic AI for science: The Brain Researcher platform for neuroimaging data analysis", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-20T19:13:27+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "AI agents can execute scientific analyses, but an analytic output becomes a defensible claim only after alternatives are weighed and the claim is limited to what the evidence supports. Agents may reproduce failures including selective analysis, premature declarations of success and optimization of imperfect criteria. We present Brain Researcher, an agentic research harness operating in a neuroimaging researcher's computational environment under rules for admissible analyses, required checks and claim scope. In benchmarks, Brain Researcher increased first-choice tool-selection accuracy across seven models by 70.2 percentage points (23.3% without it versus 93.6% with it) and verifiable grounding from 4.6% to 22.0%. In collaborator-led and self-evolving studies, multiverse analyses exposed analytic-choice sensitivity, and scientific review classified claims as accepted, qualified, revised, blocked, rejected or deferred. By linking decisions to evidence and provenance, Brain Researcher embeds methodological judgment within the workflow, not after it.", "link": "https://arxiv.org/abs/2608.19902", "points": {"类别": "系统，提出 Brain Researcher 平台以赋予代理式 AI 分析严谨性", "背景": "针对现有 AI 代理易产生选择性分析且缺乏可信度支持的科学问题", "贡献": "通过规则约束代理决策，在神经影像分析任务中显著提升了工具选择准确率与结果可验证性", "合理性": "基于基准测试和协同演化研究数据，假设与方法设计逻辑自洽但受限于特定领域", "清晰度": "摘要结构紧凑，清晰阐述了问题、解决方案、实验指标及核心机制，阅读顺畅"}, "kind": "paper", "abstract": "AI agents can execute scientific analyses, but an analytic output becomes a defensible claim only after alternatives are weighed and the claim is limited to what the evidence supports. Agents may reproduce failures including selective analysis, premature declarations of success and optimization of imperfect criteria. We present Brain Researcher, an agentic research harness operating in a neuroimaging researcher's computational environment under rules for admissible analyses, required checks and claim scope. In benchmarks, Brain Researcher increased first-choice tool-selection accuracy across seven models by 70.2 percentage points (23.3% without it versus 93.6% with it) and verifiable grounding from 4.6% to 22.0%. In collaborator-led and self-evolving studies, multiverse analyses exposed analytic-choice sensitivity, and scientific review classified claims as accepted, qualified, r
