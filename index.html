e $σ$. On WebArena-Lite, full-parameter optimization of Qwen-3.5-27B improves the No Skill baseline by 6.69%. In test-time automatic heuristic design, Agentic ESOpt performs online prompt--parameter co-evolution, improving its matched baseline in 28 of 36 settings.", "abstract_cn": "强化学习在单轮大语言模型微调方面表现良好，但长周期智能体推理引入了高度分支的交互与稀疏奖励，暴露了强化学习的局限性：其基于反向传播的重型训练栈使得大型模型微调不切实际，且长轨迹使信用分配问题更加困难。本文认为，进化策略（ES）是微调长周期大语言模型智能体的更好选择。与智能体强化学习相比，ES 具备三大优势：1) 模型可扩展性：ES 仅需极少的推理级 GPU 内存即可实现全参数优化，使大型模型微调成为可能；2) 灵活性：其轻量级黑盒反馈接口易于与提示空间进化（如技能优化和测试时计算）组合使用；3) 长周期可扩展性：ES 可在不将奖励跨周期分解的情况下执行轨迹级参数归因，随着周期长度增加展现出优于智能体强化学习的可扩展性。基于此洞察，本文提出了面向灵活参数与上下文协同进化的全参数智能体微调框架 Agentic ESOpt。该框架在每一步对当前大语言模型参数采样扰动，用奖励评估生成的智能体，并应用在线奖励加权更新。为改进探索与适应的权衡，Agentic ESOpt 进一步引入了扰动规模的余弦衰减调度。在 WebArena-Lite 基准上，Qwen-3.5-27B 的全参数优化将无技能基线提升了 6.69%；在测试时启发式设计自动规划任务中，Agentic ESOpt 通过在线提示与参数协同进化，在 36 个设置中有 28 个优于匹配基线。", "title_cn": "Agentic ESOpt：以极低 GPU 需求微调长程 LLM 智能体", "interpret": "强化学习（RL）在单次对话大语言模型微调上表现优异，但在处理长程、多步骤的代理智能体任务时，面临交互分支增多和奖励稀疏的挑战，导致传统的反向传播训练成本高昂且信用归因困难。本研究提出进化策略（ES）作为替代方案，主张其更适合微调长程大模型智能体。相比 RL，ES 具备三大优势：模型可扩展性上，仅需极低的推理级显存即可实现全参数优化，使得大型模型微调成为可能；灵活性上，其轻量级的黑盒反馈接口便于与提示空间进化（如技能优化、测试时计算增强）结合。该研究通过降低算力门槛，有望推动多智能体系统在复杂现实场景中的落地应用。", "interpret_v": 3, "num": 89}, {"title": "TAMP-Nav：面向高效具身导航的点选、思考、记忆与对齐框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "具身智能", "ts": "2026-08-18T08:00:00+08:00", "date": "2026-08-18", "weekday": "周二", "summary": "TAMP-Nav 提出统一框架，将具身导航重构为 2D 视觉提示任务，让 VLM 仅需选择 2D 像素即可由 SLAM 控制器执行，并引入选择性推理与锚点轨迹记忆机制，通过 GRPO 双层对齐实现高效导航。该方法在 R2R-CE 基准上取得 66.2% SR 的 SOTA 成绩，且仅需 90k 训练轨迹，兼具高运行效率与样本效率。", "link": "https://arxiv.org/abs/2608.17512", "points": {"类别": "方法 本文提出一种新的具身导航框架，解决现有大模型在动作空间与自然推理上的不匹配问题。", "背景": "源于大视觉语言模型直接部署困难，传统方法强行扭曲其 2D 预训练先验且效率低下。", "贡献": "通过像素到 3D 动作转换、选择性思考与记忆机制、两级对齐策略，实现高效导航。", "合理性": "将 2D 点选映射至 3D 控制符合 VLM 特性，GRPO 强化反馈设计逻辑自洽且具备显著优势。", "清晰度": "摘要结构分明，依次阐述框架三大核心组件并给出关键实验数据，表达流畅专业。"}, "kind": "paper", "abstract": "Although Large Vision-Language Models (VLMs) have significantly advanced embodied navigation, their direct deployment remains challenging, as existing methods often force VLMs into unnatural action spaces that misalign with their 2D pre-training priors, compounded by rigid reasoning schedules and inefficient memory management. To overcome these limitations, we propose TAMP-Nav, a unified framework for efficient embodied navigation. First, we introduce a Pixel-to-3D Action Formulation (Point) that reformulates navigation into 2D visual prompting. Specifically, the VLM merely selects 2D pixels, which are then projected into 3D coordinates for a low-level SLAM controller. This design naturally aligns embodied execution with the VLM's inherent 2D visual capabilities. Second, we propose an integrated Selective Reasoning and Anchor-Trajectory Memory mechanism (Think and Memorize), which dynamically triggers Chain-of-Thought and retains high-fidelity memory only at critical nodes, compressing redundant trajectories into lightweight Space-Time Indicators, thereby preserving critical historical information and enhancing spatio-temporal perception. Finally, we design an efficient Two-Level Alignment Paradigm (Align) via Group Relative Policy Optimization (GRPO). By superimposing global outcome rewards with fine-grained process rewards, this dense supervision tightly aligns the agent's cognitive planning with physical environmental feedback, endowing the model with adaptive reasoning capabilities. Experiments demonstrate that TAMP-Nav achieves state-of-the-art performance (e.g., 66.2% SR on R2R-CE) with high runtime and sample efficiency (requiring only 90k training trajectories).", "abstract_cn": "尽管大视语言模型（VLMs）显著推动了具身导航的发展，但其直接部署仍面临挑战，因为现有方法往往迫使 VLM 进入与其 2D 预训练先验不一致的不自然动作空间，并受到刚性推理流程和低效内存管理的制约。为此，我们提出了 TAMP-Nav，一个高效的具身导航统一框架。首先，我们引入像素 -3D 动作形式化（Point）技术，将导航任务重构为 2D 视觉提示；具体而言，VLM 仅选择 2D 像素并投影为 3D 坐标以驱动底层 SLAM 控制器，使具身执行与 VLM 固有的 2D 视觉能力自然对齐。其次，我们提出了一种集成的选择性推理与锚点轨迹记忆机制（Think and Memorize），该机制动态触发思维链并仅在关键节点保留高保真记忆，通过冗余轨迹压缩为轻量级时空指示器，从而保留关键历史信息并增强时空感知能力。最后，我们设计了基于组相对策略优化（GRPO）的两层对齐范式（Align），通过叠加全局结果奖励与细粒度过程奖励，实现了对智能体认知规划与物理环境反馈的紧密监督，赋予模型自适应推理能力。实验表明，TAMP-Nav 在运行效率和样本效率方面表现优异，且在具身导航任务（R2R-CE）中达到了最先进的性能（如 SR 达到 66.2%），仅需 90k 训练轨迹即可完成训练。", "title_cn": "TAMP-Nav：面向高效具身导航的点选、思考、记忆与对齐框架", "interpret": "大型视觉语言模型（VLMs）虽极大推动了具身导航发展，但受限于其 2D 预训练背景，直接应用常因动作空间强制、推理僵化及记忆低效而受阻。为此，研究提出了 TAMP-Nav 框架，旨在统一解决这一难题。其核心突破在于\"像素到 3D 动作\"的建模方式：让 VLM 仅选择 2D 像素点，再投影至三维坐标驱动低层 SLAM 控制器，实现了与模型视觉能力的天然对齐。同时，该框架引入了“思考与锚定轨迹记忆”机制，动态优化推理流程并管理路径信息。这一设计显著降低了导航的推理与执行成本，为构建更智能、自主的移动机器人提供了新范式，解决了当前具身智能在长程规划与复杂环境适应上的瓶颈。", "interpret_v": 3, "num": 90}, {"title": "Chain-of-Experience：让大语言模型在测试时通过迭代经验持续改进", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-18T08:00:00+08:00", "date": "2026-08-18", "weekday": "周二", "summary": "一项研究提出 Chain-of-Experience（CoE）方法，让大语言模型在测试时通过与自身或环境反馈的迭代交互积累经验，形成超越零样本推理的持续改进循环。", "link": "https://arxiv.org/abs/2608.18027", "points": {"类别": "实证研究 传统 LLM 评估忽略推理时互动带来的持续学习能力改进机制。", "背景": "人类通过经验持续学习，而现有大模型测试评估缺乏此类迭代反馈。", "贡献": "提出测试时链式经验（CoE）框架，结合多源反馈显著提升数学、代码及知识任务表现。", "合理性": "通过对比实验验证了迭代经验优于基线，并观察到能力与改进容量的正相关关系可信。", "清晰度": "摘要逻辑清晰，明确定义了问题、方法、实验设置及核心发现，结构紧凑。"}, "kind": "paper", "abstract": "Humans continuously learn from experience, whereas conventional large language model (LLM) evaluations ignore the models' ability to improve through inference-time interaction. In this paper, we study how LLMs learn from iterative experience at test time, a setting we refer to as Chain-of-Experience (CoE), where models accumulate experiential traces through iterative interactions with self or environmental feedback to form a continual improvement loop beyond zero-shot inference. We instantiate CoE with diverse feedback mechanisms, including model self-feedback and environmental signals such as correctness or public coding test pass rates, and evaluate across math, coding, and knowledge domains using 8 LLMs, including GPT-5, Gemini-2.5 Pro, Claude-4.5 Sonnet. Our study shows that leveraging iterative experience consistently outperforms feedback-free baselines, achieving substantial gains with self feedback alone, alongside a 5.6% overall improvement and 19% lower API cost across tasks and models. We further show that combining complementary feedback channels (e.g., model and correctness signals) yields additional gains, and that CoE delivers higher accuracy per token than existing test-time strategies. We observe a positive correlation between LLM base ability and improvement capacity, and show that models remain robust under weak or spurious feedback, with different feedback contributing to distinct improvement aspects and most gains emerging early in the iterations.", "title_cn": "Chain-of-Experience：让大语言模型在测试时通过迭代经验持续改进", "abstract_cn": "人类能够持续从经验中学习，而传统的大语言模型评估往往忽视了模型通过推理时交互进行改进的能力。本文研究了大语言模型如何在测试阶段通过迭代经验进行学习，我们将这一设置称为“经验链”（Chain-of-Experience, CoE），即模型通过迭代与自身或环境反馈的交互积累经验痕迹，从而在零次推理之外形成持续改进的闭环。我们采用包括模型自反馈在内的多样化反馈机制（如正确性或公开编程测试通过率等环境信号），在数学、编程和知识三个领域对 8 个大语言模型进行了评估，其中包含 GPT-5、Gemini-2.5 Pro 和 Claude-4.5 Sonnet。研究显示，利用迭代经验 consistently 优于无反馈基线，仅靠自反馈即可获得显著收益，同时在各项任务和模型上实现了 5.6% 的整体提升和 19% 的 API 成本降低。此外，我们证明了结合互补反馈渠道（如模型反馈与正确性信号）能产生额外收益，且 CoE 在每 token 准确率上均优于现有的测试阶段策略。我们观察到大语言模型的基座能力与改进能力呈正相关，并表明模型在弱反馈或虚假反馈下仍能保持鲁棒性，不同反馈对提升的不同方面有所贡献，且大部分收益在迭代早期即可显现。", "interpret": "与人类通过经验持续学习不同，传统大语言模型（LLM）评估往往忽略了模型在推理过程中自我迭代提升的能力。本研究提出了“经验链（Chain-of-Experience, CoE）”范式，让模型在测试阶段通过与自身或环境（如代码通过率）的交互积累“经验痕迹”，形成持续改进的闭环，而非仅依赖零样本推理。研究团队选取数学、编程和通用知识三大领域，利用 8 款主流大模型（含 GPT-5、Gemini-2.5 Pro 等）进行了广泛测试。结果表明，引入 CoE 机制能显著提升模型表现，无论反馈来源是模型自查还是外部信号，其通过迭代经验实现的能力增长均超越了未引入反馈的基线，证明了大模型在动态交互中实现自我进化的巨大潜力。", "interpret_v": 3, "num": 91}, {"title": "A Hybrid Discrete-Event and Agent-Based Simulation Approach to Model Circular Supply Chains in Healthcare: A Case Study of Laparoscopic Scissors", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-18T05:28:24+08:00", "date": "2026-08-18", "weekday": "周二", "summary": "Circular healthcare supply chains are inherently complex, characterised by interdependencies among their actors and high uncertainty in product flows and performance. Current methods used to predic…", "link": "https://arxiv.org/abs/2608.17142", "points": {"类别": "实证研究", "背景": "针对传统静态方法难以应对医疗循环经济复杂性与不确定性的研究问题。", "贡献": "提出离散事件与智能体混合仿真模型，首次评估单点与系统级循环产品设计影响。", "合理性": "基于腹腔镜剪刀案例验证模型，结论强调前期投资对降本减排的关键必要性，逻辑自洽。", "清晰度": "结构层次分明，从问题提出到模型构建及结论讨论，表达专业且逻辑流畅。"}, "kind": "paper", "title_cn": "一种混合离散事件与基于智能体的仿真方法建模医疗行业的循环供应链：以腹腔镜剪刀为例的案例研究", "summary_cn": "医疗保健领域的闭环供应链具有固有复杂性，其特征是参与者之间存在相互依赖关系，且产品流与绩效表现具有高度不确定性。目前用于预测...", "abstract": "Circular healthcare supply chains are inherently complex, characterised by interdependencies among their actors and high uncertainty in product flows and performance. Current methods used to predict the outcomes of transitioning to circular economy (CE) are limited and mostly static. This paper demonstrates the use of simulation to assess the effect of introducing circular products and the implications across the healthcare supply chain accounting for variability. The laparoscopic scissors supply chain is chosen as a case study example. To the best of our knowledge, this is the first study that assesses the implications of introducing circular product (medical devices) designs at both the individual supply chain member and overall system level. The model can be also used to inform optimal inventory strategies for hospitals, to ensure that patient safety and hospital operations are maintained. Our findings suggest that adopting circular products can reduce the environmental impact, but to achieve significant reductions in both cost and emissions, it requires significant upfront investment. We discuss the theoretical and practical implications of our study in developing tools to support the transition to CE.", "abstract_cn": "医疗行业循环供应链具有本质上的复杂性，其特征在于其参与者之间的相互依赖性以及对产品流动和绩效的高不确定性。目前用于预测向循环经济（CE）转型结果的方法有限且主要是静态的。本文展示了利用仿真来评估引入循环产品的影响及其对医疗供应链的整体意义，同时考虑变异性。本文选取了腹腔镜剪刀供应链作为案例研究。据我们所知，这是第一项在单个供应链成员和整体系统层面评估引入循环产品（医疗设备）设计影响的研究所建立的模型，同样可用于为医院制定最优库存策略，以确保患者安全和医院运营。我们的研究结果表明，采用循环产品可以减少环境影响，但若要显著降低成本和排放，则需要巨大的前期投资。我们讨论了本研究在开发支持向循环经济转型工具方面的理论与实践意义。", "interpret": "医疗领域的循环经济（即资源循环利用模式）因参与者众多且流程高度不确定，给管理带来了巨大挑战，传统静态预测方法已难以应对。本文针对腹腔镜手术剪刀供应链这一具体案例，创新性地提出并应用了“离散事件模拟与基于智能体模拟相结合”的混合建模方法。这是首次从微观（单个供应链成员）和宏观（整体系统）两个层面，评估引入可循环设计的医疗设备对运营的实际影响。研究突破了现有模型仅关注单一环节的局限，揭示了循环经济转型中潜在的库存风险与操作波动。该研究不仅深化了对医疗设备全生命周期管理的理解，更为医院制定最优库存策略、平衡患者安全与运营效率提供了关键的数据支撑与决策依据，推动医疗资源向更可持续方向转型。", "interpret_v": 3, "num": 92}, {"title": "Security of Foundation-Model-Powered Embodied Agents: Attack Surfaces, Attacks, Defenses, and Evaluation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-18T01:28:49+08:00", "date": "2026-08-18", "weekday": "周二", "summary": "Foundation models are increasingly used for perception, reasoning, planning, and action generation in embodied agents, creating security risks that can propagate from digital inputs to physical beh…", "link": "https://arxiv.org/abs/2608.16843", "points": {"类别": "综述", "背景": "现有分类未触及具身智能中信任边界首受侵犯的关键安全入口。", "贡献": "提出基于信任边界的五层十二面攻击面划分及跨层传播分析框架。", "合理性": "方法逻辑自洽，基于海量攻击防御记录数据支撑结论可信度高。", "清晰度": "结构层级分明，对攻击面与防御策略的归纳概括清晰直观。 局限性：研究聚焦主流领域，对中间件、多智能体等长尾场景覆盖不足。"}, "kind": "paper", "title_cn": "基于基础模型的身体代理安全：攻击面、攻击、防御与评估", "summary_cn": "基础模型正被越来越多地用于具身智能体的感知、推理、规划及动作生成，这带来了从数字输入传播至物理行为的安全风险。", "abstract": "Foundation models are increasingly used for perception, reasoning, planning, and action generation in embodied agents, creating security risks that can propagate from digital inputs to physical behavior. Existing surveys often organize threats by mechanisms such as jailbreaks, prompt injection, backdoors, poisoning, or adversarial examples, but these categories do not consistently identify where an adversary first enters the embodied control loop. We present a trust-boundary-centric survey of foundation-model-powered embodied-agent security. Using a first-compromised-trust-boundary principle, we separate attack surface from attack mechanism and organize the system into five layers and twelve attack surfaces spanning the model supply chain, user instructions, context and memory, physical semantic environments, multimodal perception, world state, internal reasoning, task planning, action interfaces, middleware, multi-agent communication, and execution control. Based on 58 attack records and 61 defense records collected through August 15, 2026, we analyze representative attacks, cross-layer propagation, defense placement, and evaluation practices. Our quantitative analysis shows that attack research is concentrated on multimodal perception and action interfaces, while defenses are especially concentrated on action-level and runtime protection. Context and long-term memory, middleware and networking, world-state integrity, and multi-agent trust remain comparatively underexplored. We conclude with open challenges in state provenance, compositional defenses, long-horizon attack propagation, physical realizability, Byzantine multi-robot behavior, and unified closed-loop evaluation.", "abstract_cn": "基础模型在具身智能体的感知、推理、规划和动作生成中被日益广泛地采用，由此产生了从数字输入传播至物理行为的安全风险。现有的综述往往根据 jailbreak、提示注入、后门、投毒或对抗样本等机制来组织威胁，但这些类别并不能一致地识别攻击者首次进入具身控制环路的切入点。我们提出了一种基于信任边界的具身智能体安全综述。利用“首个被攻破的信任边界”原则，我们将攻击面与攻击机制区分开来，并将系统划分为五个层次和十二个攻击面，涵盖模型供应链、用户指令、上下文与记忆、物理语义环境、多模态感知、世界状态、内部推理、任务规划、动作接口、中间件、多智能体通信和执行控制。基于截至 2026 年 8 月 15 日收集的 58 条攻击记录和 61 条防御记录，我们分析了代表性攻击、跨层传播、防御部署及评估实践。我们的定量分析显示，攻击研究集中在多模态感知和动作接口，而防御则尤其集中在动作级和运行时保护。上下文与长期记忆、中间件与网络、世界状态完整性以及多智能体信任则相对未被充分探索。最后，我们提出了状态溯源、组合防御、长程攻击传播、物理可实现性、拜占庭多机器人行为以及统一闭环评估等方面的开放挑战。", "interpret": "随着基础大模型在机器人感知、推理及行动生成中的深度应用，物理设备面临数字指令直接转化为实体行为的独特安全风险。现有研究多按攻击机制分类，却往往忽视 adversary 切入控制循环的初始路径。本文提出“信任边界中心”的新视角，首次明确攻击入口点，将系统重构为涵盖供应链、用户指令、物理语义环境、多模态感知、世界状态、内部推理、任务规划及行动执行的五层架构与十二类攻击面。这一分类法不仅填补了具身智能安全领域的理论空白，更为制定针对性防御策略和建立标准化评估体系提供了清晰的路线图，对于保障自动驾驶、智能医疗等关键领域的物理实体安全具有深远意义。", "interpret_v": 3, "num": 93}, {"title": "Breaking Planner Integrity Boundary: Enviroment State-Text Injection Attack on LLM-Driven Embodied Agents", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-18T01:02:07+08:00", "date": "2026-08-18", "weekday": "周二", "summary": "Large language model (LLM)-driven embodied agents rely on environment states to interpret scenes, generate high-level plans, and drive physical execution, making planner-visible state representatio…", "link": "https://arxiv.org/abs/2608.16806", "points": {"类别": "实证研究，提出首个无需篡改指令参数的状态文本注入攻击方法。", "背景": "现有攻击多关注指令或提示，忽视环境状态文本在具身任务中的隐蔽作用。", "贡献": "提出 ESTI 攻击框架，将虚假状态证据融入环境以影响规划执行，并构建评估基准。", "合理性": "假设具身任务受实体 grounding 约束，通过一致性验证机制攻击具有显著理论支撑。", "清晰度": "摘要结构清晰，逻辑从问题缺口推导至方法提出与实验验证，重点突出且专业。"}, "kind": "paper", "title_cn": "打破规划器完整性边界：面向 LLM 驱动具身智能体环境状态文本注入攻击", "summary_cn": "语言大模型（LLM）驱动的具身代理依赖环境状态来解释场景、生成高级规划并驱动物理执行，这使规划器可见的状态表示成为可被利用的薄弱环节。", "abstract": "Large language model (LLM)-driven embodied agents rely on environment states to interpret scenes, generate high-level plans, and drive physical execution, making planner-visible state representations a critical security boundary. Existing attacks primarily manipulate user instructions, prompt contexts, model behavior, or perceptual inputs, while paying limited attention to whether environment-state text itself can serve as deceptive task evidence and propagate beyond planning to affect execution outcomes. Because embodied tasks are constrained by entity grounding, action preconditions, spatial relations, and environmental constraints, planning deviation alone does not guarantee adversarial execution. To address this gap, we investigate environment-state text as an independent attack surface and present the first closed-loop Environment State-Text Injection (ESTI) attack for LLM-driven embodied agents. Without modifying the original user instruction, model parameters, or executor, ESTI reformulates an adversarial objective as false state evidence compatible with the current environment and influences planning and execution through object properties, spatial relations, affordances, task-stage rules, and execution feedback. We further develop ESTI-Bench to evaluate attack propagation across the planning-to-execution closed loop and compare ESTI with Vanilla IPI, EIRAD, and BADROBOT across ProgPrompt/VirtualHome, VoxPoser/RLBench, and AI2-THOR/iTHOR. ESTI consistently outperforms existing baselines, improving planning-level and execution-level attack success rates by up to 89.32\\% and 43.69\\%, respectively. Further analysis shows that grounding, consistency, and executability jointly determine whether manipulated state evidence can propagate through the embodied closed loop and produce verifiable environmental changes.", "abstract_cn": "大型语言模型（LLM）驱动的具身智能体依赖环境状态来解释场景、生成高层计划并驱动物理执行，使计划可见的状态表示成为关键安全边界。现有攻击主要操纵用户指令、提示上下文、模型行为或感知输入，却鲜少关注环境状态文本本身是否可作为欺骗性任务证据，并能从规划传播至影响执行结果。由于具身任务受限于实体 grounding、动作前置条件、空间关系和环境约束，单纯的规划偏离并不能保证敌对执行。为此，我们将环境状态文本研究为一个独立攻击面，并首次提出了针对 LLM 驱动具身智能体的闭环环境状态文本注入（ESTI）攻击。在不修改原始用户指令、模型参数或执行器的情况下，ESTI 将敌对目标重构成与环境兼容的虚假状态证据，并通过物体属性、空间关系、功能特性、任务阶段规则和执行反馈来影响规划与执行。我们进一步开发了 ESTI-Bench 以评估攻击从规划到执行的闭环传播能力，并将 ESTI 与 Vanilla IPI、EIRAD 和 BADROBOT 在 ProgPrompt/VirtualHome、VoxPoser/RLBench 及 AI2-THOR/iTHOR 等基准上进行了对比。ESTI 在所有现有基线中表现一致优于，规划级和执行级的攻击成功率分别提升了最高 89.32% 和 43.69%。进一步分析表明，grounding、一致性和可执行性共同决定了被操纵的状态证据是否能通过具身闭环传播并产生可验证的环境变化。", "interpret": "大语言模型驱动的机器人智能体依赖环境状态来理解场景并执行物理任务，这使得“可观测的环境状态文本”成为关键的安全防线。现有研究多关注指令或感知输入的篡改，却忽视将环境状态本身作为欺骗性证据注入系统的风险。由于机器人行动受实体定位、空间关系等物理约束严格限制，单纯改变计划未必能导致执行失效。为填补这一空白，本研究首次揭示了“环境状态文本注入”（ESTI）攻击方法，即通过污染环境文本描述误导模型决策，使其在看似合理的计划下产生不可预知的物理操作。该突破不仅首次实现了从计划层到执行层的闭环攻击验证，更揭示了大模型具身智能在状态感知环节的深层脆弱性，为构建安全的具身系统提供了重要的警示与防御方向。", "interpret_v": 3, "num": 94}, {"title": "Neurosymbolic Embodied Agents", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-18T00:50:59+08:00", "date": "2026-08-18", "weekday": "周二", "summary": "Language and vision-language models generate plausible embodied plans but do not guarantee executability, as their outputs can violate environment dynamics or act on incorrectly grounded entities.…", "link": "https://arxiv.org/abs/2608.16794", "points": {"类别": "方法 提出结合视觉探索与符号规划的神经符号体智能体框架。", "背景": "针对语言视觉模型生成的行动计划缺乏可执行性痛点。", "贡献": "通过约束符号规划与蒙特卡洛树搜索确保计划构建即具可执行性。", "合理性": "方法逻辑严谨且实验结果显著，但依赖特定环境动态假设。", "清晰度": "摘要结构清晰，从问题描述到实验对比层层递进易懂。"}, "kind": "paper", "title_cn": "神经符号具身智能体", "summary_cn": "语言与视觉 - 语言模型虽能生成看似合理的具身计划，却无法保证可执行性，因为其输出可能违反环境动力学或针对错误定位的实体进行操作。", "abstract": "Language and vision-language models generate plausible embodied plans but do not guarantee executability, as their outputs can violate environment dynamics or act on incorrectly grounded entities. We present a neurosymbolic agent that factors long-horizon household tasks into task-directed visual exploration and constrained symbolic planning. In the first phase, a vision-language model and exploration harness acquire goal-relevant predicates and instance bindings from egocentric observations and grounded interactions, producing a symbolic initial state. In the second, a PDDL transition model restricts decoding to tokens that extend applicable actions. Monte Carlo tree search then evaluates executable continuations using a domain-independent planning heuristic. The resulting plans are executable by construction under the transition model, with transfer to the environment conditioned on correct visual grounding. On VirtualHome and ALFWorld, open 4B-27B models exceed 90% success in both environments, and our smallest agent substantially outperforms a 27B direct visual policy in each. Constraints and search prove complementary rather than interchangeable: in ALFWorld either alone solves under a third of tasks, whereas their combination solves over 95%. The method also uses several times fewer generated tokens than extended thinking and far fewer model-visible images than direct interaction, and residual failures localize to state acquisition rather than plan generation without any specialized training.", "abstract_cn": "语言与视觉 - 语言模型能生成合理的具身计划，但其输出可能违背环境动力学或作用于未正确识别的对象。我们提出了一种神经符号智能体，将长期家庭任务分解为以任务为导向的视觉探索和受限符号规划。在第一阶段，视觉 - 语言模型和探索系统从第一人称观察和情境化交互中获取与目标相关的谓词和实例绑定，生成符号初始状态；在第二阶段，PDDL 过渡模型限制解码仅扩展适用的动作。蒙特卡洛树搜索利用领域无关的规划启发式评估可执行延续。由此生成的计划在过渡模型下天然可执行，其转移到环境取决于正确的视觉识别。在 VirtualHome 和 ALFWorld 上，开放式 4B-27B 模型在两个环境中的成功率均超过 90%，而我们的最小规模智能体在每个环境中均显著优于 27B 的直接视觉策略。约束条件和搜索证明是互补而非可替代的：在 ALFWorld 中，单独使用其一仅能解决三分之一的任务，而结合使用可解决超过 95% 的任务。该方法生成的提示词数量比扩展思考法少数倍，交互可见图像数量比直接交互法少得多，且无需任何专门训练，剩余失败仅源于状态获取而非计划生成。", "interpret": "语言与视觉大模型虽能生成看似合理的行动方案，却常因违背环境规律或操作错误对象而缺乏实际可执行性。为突破此局限，研究人员提出了一种“神经符号” embodied agent，将家庭长周期任务拆解为两个核心阶段：首先，利用视觉 - 语言模型结合自我视角观测与交互，从画面中提取任务相关逻辑谓词与对象绑定，构建符号化初始状态；随后，通过 PDDL 逻辑模型严格限制动作解码范围，确保每一步操作符合物理约束，并借助蒙特卡洛树搜索评估可行路径。该框架的关键创新在于将执行性内建于生成过程之中，生成的计划天然满足环境动态约束。这不仅提升了机器人任务的可靠性与泛化能力，也为实现真正具备自主决策与执行能力的通用智能体提供了重要范式，推动智能系统从“会说”向“真做”跨越。", "interpret_v": 3, "num": 95}, {"title": "\"If It Looks Like a User\": Measuring Real-Time Moderation Effects via Social Media Simulation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-17T21:58:51+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "Agent-based social media simulators offer a controlled environment to study content moderation, yet their value hinges on how faithfully they reproduce real platform dynamics. We develop a calibrat…", "link": "https://arxiv.org/abs/2608.16601", "points": {"类别": "方法，通过数据驱动的仿真模型验证内容 Moderation 评估的可靠性。", "背景": "源自社交媒体治理需求，针对现有仿真模型难以真实复现平台动态的痛点。", "贡献": "构建经实证拟合的仿真框架，揭示实时删除策略因转发补偿效应而低估效果。", "合理性": "基于真实疫情数据训练模型，采用进化策略优化参数，实验设计严谨可信。", "清晰度": "摘要逻辑严密，从模型构建到策略对比层层递进，表述清晰专业。"}, "kind": "paper", "title_cn": "\"像用户一样\"：通过社交媒体模拟测量实时删帖效果", "summary_cn": "基于代理的社交媒体模拟器提供了一个可控的研究内容审核环境，但其价值取决于它们在多大程度上真实复现了平台动态。", "abstract": "Agent-based social media simulators offer a controlled environment to study content moderation, yet their value hinges on how faithfully they reproduce real platform dynamics. We develop a calibrated extension of SimSoM, an agent-based model of information diffusion on social networks, grounded in a real-world dataset of online vaccine discourse during the COVID-19 pandemic. Our approach replaces ad-hoc parametrisations with empirically fitted distributions, optimised via CMA-ES (Covariance Matrix Adaptation Evolution Strategy) and validated against real data across temporal, distributional, and structural dimensions. Using this validated simulator, we provide three key contributions. First, we show that the calibrated model reproduces key statistical signatures of the empirical data, including activity distributions, post/reshare ratios, and temporal patterns. Second, we apply established misinformation-spreader detection and prevention methods to both empirical and simulated data, progressively removing top-ranked users and showing that the resulting decline in low-quality content is consistent across the two. Third, comparing static (retroactive) and dynamic (in-simulation) moderation across 30 network realisations, we show that static evaluation significantly overestimates the effectiveness of user bans for the most effective detectors: when moderation is applied in real time, compensatory resharing by the remaining users dampens the expected reduction in low-quality content, so static estimates should be read as an upper bound. These findings highlight the necessity of simulation-based evaluation for content moderation policies and contribute a reusable, empirically grounded simulation framework.", "abstract_cn": "基于智能体的社交媒体模拟器为研究内容审核提供了受控环境，但它们的价值取决于对现实平台动态的再现程度。我们基于真实世界 COVID-19 期间在线疫苗接种话语数据集，开发了校准后的 SimSoM 模型，即一个社交网络信息扩散的基于智能体的模型。我们的方法用经验拟合的分布取代了任意参数的设定，并通过 CMA-ES（协方差矩阵自适应进化策略）优化，同时在时间、分布和结构维度上经真实数据验证。使用该经校准的模拟器，我们提出了三项主要贡献：首先，我们展示了校准后的模型能够重现经验数据的关键统计特征，包括活动分布、帖子/再分享比率以及时间模式；其次，我们将既定的虚假信息传播者检测与预防方法应用于真实与模拟数据，通过逐步移除排名靠前的用户，并显示出低质量内容的下降在两者中具有一致性；最后，通过比较 30 个网络实现中的静态（追溯性）审核与动态（模拟内）审核，我们证明了静态评估会严重高估用户封禁对最高效检测器的有效性：当审核实时进行时，剩余用户的补偿性再分享会抵消预期的低质量内容减少，因此静态估计应被视为上限。这些发现强调了基于模拟的评估在内容审核政策中的必要性，并贡献了一个可复用、经验基础的模拟框架。", "interpret": "在社交媒体治理研究中，构建能真实反映平台动态的模拟环境至关重要，这直接影响对内容审核效果评估的准确性。本文提出了一种针对 SimSoM 模型的经验主义校准方法，利用真实新冠疫苗接种网络传播数据，结合优化算法（CMA-ES）替换了原本随意的参数设定，实现了模型在时间、分布及结构维度上与真实数据的高度吻合。关键发现是，该经过校准的模拟器成功复现了真实的统计特征，如用户活跃度分布、转发率及时间模式。这一成果不仅验证了模拟工具的科学价值，更为未来研究提供了一套可靠的实验基准，使得研究人员能够在可控环境中客观评估不同审核策略的实时效果，弥补了实验室研究与现实复杂环境之间的鸿沟。", "interpret_v": 3, "num": 96}, {"title": "即插即用的2D运动接口：让真实世界运动语言模型无需微调即可工作", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "研究团队提出一种即插即用的2D运动接口，使3D预训练的运动语言模型（MoLMs）无需修改或微调即可接受2D运动输入。在公开数据集上，该方法在多个MoLMs上达到与3D运动输入相当的性能，并优于从头训练2D运动的模型。团队还构建了单目真实世界视频运动评估数据集并引入真实视频适配器，证明在单目姿态估计场景下2D运动比3D运动更具实用性。", "link": "https://arxiv.org/abs/2608.15984", "points": {"类别": "方法，提出无需微调即可处理 2D 输入的即插即用接口。", "背景": "解决单目视频获取 3D 运动数据困难限制模型现实应用的问题。", "贡献": "构建真实世界数据集并展示 2D 接口性能优于从头训练方案。", "合理性": "基于现有预训练模型适配的假设合理，但依赖单目视频精度。", "清晰度": "摘要逻辑清晰，结构紧凑且技术细节描述简明扼要。"}, "kind": "paper", "abstract": "Motion Language Models (MoLMs) typically understand human motions by tokenizing 3D motion and processing the resulting tokens using a language model. However, obtaining accurate 3D motions from monocular videos is challenging, limiting their real-world applicability. To address this issue, we introduce a plug-and-play 2D Motion Interface that enables 3D-pretrained MoLMs to accept 2D motion inputs without modifying or fine-tuning the original models. Experiments on public datasets show that our method achieves performance comparable to 3D motion inputs across multiple MoLMs and outperforms training MoLMs from scratch on 2D motions. We further construct a monocular real-world video motion evaluation dataset and introduce a real-video adapter, demonstrating the usefulness of 2D motions over 3D motions under the evaluated monocular pose-estimation setting. These results suggest that 2D motion provides a practical interface for deploying MoLMs in real-world motion understanding settings. Code is available at https://github.com/irajisamurai/2D-Motion-Interface.", "abstract_cn": "//github.com/irajisamurai/2D-Motion-Interface 获取。", "title_cn": "即插即用的2D运动接口：让真实世界运动语言模型无需微调即可工作", "interpret": "针对现有“运动语言模型”难以从单镜头视频中获取高精度 3D 动作数据，从而限制其实际应用的痛点，研究者提出了一种“即插即用”的 2D 运动接口。该创新方案无需修改或微调预训练的 3D 模型，即可直接处理 2D 动作输入。实验表明，该方法在多个基准数据集上的表现可与使用 3D 数据的同类模型媲美，甚至在从头训练 2D 数据方面更具优势。此外，团队构建了包含真实单镜头视频的评估数据集及适配器，证实了 2D 运动数据在单目姿态估计场景下优于 3D 数据。这一成果不仅降低了高质量动作数据的获取门槛，也为通用动作大模型在现实世界中的快速部署提供了低成本、高效率的新路径。", "interpret_v": 3, "num": 97}, {"title": "循环语言模型提升组合式工具调用能力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "一项新研究评估了原生与改造型循环语言模型在API-Bank、BFCL和NESTful基准上的组合式工具调用表现。在匹配监督微调条件下，循环计算普遍有利于组合与依赖感知的工具使用，多步工具调用准确率随循环深度增加而提升。自适应推理通过按需分配额外计算，实现了更优的计算-性能权衡，表明循环语言模型是智能体系统的有前景架构。", "link": "https://arxiv.org/abs/2608.18171", "points": {"类别": "实证研究，聚焦循环语言模型在组合式工具调用中的实际表现。", "背景": "现有循环模型虽在推理评测表现优异，但在需要多步骤协调的工具使用场景中潜力尚未被充分探索。", "贡献": "通过多数据集对比，发现循环计算能提升多步工具协作能力，且自适应推理策略在性能与计算间取得更好平衡。", "合理性": "实验设计严格匹配监督微调细节并控制变量，结论基于可控实验数据，可信度高但受限于特定 API 场景。", "清晰度": "摘要逻辑清晰，从问题提出、实验设置到核心结论层层递进，结构紧凑易读。"}, "kind": "paper", "abstract": "Looped language models have shown promising results on reasoning benchmarks, yet their potential for agentic tool use remains largely unexplored. We study this question in compositional tool-calling settings, where models must coordinate multiple API calls, maintain intermediate state, and preserve dependencies across tool interactions. We evaluate native and retrofitted looped language models on API-Bank, BFCL, and NESTful, comparing looped and non-looped models trained under matched supervised fine-tuning recipes and varying recurrent depth at inference time. In controlled experiments, recurrent computation generally benefits compositional and dependency-aware tool use, while providing smaller and more model-dependent gains on isolated API invocation. Accuracy on multi-step tool use generally increases with recurrent depth; adaptive inference, however, achieves a more favorable compute-performance trade-off by allocating additional computation only when needed. Our results suggest that looped language models are a promising architecture for agentic systems that require reliable planning, coordination, and execution of compositional tool use workflows.", "abstract_cn": "回环语言模型在推理基准测试中表现良好，但其代理工具使用的潜力仍未被充分探索。我们在组合式工具调用场景中研究这一问题，即模型需协调多个 API 调用、维护中间状态并保留跨工具交互的依赖关系。我们评估了原生和改造后的回环语言模型在 API-Bank、BFCL 和 NESTful 数据集上的表现，对比了采用匹配监督微调食谱训练的循环与非循环模型，并分析了推理时的不同循环深度。在受控实验中，循环计算通常能提升组合式和依赖感知的工具使用效果，而在孤立的 API 调用场景下带来的收益较小且更依赖于具体模型。多步骤工具使用的准确率通常随循环深度的增加而提高，然而自适应推理通过仅在必要时分配额外计算，实现了更为有利的计算与性能权衡。我们的结果表明，回环语言模型是适用于需要可靠规划、协调及执行组合式工具使用工作流的代理系统的一种有前景的架构。", "title_cn": "循环语言模型提升组合式工具调用能力", "interpret": "循环语言模型（Looped Language Models）近期在逻辑推理测试中表现优异，但其组合式工具调用能力仍待探索。本研究聚焦于模型需协调多个 API 调用、维护中间状态及保持跨交互依赖的场景，对比了原生与后期改造的循环模型在 API-Bank、BFCL 等数据集上的表现。实验严格控制训练条件，仅调整推理时的循环深度。结果显示，在处理多步骤、依赖关系复杂的工具调用时，引入循环计算机制能显著提升准确率，且提升幅度随循环深度增加而扩大；而在单一 API 调用场景中，收益则相对较小且波动较大。这一发现表明，赋予模型“自我修正与迭代”的能力，是增强其自动化代理系统协同操作的关键，有望推动 AI 在复杂实际任务中的自主执行能力。", "interpret_v": 3, "num": 98}, {"title": "HarnessEval-W：将智能体化评估引入世界模型基准测试", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "世界模型", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "HarnessEval-W 提出一种智能体化评估流水线，将 LLM 生态中的 harness 范式引入世界模型基准测试。该方法将评估问题分解为可测量的子问题，并派生子智能体进行推理，最终由父智能体验证证据并给出结论，形成可核查的推理链。研究在 330 个评估案例上对 18 个代表性世界模型进行了测试，判断与人类偏好高度一致，并提供细粒度诊断；完整流水线已开源。", "link": "https://arxiv.org/abs/2608.16859", "points": {"类别": "基准测试系统，提出一种将智能体评估引入世界模型的新方法。", "背景": "现有世界模型评估仅依赖分数且缺乏推理链验证机制。", "贡献": "构建多智能体协作管道以生成可解释、可验证的评估依据。", "合理性": "采用分层诊断与多智能体协作在方法论上逻辑自洽且可行。", "清晰度": "摘要结构严谨，清晰阐述了问题、方案及实验结果。"}, "kind": "paper", "abstract": "A benchmark should deliver more than a scalar score: what makes an evaluation trustworthy is the reasoning that justifies the score. This is especially critical for world models, where judging a rollout requires understanding whether physics, causality, and world state evolve correctly. Humans spot such violations naturally, yet no existing benchmark automates this capability: metrics are computed brute-force, leaving no reasoning chain that can be examined or verified. We introduce HarnessEval-W, an agentified evaluation pipeline that brings the harness paradigm from the LLM ecosystem to world model benchmarking. Rather than applying a fixed rubric, HarnessEval-W interprets the context of each evaluation case, decomposes the evaluation question into measurable subproblems, and spawns specialized sub-agents, each equipped with tailored context and diagnostic tools to reason over its own subproblem. The parent agent then validates the gathered evidence and summarizes it into the final verdict. This hierarchical workflow turns every evaluation into a transparent evidence tree whose complete reasoning chain justifies the result. We apply HarnessEval-W to 18 representative world models over 330 evaluation cases. Its judgments closely align with human preferences while providing verifiable, fine-grained diagnoses of every generated rollout. We open-source the full pipeline as a live benchmark and invite the broad community to contribute to grow new skills and evaluation cases as world models evolve.", "title_cn": "HarnessEval-W：将智能体化评估引入世界模型基准测试", "abstract_cn": "基准测试应交付多于单一标量分数：使评估值得信赖的是能够 justify 该分数的推理过程。这对于世界模型尤其关键，因为判断一次 rollout 需要理解物理、因果关系和世界状态是否正确演变。人类能自然察觉此类违规，然而现有基准测试尚未自动化这一能力：指标是蛮力计算的，缺乏可审查或验证的推理链条。我们提出 HarnessEval-W，将 LLM 生态中的 harness 范式引入世界模型基准测试。与其应用固定评分标准，HarnessEval-W 会解读每个评估案例的上下文，将评估问题分解为可度量的子问题，并生成配备定制上下文和诊断工具的专门子代理，对各自的子问题进行推理。父代理随后验证收集到的证据并将其汇总为最终裁决。这种分层工作流程将每次评估转变为透明证据树，其完整的推理链条 justify 结果。我们将 HarnessEval-W 应用于 18 个代表性世界模型的 330 个评估案例。其判断与人类偏好高度一致，同时提供可验证、细粒度的每一步 rollout 诊断。我们将完整流程开源为活体基准测试，并邀请广大社区贡献新技能与新评估案例，以配合世界模型的演进。", "interpret": "世界模型作为人工智能模拟物理环境与因果演化的核心前沿，其评估一直面临“黑盒”困境：现有基准测试常仅依赖标量分数进行 brute-force（暴力）评分，缺乏对人类自然推理能力的自动化捕捉，难以判断物理定律或因果链条是否被正确遵循。为突破这一局限，研究提出了 HarnessEval-W，创新性地将大语言模型领域成熟的“测试 harness\"范式引入世界模型评估体系。该系统摒弃了僵化的固定评分规则，转而让智能体解读评估语境，将复杂问题拆解为可度量的子任务，并启动配备专用诊断工具的子代理进行深度推理。这一框架不仅实现了评估过程的透明化与可追溯性，还显著提升了测试结果的信度，为验证人工智能对复杂动态环境的模拟能力提供了可靠的新标准，推动基准测试从简单打分向智能诊断的质变。", "interpret_v": 3, "num": 99}, {"title": "GenRouter：面向智能体图像生成的统一工作流路由框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "GenRouter 提出首个面向智能体图像生成的统一工作流路由框架，将多样化智能体管线标准化为通用原语与可执行模板，并通过需求分析、经验匹配和 Pareto 过滤将异构提示词自适应路由至最优工作流。实验显示，相比重型静态管线，GenRouter 在保持视觉对齐的同时将执行成本降低超 95%、延迟降低 65%，并借助累积经验实现零样本泛化，性能提升且计算开销减半。", "link": "https://arxiv.org/abs/2608.16721", "points": {"类别": "系统方法，提出首个面向智能体图像生成的统一工作流路由框架。", "背景": "现有图像生成流程计算资源浪费严重且缺乏灵活适配能力。", "贡献": "定义通用基元标准 GenCanvas，通过三大策略实现智能体任务的高效动态路由与成本优化。", "合理性": "基于三大路由策略设计逻辑自洽，实验数据显著证实了其在速度与精度上的双重提升。", "清晰度": "摘要结构完整，核心创新点与实验结果阐述明确，逻辑层次清晰易读。"}, "kind": "paper", "abstract": "The rapid evolution of text-to-image (T2I) generation models has effectively solved the foundational challenge of raw pixel synthesis, shifting the community's focus toward fulfilling increasingly intricate user requests. While recent agentic image generation workflows enhance static inference with advanced capabilities like external knowledge retrieval and iterative reasoning, they mostly operate in isolated silos with fixed ``one-size-fits-all\" topologies. This inevitably leads to severe compute-mismatch, where simple queries are forced through computationally heavy pipelines. To bridge this gap, we present GenRouter, the first unified workflow routing framework for agentic image generation. We first formulate GenCanvas, standardizing diverse agentic pipelines into a universal set of foundational primitives and executable templates. Operating over this unified space, GenRouter adaptively routes heterogeneous prompts to their optimal workflows via (i) demand profiling, (ii) experience matching, and (iii) Pareto filtering. Extensive experiments across diverse benchmarks demonstrate that GenRouter achieves superior visual alignment while reducing execution costs by over 95% and latency by 65% compared to heavyweight static pipelines. Furthermore, the system continuously self-evolves via accumulated experience, enabling robust zero-shot generalization that boosts performance and halves computational overhead.", "abstract_cn": "文生图模型的快速演进有效解决了原始像素合成的基础挑战，使社区关注点转向满足日益复杂的用户需求。虽然近期智能体图像生成工作流通过外部知识检索和迭代推理等高级功能增强了静态推理能力，但它们大多以固定且通用的拓扑结构在孤立环境中运行，这不可避免地导致计算资源错配，迫使简单查询通过计算量巨大的流程处理。为填补这一差距，我们提出了 GenRouter，首个适用于智能体图像生成的统一工作流路由框架。我们首先构建 GenCanvas，将多种智能体工作流标准化为一组基础原语和执行模板的统一集。在该统一空间上运行，GenRouter 通过需求画像、经验匹配和帕累托筛选，自适应地将异构提示路由到最优工作流。广泛的多基准实验表明，与重型静态工作流相比，GenRouter 实现了更优的视觉对齐度，同时减少了超过 95% 的执行成本和 65% 的延迟。此外，该系统通过积累的经验持续自我进化，实现了鲁棒的零样本泛化能力，在提升性能的同时将计算开销减半。", "title_cn": "GenRouter：面向智能体图像生成的统一工作流路由框架", "interpret": "随着文本生成图像模型发展，社区焦点已从基础合成转向满足复杂需求。尽管现有智能体工作流引入了外部知识检索等进阶能力，但多采用固定拓扑结构，导致简单查询被迫经过重型计算流程，造成资源浪费。为此，研究提出了 GenRouter，首个面向智能体图像生成的统一工作流路由框架。其核心在于构建 GenCanvas，将多样化的智能体管线标准化为基础原语和执行模板。GenRouter 可在该统一空间内自适应地根据用户需求选择最优计算路径。这一方案有效解决了算力与需求错配问题，提升了生成效率与灵活性，为构建更智能、高效的图像生成系统提供了关键基础设施，推动技术从静态推理向动态、个性化服务演进。", "interpret_v": 3, "num": 100}, {"title": "R^3-Bench：LLM 在共享预算下的资源理性推理仍显吃力", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "新基准 R^3-Bench 在数学、竞赛编程和抽象推理中，以共享预算评估六题套件，覆盖无工具与智能体两种场景。对六款模型的 72 个主表单元，离线经验 oracle 均值在所有单元达到或超过竞赛均值，其中 71 个单元严格更高；中等无工具压力下，四款模型的均等分配回放也超过竞赛表现。轨迹诊断显示策略更新有限且失败模式随压力变化，揭示模型在共享预算下实现能力与表现之间存在持续差距。", "link": "https://arxiv.org/abs/2608.16033", "points": {"类别": "实证研究，聚焦共享预算下大模型资源分配能力的量化评估。", "背景": "认知科学关注有限计算下的最优决策，现有基准未对齐单题表现评估。", "贡献": "提出 R^3-Bench 引入离线经验预言机，证明其平均表现优于单题匹配竞赛结果。", "合理性": "数据与实验结果高度自洽，但缺乏跨域通用地策略或长期适应性分析。", "清晰度": "逻辑推导严密，数据呈现直观，结构清晰且专业度强。"}, "kind": "paper", "abstract": "In cognitive science, resource rationality asks how an agent should allocate limited computation to maximize expected value. Most reasoning and agent benchmarks use independent per-task budgets; existing shared-budget studies do not calibrate suite performance against the same model's demonstrated single-problem competence. We introduce $R^3$-Bench, which evaluates six-problem suites under shared budgets across mathematics, competitive programming, and abstract reasoning in tool-free and agentic settings. Matched single-problem response curves define an offline empirical oracle over observed successes. Across 72 main-table cells for six models, the oracle mean matches or exceeds the contest mean in all cells and is strictly higher in 71. Under moderate tool-free pressure, equal-allocation replay also exceeds contest performance for four of six models. Trajectory diagnostics reveal limited strategy updating and pressure-dependent failure patterns. In a three-model diagnostic under strong agentic pressure, at least one fixed scheduler exceeds the contest mean in six of nine cells, but no policy dominates across domains. These results expose a persistent gap between demonstrated competence and shared-budget realization.", "abstract_cn": "认知科学中的资源合理性研究代理应如何分配有限计算以最大化预期价值。大多数推理和代理基准测试使用独立的任务预算，而现有的共享预算研究并未将套件表现与同模型单问题能力的已验证水平进行校准。我们提出了 R³-Bench，该基准在工具自由和智能体设置下，评估跨数学、编程和抽象推理三个领域的六题共享预算套件。匹配的单问题响应曲线为观测到的成功建立了一个离线经验真理值函数。在六个模型共 72 个主表单元格中，该真理值函数的平均值在所有单元格中均达到或超过竞赛平均值，且在 71 个单元格中严格更高。在适度的工具自由压力下，等比例回放策略也能使其中四个模型的超越竞赛表现。轨迹诊断显示策略更新有限，且存在与压力相关的失败模式。在三模型诊断场景的强智能体压力下，至少一种固定调度器在九个单元格中的六个里超越了竞赛平均值，但没有策略能跨领域占优。这些结果揭示了已展示能力与共享预算实现之间的持久差距。", "title_cn": "R^3-Bench：LLM 在共享预算下的资源理性推理仍显吃力", "interpret": "认知科学中的“资源理性”探讨智能体如何在有限算力下最大化收益。现有评测多采用任务独立预算，缺乏跨任务的统筹校准。为此，研究者推出了$R^3$-Bench，在数学、编程及抽象推理三个领域，通过共享预算模式测试六大模型。研究构建了基于单任务表现的“离线经验真理值”作为基准，发现该基准得分在绝大多数情况下均高于竞赛表现，证明模型难以适应资源受限的规划场景。即使在工具辅助的代理模式下，均衡分配资源也未显著提升性能。这一结果揭示了当前大模型在复杂推理中存在的系统性瓶颈，提示需从训练数据或模型架构入手，优化其在动态资源约束下的决策能力。", "interpret_v": 3, "num": 101}, {"title": "ClawGym II：探索智能体框架上的黑盒强化学习", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "该研究提出一个统一的黑盒强化学习框架，通过沙盒执行基础设施和前缀树轨迹重建，将PPO与GRPO适配至复杂智能体框架，并引入混合框架训练。基于Qwen3-30A3B，该方法在ClawGym-Bench上通过OpenClaw和Claude Code分别将Pass@1提升9.98和14.81个百分点，且在200-400优化步内保持稳定，并在JobBench和OfficeQA等任务上持续获益。", "link": "https://arxiv.org/abs/2608.16798", "points": {"类别": "系统，提出统一黑盒强化学习框架优化复杂智能体协同任务", "背景": "解决通过复杂智能体框架进行强化学习难以扩展和稳定的核心挑战", "贡献": "构建沙箱执行基建解耦优化，结合前缀树重构及混合框架实现高效训练", "合理性": "方法逻辑闭环清晰，实验数据显著且稳定性良好，无明显技术缺陷", "清晰度": "摘要结构严谨层次分明，术语使用专业准确，阅读流畅易理解"}, "kind": "paper", "abstract": "Agent harnesses have substantially improved performance on long-horizon tasks by coordinating agent interactions with the environment. However, reinforcement learning through complex harnesses remains largely unexplored, as scaling such training to long-horizon agent tasks introduces fundamental challenges. In this work, we present a unified black-box RL framework for stable and scalable optimization of general agents through complex harnesses. Concretely, we first build a sandbox-based execution infrastructure that isolates task environments and harnesses within temporary sandboxes for large-scale concurrent rollouts. We then decouple policy optimization from opaque harness execution and place a serving proxy at the model boundary to capture model calls. To reconstruct multi-turn trajectories and improve training efficiency, we organize the captured calls into prefix trees and further adapt both critic-based PPO and critic-free GRPO to optimize over the recovered tree structure. Meanwhile, we maintain training-inference consistency throughout the optimization process. Finally, we introduce mix-harness training, allowing a single model to be jointly optimized by heterogeneous harnesses. With Qwen3-30A3B, black-box RL improves Pass@1 on ClawGym-Bench by 9.98 and 14.81 points through OpenClaw and Claude Code, respectively, while remaining stable over 200-400 optimization steps. Moreover, the framework yields consistent gains on more challenging tasks such as JobBench and OfficeQA. Overall, our framework enables effective, stable, and scalable optimization of general agents through black-box harnesses, supporting unified training across heterogeneous execution systems.", "abstract_cn": "代理工具在协调代理与环境交互方面已显著提升了长程任务的性能，但通过复杂工具进行强化学习的扩展研究仍 largely 未探，因为其训练面临基础挑战。本文提出一种统一的“黑箱”强化学习框架，旨在通过对复杂工具进行稳健且可扩展的优化来提升通用代理的性能。具体而言，我们首先构建了基于沙箱的执行基础设施，将任务环境代理工具隔离在临时沙箱中以支持大规模并发推演；随后将策略优化与不透明的工具执行解耦，并在模型边界部署服务代理以捕获模型调用；为重构多轮轨迹并提高训练效率，我们将捕获的调用组织成前缀树，并据此适配基于评判函数的 PPO 和无需评判函数的 GRPO 进行基于恢复树结构的优化；在整个优化过程中始终保持训练 - 推理的一致性。最后，我们引入了混合工具训练，允许单一模型由异构工具进行联合优化。在使用 Qwen3-30A3B 时，通过 OpenClaw 和 Claude Code 两种工具，黑箱强化学习使 ClawGym-Bench 上的 Pass@1 提升分别达到 9.98 和 14.81 分，且在 200-400 步优化中保持稳定。此外，该框架在 JobBench 和 OfficeQA 等更具挑战性的任务上也取得了稳定的增益。总体而言，本框架实现了通过黑箱工具对通用代理的有效、稳健和可扩展优化，支持在异构执行系统上的统一训练。", "title_cn": "ClawGym II：探索智能体框架上的黑盒强化学习", "interpret": "《ClawGym II》针对智能体在长序列任务中因交互复杂导致的强化学习难优化问题，提出了一套统一的“黑盒”强化学习框架。以往研究多依赖智能体与环境的直接互动，却难以应对涉及复杂工具使用的复杂训练场景。本研究首先构建了基于沙箱的执行基础设施，将任务环境与智能体工具隔离，支持大规模并行训练；其次，将策略优化与工具执行解耦，并在模型边界部署代理服务以捕获所有调用。关键发现是利用树状结构重组多轮交互数据，显著提升了轨迹重构效率与训练稳定性。这一突破为智能体学习使用复杂工具提供了可扩展的通用方案，推动人工智能从单一任务执行向多步规划与工具协同的跨越。", "interpret_v": 3, "num": 102}, {"title": "Ventor-QTest：面向第三方托管大模型 API 的威胁模型驱动审计", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "Ventor-QTest 提出一种无需目标 API 概率信息的复合黑盒审计方法，通过重复请求与长序列组件分别报告平均保真度损失（AFL）和极端保真度损失（EFL）。在七组路由快照中，EFL 随任务暴露增加与 Terminal-Bench 通过率下降同步出现，提示审计长程智能体任务时应联合报告 AFL 与 EFL。实现已开源。", "link": "https://arxiv.org/abs/2608.16391", "points": {"类别": "系统 本文提出 Ventor-QTest 系统，旨在解决第三方托管大模型 API 审计缺失问题。", "背景": "伴随大语言模型广泛应用，第三方托管模型日益普遍，其推理 API 质量审计已成为开放问题。", "贡献": "作者提出黑盒审计框架，通过重复请求重构输出分布并报告无偏的平均/极端保真度损失指标。", "合理性": "实验显示两项指标能捕捉不同任务类型特征，且独立于具体概率信息，方法具备可信度。", "清晰度": "摘要逻辑严密，从问题定义到指标设计再到实验验证，结构清晰流畅且易于理解。"}, "kind": "paper", "abstract": "As large language models become increasingly widespread, third-party providers that deploy open-weight models have become an important part of the ecosystem. Auditing the quality of their inference APIs is therefore an open problem. We formalize hosted model routing as a stochastic process and propose \\mbox{\\textbf{Ventor-QTest}}, a composite black-box audit that requires no probability information from the target API. Its repeated-request component sends each frozen constrained context to the target multiple times, reconstructs a categorical output distribution from the returned text counts, and reports \\emph{average fidelity loss} (AFL) as a null-bias-corrected, within-window mean coarsened-KL statistic. Its long-sequence component uses independent runs to report \\emph{extreme fidelity loss} (EFL) through the empirical upper tail of a run-level reference-centered-surprisal statistic. Across three logprob-capable route conditions, AFL shows strong linear descriptive agreement with a logprob-derived coarsened-KL comparator. Across seven route snapshots, 20-run sequence probes reveal route-specific EFL variation. AFL and EFL have little detectable route-level association with GPQA-Diamond accuracy. In contrast, pronounced EFL coincides with a decline in Terminal-Bench pass rate as task exposure increases. This pattern may arise because correctness in long-horizon tasks is more sensitive to extreme fidelity loss. These results motivate reporting AFL and EFL jointly, particularly when auditing long-horizon agentic tasks. The open-source implementation is available at https://github.com/Tencent/AI-Infra-Guard/tree/main/services/api_checker/ventor_qtest.", "title_cn": "Ventor-QTest：面向第三方托管大模型 API 的威胁模型驱动审计", "abstract_cn": "随着大型语言模型日益普及，部署开源权重模型的服务商已成为生态系统的重要组成部分，因此对其推理 API 质量进行审计已成为一个开放问题。我们将托管模型路由形式化为随机过程，并提出了一种名为 Ventor-QTest 的复合黑盒审计方法，该方法无需从目标 API 获取任何概率信息。其重复请求组件将每个冻结的受限上下文多次发送给目标，根据返回的文本计数重构分类输出分布，并以平均保真度损失（AFL）作为去零偏、窗口内均值粗糙化的 KL 散度统计量进行报告；其长序列组件利用独立运行通过参考中心惊讶统计量的经验上尾报告极端保真度损失（EFL）。在三种具备 logprob 能力的路由条件下，AFL 与基于 logprob 的粗糙化 KL 散度比较器表现出强烈的线性描述相关性。在七个路由快照中，20 次运行序列探测揭示了路由特定的 EFL 变化。AFL 和 EFL 与 GPQA-Diamond 准确率的路线级别关联微乎其微。相比之下，显著的 EFL 与终端基准通过率下降相伴出现，这种现象可能是因为长horizon 任务的正确性对极端保真度损失更为敏感。这些结果促使我们共同报告 AFL 和 EFL，特别是在审计长horizon 代理任务时。开源实现已发布在 GitHub 上。", "interpret": "随着大模型生态扩张，第三方托管服务日益普及，但其推理接口的质量与安全评估长期缺乏标准方法。现有审计手段往往依赖模型内部概率信息，难以在通用场景下应用。为此，研究人员提出了无需访问目标模型内部参数的黑盒审计框架 Ventor-QTest。该工具将托管模型路由建模为随机过程，通过复合测试机制实现全面评估：其重复请求组件通过多次调用构建输出分布，计算经无偏修正的平均保真度损失（AFL），以量化模型在常规语境下的稳定性；其长序列组件则利用独立运行统计参考中心的意外统计量，报告极端保真度损失（EFL），以此揭示长文本场景下的潜在风险。该方法为评估第三方大模型服务的可靠性提供了新范式，有助于构建更可信的 AI 基础设施。", "interpret_v": 3, "num": 103}, {"title": "RUPA：面向 LLM 智能体的关系不确定性传播框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "RUPA 提出一种轨迹级不确定性量化框架，将执行历史建模为有向图，沿时间与语义依赖边传播不确定性，以捕捉跨步骤累积的执行风险。在 τ-2、Terminal-Bench-2 和 GAIA 基准上，使用 6 个开源 LLM 评估，RUPA 在不确定性估计准确度、早期失败检测及不确定性引导执行方面均优于现有方法。", "link": "https://arxiv.org/abs/2608.16002", "points": {"类别": "方法 提出 RUPA 框架以解决长程依赖关系导致的错误累积问题。", "背景": "现有不确定性量化方法仅关注局部信号，忽略执行轨迹中的长期依赖。", "贡献": "将执行历史建模为依赖图并传播不确定性，结合行为特征提供轨迹级置信度估计。", "合理性": "基于轨迹级图结构传播风险，假设合理且实验在主流基准上验证了有效性。", "清晰度": "摘要逻辑严密，从问题定义到方法创新及实验结果的表述清晰流畅。"}, "kind": "paper", "abstract": "Reliable uncertainty quantification (UQ) is essential for deploying large language model (LLM) agents in complex interactive environments. Existing UQ methods largely rely on local signals, such as token probabilities, predictive entropy, or per-step confidence, and therefore overlook the long-range dependencies through which errors accumulate across an execution trajectory. As a result, they may fail to identify agent failures whose causes originate several reasoning or interaction steps before the final answer. We propose RUPA (Relational Uncertainty Propagation for Agents), a trajectory-level UQ framework for LLM agents. RUPA represents an execution history as a directed trajectory graph in which reasoning states, tool interactions, and environment feedback are nodes connected by temporal and semantic dependency edges. It then propagates uncertainty over this graph to capture how execution risk accumulates and transfers across interaction steps. The propagated signal is combined with trajectory-level behavioral features and goal-alignment information to produce a confidence estimate for the full agent trajectory. We evaluate RUPA on representative agent benchmarks, including $τ$-2, Terminal-Bench-2, and GAIA, using 6 open-source LLMs spanning multiple model families. Experimental results show that RUPA consistently outperforms existing UQ methods by providing more accurate uncertainty estimates, enabling earlier failure detection, and improving uncertainty-guided agent execution across diverse agent tasks. These results demonstrate that explicitly modeling relational dependency is crucial to reliable UQ for long-horizon LLM agents, providing a practical foundation for trustworthy agent execution.", "abstract_cn": "可靠的量化不确定性对于在复杂的交互式环境中部署大型语言模型代理至关重要。现有的量化不确定性方法主要依赖局部信号，例如 token 概率、预测熵或每步置信度，因而忽略了错误在执行轨迹中通过长期依赖关系累积的过程。结果，它们可能无法识别那些源于最终答案之前若干推理或交互步骤之前的代理失败原因。我们提出了 RUPA（用于代理的定量不确定性传播），这是一种针对 LLM 代理的轨迹级量化不确定性框架。RUPA 将执行历史表示为有向轨迹图，其中的推理状态、工具交互和环境反馈是节点，通过时间和语义依赖边相连。它随后在该图上传播不确定性，以捕捉执行风险如何在交互步骤之间累积和传递。传播的信号与轨迹级行为特征和目标对齐信息相结合，以生成完整代理轨迹的置信度估计。我们在具有代表性的代理基准测试上对 RUPA 进行了评估，包括 $τ$-2、Terminal-Bench-2 和 GAIA，使用了涵盖多个模型家族的 6 款开源 LLM。实验结果表明，RUPA 通过提供更准确的量化不确定性估计，实现更早的失败检测，并改善不确定性引导的代理执行，在各类代理任务中均优于现有的量化不确定性方法。这些结果表明，显式地建模关系依赖对于长视距 LLM 代理的可靠量化不确定性至关重要，为可信任的代理执行提供了实践基础。", "title_cn": "RUPA：面向 LLM 智能体的关系不确定性传播框架", "interpret": "在大语言模型（LLM）智能体复杂交互部署中，现有不确定性量化方法多依赖局部信号（如 Token 概率），常忽视错误随执行轨迹传播的长程依赖，导致无法预判数步前引发的最终失败。为此，研究提出 RUPA 框架，将智能体执行历史建模为包含推理状态、工具交互及环境反馈的有向轨迹图，通过节点与边的时空语义依赖关系传播不确定性。该方法显著提升了因果追溯能力，能够准确识别源于早期步骤的深层错误。这为增强 LLM 智能体在动态环境中的可靠性与可解释性提供了新路径，推动其从简单任务向高难度自主规划应用迈进。", "interpret_v": 3, "num": 104}, {"title": "Zetta ζ：面向自进化物理智能的高效闭环具身框架", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "具身智能", "ts": "2026-08-17T08:00:00+08:00", "date": "2026-08-17", "weekday": "周一", "summary": "Zetta 提出一种闭环具身框架，在保持基础策略冻结的同时，在线进化基于代码的运行时批评者与恢复技能。通过三个时间尺度分离的循环，Zetta 在 LIBERO-Pro 和 RoboCasa 上分别达到 90.8% 和 93.6% 的成功率，并实现 11.1 倍推理加速；学习技能可零样本迁移，并涌现出机器人的\"顿悟时刻\"。", "link": "https://arxiv.org/abs/2608.16590", "points": {"类别": "实证研究，提出新型闭环具身智能自进化框架", "背景": "现有代理系统缺乏执行中的实时闭环学习能力，无法应对动态物理环境", "贡献": "构建 Zetta 框架实现运行时与技能在线进化，支持高频决策与零样本迁移", "合理性": "多时序分离机制与解耦基础设施可信度高，但依赖当前硬件算力支持", "清晰度": "逻辑链条清晰，技术细节与实验指标呈现直观，便于快速理解核心思路"}, "kind": "paper", "abstract": "Embodied agents are increasingly used to close the gap left by end-to-end policy models. Yet the agentic path has not realized closed-loop learning in physical execution: existing harnesses remain largely open-loop, following fixed skills during rollout and reflecting only after an episode completes. Such post-hoc reflection cannot govern execution as it unfolds, because physical interaction requires decisions to track rapidly changing robot-environment states at a frequency beyond today's large agentic models. We present Zetta, a closed-loop embodied harness that evolves code-based runtime critics and recovery skills online while keeping the base policy frozen. Through three timescale-separated loops, Zetta provides action-frequency governance, rollout-level critic-recovery proposal, and validation-gated skill updates. Together with Z-Infra, a rollout infrastructure decoupling agent logic from heterogeneous execution resources, Zetta achieves state-of-the-art success on LIBERO-Pro and RoboCasa under our current rollout budget, reaching 90.8% and 93.6%, with an 11.1x inference speedup; success continues to scale with self-exploration experience; learned skills transfer zero-shot, and clear robotic \"Aha Moments\" emerge. These results show that closed-loop harness self-evolution opens a scaling path for reliable physical intelligence.", "abstract_cn": "具身智能代理正致力于填补端到端策略模型留下的性能差距，但其智能体范式尚未实现物理执行中的闭环学习：现有框架大多开环运行，仅在回合结束后才反映固定技能。这种事后反思无法在执行过程中实时调控，因为物理交互要求决策频率远超当前大型智能体模型的能力。我们提出 Zetta，一种闭环具身框架，能在保持基础策略冻结的同时，在线演化基于代码的运行时评论员与恢复技能。通过三个时长的分离循环，Zetta 实现了动作频率级的治理、滚动层面的评论 - 恢复建议，以及验证门控的技能更新。结合 Z-Infra（一种将智能体逻辑与异构执行资源解耦的滚动基础设施），Zetta 在 LIBERO-Pro 和 RoboCasa 上取得当前滚动预算下的最先进成果，成功率分别达到 90.8% 和 93.6%，推理速度提升 11.1 倍；成功效果随自我探索经验持续扩展；所学技能支持零样本迁移，并清晰涌现出机器人\"顿悟时刻”。这些结果表明，闭环框架的自主演化开启了可靠物理智能的扩展路径。", "title_cn": "Zetta ζ：面向自进化物理智能的高效闭环具身框架", "interpret": "现有端到端智能体在物理执行中存在反馈滞后问题，难以应对机器人环境中瞬息万变的动态状态，导致决策往往无法实时修正。为此，研究团队提出了 Zetta 框架，它通过保持基础策略冻结、仅在线进化代码运行时评论与恢复技能的方式，实现了真正的闭环学习。Zetta 利用三个分离的时间尺度循环，分别提供动作频率级的实时治理、滚动级别的评论恢复建议，以及验证门控的技能更新机制。这一设计有效解决了物理交互中的高频决策瓶颈，弥补了传统后验反思的不足。该成果标志着具身智能从“固定技能执行”迈向“自我进化的物理闭环”，为构建具备持续适应与纠错能力的自主机器人系统奠定了重要基础。", "interpret_v": 3, "num": 105}, {"title": "新兴多智能体系统的模式与问题", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceShort": "Hacker News 热门", "hue": 214, "domain": "AI Agent", "ts": "2026-08-16T19:17:57.393000+08:00", "date": "2026-08-16", "weekday": "周日", "summary": "随着AI智能体在共享代码库、市场等社会系统中承担更多任务，智能体间的真实交互将激增，其交互量可能超过人机交互。Anthropic实验显示，协调式智能体群在2700万token运行中发现266个漏洞，远超独立并行方法的21个，但两者互补性明显。智能体虽擅长工具使用，但在长期协作与协调方面仍面临挑战。", "link": "https://www.anthropic.com/research/multiagent-systems", "points": {"类别": "实证研究", "背景": "针对 AI 智能体在复杂社会系统中大规模真实交互带来的新挑战。", "贡献": "发现协调式群智能体易出现漏洞，但证实了独立与协调方法的互补优势。", "合理性": "通过 Anthropic 真实环境实验验证结论，数据详实但样本量仍有待扩展。", "清晰度": "摘要结构完整，逻辑流畅，清晰展示了交互激增与协作瓶颈。"}, "kind": "paper", "abstract": "随着AI智能体在共享代码库、市场等社会系统中承担更多任务，智能体间的真实交互将激增，其交互量可能超过人机交互。Anthropic实验显示，协调式智能体群在2700万token运行中发现266个漏洞，远超独立并行方法的21个，但两者互补性明显。智能体虽擅长工具使用，但在长期协作与协调方面仍面临挑战。", "abstract_cn": "随着AI智能体在共享代码库、市场等社会系统中承担更多任务，智能体间的真实交互将激增，其交互量可能超过人机交互。Anthropic实验显示，协调式智能体群在2700万token运行中发现266个漏洞，远超独立并行方法的21个，但两者互补性明显。智能体虽擅长工具使用，但在长期协作与协调方面仍面临挑战。", "interpret": "随着人工智能智能体在代码协作、市场交易等社会系统中承担核心任务，其真实交互频率已趋近甚至超越人机交互，深刻重塑着 AI 的运行生态。研究表明，当智能体群以协调方式共同执行大规模任务（如 Anthropic 在 2700 万 token 的实验中），系统极易暴露出复杂交互引发的漏洞，数量高达 266 个，显著高于独立并行运行时的 21 个。这一发现揭示了当前智能体虽具备卓越的工具使用能力，但在长期规划、多主体协同与冲突解决方面仍存在明显短板。该研究指出，协调与独立两种模式并非互斥，而是具有显著互补性；解决协作中的不确定性将是推动多智能体系统从简单自动化向真正群体智慧演进的关键，这对构建安全、高效的未来社会型 AI 架构具有重要指导意义。", "interpret_v": 3, "num": 106}, {"title": "LittleLearner：一个只学美国小学课程（K-5）的 LLM 沙盒，研究模型能力边界", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceShort": "Hacker News 热门", "hue": 214, "domain": "LLM", "ts": "2026-08-16T17:42:02.137000+08:00", "date": "2026-08-16", "weekday": "周日", "summary": "LittleLearner 是一个受控沙盒，用 88B token 的 LittleCurriculum 语料（按 Common Core K-5 标准过滤）从头训练 0.6B / 1.3B / 5B 三个规模模型，并配有未过滤的对照模型。实验发现，扩展规模、SFT+GRPO 后训练和上下文学习都能放大课程内能力，但均无法有效提升超出 K-5 范围的表现，表明预训练过滤决定了模型的能力上限。", "link": "https://littlelearner-ll.github.io/", "points": {"类别": "实证研究", "背景": "探究受控小学课程语料对大语言模型能力边界的根本影响。", "贡献": "构建专用沙盒验证预训练数据过滤直接决定模型在 K-5 范围外的表现上限。", "合理性": "通过多规模模型与对比组实验，逻辑严密且结论可信，无显著方法缺陷。", "清晰度": "摘要逻辑连贯，重点突出数据过滤的关键作用，结构清晰易懂。"}, "kind": "paper", "abstract": "LittleLearner 是一个受控沙盒，用 88B token 的 LittleCurriculum 语料（按 Common Core K-5 标准过滤）从头训练 0.6B / 1.3B / 5B 三个规模模型，并配有未过滤的对照模型。实验发现，扩展规模、SFT+GRPO 后训练和上下文学习都能放大课程内能力，但均无法有效提升超出 K-5 范围的表现，表明预训练过滤决定了模型的能力上限。", "abstract_cn": "LittleLearner 是一个受控沙盒，用 88B token 的 LittleCurriculum 语料（按 Common Core K-5 标准过滤）从头训练 0.6B / 1.3B / 5B 三个规模模型，并配有未过滤的对照模型。实验发现，扩展规模、SFT+GRPO 后训练和上下文学习都能放大课程内能力，但均无法有效提升超出 K-5 范围的表现，表明预训练过滤决定了模型的能力上限。", "interpret": "本文通过构建\"LittleLearner\"沙盒，研究了美国 K-5 小学课程对大型语言模型能力边界的限制。研究团队使用 880 亿 token 的\"LittleCurriculum\"语料（严格遵循 Common Core 标准过滤后的文本），从头训练了 0.6 亿至 5 亿参数的三个模型，并设置未过滤语料的对照模型进行对比。实验结果表明，无论模型参数如何扩展，或在完成监督微调（SFT）后引入策略优化（GRPO）及上下文学习，这些模型在课程内的表现均显著提升，但始终无法超越 K-5 知识范围。这一发现深刻揭示：当训练数据经过严格的主题过滤时，模型的知识上限将严格锁定于语料内容，规模与算法的优化难以突破这一“数据决定论”的边界，为可控模型的能力边界研究提供了关键实证依据。", "interpret_v": 3, "num": 107}, {"title": "动态多字节预测：分层语言模型如何加速推理", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-16T08:00:00+08:00", "date": "2026-08-16", "weekday": "周日", "summary": "字节级分层语言模型（LMs）近期成为子词分词模型的稳健替代方案，但逐字节生成仍是推理速度瓶颈。研究者提出多字节预测（MBP），通过并行生成多个字节来加速推理，且几乎不影响性能、不增加参数。MBP 基于多 token 预测（MTP）范式，引入可变长度预测窗口与新型注意力掩码机制，在多项生成任务中实现性能与推理吞吐量的帕累托最优权衡。", "link": "https://arxiv.org/abs/2608.15454", "points": {"类别": "方法 论文提出多字节并行预测框架，旨在加速分层语言模型的推理速度。", "背景": "当前分层语言模型逐字节生成导致推理瓶颈，且无法利用并行计算优势。", "贡献": "引入动态多字节预测机制，通过可变窗口与新颖掩码方案实现无参数加速。", "合理性": "基于因果约束的并行设计逻辑严谨，在多项任务中展现出最优性能吞吐比。", "清晰度": "摘要结构紧凑，创新点与技术细节表述准确，条理清晰易懂。"}, "kind": "paper", "abstract": "Byte-level hierarchical language models (LMs) have recently emerged as a robust alternative to their popular counterparts that use subword tokenization. However, generating one byte at a time remains a bottleneck for inference speed. To address this, we introduce multi-byte prediction (MBP), which generates multiple bytes in parallel, speeding up inference with minimal performance impact and no additional parameters. MBP builds on the popular multi-token prediction (MTP) paradigm with two crucial innovations. First, we introduce a variable-length prediction window that aligns with the latent tokens, or segments, of a hierarchical LM. Second, we implement a novel attention-masking scheme that enables parallel byte prediction without violating causality. We show that multi-byte prediction strikes a Pareto-optimal trade-off across multiple generative tasks, instruction following, question answering, summarization, and machine translation, achieving the best trade-off between performance and inference throughput.", "title_cn": "动态多字节预测：分层语言模型如何加速推理", "abstract_cn": "基于字粒度的层级语言模型（LMs）已逐渐成为一种高效的替代方案，用于取代基于子词分词的主流模型，然而逐字节生成仍限制了推理速度。为此，我们提出了多字节预测（MBP）方法，该方法通过并行生成多个字节来加速推理，且在性能上影响极小、无需额外参数。MBP 基于流行的多令牌预测（MTP）范式，并引入了两项关键创新：首先，我们提出了与层级 LM 中的潜令牌或段对齐的可变长度预测窗口；其次，我们实现了一种新颖的注意力掩码方案，支持并行字节预测的同时不破坏因果性。研究表明，多字节预测在生成任务、指令遵循、问答、摘要生成及机器翻译等多个任务中取得了帕累托最优平衡，实现了性能与推理吞吐量的最佳权衡。", "interpret": "分层语言模型通过按字节分层而非分词处理文本，虽提升了精度，但逐字节生成的慢速推理限制了其应用。为此，研究者提出了无需新增参数的多字节预测（MBP）技术。该方法在保留原有层级结构的基础上，创新性地设计了与潜在分段对齐的变长预测窗口，并制定了特殊的注意力掩码方案，确保多字节并行生成不破坏因果逻辑。实验表明，MBP 能在几乎零性能损失的前提下，显著加速指令遵循、问答等生成任务。这一突破为高效、高精度的语言模型推理提供了新路径，推动了大模型在实时交互场景的落地。", "interpret_v": 3, "num": 108}, {"title": "有界智能体：多智能体AI系统的委托安全机制", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-16T08:00:00+08:00", "date": "2026-08-16", "weekday": "周日", "summary": "论文提出Agentic Principal Chain（APC），通过六项授权检查追踪并限制多智能体系统中的委托权限，防止越权组合与子代理权限扩散。在3，154个实例评测中，AgentDojo四个域的数据外泄从75-100%降至0%，并拦截全部544例InjecAgent数据窃取；授权延迟第99百分位仅0.24毫秒。实现、评测工具与数据均已公开。", "link": "https://arxiv.org/abs/2608.15888", "points": {"类别": "系统方法。提出受界智能体及 APC 委托安全机制以增强多智能体系统。", "背景": "源于 LLM 代理权限静态导致组合攻击与越权执行的授权架构安全缺陷。", "贡献": "引入 APC 追踪授权链并实施六项检查；证明单调性与完备性并实现数据外泄阻断。", "合理性": "授权机制独立于模型行为且评估可信，但完备性证明依赖串行接入等强假设条件。", "清晰度": "写作逻辑从问题界定到机制设计再到实证评估层层递进，结构清晰专业易读。"}, "kind": "paper", "abstract": "LLM-based agents can act on behalf of a user to access cloud services, call tools, or invoke agents. At session start, the agent's permissions are set but remain static, and each request is evaluated independently, without considering prior actions. Within its permissions, an agent may act contrary to the delegated task, combine individually permitted actions into a prohibited outcome, or delegate authority to a sub-agent without limiting it. A prompt injection poses a risk only if the agent has authority to perform such actions; this is therefore a problem of authorization architecture, not just the model. The Agentic Principal Chain (APC) tracks delegated authority from one principal to the next. APC evaluates each request against the accumulated session state using six authorization checks. APC carries forward and restricts delegated scope and budgets. Using composition closure, APC checks requests against prior actions to prevent prohibited combinations and enforces the decision outside the model. We prove Blast Radius Monotonicity and Composition Soundness for APC implementations; Composition Soundness is limited to prohibited combinations under a complete restriction set and serialized admission. We evaluated 3,154 instances including InjecAgent, AgentDojo, and ASB. Our compromised-model evaluation tests APC independently of model behavior by inserting the ground-truth attack call after the first legitimate tool call. AgentDojo exfiltration fell from 75-100% to 0% across all four domains; APC blocked all 544 InjecAgent data-stealing cases. Intent binding reduced destruction from 38.6% to 4.0% and manipulation from 90.5% to 12.1%. Authorization latency was 0.24 ms at the 99th percentile on an idle host; across 949 AgentDojo task-injection pairs, utility was 8.6 and 13.9 percentage points lower in the two settings. Implementation, evaluation tools, and data are publicly available.", "title_cn": "有界智能体：多智能体AI系统的委托安全机制", "abstract_cn": "基于 LLM 的代理可代表用户访问云服务、调用工具或触发其他代理。在会话开始时代理的权限虽已设定但保持静态，且每次请求均独立评估，未考虑先前操作。代理在其权限内可能反向执行委托任务，将单项允许操作组合成禁止结果，或将权限委托给子代理而不作限制。若代理具备执行此类操作的权威，提示注入即构成风险，这本质上是授权架构而非单纯模型问题。代理主链（Agentic Principal Chain, APC）追踪从一个主代理向下一个主代理的委托权威，并利用六种授权检查对每请求基于累积会话状态进行评估。APC 在延续委托范围与预算的同时加以限制，并通过组合封闭机制将请求与先前操作进行比对以阻止禁止组合，同时于模型外部强制执行决策。我们对 APC 实行了爆破半径单调性与组合健全性证明；组合健全性在完整限制集与串行接纳约束下仅适用于禁止组合。我们评估了 3,154 个实例，涵盖 InjecAgent、AgentDojo 与 ASB。通过植入真实攻击调用后的受损模型测试，我们实现了对模型行为的独立验证；APC 将 AgentDojo 的数据外泄率从四个领域的 75%-100% 降至 0%，阻断了全部 544 起 InjecAgent 数据窃取案例。意图绑定将破坏率从 38.6% 降至 4.0%，操控率从 90.5% 降至 12.1%。在空闲主机上，授权延迟的第 99 百分位为 0.24 ms；在 949 对 AgentDojo 任务注入场景中，两个设置下的效用分别降低 8.6 和 13.9 个百分点。我们的实现、评估工具与数据已公开。", "interpret": "大型语言模型驱动的智能体常被授权代表用户访问云端或调用工具，但现有机制多依赖静态权限且缺乏对历史行为的全局约束。这导致智能体可能在权限内通过组合独立操作实现被禁止的结果，或滥用子代理扩大权力范围，而提示词注入风险仅当涉及真实权限时才构成威胁，本质是授权架构缺陷。为此，研究提出了代理主体链（APC），该机制追踪权限从主体到次主体的传递路径，并在每次请求时结合会话累积状态进行六项关键授权检查。通过引入组合封闭约束，APC 能动态限制授权范围与预算，防止权力越界，为构建安全可控的多智能体协作系统提供了新的信任基础。", "interpret_v": 3, "num": 109}, {"title": "Insurance as AI Risk Infrastructure: A Generative-Agent Simulation of AI Adoption", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "虚拟仿真社会", "ts": "2026-08-15T19:45:51+08:00", "date": "2026-08-15", "weekday": "周六", "summary": "The rapid evolution of artificial intelligence (AI) tools has demonstrated immense potential to enhance societal well-being and operational efficiency. However, the inherent unreliability and uncer…", "link": "https://arxiv.org/abs/2608.15181", "points": {"类别": "模拟实证研究，提出保险作为 AI 风险基础设施以加速企业采纳", "背景": "针对大语言模型不可靠性及企业因未知损失而不敢深度集成 AI 的现状", "贡献": "构建含保险机制的社会经济框架，利用 LLM 驱动智能体系统进行行为验证与效果评估", "合理性": "模拟结合理论与经济数据，逻辑自洽但仅依赖仿真无法完全替代真实世界数据验证", "清晰度": "摘要结构完整且术语使用规范，从问题描述到方法验证再到结论层层递进，阅读流畅"}, "kind": "paper", "title_cn": "保险作为人工智能风险基础设施：人工智能采用过程的可生成代理模拟", "summary_cn": "人工智能（AI）工具的快速演进已展现出提升社会福祉和运营效率的巨大潜力，然而其固有的不可靠性和不确定性……", "abstract": "The rapid evolution of artificial intelligence (AI) tools has demonstrated immense potential to enhance societal well-being and operational efficiency. However, the inherent unreliability and uncertain operational consequences of modern AI systems, typified by large language models (LLMs), have created a significant barrier to enterprise adoption. Many enterprises remain hesitant to integrate these tools deeply into their workflows due to concerns about unpredictable losses and liability exposure. While existing technical safeguards primarily seek to reduce the likelihood or severity of AI-enabled workflow failures, they do not by themselves provide ex post financial protection when residual pecuniary tail losses materialize. In this paper, we introduce a socio-economic framework that complements these safeguards by transferring and absorbing the residual financial consequences of AI adoption through insurance. To evaluate this framework, we develop an LLM-driven agent-based social simulation (LABSS) system. We assess the behavioral validity of the simulation using established economic and sociological theories. Our analysis demonstrates that the proposed insurance framework reduces firm-level financial exposure, thereby accelerating the aggregate adoption of AI tools and improving firm solvency and aggregate capital.", "abstract_cn": "人工智能工具的快速演变展现出巨大的潜力以改善社会福利并提升运营效率。然而，现代 AI 系统（以大语言模型为代表）固有的不可靠性和不确定的运营后果，构成了企业采纳的重大障碍。许多企业因担忧不可预见的损失和法律责任而犹豫是否将这些工具深度集成到工作流程中。虽然现有的技术保障措施旨在降低 AI 驱动工作流失败的可能性或严重程度，但它们并不能在残余财务尾部损失发生时提供事后经济补偿。本文引入一个社会经济框架，通过保险机制转移并吸收 AI 采纳带来的残余财务后果，以完善这些保障措施。为评估该框架，我们构建了一个以 LLM 驱动的基于智能体的社会模拟（LABSS）系统，并利用成熟的经济学和社会学理论检验其行为有效性。我们的分析表明，所提出的保险框架降低了企业层面的财务风险敞口，从而加速 AI 工具的总体采纳，并提升企业偿付能力和总体资本。", "interpret": "随着生成式 AI（特别是大语言模型）的飞速演进，其带来的运营效率提升巨大，但模型固有的不可靠性和操作后果的不确定性，正成为企业广泛采用的最大阻碍。传统技术安全措施主要致力于降低故障发生的概率或严重程度，却无法在 AI 系统仍导致残余经济损失时提供事后的财务保障。本文提出了一种全新的“保险作为 AI 风险基础设施”的经济社会框架，通过模拟“生成式智能体”系统，展示了保险机制如何转移并吸收 AI 采用过程中的残余财务后果。这一研究填补了现有技术防护在应对长尾损失上的空白，旨在为构建一个既能享受 AI 红利又能有效管理潜在风险的稳健企业环境提供理论依据与政策方向。", "interpret_v": 3, "num": 110}, {"title": "LAPF: LLM-Agent-Based Path Finder Using the UAVScenes Dataset", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI认知算法", "ts": "2026-08-15T19:28:21+08:00", "date": "2026-08-15", "weekday": "周六", "summary": "Uncrewed aerial vehicles (UAVs) are increasingly deployed for autonomous navigation in complex outdoor environments, where dynamic conditions and mission requirements require intelligent adaptive d…", "link": "https://arxiv.org/abs/2608.15175", "points": {"类别": "实证研究，针对复杂户外无人机电联导航提出新框架。", "背景": "解决现有方法泛化性差及大模型缺乏自主功能的局限。", "贡献": "构建含感知规划记忆闭环架构，提升路径效率并减少修正事件。", "合理性": "实验数据支撑结论，但当前仅限单一数据集验证。", "清晰度": "摘要逻辑严密，从问题到方案及结果层层递进。"}, "kind": "paper", "title_cn": "LAPF：基于大语言模型代理的路径寻找器，利用 UAVScenes 数据集", "summary_cn": "无人机（UAV）越来越多地部署于复杂户外环境的自主导航任务中，动态环境与任务需求需要智能化的自适应导航策略。", "abstract": "Uncrewed aerial vehicles (UAVs) are increasingly deployed for autonomous navigation in complex outdoor environments, where dynamic conditions and mission requirements require intelligent adaptive decision-making. Existing optimization-based, Machine Learning (ML), and Reinforcement Learning (RL) approaches often rely on predefined models or task-specific training, limiting their generalization and adaptability in uncertain scenarios. Recent Large Language Model (LLM)-assisted approaches offer promising reasoning capabilities but remain constrained by limited agentic functionality, including insufficient memory, planning, and tool interaction mechanisms.This paper proposes an LLM-Agent-Based Path Finder (LAPF) framework for autonomous UAV navigation in town-scale outdoor environments. LAPF extends LLM-assisted navigation by integrating perception, memory, planning, and action modules into a closed-loop cognitive architecture. The proposed agent leverages prior navigation experiences, performs Chain-of-Thought (CoT) reasoning, couples each detected hazard to a bounded corrective action, and dynamically refines waypoint decisions based on environmental feedback.The three independent trials per method demonstrate that LAPF achieves mean path lengths of 512.83 m and 506.37 m, compared to the straight-line optimum of 497.33 m, corresponding to path length reductions of 17.2% and 15.6% relative to CoT prompting and absolute path efficiencies of 97.1% and 98.1% in open-field and obstacle-injected scenarios, respectively. Furthermore, LAPF is the only evaluated approach that couples every detected hazard to a bounded, metric-neutral corrective action while maintaining near-goal stability, with zero clamp events in both scenarios, whereas CoT prompting increases from 9.7 to 14.0 events.", "abstract_cn": "无人机在复杂户外环境中的自主导航日益普及，动态条件与任务需求要求智能的自适应决策能力。现有的基于优化、机器学习和强化学习的方法往往依赖预设模型或特定任务训练，限制了其在不确定场景中的泛化与适应能力。近期基于大型语言模型的方法虽提供了有潜力的推理能力，但仍受限于有限的代理功能，包括记忆、规划和工具交互机制不足。本文提出了一种面向城市级户外环境自主导航的基于大型语言模型的代理路径规划器（LAPF）框架，该框架通过将感知、记忆、规划和行动模块整合为闭环认知架构来扩展基于大型语言模型的导航。所提出的代理利用先验导航经验进行思维链推理，将每个检测到的危险耦合为有界的修正行动，并基于环境反馈动态细化航点决策。三个独立试验表明，与直线最优路径相比，LAPF 的平均路径长度分别为 512.83 米和 506.37 米，对应于思维链提示和绝对路径效率场景下的路径长度缩减 17.2% 和 15.6%，以及在开阔场地和障碍物注入场景下的 97.1% 和 98.1% 的路径效率。此外，LAPF 是唯一一种在保持接近目标稳定性的同时，能将每个检测到的危险耦合为有界且与度量中立的修正行动的方法，且两种场景下均无夹钳事件，而思维链提示事件数则从 9.7 次增加至 14.0 次。", "interpret": "无人机在复杂城市环境中执行自主导航任务时，常面临动态障碍物与多变任务需求。传统优化、机器学习及强化学习方法多依赖预设模型或特定场景训练，泛化能力受限；而新兴的大语言模型虽具备强大推理力，却常缺乏独立执行、记忆管理及工具调用等关键功能。为此，本文提出了一种基于大语言模型的智能体路径规划框架（LAPF）。该框架将感知、记忆、规划与执行模块深度融合，利用 LLM 的泛化推理能力，使无人机无需针对每个新任务进行额外训练，即可自主适应不确定环境并完成多阶段导航。该研究标志着从“感知 - 规划”分离的传统架构向“认知代理”模式的跨越，为无人系统在真实城市场景中实现高鲁棒性的自主决策提供了新范式。", "interpret_v": 3, "num": 111}, {"title": "理解智能体 AI 系统中的认知诱发风险", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI认知算法", "ts": "2026-08-15T08:00:00+08:00", "date": "2026-08-15", "weekday": "周六", "summary": "一项研究系统分析了由大语言模型驱动的前沿智能体系统因认知能力扩展而引发的风险，按认知范围分为物理认知、社会认知到自我指涉认知三个层级。研究对应考察了这些风险对人类能动性、自主性和控制能力的影响，并提出缓解策略以增强智能体 AI 系统的可控性，保障其长期安全发展。", "link": "https://arxiv.org/abs/2608.15304", "points": {"类别": "实证研究，聚焦大模型智能体引发的认知诱发风险，分析其对人类社会的影响。", "背景": "前沿智能体展现类人认知模式，其深度整合引发的认知参与问题亟待系统研究。", "贡献": "基于三阶认知框架剖析代理系统风险，并提出缓解策略以保障安全可控发展。", "合理性": "从物理到自我参照的认知层级递进逻辑严密，风险关联假设可信但缺乏实测数据支持。", "清晰度": "框架结构清晰且层级分明，语言专业流畅，但部分术语定义略显抽象影响理解。"}, "kind": "paper", "abstract": "Frontier agentic systems powered by large language models (LLMs) exhibit human-like patterns of cognition. As these systems become deeply integrated across different domains, their cognitive engagement raises critical concerns for human society that remain insufficiently studied. To address this gap, we systematically analyze risks induced by expanding cognitive capabilities, following a three-level framework defined by their cognitive scope, from physical cognition to social cognition, and finally to self-referential cognition. We study their potential risks to human agency, autonomy, and control capability, corresponding to each cognitive level. We finally propose strategies to mitigate these risks and enhance the controllability of agentic AI systems, ensuring their long-term safe development.", "title_cn": "理解智能体 AI 系统中的认知诱发风险", "abstract_cn": "前沿的智能代理系统基于大型语言模型（LLMs）展现出类人类的认知模式。随着这些系统在不同领域深度集成，其认知参与对人类社会构成了亟待研究却尚未充分关注的关键问题。为弥补这一空白，我们系统分析了由认知能力扩展引发的风险，遵循一个按认知范围划分的三层框架：从物理认知到社会认知，再到元认知。我们针对每个认知层级，研究了它们对人类主体性、自主性及控制能力构成的潜在风险。最后，我们提出了缓解这些风险并提升智能代理系统可控性的策略，以确保其长期安全发展。", "interpret": "随着大语言模型驱动的智能体在物理、社会乃至自我指涉层面展现出类人认知能力，其深度融入人类社会带来的认知风险正日益凸显，却尚缺乏系统研究。本研究提出一套涵盖三个认知层级的分析框架，逐一剖析此类智能体对人类自主权、控制能力及主体性的潜在威胁。研究发现，从操控物理世界到介入社会互动，再到挑战自我反思机制，每层认知扩展均对应着独特的风险形态，例如可能削弱人类的决策自由或引发不可控的自我强化。文章据此提出针对性缓解策略，旨在强化智能体的可控性，确保其长期安全发展。这一成果为治理强智能体风险提供了理论依据，有助于维护人类在技术演进中的核心地位与社会稳定。", "interpret_v": 3, "num": 112}, {"title": "记忆智能体记忆基板全面评测：无单一方案占优，检索过多反伤决策", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-15T08:00:00+08:00", "date": "2026-08-15", "weekday": "周六", "summary": "一项受控评测系统考察了记忆增强型智能体的多种记忆基板，覆盖稠密与稀疏索引、文本记录、结构化存储、层级存储、精炼记忆、参数更新及激活兼容上下文机制。在三个骨干模型和四个基准套件上统一测量了26项性能与效率指标，结果显示无单一基板持续占优：广泛检索利于长上下文事实问答，但过度检索会转移对关键行动上下文的注意力，损害序贯决策。研究提出基板路由是自适应记忆系统的必要组件。", "link": "https://arxiv.org/abs/2608.15008", "points": {"类别": "实证研究。系统开展记忆基板在长程大语言智能体中的全面基准测试与效果分析。", "背景": "源于记忆作为长期智能体核心基础设施，当前评估方法缺乏针对不同运行场景的指导意义。", "贡献": "构建统一评测框架覆盖七类记忆基板并发现无单一方案占优，提出基于检索度量的智能路由策略。", "合理性": "假设合理，通过多模型多基准覆盖不同场景，仅限制代码开源，未发现逻辑漏洞。", "清晰度": "结构严谨逻辑清晰，从问题背景到评测设计再到结果分析层层递进易读。"}, "kind": "paper", "abstract": "Memory is becoming core infrastructure for long-horizon LLM agents, yet existing evaluations offer limited guidance on which memory substrate, namely the underlying medium in which memory is represented and stored, should be used under different operating regimes. We present a controlled harness evaluation of memory substrates for memory-augmented agents, covering dense and sparse indices, text records, structural stores, hierarchical stores, refinement-based memories, parametric updates, and activation-compatible context mechanisms. Across three backbone models and four benchmark suites spanning user-centric question answering and agent-centric decision-making, we instrument 26 performance and efficiency metrics under a unified harness. Our results show that no single substrate consistently dominates: broad retrieval benefits long-context factual QA, while excessive retrieval can harm sequential decision-making by shifting attention away from action-critical context. Scalability introduces a further routing axis, as substrates that perform well at moderate history lengths can become costly or brittle at longer horizons. These findings motivate substrate routing as a necessary component of adaptive agent memory systems and provide empirical guidance for designing efficient, reliable, and regime-aware long-term memory for LLM agents. Code will be made available upon acceptance.", "abstract_cn": "记忆已成为长程大语言模型智能体的核心基础设施，但现有评估在何种操作模式下应使用何种记忆介质（即记忆存储与表示的底层载体）方面仍缺乏指导。我们提出了一种针对记忆增强智能体记忆介质的受控评估体系，涵盖稠密与稀疏索引、文本记录、结构化存储、分层存储、基于细化机制的记忆、参数更新以及激活兼容的上下文机制。我们利用统一评估体系，在涵盖以用户为中心的问答和以智能体为中心的决策的三骨干模型与四基准套件中，监测了 26 项性能与效率指标。结果显示，没有任何单一介质能够全面占优：广泛检索有利于长上下文中事实性问答，而过度检索则可能因将注意力从关键动作上下文中转移而损害序列决策。可扩展性引入了另一条路由路径，因为那些在中等历史长度下表现良好的介质在更长范围下可能变得昂贵或脆弱。这些发现促使我们将介质路由作为自适应智能体记忆系统的必要组成部分，并为设计高效、可靠且感知运行模式的大语言模型长期记忆提供了实证指导。代码将在论文录用后提供。", "title_cn": "记忆智能体记忆基板全面评测：无单一方案占优，检索过多反伤决策", "interpret": "随着大语言模型智能体（LLM Agents）向长程任务发展，记忆机制已成为核心基础设施，但现有评估未能清晰指导不同场景下内存存储介质（如稠密索引、稀疏索引、结构化存储等）的选择。本研究构建了统一评估框架，对七种主流记忆基板的性能与效率进行了全面测试，涵盖事实问答与决策执行两大核心场景，并关联三种主流基座模型。\n\n核心发现表明：不存在一种“万能”的内存方案。稠密索引在需要处理长上下文事实问答时表现优异，而过度依赖检索机制反而会削弱智能体的决策效率与响应速度。该研究填补了长程智能体记忆评估的空白，揭示了检索策略与任务类型间的非线性关系，为构建高效、可扩展的记忆增强型智能体提供了关键的实证依据与设计指导。", "interpret_v": 3, "num": 113}, {"title": "StateM：通过 Harness 扩展在 Terminal-Bench 2.1 上达到 95.3% 原始准确率", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-15T08:00:00+08:00", "date": "2026-08-15", "weekday": "周六", "summary": "StateM 是一种智能体原生运行时，通过持久状态、阶段局部上下文和可恢复运行手册提升长时程智能体执行能力，无需修改模型权重。在 Terminal-Bench 2.1 上，StateM 将 GPT-5.5 xhigh 从 83.1% 提升至 92.1%，并将 GPT-5.6 Sol xhigh 推至 95.3% 原始准确率，在 445 次试验中全部 89 项任务至少成功一次。", "link": "https://arxiv.org/abs/2608.15089", "points": {"类别": "实证研究，针对长程任务失败提出新的运行时间系统架构。", "背景": "现有 Agent 模型虽能解题，却在状态跟踪和流程控制上常出现失败。", "贡献": "提出 StateM 运行库，通过持久状态和版本化规程将多模型准确率提升至 95%。", "合理性": "通过大幅降低试错成本和资金消耗验证，假设与实验设计具有高度可信度。", "清晰度": "摘要逻辑连贯，数据详实，清晰展示了架构如何具体改进不同模型的表现。"}, "kind": "paper", "abstract": "Long-horizon agents can fail even when their underlying models can solve the constituent steps. They may lose track of mutable state, fail to reactivate lessons from earlier executions, skip known procedures, or stop prematurely. We bet on harness scaling to improve the execution system around an agent without changing its model weights. We introduce StateM, an agent-native runtime that organizes execution around durable states, phase-local context, checked transitions, recoverable runbooks, and versioned procedural practices that agents and users can inspect together. On Terminal-Bench 2.1, StateM raises GPT-5.5 xhigh to 92.1\\%, versus 83.1\\% reference and GPT-5.6 Sol Ultra at 91.9\\%. The runbook transfers unchanged to GPT-5.6. With GPT-5.6 Sol xhigh, StateM reaches 95.3\\% raw accuracy across 445 trials and succeeds on all 89 tasks at least once. The frozen profile raises GPT-5.6 Luna from 76.7 to 85.4\\%, above the 84.9\\% Sol xhigh reference. Using the same runtime, runbook structure, and golden rules, less than \\$38 of adaptation raises DeepSeek-V4 Flash from 82.7 to 88.1\\% under standard timeouts and to 89.1\\% on an 88-task common core. Extending only the remaining latency-sensitive task matches the reported 88.8\\% GPT-5.6 Sol max result. Final-score API usage is about \\$15 versus \\$574.68 for the GPT reference; total DeepSeek expenditure is \\$52.22. On BusinessBench, family-specific runbooks built on development sets yield held-out gains of 0.55 macro and 1.34 micro points; two mechanism-matched families improve by 10.04 points. Concrete rules generalize when tasks share execution structure, while the control methodology applies broadly. StateM turns selected postmortem findings into persistent, executable preconditions and practices, making learned controls explicit and enforceable through stateful controls. Code at github.com/henryqin1997/statem.", "abstract_cn": "即使其基础模型能够解决构成步骤，长时程智能体仍可能因丢失可变状态、无法回溯早期执行经验、跳过已知流程或提前停止而失败。我们主张通过扩展运行环境来改进智能体的执行系统，而无需调整其模型权重。我们介绍了 StateM，一种以持久状态为核心、具备阶段局部上下文、校验状态转移、可恢复执行步骤以及可被智能体与用户共同检视的版本化流程实践的智能体原生运行时。在 Terminal-Bench 2.1 上，StateM 将 GPT-5.5 xhigh 的表现从 83.1% 提升至 92.1%，高于 GPT-5.6 Sol Ultra 的 91.9%；且执行步骤手册可无缝迁移至 GPT-5.6。使用 GPT-5.6 Sol xhigh，StateM 在 445 次试验中实现 95.3% 的原始准确率，并至少成功完成全部 89 项任务。冻结配置文件使 GPT-5.6 Luna 从 76.7% 提升至 85.4%，超过 GPT-5.6 Sol xhigh 的 84.9% 基线。在相同的运行时、执行步骤结构及黄金规则下，不足 38 美元的调整费用即可将 DeepSeek-V4 Flash 的标准超时表现从 82.7% 提升至 88.1%，并在 88 项通用核心任务上达到 89.1%；仅扩展剩余对延迟敏感的任务即可匹配 GPT-5.6 Sol max 报告的 88.8% 成绩。最终，StateM 的 API 使用成本约为 15 美元，而 GPT 参考方案为 574.68 美元；DeepSeek 总支出为 52.22 美元。在 BusinessBench 上，基于开发集构建的家族特定执行步骤手册产生了 0.55 个宏平均和 1.34 个微平均的点差增益，两种机制匹配家族则提升了 10.04 分。当任务共享执行结构时，具体规则具有泛化能力，而控制方法论适用于广泛场景。StateM 将事后分析结果转化为持久且可执行的先决条件与实践，使学习到的控制措施通过状态控制变得显式并可强制执行。代码位于 github.com/henryqin1997/statem。", "title_cn": "StateM：通过 Harness 扩展在 Terminal-Bench 2.1 上达到 95.3% 原始准确率", "interpret": "长程任务中，智能体往往因遗忘中间状态、无法复用过往经验或步骤跳跃而失败，这通常是执行系统缺陷所致，而非模型能力不足。为此，研究提出了一种名为 StateM 的代理原生运行时，旨在通过优化执行流程而非更新模型参数来提升表现。StateM 的核心在于建立持久化状态管理机制，配合分阶段上下文、关键步骤校验、可恢复的运行手册及可版本化的过程实践。这些设计让代理与用户能够共同审视执行细节。在终端测试 2.1 基准上，该方法显著提升了性能：将 GPT-5.5 xhigh 的准确率从 83.1% 推高至 92.1%，甚至使其超越同等条件下的其他顶级模型（如 GPT-5.6 Sol Ultra）。更重要的是，其运行的“运行手册”可直接转移至新模型，而无需重新训练，实现了高效复用。实验表明，结合该机制后，智能体在 445 次试验中原始准确率达 95.3%，且成功完成所有 89 个任务至少一次。这一发现证明，通过架构层面的状态管理扩展，可以有效解决长程代理执行的稳定性难题。", "interpret_v": 3, "num": 114}, {"title": "VibeWorlding：多模态智能体能否端到端构建 3D 开放世界？", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "AI Agent", "ts": "2026-08-15T08:00:00+08:00", "date": "2026-08-15", "weekday": "周六", "summary": "VibeWorlding 提出统一框架，用于基准测试和训练能自主推断用户意图、规划场景布局、调用 3D 工具并反思多模态反馈的\"vibe worlding\"智能体。", "link": "https://arxiv.org/abs/2608.15265", "points": {"类别": "系统 该研究聚焦多模态智能体在端到端构建交互式 3D 开放世界的挑战。", "贡献": "提出统一框架 VibeWorlding 及配套基准测试 VWE-BENCH 和强化学习训练系统 VibeWorlding-Gym。", "合理性": "实验显示当前顶尖模型成功率不足六成，且指出 3D 编辑精准度为关键瓶颈。", "清晰度": "结构清晰，从问题定义、基准构建、训练框架到实验结果层层递进。"}, "kind": "paper", "abstract": "Constructing an interactive 3D open world from a user query is important. However, existing methods are primarily evaluated on idealized, simple queries, making it difficult to systematically analyze and compare how multimodal agents understand user intent, use 3D tools, and reason over textual and visual 3D world information. To this end, we propose VibeWorlding, a unified framework for benchmarking and training vibe worlding agents: a multimodal agent that can autonomously infer user intent, plan scene layout, invoke 3D tools, and reflect on the multimodal feedback in a multi-turn agent-environment interaction process. To achieve this, we first build VWE-BENCH, a benchmark of 2,616 high-quality 3D assets, 323 human-annotated seed 3D worlds, and 6,828 reverse-synthesized multimodal user queries, split into verified queries with ground-truth and unverified queries with carefully designed rubrics. Moreover, we develop VibeWorlding-Gym, a joint multimodal RL post-training framework that integrates (1) a sandbox environment unifying asset retrieval, editing, and image rendering as MCP tools, and (2) a rubric-based verifier that combines physical feasibility and intent fulfillment verification, supporting both fair model evaluation and scalable multimodal RL reward service. Our experiments show that current frontier MLLMs are far from solving the vibe worlding agent task, with even GPT-5.5 and Qwen3.8-Max reaching below 60% success rate, and trace the bottleneck to precise 3D world editing. We further find that RL training can ease this weakness and enable open-source MLLMs to even surpass closed-source frontiers: our VibeWorlder-8B is comparable to frontier MLLMs, while our flagship VibeWorlder-30B-A3B attains the best overall Pass@1 among all evaluated models.", "abstract_cn": "构建交互式三维开放世界是至关重要的一步。然而，现有方法主要在理想化且简单的查询上进行评估，这使得难以系统性地分析并比较多模态代理如何理解用户意图、使用三维工具以及推理文本和视觉三维世界信息。为此，我们提出了 VibeWorlding，一个用于基准测试和训练多模态“氛围构建”代理的统一框架：该代理能够自主推断用户意图、规划场景布局、调用三维工具，并在多轮代理 - 环境交互过程中反思多模态反馈。为此，我们首先构建了 VWE-BENCH，包含 2,616 个高质量的 3D 资产、323 个人工标注的种子 3D 世界以及 6,828 个反向合成的多模态用户查询，并划分为带有真实标签的已验证查询和带有精心设计的评分标准的未验证查询。此外，我们开发了 VibeWorlding-Gym，一个联合多模态强化学习后训练框架，它整合了（1）作为模型上下文协议工具的资产检索、编辑和图像渲染统一沙盒环境，以及（2）结合物理可行性和意图满足验证的基于评分标准的验证器，支持公平模型评估和可扩展的多模态强化学习奖励服务。我们的实验表明，当前的前沿多模态大语言模型距离解决“氛围构建”代理任务仍有很长一段路要走，即使是 GPT-5.5 和 Qwen3.8-Max 的成功率也低于 60%，其瓶颈在于精确的三维世界编辑。我们进一步发现，强化学习训练可以缓解这一弱点，甚至使开源多模态大语言模型超越闭源前沿模型：我们的 VibeWorlder-8B 与前沿多模态大语言模型相当，而我们的旗舰模型 VibeWorlder-30B-A3B 在所有评估模型中获得了最佳的整体 Pass@1 指标。", "title_cn": "VibeWorlding：多模态智能体能否端到端构建 3D 开放世界？", "interpret": "面对现有研究多依赖理想化简单查询来评估多模态智能体在构建 3D 开放世界的短板，学者提出了\"VibeWorlding\"统一框架。该框架旨在训练能够自主理解用户意图、规划场景布局、调用 3D 工具并进行多轮反馈反思的智能体。为此，研究构建了包含 2616 个高精度 3D 资产、323 个人工标注种子世界及 6828 个反向合成多模态查询的\"VWE-BENCH\"基准测试集。这一工作填补了系统分析智能体在复杂交互中如何处理图文 3D 信息的空白，不仅验证了端到端构建开放世界的可行性，更为未来多模态大模型在虚拟环境中实现自然交互提供了关键评估标准与应用场景。", "interpret_v": 3, "num": 115}, {"title": "ForgeWM：面向少步动作条件视频世界模型的渐进式因果训练", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "世界模型", "ts": "2026-08-14T15:13:34+08:00", "date": "2026-08-14", "weekday": "周五", "summary": "ForgeWM 提出一种渐进式框架，将双向动作条件视频生成器转化为高效的少步世界模型，通过域适应、教师强制因果训练、因果一致性蒸馏及与双向教师模型的在线策略分布匹配，得到稳态去噪预算为 1、2、4 步的专用学生模型。", "link": "https://arxiv.org/abs/2608.14022", "points": {"类别": "方法 本文提出一种渐进式因果训练框架，用于构建少步动作条件视频世界模型。", "背景": "现有因果蒸馏方法难以将离散键鼠状态对齐至压缩潜在块，导致交互式世界模型生成困难。", "贡献": "通过教师强加训练与因果一致性蒸馏，实现多阶段低延迟生成及回放时精化协议。", "合理性": "基于 Minecraft 轨迹验证效果显著，方法逻辑自洽但通用性仍待进一步验证。", "清晰度": "摘要结构分明，技术细节描述清晰，实验结果支撑有力且易于理解。"},
