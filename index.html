const DATA = {"records": [{"title": "数据约束下的混合预训练缩放定律", "source": "Apple Machine Learning Research（RSS）", "sourceShort": "Apple Machine Learning Research", "hue": 209, "domain": "LLM", "ts": "2026-08-20T08:00:00+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "苹果机器学习研究团队通过2000余次语言模型训练实验，系统研究了稀缺目标数据与通用数据混合预训练中的权衡问题。研究发现，目标数据占比过低会导致模型对目标领域暴露不足，而占比过高则因重复样本过多引发收益递减乃至过拟合，为数据约束下的混合预训练策略提供了量化依据。", "link": "https://machinelearning.apple.com/research/scaling-laws-mixture-pretraining", "points": {"类别": "实证研究，系统验证混合预训练中目标数据比例的黄金平衡点。", "背景": "源于大模型训练中稀缺垂直数据利用效率低与通用数据过拟合的矛盾。", "贡献": "通过两千余次实验揭示目标数据占比过高导致收益递减并引发过拟合。", "合理性": "大量实证数据支撑结论，量化模型对领域暴露不足与重复样本影响的界限可信。", "清晰度": "摘要逻辑严密，明确呈现问题、发现及意义，表达清晰专业无歧义。"}, "kind": "paper", "abstract": "苹果机器学习研究团队通过2000余次语言模型训练实验，系统研究了稀缺目标数据与通用数据混合预训练中的权衡问题。研究发现，目标数据占比过低会导致模型对目标领域暴露不足，而占比过高则因重复样本过多引发收益递减乃至过拟合，为数据约束下的混合预训练策略提供了量化依据。", "abstract_cn": "苹果机器学习研究团队通过2000余次语言模型训练实验，系统研究了稀缺目标数据与通用数据混合预训练中的权衡问题。研究发现，目标数据占比过低会导致模型对目标领域暴露不足，而占比过高则因重复样本过多引发收益递减乃至过拟合，为数据约束下的混合预训练策略提供了量化依据。", "interpret": "针对当前人工智能领域通用知识与特定领域知识平衡难的问题，苹果机器学习团队通过分析超过 2000 次实验，系统揭示了在稀缺目标数据与海量通用数据混合预训练中的关键规律。研究表明，数据比例并非线性关系：若目标领域数据占比过低，模型难以充分掌握专业知识；而若占比过高，大量重复样本会引发收益递减甚至导致过拟合。这一量化发现为构建高效模型提供了新依据，意味着在实际应用中，通过优化混合数据策略，既能在保证基础能力的同时，显著提升模型在特定场景下的表现，推动大模型从“通用智能”向“垂直领域专家”的精准演进。", "interpret_v": 3, "num": 1}, {"title": "Pre-Compiled Pipeline Shards for Distributed LLM Inference on Intel AI PC Fleets", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-20T01:33:28+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Modern Intel AI PCs ship capable integrated GPUs and NPUs with 16+ GB of unified memory, and they spend considerable time idle. That is not enough memory to fit a large model such as a 70B-paramete…", "link": "https://arxiv.org/abs/2608.19147", "points": {"类别": "系统，提出利用 Intel AI PC 集群通过流水线并行执行大模型的方法。", "背景": "解决单机显存不足无法加载大模型及现有高并发推理系统效率受限的问题。", "贡献": "提出预编译流水线分片方案，通过注入特定优化与微批处理实现高性能推理。", "合理性": "技术路径可行，通过对比实验验证了该方案能显著提升多用户并发吞吐与交互延迟。", "清晰度": "摘要逻辑严密，实验数据详实，开源代码附随使得复现与理解过程清晰明确。"}, "kind": "paper", "title_cn": "用于在 Intel AI PC 舰队上进行分布式大语言模型推理的预编译流水线分片", "summary_cn": "现代 Intel AI PC 配备了具有 16+ GB 统一内存的 capable 集成 GPU 和 NPU，但它们大部分时间处于闲置状态。内存总量不足以容纳像 70B 参数规模这样的大型模型……", "abstract": "Modern Intel AI PCs ship capable integrated GPUs and NPUs with 16+ GB of unified memory, and they spend considerable time idle. That is not enough memory to fit a large model such as a 70B-parameter LLM. We show that a handful of AIPCs, working together over an ordinary network, can serve models beyond the capability of any single one. We use pipeline parallelism: a model is split by layer into per-stage shards, each pre-compiled into an OpenVINO graph, so that every machine runs one shard and passes activations to the next. Three techniques make this fast enough to be useful. First, we recover the speed of the unsplit model: a naive per-stage export runs well below monolithic inference because it misses an OpenVINO GPU optimization, and injecting a beam_idx Gather into each shard triggers that optimization (the IndirectKVCache fusion) and brings the shards to parity. Second, we leverage speculative decoding on stateful OpenVINO models. Third, the pipeline serves several users at once by interleaving their requests across the stages, each request carrying its own cache (micro-batching). Together, a two-node Llama 3.1 8B INT4 pipeline serves two concurrent users at 1.79x the single-user throughput of the unsplit model on the same hardware, and the gap widens under simulated wide-area latency. The same design scales to a 70B model that no single fleet member can hold: a four-node deployment of Lunar Lake AI PCs on Intel Tiber Cloud serves a single user at interactive speed, with output token-for-token identical to the same four-node pipeline decoding without speculation. Code, raw benchmark logs, and reproduction scripts ship as a self-contained package at https://github.com/labscommunity/pipeline-sharded-inference-paper (in the top-level reproduction/ directory).", "abstract_cn": "现代 Intel AI PC 配备具备 16GB 以上统一内存的集成 GPU 和 NPU，但闲置时间较长，且内存不足以容纳 700 亿参数这样的大型模型。我们展示了少量 AI PC 在普通网络上协同工作即可运行超出单台设备能力范围的模型，该方法利用流水线并行性将模型按层切分为预编译为 OpenVINO 图形的各阶段片段，使每台机器运行一个片段并传递激活状态给下一阶段。三种技术使其速度达到实用水平：首先，通过注入 beam_idx Gather 操作触发 OpenVINO GPU 优化（IndirectKVCache 融合），恢复了未拆分模型的推理速度；其次，利用状态型 OpenVINO 模型的推测解码；第三，通过在各阶段交错请求并携带独立缓存（微批量）实现多用户并发服务。实验表明，两台节点的 Llama 3.1 8B INT4 流水线在同一硬件上使双用户吞吐量达到单用户模式 1.79 倍，在模拟广域网延迟下该优势进一步扩大；同一设计可扩展至单台无法完整加载的 70B 模型，四台 Lunar Lake AI PC 在 Intel Tiber Cloud 上即可实现交互式速度，其输出 token 与同规模无推测解码流水线完全一致。代码、原始基准日志及复现脚本已作为自包含包发布至 GitHub 仓库。", "featured_date": "2026-08-20", "interpret": "现代 Intel AI PC 虽集成显卡/NPU 内存充足，但单个设备难以加载 700 亿参数等大模型且闲置率高。本研究提出“预编译流水线分片”方案，将大模型按层拆分为各节点运行一段的“分片”，通过普通网络协同推理。核心方法包括：恢复因拆分而丢失的 OpenVINO 优化性能（如间接 KV 缓存融合）、利用状态模型进行推测解码，以及通过交错请求与微批量技术实现多用户并发。实验表明，双节点部署的 Llama 3.1 8B 模型吞吐量是单用户模式的 1.79 倍；四节点部署的 70B 模型虽单个设备无法承载，却能实现交互式推理速度。该方案有效利用闲置算力，显著降低了大模型落地门槛。", "interpret_v": 3, "num": 2}, {"title": "Tuning the Stochastic Machine: A Systems Engineer's Operating Model for Human-AI Engineering", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-20T01:18:53+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "When an expert corrects an LLM assistant's error, the correction usually dies with the session, and the error class returns. I argue this is an operations problem, not a tooling problem: mechanisms…", "link": "https://arxiv.org/abs/2608.19125", "points": {"类别": "方法，提出基于系统工程视角的七原则人类 -AI 协作操作规范。", "背景": "针对专家修正大语言模型错误后无法留存导致问题复发的操作管理难题。", "贡献": "构建融合版本追踪与错误循环的系统化治理框架以解决模型错误固化。", "合理性": "将成熟工业流程映射至随机生成系统具有逻辑自洽性，但需实证验证核心机制。", "清晰度": "结构严密从问题根源推导至测量框架，语言专业且指代明确清晰。"}, "kind": "paper", "title_cn": "调谐随机机器：人机工程系统的工程师运作模型", "summary_cn": "当专家纠正大语言模型助手的错误时，该纠正通常随会话结束而消失，错误类别随之复发。我认为，这并非工具问题，而是一个操作问题：机制……", "abstract": "When an expert corrects an LLM assistant's error, the correction usually dies with the session, and the error class returns. I argue this is an operations problem, not a tooling problem: mechanisms for persisting corrections exist and are shipping, but the discipline for governing them -- versioning with provenance, recurrence monitoring, counter-metrics, retirement of stale rules -- does not. Writing as a systems engineer of thirty years, I map the LLM stack onto the machines my profession already operates (frozen silicon, firmware, loadable modules, persistent configuration, volatile memory), identify where the mapping fails (stochastic generation, configuration that binds only probabilistically, no general-purpose retirement (verification) stage by default), and derive from the failures a seven-principle operating discipline with an error loop at its core. Three cases from my own practice illustrate the mechanism, among them a control that silently became the exact harm it was built to prevent. I close with the measurement framework this view implies and the lab study required to test it.", "abstract_cn": "当专家纠正大语言模型助手的错误时，该纠正通常随会话消失而失效，且错误类别卷土重来。我认为这是操作问题而非工具问题：用于持久化纠正的机制已存在并正在发布，但治理它们的纪律——即包含溯源版本控制、重复性监测、反向指标以及过期规则退役——则尚未建立。作为一名拥有三十年经验系统工程师，我将大语言模型栈映射到本职业已操作的机器（冻结硅片、固件、可加载模块、持久化配置、易失性存储器）上，识别映射失效之处（随机生成、仅概率性绑定的配置、默认缺乏通用的退役或验证阶段），并从这些失效中推导出一个以错误循环为核心的七项原则操作纪律。我通过来自本人实践的三个案例阐释该机制，其中包括一个本应防止危害的控制却悄无声息地变成了该危害本身。最后，我提出了该视角所蕴含的测量框架以及必要的实验室研究来对其进行验证。", "interpret": "当前大语言模型（LLM）的应用常面临一个顽疾：专家人工修正的错误往往随会话结束而失效，同类错误随即复发。作者指出，这并非工具开发不足，而是缺乏一套严谨的系统工程治理范式。文章基于作者三十年的系统工程经验，将 LLM 堆栈映射至传统的“冻结硅片”、“固件”及“持久配置”等成熟架构，精准剖析了从概率生成、模糊配置到缺乏通用退役机制的映射断层。据此，文章提出了一套包含错误循环在内的七项核心操作原则。这一研究为将 AI 从实验性工具转化为可稳定运维的工程化资产提供了关键路径，有助于解决行业长期存在的知识流失与重复犯错问题，推动人机协作进入标准化、可迭代的新阶段。", "interpret_v": 3, "num": 3}, {"title": "JANUS: A Multi-modal Foundation Neural Sampler for Disordered Materials", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-20T01:11:03+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Many problems in disordered materials require sampling beyond fixed composition and volume, where coupled changes in atomic identities and structure create a prohibitively expensive discrete-contin…", "link": "https://arxiv.org/abs/2608.19116", "points": {"类别": "方法，提出结合离散与连续扩散的多模态神经采样新框架。", "背景": "无序材料中成分体积耦合变化导致离散连续采样成本过高难以解决。", "贡献": "无需预生成数据即可实现高效采样，并支持热力学性质与反向设计任务。", "合理性": "方法基于能量评估直接训练且经多体系验证，仅在离散连续耦合机制上存在理论挑战。", "清晰度": "摘要逻辑严密，先定义问题再介绍方法并列举具体系统验证，结构层次分明。"}, "kind": "paper", "title_cn": "JANUS：用于无序材料的模态基础神经采样器", "summary_cn": "无序材料中的许多问题需要超越固定组分和体积的采样，其中原子身份和结构的耦合变化造成了禁止性的离散连续计算开销。", "abstract": "Many problems in disordered materials require sampling beyond fixed composition and volume, where coupled changes in atomic identities and structure create a prohibitively expensive discrete-continuous sampling problem. Here we introduce JANUS, a multimodal neural sampler that couples continuous and masked discrete diffusion through an equivariant graph neural network trained directly from energy evaluations, without pre-generated equilibrium data. In benchmark Ising and isobaric $ΔμNPT$ alloy systems, JANUS reproduces reference Monte Carlo equilibrium observables and recovers free energies and phase behavior with more than three orders of magnitude fewer energy evaluations. In multicomponent alloys, JANUS enables conditional steering toward prescribed chemical short-range order and enhanced bulk modulus and, when coupled to a large language model evolutionary agent, performs efficient inverse design for balanced optical and mechanical properties. In semiconductors like silicon and diamond, JANUS explores vacancies and dopants spanning 15 elements in grand-canonical $μVT$ ensembles, recovers established defects including the silicon $E$ centre, and identifies new candidate defect pairs and triplets for quantum engineering, including S-Ti in silicon and B-O-O in diamond, with deep in-gap states validated by hybrid-functional density functional theory. By unifying discrete site identities with continuous structural and volumetric relaxation, JANUS provides a foundation for thermodynamic sampling, characterization and inverse design of chemically disordered materials.", "abstract_cn": "无序材料中的许多问题需要超越固定成分和体积的采样，而原子身份与结构的耦合变化导致了极其昂贵的离散 - 连续采样难题。此处我们介绍了 JANUS，一种通过等变性图神经网络将连续扩散与掩码离散扩散相结合的多模态神经采样器，该网络直接从能量评估中训练，无需预生成的平衡数据。在基准 Ising 和等温等压 μVT 合金系统中，JANUS 复现了参考蒙特卡洛平衡可观测量，并仅需比参考方法多三个数量级更少的能量评估即可恢复自由能和相变行为。在多组分合金中，JANUS 能够实现向预定短程化学秩序的定向调控，并增强整体弹性模量；当与大语言模型进化代理耦合时，它能够针对平衡的光学与机械性能进行高效的逆向设计。在硅、金刚石等半导体中，JANUS 在大正则 μVT 系综中探索跨越 15 种元素的空位与掺杂剂，复现了包括硅 E 中心等在内的已知缺陷，并识别出包括硅中 S-Ti 及金刚石中 B-O-O 等在内的新型候选缺陷对与三元组，其深能级态已通过混合泛函密度泛函理论验证。通过统一离散的站点身份与连续的结构及体积弛豫，JANUS 为化学无序材料的热力学采样、表征及逆向设计奠定了基础。", "interpret": "无序材料研究常面临一个难题：原子种类与结构需同步调整时，传统采样代价过高。为此，科研团队提出 JANUS 模型，它利用等变性图神经网络，通过连续扩散与掩码离散扩散的耦合，直接在能量评估中训练，无需预先准备平衡态数据。在等温伊辛模型及等压系综合金系统中，JANUS 成功复现参考蒙特卡洛观测值，并精准还原自由能及相变行为。最令人瞩目的是，其效率较传统方法提升三个数量级以上，大幅减少了昂贵的能量计算。此外，JANUS 还能在多组分合金中引导特定的化学短程有序，增强体弹性模量。该成果不仅为材料发现提供了高效新工具，更与进化算法结合后展现出更广阔的探索潜力，有望加速下一代高性能材料的设计过程。", "interpret_v": 3, "num": 4}, {"title": "DA-WAM: Decision-Aligned Future Latents for Driving World Models", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-20T00:33:02+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Anticipating how scenes evolve under ego actions is fundamental to safe autonomous driving, yet the full potential of world models for decision-making remains unrealized. The critical challenge lie…", "link": "https://arxiv.org/abs/2608.19085", "points": {"类别": "系统，提出将预测表示学习与轨迹规划统一决策的新框架。", "背景": "自动驾驶世界模型因预测结果无法指导决策选择而未能发挥决策潜力。", "贡献": "提出 DA-WAM 框架，实现预测、动作条件化建模与打分的一体化目标演化。", "合理性": "方法通过在线编码器与硬负样本监督确保表示可信度且实验结果稳健。", "清晰度": "摘要逻辑层层递进，从问题根源到具体机制再到验证结果结构清晰。"}, "kind": "paper", "title_cn": "DA-WAM：面向驾驶世界模型的决策对齐未来潜变量", "summary_cn": "预测自驱行为下场景的演变对于确保自动驾驶安全至关重要，但世界模型在决策中的全部潜力尚未充分发挥。关键挑战在于……", "abstract": "Anticipating how scenes evolve under ego actions is fundamental to safe autonomous driving, yet the full potential of world models for decision-making remains unrealized. The critical challenge lies in ensuring that future modeling is not merely predictive, but decision-informative: the predicted future must directly shape which trajectory is selected. Existing approaches decouple future representation learning from planning optimization, or share predicted states across trajectory candidates, thereby diluting the action-specific consequences that ought to guide selection. To bridge this gap, we propose DA-WAM, a framework that unifies predictive representation learning, action-conditioned future modeling, and trajectory scoring under a single decision-making objective. DA-WAM maintains predictive supervision throughout planner optimization via an online encoder and a stable momentum target, allowing future representations to co-evolve with the driving task. An action-conditioned predictor generates a distinct future latent state per trajectory candidate, which is then evaluated by a future-latent-conditioned factorized scorer. For the expert-matched trajectory, the predicted future latent is supervised by the observed future representation, while safety-critical hard negatives provide additional supervision near planning boundaries. Extensive experiments on NAVSIM-v1 and NAVSIM-v2 demonstrate state-of-the-art performance, while ablations and diagnostic analyses validate the key components.", "abstract_cn": "预测在自身动作影响下场景的演变对于安全自动驾驶至关重要，但世界模型在决策中的潜力尚未充分发挥。关键挑战在于确保未来建模不仅具有预测性，更能提供决策信息：预测的未来必须直接塑造轨迹的选择。现有方法将未来表征学习与规划优化解耦，或在候选轨迹间共享预测状态，从而稀释了本应指导选择的行动特异性后果。为此，我们提出 DA-WAM 框架，在单一决策目标下统一了预测表征学习、行动条件化未来建模和轨迹评分。DA-WAM 通过在线编码器和稳定的动量目标在规划优化过程中保持预测监督，使未来表征与驾驶任务共同演化。行动条件化预测器为每个候选轨迹生成独特的未来潜变量，随后由未来潜变量条件化的因子化评分器进行评估。对于专家匹配轨迹，预测的未来潜变量受观测未来表征监督，而安全性关键的高难度负样本则在规划边界附近提供额外监督。在 NAVSIM-v1 和 NAVSIM-v2 上的广泛实验证明其达到了最先进的性能，消融研究和诊断分析验证了关键组件的有效性。", "featured_date": "2026-08-20", "interpret": "自动驾驶能否安全行驶，关键在于能否预判车辆动作将导致的环境演变。然而，现有的世界模型往往将“预测未来”与“规划决策”割裂，导致生成的未来场景无法精准指导路径选择。为此，本文提出了 DA-WAM 框架，旨在统一预测学习与决策目标。该方法通过在线编码器与动量目标，让未来表征与驾驶任务同步进化，为每条候选轨迹生成独特的未来隐状态，并利用专用评分器进行精细化评估。实验表明，DA-WAM 在 NAVSIM 数据集上达到最优表现。其核心贡献在于打通了从场景预测到决策优化的闭环，使自动驾驶系统不仅能“看见”未来，更能“理解”动作后果，从而显著提升规划的安全性与效率。", "interpret_v": 3, "num": 5}, {"title": "When Readability and Source Retention Diverge: An Evaluability Gap in AI Translation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-20T00:32:47+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Readable AI output can leave an evaluability gap: even when the source is shown, an overall-quality judgment may not reflect what an output preserves. We investigated how source-text condition and…", "link": "https://arxiv.org/abs/2608.19083", "points": {"类别": "实证研究", "背景": "探讨当翻译输出易读性与原文保留率背离时，源文本对质量判断与信任度的影响机制。", "贡献": "通过双因素实验揭示源文本条件与渲染方式的交互效应，并构建评估 - 结构模型。", "合理性": "采用大样本对照实验验证假设，数据驱动结论，但依赖自陈式量表存在主观偏差。", "清晰度": "逻辑层层递进，从实验发现到理论建模，结构清晰且专业术语使用规范。"}, "kind": "paper", "title_cn": "当可读性与源文本保留度出现分歧：AI 翻译中的可评估性缺口", "summary_cn": "AI 生成的可读性输出可能导致评估性缺口：即使展示了源文本，整体质量判断也不一定能反映所保留的内容。我们研究了源文本条件……", "abstract": "Readable AI output can leave an evaluability gap: even when the source is shown, an overall-quality judgment may not reflect what an output preserves. We investigated how source-text condition and output rendering relate to perceived translation quality, and how output and system appraisals relate to trust and stated disclosure willingness in a plain-text interface. A focal 2 * 2 comparison (N=306) using TransLingo examined simple generated narratives and complex literary-philosophical prose alongside LLM-generated readability-oriented outputs and researcher-revised fidelity-oriented outputs. A descriptive stimulus audit indicated greater source retention in fidelity-oriented outputs in both source-text conditions. Factorial analyses showed a significant rendering-by-source-text-condition interaction in perceived quality. Participants rated fidelity-oriented outputs higher than readability-oriented outputs for the simple narratives, whereas no reliable rendering difference emerged for the complex prose. A corresponding source-condition-dependent pattern was observed for perceived intelligence, agency-oriented anthropomorphic attribution, and task-performance trust. A separate theory-ordered appraisal-structure SEM characterized concurrent associations among perceived quality, perceived intelligence, agency-oriented anthropomorphic attribution, task-performance trust, and stated disclosure willingness across six domains, with task-performance trust as the proximal correlate of stated willingness. The observed rating pattern distinguishes source access from source evaluability: for the complex stimuli, displaying the source did not ensure that one overall-quality rating reflected differences in retained content. It also separates support for evaluating translation output from data-handling support for decisions about what personal text to entrust to a system.", "abstract_cn": "可读性的 AI 生成输出可能引发可评估性缺口：即使显示了源文本，整体质量判断也不一定能反映输出保留的内容。本研究考察了源文本条件与输出呈现形式对感知翻译质量的影响，以及输出评价与系统评估在纯文本界面下对信任度和披露意愿的影响。利用 TransLingo 进行 2*2 对比实验（N=306），研究者对简单生成叙事、复杂文学哲学文本以及大型语言模型生成的侧重可读性输出、研究修订的侧重保真度输出进行了比较。描述性刺激审计显示，在两种源文本条件下，侧重保真度的输出具有更高的源文本保留度。因素分析结果显示感知质量存在显著的呈现形式与源文本条件的交互效应：参与者对简单叙事中的侧重保真度输出评分更高，而在复杂文本中未观察到呈现形式的可靠差异。对感知智能、拟人化主体归因及任务表现信任的评估也呈现出与源文本条件相关的模式。另一项基于理论排序的评估结构潜在变量模型刻画了感知质量、感知智能、拟人化主体归因、任务表现信任与陈述性披露意愿在六个领域间的并发关联，其中任务表现信任是陈述意愿的近端相关指标。观察到的评分模式区分了“获取源文本”与“评估源文本”：对于复杂刺激，显示源文本并不能保证整体质量评分能反映保留内容上的差异。这也将“支持翻译输出的评估”与“支持关于将个人文本委托给何种系统的决策的数据管理”区分开来。", "interpret": "当翻译追求“易读性”时，即便展示原文，用户也常难以准确判断译文质量，这形成了所谓的“可评估性缺口”。本研究以 TransLingo 为例，通过对比“面向易读性的 AI 生成”与“保真度优先的修订版”，探讨了来源文本条件如何影响感知质量与信任度。研究发现，虽然保真度版本在来源文本中保留了更多原意，但其产生的交互效应表明，译文的可读性并不直接等同于用户对其质量的认可。这一发现揭示了一个关键影响：过度优化读性的 AI 输出可能导致用户对译文实际内涵的误判，削弱了对内容准确性的信任及透明披露意愿。对于追求人机协作与透明治理的研究者而言，平衡可读性与保真度，并明确告知用户 AI 的存在，是提升翻译信任的关键。", "interpret_v": 3, "num": 6}, {"title": "What is Missing from AI Post-Training AI: An Empirical Analysis", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-20T00:17:39+08:00", "date": "2026-08-20", "weekday": "周四", "summary": "Large language model (LLM) agents can now post-train an LLM end-to-end. They can write code, launch training, evaluate checkpoints, and improve downstream performance, raising the prospect of AI-fo…", "link": "https://arxiv.org/abs/2608.19072", "points": {"类别": "实证研究，通过数据分析揭示 AI 自训练中的执行与策略能力差异。", "背景": "针对当前 AI 能否自主迭代训练的假设，质疑其对策略调整能力的低估。", "贡献": "发现训练策略在初期即锁定，提出经验、引导与推理无法解决策略僵化问题。", "合理性": "基于大量公开轨迹证据，实验设计严谨，指出的机制缺失假设合理可信。", "清晰度": "逻辑严密，层层递进解释现象根源，结构清晰且论证过程通俗易懂。"}, "kind": "paper", "title_cn": "AI 后训练 AI 缺失了什么：一项实证分析", "summary_cn": "大型语言模型（LLM）代理现已能够对整个系统进行 AI 后训练。它们可以编写代码、启动训练、检查点评估并提升下游性能，从而提升了 AI 进化的前景。", "abstract": "Large language model (LLM) agents can now post-train an LLM end-to-end. They can write code, launch training, evaluate checkpoints, and improve downstream performance, raising the prospect of AI-for-AI. We argue that this picture conflates two distinct capabilities: execution-level capability, iterating within a selected training strategy; and strategy-level capability, revising the high-level judgment as experimental evidence accumulates. Analyzing a large corpus of publicly released post-training trajectories, we find that across different tasks, the agent's training strategy is locked in at the very beginning, and the entire remaining budget is spent on local adjustments within the selected strategy. We then examine three natural explanations--missing experience, missing guidance, and insufficient reasoning--with escalating interventions. Extensive experiments show that (1) an experience-driven scaffold improves execution across the board (+12.6 points on GSM8K and +40.8 on HumanEval) but leaves the strategy static; (2) human guidance effectively redirects the initial strategy, yet the agent falls back into local adjustment loops once training starts; and (3) additional inference compute pays off on easier tasks but yields almost no gain on the hardest one. In conclusion, what agents lack is neither experience, guidance, nor reasoning compute, but a mechanism for spontaneously reevaluating their strategy during execution.", "abstract_cn": "大型语言模型（LLM）代理现在可以实现对 LLM 的全程后训练，包括编写代码、启动训练、评估检查点以及提升下游性能，这开启了 AI 为 AI 的前景。我们认为，这一图景混淆了两种截然不同的能力：在选定训练策略内迭代的执行级能力，以及随着实验证据积累而修订高层判断的策略级能力。通过对大量公开发布的后训练轨迹进行分析，我们发现，无论任务如何，代理的训练策略在极早期即被锁定，剩余的全部预算仅用于在选定策略内的局部调整。随后，我们评估了三种自然解释（缺失经验、缺失指导和推理不足），并辅以逐级强化的干预措施。大量实验表明：（1）经验驱动的脚手架全面提升了执行效果（GSM8K 提升 12.6 分，HumanEval 提升 40.8 分），但使策略保持静态；（2）人类指导能有效重新定向初始策略，但一旦训练开始，代理便会陷入局部调整循环；（3）额外的推理计算在简单任务上有效，但在最难的任务上几乎无增益。总之，代理缺乏的并非经验、指导或推理计算量，而是一种在运行中自发重新评估其策略的机制。", "interpret": "大语言模型（LLM）代理已能实现端到端的“后训练”能力，通过编写代码、运行训练并迭代优化，催生了\"AI 为 AI\"的新前景。然而，现有研究常混淆两种关键能力：一种是在既定策略下进行微调的执行级能力，另一种是基于新证据修正高层策略的自主策略级能力。分析大量公开的后训练轨迹发现，代理往往在起始阶段就锁定策略，随后将全部算力浪费在局部调整上。实验进一步指出，这源于经验缺失、引导不足或推理能力薄弱。该研究通过验证三种干预措施，揭示了当前 AI 训练的僵化症结：若缺乏对高层策略的动态规划与试错引导，AI 将沦为机械执行者，难以真正突破性能瓶颈。这对未来构建具备自我进化能力的通用人工智能至关重要。", "interpret_v": 3, "num": 7}, {"title": "LT-Mem: Volatility-Aware Spatio-Temporal Memory for Lifelong Scene Understanding", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-19T23:56:53+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Long-term robot operation in evolving environments requires object-level understanding that persists across repeated revisits. Existing systems either overwrite history to maintain an up-to-date ma…", "link": "https://arxiv.org/abs/2608.19059", "points": {"类别": "系统方法", "背景": "机器人重访场景中存在因遗忘历史数据导致的物体身份不一致问题。", "贡献": "提出基于波动感知的多会话 SLAM 与记忆进化框架，引入三元结构保留状态与事件历史。", "合理性": "假设通过证据评分与波动策略平衡覆盖与保留，实验数据证明架构优于单纯增加模型容量。", "清晰度": "逻辑层层递进，从问题定义到核心机制及数据集构建，结构清晰且重点突出。"}, "kind": "paper", "title_cn": "LT-Mem：感知波动性的时空记忆用于终身场景理解", "summary_cn": "在不断演变的长期机器人操作中，需要能够跨越多次重复回访而持续的对象层级理解；现有系统要么在保持数据最新的情况下重写历史记录，要么...", "abstract": "Long-term robot operation in evolving environments requires object-level understanding that persists across repeated revisits. Existing systems either overwrite history to maintain an up-to-date map or store semantic snapshots without consistent cross-session object identity, resulting in temporal amnesia: the systematic loss of object history that prevents answering queries such as \"Where has the green chair been across all sessions?\" We propose LT-Mem, a volatility-aware memory evolution framework that unifies spatially aligned instance-level 3D perception with volatility-conditioned temporal reasoning. First, a multi-session SLAM backbone provides spatially aligned per-object observations across sessions. Second, a reasoning layer governs how object memory evolves: deterministic evidence scoring preserves cross-session identity, and a volatility-aware policy selects among overwrite, hold, and multi-hypothesis actions based on each object's dynamics. Third, the resulting Tri-Memory structure (Live, Delta, Meta) preserves both current states and event histories, enabling longitudinal object-centric reasoning. We further introduce LT-VQA, a dataset and evaluation suite comprising multi-session recordings, persistent identity annotations, and temporal QA pairs. Experiments show that LT-Mem consistently outperforms baselines across all metrics while consuming an order of magnitude fewer tokens, and ablations confirm that gains are driven by the structured memory architecture rather than LLM capacity.", "abstract_cn": "在演化的环境中进行长期机器人操作，需要能够在重复回访中保持持久的对象级理解。现有系统要么更新历史记录以维护最新地图，要么存储语义快照而缺乏跨会话的对象身份一致性，导致了时间性遗忘：即系统性地丧失对象历史，从而无法回答诸如“绿色椅子在所有会话中都在哪里？”这样的查询。我们提出了 LT-Mem，一个感知波动性的记忆演化框架，它将空间对齐的实例级 3D 感知与波动性条件的时间推理统一起来。首先，多会话 SLAM 骨干提供了跨会话的对象级对齐观测。其次，推理层规定了对象记忆如何演化：确定性证据评分用于保持跨会话身份，而波动性感知策略根据每个对象的动力学在重写、保留和多假设行动中进行选择。第三，产生的三记忆结构（实时、差值、元数据）既保留了当前状态又保留了事件历史，从而实现了纵向的以对象为中心的推理。我们还引入了 LT-VQA，一个包含多会话录制、持久身份标注和时间查询对的数据集及评估套件。实验表明，LT-Mem 在所有指标上均优于基线，且消耗的 token 数量减少了一个数量级，消融实验证实性能提升归功于结构化记忆架构而非大模型能力。", "interpret": "在机器人长期作业中，面对不断变化的环境，如何让物体信息在多次重返任务中保持连贯，是当前机器人学的一大挑战。现有系统往往因过度更新地图而遗忘历史，或因存储静态快照而无法识别同一物体的跨会话身份，导致“时间失忆症”，难以回答诸如“绿色椅子在历次访问中的轨迹”等关键问题。\n\n为了解决这一难题，LT-Mem 提出了一种具有波动感知能力的时空记忆进化框架。该方案首先利用多会话同步定位与建图（SLAM）技术，实现跨会话的物体级空间对齐观察。核心突破在于其推理层，通过确定性证据评分确保物体身份的一致性，并引入波动感知策略，智能判断是更新、保留还是覆盖已有记忆。这一机制有效平衡了地图的时效性与历史完整性，赋予机器人类似人类的长期记忆能力，显著提升了机器人在复杂动态环境中的自主导航与场景理解水平，为构建真正具备长期规划能力的服务机器人奠定了坚实基础。", "interpret_v": 3, "num": 8}, {"title": "Self-prompting and cross-model consensus enable reproducible data extraction from scientific literature with large language models", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-19T23:20:11+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Accurately extracting nuanced, contextualized data from research articles is laborious and time intensive. Here, we investigate the performance of frontier, browser-based large language models (LLM…", "link": "https://arxiv.org/abs/2608.19025", "points": {"类别": "方法论文", "背景": "解决从科研文献中准确提取含上下文细节数据的劳动密集型难题。", "贡献": "提出自提示与跨模型共识方法，实现了无需专家干预的数据提取。", "合理性": "自提示提升效率但依赖人工复核，跨模型验证需解决引用发现难题。", "清晰度": "逻辑递进展示四种工作流，结构清晰且实验对比直接明了。"}, "kind": "paper", "title_cn": "自提示与跨模型共识使大语言模型能够从科学文献中提取可复现的数据", "summary_cn": "准确从研究文章中提取细微且上下文关联的数据是一项耗时且劳动密集型的任务。在此，我们探讨了前沿、基于浏览器的……", "abstract": "Accurately extracting nuanced, contextualized data from research articles is laborious and time intensive. Here, we investigate the performance of frontier, browser-based large language models (LLMs) to extract highly contextualized information. We demonstrate four escalating workflows, 1) given an expert curated prompt and research articles, most frontier LLMs perform well at data extraction, however can struggle with interpreting scientific context and nuance, 2) given simple instructions, LLMs can author their own prompts which were almost as eNective as expert-written prompts, 3) autonomous discovery of research literature was diNicult, agents either missed or hallucinated references, and 4) LLMs can create new datasets from published guidelines that closely match human-expert judges, but still require a human-in-the-loop. Together, these findings define an auditable division of labour in which experts specify the evidence standard, models cross-check repeated extractions and researchers resolve disputed cases, providing a practical route to scaling scientific data curation without relinquishing expert oversight.", "abstract_cn": "准确从研究文章中提取细致、背景化的数据既耗时又费力。本文探讨了最先进的基于浏览器的生成式大语言模型提取高度背景化信息的性能。我们展示了四种递进的工作流：首先，在专家定制的提示词和研究文章配合下，大多数先进大语言模型擅长数据提取，但在解读科学背景和细微之处方面表现不佳；其次，在简单指令下，大语言模型能自主生成提示词，其效果几乎等同于专家撰写的提示词；第三，大语言模型的自主科研文献发现较为困难，代理往往会遗漏或捏造参考文献；第四，大语言模型可以依据已发布的指南创建新数据集，其结果与人类专家评估者高度一致，但仍需人机协同。这些发现确立了一种可审计的分工模式：专家规定证据标准，模型进行交叉验证重复提取，研究人员解决争议案例，从而提供了一条在保留专家监督的前提下规模化科学数据整理的切实路径。", "interpret": "准确从科研论文中提炼细微且语境化的数据，传统上是一项耗时费力的工作。本研究利用前沿浏览器版大语言模型（LLM），探索了其信息提取能力。研究揭示了四种递进式工作流：首先，给定专家精心撰写的提示词，大多数先进 LLM 能高效提取数据，但在理解科学语境与细微差别方面表现欠佳；其次，面对简单指令，LLM 能自主生成提示词，其效果几乎媲美专家编写；然而，让 LLM 自主发现研究文献仍具困难，智能体常出现漏检或“捏造”文献的现象；最后，LLM 虽能基于既有指南创建高度匹配专家判断的新数据集，但仍需人工监督介入。这些发现确立了 LLM 在数据提取中的可审计能力边界，为未来如何更可靠地利用人工智能辅助科学研究提供了明确指引。", "interpret_v": 3, "num": 9}, {"title": "From Threat Intelligence to Detection: Knowledge-driven Enrichment and Template-based Rule Grounding for Automated Sigma Rule Generation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-19T23:11:43+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Mechanisms for dynamically converting cyber threat intelligence (CTI) into actionable detection capabilities are necessary due to the rapid evolution of Advanced Persistent Threats (APTs). Sigma ru…", "link": "https://arxiv.org/abs/2608.19011", "points": {"类别": "方法", "背景": "应对高级持续性威胁动态演进，提升传统 Sigma 规则生成在准确性、可扩展性上的不足。", "贡献": "提出 AUTOSigma 框架，融合知识增强、模板锚定与 LLM 裁判机制，实现高精度自动化 Sigma 规则生成。", "合理性": "多阶段混合架构平衡了结构化知识与大模型能力，实验验证其在真实 APT 报告转化中优于纯 LLM 方案。", "清晰度": "摘要逻辑严密，从痛点到方案层层递进，技术路径与评估维度表述清晰且具体。"}, "kind": "paper", "title_cn": "从威胁情报到检测：基于知识增强与基于模板的规则 grounding 的自动化 Sigma 规则生成", "summary_cn": "由于高级持续性威胁（APT）的快速演变，动态将网络威胁情报（CTI）转化为可操作的检测能力机制势在必行。Sigma 规则……", "abstract": "Mechanisms for dynamically converting cyber threat intelligence (CTI) into actionable detection capabilities are necessary due to the rapid evolution of Advanced Persistent Threats (APTs). Sigma rules are an essential part of contemporary threat detection workflows because they offer a platform-independent framework for expressing detection logic that can be converted into particular queries across SIEM systems. Conventional techniques for manually crafting Sigma rules are prone to mistakes, and necessitate extensive knowledge, which restricts their scalability. Although there are open-source and industry-maintained Sigma rule repositories, they often fail to keep pace with emerging threats and require frequent customization to fit diverse operational environments. This emphasizes the necessity of dynamic rule generation that is adapted to evolving attack techniques as well as particular use cases. In this work, we design AUTOSIGMA, an automated solution for transforming unstructured CTI reports into relevant Sigma rules. Rather than relying solely on language models, AUTOSIGMA leverages a structured knowledge base to enrich partial inputs, matches the enriched content against a repository of existing Sigma rules, and then employs an LLM-as-a-Judge mechanism to iteratively validate the rules. By combining knowledge-driven enrichment, template-based rule grounding, and a multi-stage solution, AUTOSIGMA enables accurate, context-aware, and relevant rule generation. Evaluations across multiple real-world APT reports and multiple security blogs demonstrate that AUTOSIGMA outperforms alternative solutions and LLM models in rule validity, rule relevancy, MITRE ATT&CK technique coverage, and robustness to input quality. AUTOSIGMA's Demo: https://youtu.be/iSr6IurQ6BM", "abstract_cn": "//youtu.be/iSr6IurQ6BM", "interpret": "面对高级持续性威胁（APTs）的快速演变，将网络安全情报（CTI）动态转化为可执行的检测能力至关重要。Sigma 规则作为一种平台无关的检测逻辑表达框架，能将被 SIEM 系统广泛使用。然而，传统手工编写规则不仅门槛高且易出错，开源库也常滞后于新型威胁，难以适配特定环境。本研究提出了一种由知识驱动的情报富集结合模板化的规则 grounding 机制，旨在自动生成 Sigma 规则。关键在于利用结构化情报自动填充规则模板，将威胁特征直接映射为检测逻辑。这一方法解决了规则更新滞后和定制化成本高企的难题，显著提升了威胁检测的敏捷性与规模化能力，使安全团队能更快速地应对新型攻击，强化了纵深防御体系的有效性。", "interpret_v": 3, "num": 10}, {"title": "Grading the Graders: Verification Autonomy Levels (L0-L5) for LLM Reasoning", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "LLM", "ts": "2026-08-19T23:10:00+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Large language models (LLMs) are increasingly paired with verifiers (step checkers, self-consistency filters, tool-based fact checkers, formal proof assistants) that claim to detect the model's err…", "link": "https://arxiv.org/abs/2608.19009", "points": {"类别": "理论与方法，提出验证自主性等级（VAL）分类框架", "背景": "LLM 验证领域术语定义混乱，现有“等级”概念存在五重歧义", "贡献": "定义 VAL 轴区分验证源头与保证，揭示完备性盲区及形式化局限", "合理性": "假设成立，基于四领域实证与强基准对比，逻辑自洽但依赖形式化规范", "清晰度": "结构清晰，术语对比明确，通过多案例验证核心观点表达有力"}, "kind": "paper", "title_cn": "LLM 推理的验证者分级：验证自主性等级（L0-L5）", "summary_cn": "大型语言模型（LLMs）正日益与验证器（步骤检查器、自洽性过滤器、基于工具的真相核查器、形式化证明助手）配对，宣称能够检测模型推理过程中的错误……", "abstract": "Large language models (LLMs) are increasingly paired with verifiers (step checkers, self-consistency filters, tool-based fact checkers, formal proof assistants) that claim to detect the model's errors. Yet the verification literature uses the word \"level\" to mean at least five different things: verification granularity, concept abstraction, risk tier, system-stack layer, and the epistemic source of the ground truth. We propose Verification Autonomy Levels (VAL), a meta-standard classifying verification schemes along a single axis: where does the verification spec come from, and what does the verdict guarantee? VAL ranges from L0 (LLM self-declaration, no deterministic anchor) through L2 (objective ground truth, correctness only) to L3/L4 (decidable systems with single-property or domain-level completeness), with L5 impossible in the unrestricted case. Central to VAL is the completeness blind spot: substitution- and sampling-based verifiers can confirm that proposed candidates hold, but cannot prove that no candidate was missed. We further identify a dichotomy the literature has not stated: completeness is reachable only for formally specifiable properties, while empirical open-world verification (fact-checking, diagnosis) caps at anchored correctness (L2). We document this across four domains (symbolic mathematics, behavior monitoring, medical diagnosis, and code generation) and in the strongest existing formal-verification baseline, whose authors note the verifier \"focuses on the correctness of each step.\" We show the levels of granularity, concept hierarchy, risk, and system stack are orthogonal to VAL, resolving a systematic conflation across 17 surveyed papers. Code and full assessment are released as supplementary material.", "abstract_cn": "大语言模型（LLMs）正越来越多地与验证器（步骤检查器、自洽性过滤器、基于工具的事实检查器、形式证明助手）配对，声称能检测模型的错误。然而，验证文献中的\"层级\"一词意指至少五种不同的含义：验证粒度、概念抽象度、风险等级、系统分层以及真值的认识论来源。我们提出了验证自主层级（VAL），这是一个元标准，用于沿单一轴线对验证方案进行分类：验证规范来自何处，以及判决能保证什么。VAL 从 L0（LLM 自我声明，无确定性锚点）经过 L2（客观真值，仅保证正确性）延伸到 L3/L4（具有单一属性或领域级完备性的可判定系统），而 L5 在受限条件不可实现。VAL 的核心在于完备性盲区：基于替换和抽样的验证器可以确认提出的候选项成立，但无法证明未遗漏任何候选项。我们进一步指出文献中未明确的一个二元对立：仅对形式可规范化的属性可达完备性，而经验性的开放世界验证（如事实检查、诊断）上限为锚定正确性（L2）。我们在四个领域（符号数学、行为监控、医学诊断和代码生成）以及现有的最强形式验证基准中记录了这一点，该基准的作者在文中指出验证器“专注于每一步的正确性”。我们证明了粒度、概念层级、风险和系统分层的层级与 VAL 正交，从而解决了跨 17 篇调研论文的有系统性混淆问题。代码和完整评估已作为补充材料发布。", "interpret": "随着大语言模型（LLM）被广泛配对各类“验证器”以提升准确性，学术界却长期缺乏统一标准，导致“验证层级”一词被随意用于指代粒度、抽象度或系统结构等不同概念，造成评估混乱。为此，本文提出了“验证自主层级”（VAL）这一元标准，旨在从验证规范的来源及裁决所保证的程度单一维度对方案进行分类。该框架从 L0（LLM 自我声明，无客观锚点）递增至 L5（理论上不可达的完全验证）。核心发现指出，大多数现有方法处于较低层级，难以提供确定性保障；唯有在特定可判定领域内的 L3 和 L4 级系统，才具备单属性或领域级完备性。这一理论框架不仅厘清了当前验证领域的概念混淆，更为评估 LLM 推理结果的可靠性提供了统一的度量标尺，有助于推动构建更可信的人工智能系统。", "interpret_v": 3, "num": 11}, {"title": "Beyond Placement and Articulation: Usage-Driven Code Scenes for Embodied Interaction", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-19T20:00:35+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Indoor scene synthesis provides essential environments for embodied AI, robotic manipulation, and simulation-based policy learning. Recent code-based scene generation methods produce editable and e…", "link": "https://arxiv.org/abs/2608.18840", "points": {"类别": "系统研究，提出用于具身交互的代码驱动场景生成框架。", "背景": "现有代码场景生成方法仅关注视觉构建，缺乏功能性与交互逻辑。", "贡献": "设计 RoomWright 框架，通过任务推理、因果规则编排及方向校正生成可交互场景。", "合理性": "方法逻辑自洽，针对性解决现有工具忽视功能使用的痛点。", "清晰度": "摘要结构清晰，技术路线与实验验证表述简明扼要。"}, "kind": "paper", "title_cn": "超越放置与衔接：用于具身交互的代码驱动代码场景", "summary_cn": "室内场景合成是具身人工智能、机器人操作及基于模拟的策略学习的必备环境。", "abstract": "Indoor scene synthesis provides essential environments for embodied AI, robotic manipulation, and simulation-based policy learning. Recent code-based scene generation methods produce editable and extensible environments, yet they remain focused on visual construction and object-level articulation, leaving the functional usage of scenes largely unmodeled. To address this problem, we present RoomWright, an agentic usage-driven framework for generating 3D scenes represented entirely as code for embodied interaction. RoomWright performs usage-driven object reasoning, which treats each anchor as a task centre and admits task-required objects and their affordances. A code agent further enables multi-part interaction by compiling each interaction into a trigger, condition, effect rule that updates structured object states, capturing causal dependencies across objects. Moreover, since manipuland orientation is ambiguous and hard to recover from pixels, RoomWright alleviates this via annotation-informed usage-guided orientation. Extensive experiments demonstrate the effectiveness of our method. The resulting scenes are executable, editable, and simulation-ready, providing interactive environments for embodied AI and policy learning.", "abstract_cn": "室内场景合成对于具身人工智能、机器人操作及基于仿真的策略学习至关重要。现有的基于代码的场景生成方法虽能产生可编辑和扩展的环境，但仍侧重于视觉构建与物体级连接，致使场景的功能用途未被充分建模。为了解决这一问题，我们提出了 RoomWright，这是一个以用程驱动生成完全由代码表示的 3D 场景的代理框架，旨在服务于具身交互。RoomWright 执行用程驱动的物体推理，将每个锚点视为任务中心，并接受任务所需的物体及其功能特性。代码代理通过编译每个交互为触发条件、规则及效果，进而更新结构化物体状态，从而实现了多部件交互并捕捉了物体间的因果依赖关系。此外，鉴于操作对象朝向模糊且难以从像素中恢复，RoomWright 通过注释指导的用程定向缓解了该问题。广泛的实验验证了我们方法的有效性。生成的场景具备可执行、可编辑及仿真就绪的特性，为具身人工智能和策略学习提供了交互环境。", "featured_date": "2026-08-20", "interpret": "室内场景合成是人工智能机器人实现操作与学习的核心基础。现有代码生成方法虽能构建可编辑环境，却多集中于视觉外观，忽视了场景的“功能使用”。为此，研究提出了 RoomWright 框架，通过“使用驱动”策略生成完全基于代码的三维场景。该方法将每个任务锚点视为交互中心，智能体将复杂操作编译为包含触发、条件与效果的规则，从而精准捕捉物体间的因果依赖。针对传统方法难以从像素恢复物体朝向的痛点，系统引入了基于注释的使用导向对齐机制，显著提升场景可用性。实验表明，RoomWright 生成的场景不仅具备高度交互性，更能无缝支持机器人政策学习与仿真训练，为构建真正“可操作”的智能环境提供了新范式。", "interpret_v": 3, "num": 12}, {"title": "A Multi-Agent Platform for Automated Enterprise Analytics and Insight Generation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-19T17:49:58+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "This paper proposes a multi-agent framework built on CrewAI [1] for conversational business intelligence. Five specialized AI agents operate in a sequential pipeline to process natural language que…", "link": "https://arxiv.org/abs/2608.18740", "points": {"类别": "系统 本文提出基于 CrewAI 的多智能体平台，实现企业数据分析与洞察自动化。", "背景": "针对传统单智能体在复杂商业智能任务中效率低、幻觉高的问题。", "贡献": "构建五智能体流水线与纵深防御架构，实测功能准确率达 95.3% 且幻觉率仅 6.7%。", "合理性": "基于多租户隔离参数化机制，通过跨模型与专家验证，方法设计严谨可信。", "清晰度": "摘要逻辑严密，数据详实，清晰展示了系统架构、评估结果及消融实验结论。"}, "kind": "paper", "title_cn": "面向自动化企业分析洞察生成的人工智能平台", "summary_cn": "本文提出了基于 CrewAI 的面向对话式商业智能的多智能体框架。五名专业 AI 智能体按顺序在流水线中处理自然语言查询", "abstract": "This paper proposes a multi-agent framework built on CrewAI [1] for conversational business intelligence. Five specialized AI agents operate in a sequential pipeline to process natural language queries, retrieve and analyze data, generate visualizations via the Model Context Protocol (MCP) [2], and deliver actionable insights. The platform features a defense-in-depth security architecture for multi-tenant data isolation and a query parameterization mechanism for transforming conversational insights into reusable dashboard components. Evaluation across 300 end-to-end test cases spanning synthetic and production enterprise datasets demonstrates 95.3% functional accuracy, a mean response latency of 24 seconds, and a response quality score of 4.52/5.0 as assessed by an LLM-as-a-Judge framework, with a 93.0% hallucination-free rate, representing a 22.6 percentage point accuracy improvement and 20.2% quality gain over a single-agent baseline. Cross-model evaluation across four LLM backends and human expert validation confirm architectural generalizability and evaluator reliability. An ablation study confirms that the Data Analysis and Report Aggregation agents are the primary drivers of output quality.", "abstract_cn": "本文提出了一种基于 CrewAI [1] 构建的多智能体框架，用于对话式商业智能。五个专用人工智能代理按顺序流程协作，以处理自然语言查询、检索并分析数据、通过模型上下文协议（MCP）[2] 生成可视化图表，并交付可执行的洞察。该平台具备纵深防御安全架构以实现多租户数据隔离，并配有查询参数化机制，可将对话式洞察转化为可复用的仪表板组件。对涵盖合成和企业生产数据的 300 个端到端测试用例的评估显示，该平台的功能准确率为 95.3%，平均响应延迟为 24 秒，依据 LLM-as-a-Judge 框架评估的响应质量评分为 4.52/5.0，幻觉率低至 93.0%，相比单一智能体基线，功能准确率提升了 22.6 个百分点，质量得分提高了 20.2%。在四个 LLM 后端上的跨模型评估及人类专家验证证实了架构的普适性和评估者的可靠性。消融研究证实，数据分析报告和聚合代理是输出质量的主要驱动力。", "featured_date": "2026-08-20", "interpret": "本文提出了一种基于 CrewAI 的多智能体框架，旨在实现自动化的企业分析与洞察生成。该体系部署了五个专用智能体，按顺序处理自然语言查询、数据检索分析、基于 Model Context Protocol 的可视化生成及行动建议输出。平台采用纵深防御安全架构保障多租户数据隔离，并引入参数化机制将对话结果转化为可复用的仪表盘组件。\n\n在涵盖 300 个端到端测试用例的评估中，该系统在合成与生产数据上实现了 95.3% 的功能准确率，平均响应延迟为 24 秒，幻觉率仅 7.4%。相比单智能体基线，其功能准确率提升了 22.6 个百分点，质量得分也获得 20.2% 的增长。消融研究证实，数据分析与报告聚合智能体是决定输出质量的关键。该成果为构建高效、安全且可信的企业级 AI 分析工具提供了实证依据。", "interpret_v": 3, "num": 13}, {"title": "CL4D: Contrastive Language-4D Pretraining for Vision-Language Reasoning in Dynamic Scenes", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-19T17:37:15+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "4D understanding and reasoning is a fundamental capability for embodied AI agents operating in dynamic physical environments. However, existing vision encoders are largely limited to static 2D imag…", "link": "https://arxiv.org/abs/2608.18734", "points": {"类别": "方法，提出首个直接处理动态点云的 4D 视觉编码器及 4D 视觉语言模型。", "背景": "当前视觉编码器缺乏对时空几何与运动演化的联合建模能力，难以理解动态场景。", "贡献": "构建 DynAction4D 数据集，实现无监督 4D 点云预训练，并在动态场景基准上达成 SOTA。", "合理性": "对比学习目标与零样本检索效果可信，但点云表示法在通用性上存在应用局限。", "清晰度": "逻辑结构完整，从问题背景到方法实现再到实验验证，层次清晰且重点突出。"}, "kind": "paper", "title_cn": "CL4D：面向动态场景视觉 - 语言推理的对比语言 -4D 预训练", "summary_cn": "4D 理解与推理是嵌入式人工智能代理在动态物理环境中运行的基本能力，然而现有的视觉编码器主要局限于静态 2D 图像……", "abstract": "4D understanding and reasoning is a fundamental capability for embodied AI agents operating in dynamic physical environments. However, existing vision encoders are largely limited to static 2D images or 3D point clouds without temporal modeling, or to 2D videos that lack accurate geometric depth reasoning. Consequently, current approaches fail to jointly capture spatial structure and motion evolution in dynamic scenes. We present CL4D, the first foundational 4D vision encoder that directly operates on dynamic point clouds, trained with a contrastive learning objective to align spatio-temporal geometric representations with natural language descriptions. By learning a shared embedding space between text and 4D scene dynamics, CL4D enables zero-shot motion-to-text and text-to-motion retrieval in dynamic environments and serves as a foundational 4D vision encoder for downstream 4D vision-language tasks. Building on this encoder, we introduce 4DVLM, a 4D vision-language model that conditions language generation on dynamic geometric representations. 4DVLM is the first VLM designed to operate directly on 4D point clouds without relying on 2D images, 2D videos, or static 3D point clouds. We train CL4D and subsequently 4DVLM on a newly constructed dataset termed DynAction4D capturing diverse human motions across varying object interactions and scene environments. Extensive experiments across multiple 4D human action benchmarks demonstrate that CL4D achieves state-of-the-art performance, with improvements of approximately ~16.75% over prior methods. Furthermore, 4DVLM outperforms frontier video VLMs such as Gemini and GPT-5 even when these models are provided with RGB video sequences corresponding to the same scenes represented as 4D point clouds for 4DVLM.", "abstract_cn": "4D 理解与推理是机器人在动态物理环境中运行的核心能力，但现有的视觉编码器大多局限于静态 2D 图像或缺乏时序建模的 3D 点云，或局限于缺乏精确几何深度推理能力的 2D 视频，导致无法在动态场景中同步捕捉空间结构与运动演化。我们提出了 CL4D，首个直接作用于动态点云的 4D 视觉编码器，采用对比学习目标对齐时空几何表示与自然语言描述；通过构建文本与 4D 场景动态的共享嵌入空间，CL4D实现了动态环境中的零样本运动到文本及文本到运动检索，并为下游 4D 视觉 - 语言任务提供了基础编码器。在此基础上，我们引入了 4DVLM，一种基于动态几何表示生成语言的 4D 视觉 - 语言模型，它是首个无需依赖 2D 图像、2D 视频或静态 3D 点云即可直接操作 4D 点云的 VLM。我们利用新构建的涵盖多物体交互与场景环境中多样化人体动作的 DynAction4D 数据集训练 CL4D 及其衍生模型 4DVLM。在多个 4D 人体动作基准测试上的广泛实验表明，CL4D 取得了最先进的性能，相比现有方法提升了约 16.75%。此外，4DVLM 甚至超越了 Gemini 和 GPT-5 等前沿视频 VLM，前提是这些模型需输入与 4DVLM 所处理的 4D 点云场景对应的 RGB 视频序列。", "interpret": "动态场景下的视觉理解是具身智能体在复杂物理环境中自主行动的核心能力。然而，现有主流模型多局限于静态图像或缺乏深度信息的视频，难以同时捕捉空间结构与运动演化的关系。为此，本研究提出 CL4D，首个直接处理动态点云的基础模型。它通过对比学习，将时空几何表示与自然语言描述对齐，在文本与 4D 场景动力学之间构建了共享嵌入空间。该模型实现了零样本的运动转文本检索及文本转运动检索，不仅解决了动态场景中时空特征解耦的难题，更为下游 4D 视觉 - 语言任务提供了强有力的基础编码器，推动人工智能从静态分析向动态交互的跨越。", "interpret_v": 3, "num": 14}, {"title": "Vision-Language Models for Egocentric Video: From Hand-Object Interaction to Embodied AI", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "具身智能", "ts": "2026-08-19T16:21:58+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Egocentric video captures activities from the wearer's perspective, providing a direct view of human attention, hand--object interaction, and goal-directed behavior. This perspective is increasingl…", "link": "https://arxiv.org/abs/2608.18671", "points": {"类别": "综述，旨在梳理 VLM 在自摄视频理解与具身智能领域的研究脉络。", "背景": "针对自摄视角中存在的运动、遮挡及长程依赖挑战，探索多模态大模型应用。", "贡献": "系统评述了从传统架构到具身智能的任务进展，指出意图识别仍是当前主要瓶颈。", "合理性": "假设具身智能需强化时序推理与图表示，符合现有技术痛点与演进规律。", "清晰度": "按任务、数据、推理等模块组织内容，结构严谨且重点突出。"}, "kind": "paper", "title_cn": "面向第一人称视频的视觉 - 语言模型：从手物交互到具身智能", "summary_cn": "第一人称视频以佩戴者的视角捕捉活动，直接呈现人类注意力、手物交互及目标导向行为。", "abstract": "Egocentric video captures activities from the wearer's perspective, providing a direct view of human attention, hand--object interaction, and goal-directed behavior. This perspective is increasingly important for wearable intelligence, assistive systems, human--robot interaction, and embodied AI, yet it introduces challenges including ego-motion, occlusion, small active objects, viewpoint-dependent appearance, and long-range temporal dependencies. Vision--language models (VLMs) offer a promising foundation for addressing these challenges by linking visual observations with semantic knowledge and natural-language supervision. This survey presents a critical review of VLMs for egocentric video understanding, tracing the progression from conventional recognition architectures to multimodal foundation models and embodied systems. We organize the literature around tasks, datasets, hand--object interaction understanding, temporal reasoning, frame and clip selection, multimodal representation learning, prompting, semantic alignment, and model adaptation. Particular attention is given to graph-based and object-centric reasoning as mechanisms for modeling relations among hands, objects, actions, and scene context over time. We further examine how first-person perception and multimodal foundation models support wearable assistance, robot skill learning, human-to-robot transfer, and embodied decision making. Across the reviewed literature, a consistent limitation emerges: current models recognize visible objects more reliably than evolving interactions, actions, and user intent, especially over long activities. We therefore identify temporally grounded reasoning, interaction-aware supervision, efficient long-video processing, multimodal fusion, graph-enhanced representations, cross-domain generalization, privacy, and trustworthy evaluation as key priorities for deployable embodied intelligence.", "abstract_cn": "自我中心视频以穿戴者的视角记录活动，直接呈现人类注意力、手物交互及目标导向行为，这对可穿戴智能、辅助系统、人机交互及具身人工智能日益重要，但也带来了自旋运动、遮挡、微小活跃物体、视角依赖的外观及长期时间依赖等挑战。视觉语言模型（VLM）通过结合视觉观察与语义知识及自然语言监督，为解决上述挑战提供了有前景的基础。本文对面向自我中心视频的视觉语言模型进行了关键性综述，梳理了从传统识别架构到多模态基础模型及具身系统的演进。我们将文献按任务、数据集、手物交互理解、时间推理、帧与片段选择、多模态表示学习、提示、语义对齐及模型适配进行组织，特别关注图基础及中心对象推理作为建模手、物体、动作及场景上下文随时间间关系的机制。我们还考察了第一人称感知及多模态基础模型如何支持可穿戴辅助、机器人技能学习、人机迁移及具身决策。纵观所评文献，一个一致的限制浮出水面：当前模型对可见物体的识别可靠性高于对演化交互、动作及用户意图的识别，尤其是对于长期活动。因此，我们将基于时间推理、交互感知监督、高效长视频处理、多模态融合、增强型图表示、跨域泛化、隐私保护及可信评估确立为可部署具身智能的关键优先事项。", "interpret": "自眼动视频技术普及以来，它作为第一人称视角，为可穿戴智能、人机协作及具身智能提供了直接观察人类注意力与动作的窗口。然而，这种视角天然面临运动模糊、遮挡、小目标检测难及长时程依赖等复杂挑战。近年来，视 - 语模型凭借融合视觉感知与语言知识的优势，成为解决上述难题的关键路径。本文系统梳理了该领域从传统架构向多模态基础模型演进的核心进展，重点解析了 VLM 如何通过自然语言监督强化对“手 - 物交互”的理解，推动具身 AI 从被动识别迈向主动理解与决策。这一研究不仅填补了具身认知领域的知识缺口，更为未来机器人自主服务与增强人类能力奠定了坚实的理论与技术基础。", "interpret_v": 3, "num": 15}, {"title": "Reinforced Planning with Latent World Models", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-19T16:21:28+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Humans solve complex problems by constructing plans and mentally simulating their outcomes with an internal model of the world. Machine learning has produced world models that similarly predict the…", "link": "https://arxiv.org/abs/2608.18669", "points": {"类别": "方法类研究，提出基于强化学习搜索新规划的算法。", "背景": "解决现有机器世界模型预测后计划优化仍依赖手工设计的局限。", "贡献": "提出 RP1 方法实现全离线优化与多步计划改进，大幅超越手工搜索算法。", "合理性": "独立于预训练世界模型通用性强，实验在视觉导航与机器人操作上验证可信。", "清晰度": "摘要逻辑连贯从问题背景到方案优势层层递进，结构清晰易读。"}, "kind": "paper", "title_cn": "基于潜在世界模型的强化规划", "summary_cn": "人类通过构建计划并利用内部世界模型进行模拟来解决复杂问题。机器学习已生成类似的用于预测的潜隐世界模型……", "abstract": "Humans solve complex problems by constructing plans and mentally simulating their outcomes with an internal model of the world. Machine learning has produced world models that similarly predict the outcomes of action sequences, but the improvement of candidate plans still isn't fully learned. Current planners are either hand-designed, distilled from a hand-designed optimizer, or learned only to inform an amortized policy rather than to revise the plan itself. We introduce the Reinforced Planning, a method based on the idea that search can be learned by reinforcing good search rules into a neural planner. Our implementation RP1 learns both how to evaluate imagined outcomes through a critic, as well as how to improve multi-step plans through an optimizer trained fully offline from imagined world-model roll-outs. To our knowledge, RP1 is the first method to fully learn how to improve multi-step plans. Furthermore, it can be trained independently of and attached to any pretrained latent world model. Across visual navigation, arm reaching, and robotic manipulation on two world-model backbones, RP1 substantially outperforms hand-designed search algorithms, reaching near-perfect success in several settings while using $1,000 \\times$ less world-model rollouts and being up to $67 \\times$ faster than the strongest alternative under concurrent planner inference.", "abstract_cn": "人类通过构建计划并利用内部世界模型在脑海中模拟结果来解决复杂问题。机器学习产生的世界模型也能预测动作序列的结果，但候选计划的优化仍未得到充分学习。当前的规划器要么人工设计，要么由人工设计的优化器蒸馏而来，或者仅被学习用于提供摊销策略而非修正计划本身。我们提出了强化规划（Reinforced Planning），其核心思想是通过强化好的搜索规则来训练一个神经规划器。我们的实现 RP1 既通过批评者学习如何评估想象的结果，又通过完全离线从想象的世界模型模拟中训练优化器来学习如何改进多步计划。据我们所知，RP1 是首个能够完全学习多步计划改进方法。此外，它可以独立于任何预训练好的潜在世界模型进行训练并附加使用。在视觉导航、手臂抓取以及在两个世界模型主干上的机器人操作任务中，RP1 显著优于人工设计的搜索算法，在几个场景中达到了近乎完美的成功率，同时使用了 $1,000 \\times$ 更少的世界模型模拟次数，且比最强的替代方案在并行规划器推理下快多达 $67 \\times$。", "interpret": "本研究旨在解决当前机器学习世界模型预测准确，但规划能力（即如何优化行动序列）仍依赖人工设计或仅用于辅助策略的问题。针对搜索策略难以自动优化的瓶颈，作者提出了“强化规划”（Reinforced Planning）方法，核心思想是将“搜索规则”本身视为一种可学习的技能。通过引入评论家网络评估虚拟结果，并利用完全离线训练的优化器在模拟环境中改进多步计划，该方法成功构建了一个能自主学习如何修正和升级自身规划方案的神经规划器。这是首个实现端到端学习多步计划优化的系统，标志着从“生成预测”向“自主决策”的重大跨越，为机器人复杂任务及智能体在动态环境中的自主决策提供了全新范式。", "interpret_v": 3, "num": 16}, {"title": "Progressive Experience Fusion for Multi-Task World Model Control in Endovascular Navigation", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-19T15:51:50+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Autonomous endovascular navigation could support the delivery of mechanical thrombectomy to underserved areas, but controllers must navigate long, multi-stage paths across varying vascular anatomie…", "link": "https://arxiv.org/abs/2608.18647", "points": {"类别": "实证研究，聚焦内支架导航中的多任务世界模型控制问题。", "背景": "针对服务受限区域机械取栓需求，解决长距离多阶段血管路径导航难题。", "贡献": "提出渐进式经验融合算法，显著提升多任务控制器成功率并实现患者特定适应。", "合理性": "方法逻辑自洽且实验数据详实，但临床前验证后尚需大规模实地测试以确保安全性。", "清晰度": "摘要结构紧凑、数据明确，清晰展示了训练方法、对比实验及临床场景下的性能表现。"}, "kind": "paper", "title_cn": "内血管导航中多任务世界模型控制的渐进经验融合", "summary_cn": "自主介入血管导航可支持向欠发达地区输送机械取栓治疗，但控制器必须导航横跨不同血管解剖结构的长距离多阶段路径……", "abstract": "Autonomous endovascular navigation could support the delivery of mechanical thrombectomy to underserved areas, but controllers must navigate long, multi-stage paths across varying vascular anatomies. This study investigates Progressive Experience Fusion (PEF) to train a multi-task TD-MPC2 controller. We additionally evaluate a heuristic that changes the Model Predictive Path Integral planning horizon using residual action-sequence dispersion, and fine-tuning in a patient-specific simulation. Across five subtasks in ten known training anatomies with held-out targets, PEF achieved a mean success rate of 74%, compared with 37% for Soft Actor-Critic (p < 0.001) and 65% for base TD-MPC2 (p = 0.053). A PEF controller with adaptive-horizon planning trained on 30 vasculatures achieved a mean success rate of 90% in ten held-out vasculatures. The PEF agent successfully transferred to an unseen in vitro stroke patient vasculature under fluoroscopy, achieving a mean path ratio improvement from 63% to 80% with fine-tuning (p < 0.001), following 40x103 fine-tuning steps (corresponding to approximately 107 min of clinical inter-hospital transfer time). This work represents a proof of concept for multi-vasculature training and patient-specific adaptation, while further validation is required before clinical deployment.", "abstract_cn": "自主腔内导航可支持向欠发达地区输送机械取栓，但控制器必须穿越不同血管解剖结构的长距离多阶段路径。本研究探讨了渐进式经验融合（PEF）以训练多任务 TD-MPC2 控制器，并评估了利用残差动作序列分散度调整模型预测路径积分规划视界以及在患者特异性仿真中进行微调的启发式方法。在五个子任务及十个已知训练解剖结构中留出目标进行测试时，PEF 的平均成功率为 74%，软Actor-Critic 为 37%（p < 0.001），基础 TD-MPC2 为 65%（p = 0.053）。一个具备自适应视界规划且在 30 种血管结构上训练的 PEF 控制器在十个留空血管结构中的平均成功率为 90%。该 PEF 代理在透视下成功转移到未见过的体外卒中患者血管结构中，经过 40x10^3 步（对应约 10^7 分钟临床院际转运时间）的微调后，平均路径比从 63% 提升至 80%（p < 0.001）。本工作实现了多血管结构训练与患者特异性适应的概念验证，但在临床部署前仍需进一步验证。", "interpret": "内外科血管导航的自主化是提升缺血性卒中治疗可达性的关键，但长距离、多阶段且解剖结构复杂的血管路径对控制器提出了极高要求。本研究提出了一种渐进式经验融合（PEF）方法，用于训练多任务强化学习控制器，旨在解决模型预测控制中规划效率与泛化能力的平衡问题。实验在十个已知血管解剖模型中，PEF 实现了 74% 的平均成功率，显著优于 Soft Actor-Critic（37%）和基础 TD-MPC2（65%）。关键在于，PEF 通过自适应调整规划时窗并利用残差序列离散度，成功实现了跨患者模拟数据的迁移学习。特别是在未见过的血管中，经特定训练后该控制策略表现卓越，证明了其在应对个体差异时的强大适应力，为未来辅助血栓切除术等微创手术提供了可靠的自动化导航方案。", "interpret_v": 3, "num": 17}, {"title": "PILOT Technical Report", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-19T15:35:10+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Existing agentic approaches for recommendation system optimization remain fundamentally reactive: they adjust parameters in response to observed metric changes but lack the ability to proactively d…", "link": "https://arxiv.org/abs/2608.18637", "points": {"类别": "系统框架，提出 PILOT 一种基于 LLM 代理的推荐系统主动优化框架。", "背景": "现有代理方法被动响应指标变化，缺乏主动实验设计与跨任务知识积累能力。", "贡献": "通过实验管理器、搜索规划器和记忆策展人实现全生命周期治理与个人化搜索。", "合理性": "在淘宝多桶部署并对比 ROAM 显示显著提升，规则限制确保安全性与可控性。", "清晰度": "摘要结构完整且数据详实，技术角色明确，逻辑表达清晰易懂。"}, "kind": "paper", "title_cn": "PILOT 技术报告", "summary_cn": "现有的推荐系统优化代理方法本质上仍是反应式的：它们针对观测到的指标变化调整参数，但缺乏主动预演…", "abstract": "Existing agentic approaches for recommendation system optimization remain fundamentally reactive: they adjust parameters in response to observed metric changes but lack the ability to proactively design controlled experiments, personalize strategies at the user-segment level, or accumulate reusable experimental methodology across tasks. We present PILOT (Proactive Insight Learner for Online Tree-Experiments), an LLM-agent framework that organizes three roles within a constrained control loop where deterministic services enforce all safety, statistical, and permission boundaries: (1) an Experiment Manager that drives the full experiment lifecycle -- task intake, observation governance, anomaly recovery, and postmortem -- by selecting only from a rule-generated legal-command envelope; (2) a Search Planner that proposes candidate decision trees for user-segment-level personalization, invoked only when the Manager requests planning; and (3) a Memory Curator that asynchronously distills experiment outcomes into strategy-level domain knowledge and provenance-tracked methodology, failure-isolated from the main loop. The Manager makes the agent proactive, the Planner enables population-level personalization beyond global tuning, and the Curator turns every completed task into a learning opportunity for the next. Deployed on Taobao's platform with 5 experimental buckets, PILOT is compared against ROAM(Reactive Optimization with Agent-driven Moves), a free-exploration agent without lifecycle governance or structured hypothesis testing. PILOT achieves up to +1.40% IPV, +1.60% Core IPV, +0.96% transaction count, and +1.50% transaction amount, improving over ROAM's best results (+1.00% IPV, +0.90% Core IPV, +0.60% transaction count, +1.13% transaction amount) while raising search efficiency from 53.3% to 93.3% (+40 pp), with no human intervention throughout the experimental cycle.", "abstract_cn": "现有的推荐系统优化智能体方法本质上仍属被动响应模式：它们仅在指标变化时调整参数，却缺乏主动设计受控实验、按用户细分定制策略或跨任务积累可复用实验方法论的能力。我们提出了 PILOT（面向在线树实验的主动洞察学习者），一个由 LLM 智能体驱动的框架，该框架在受限控制环中组织三个角色，由确定性服务强制执行所有安全、统计及权限边界：（1）实验经理驱动完整的实验生命周期——从任务接入、观察治理、异常恢复到事后分析，仅从规则生成的合法命令空间中选择指令；（2）搜索规划器在被经理请求规划时，提出用于用户细分级个性化的候选决策树；（3）记忆策展员异步将实验结果提炼为策略级领域知识和经过溯源追踪的方法论，并将失败结果与主循环隔离。经理使智能体具备主动性，规划器支持超越全局调优的人群级个性化，策展员将每项任务转化为下一次的学习机会。PILOT 已在淘宝平台的 5 个实验桶中部署，并与无生命周期治理和结构化假设检验的主动探索智能体 ROAM（基于智能体动作的被动优化）进行了对比。PILOT 实现了最高+1.40% 的 IPV、+1.60% 的核 IPV、+0.96% 的交易数量和+1.50% 的交易金额，优于 ROAM 的最佳结果（+1.00% IPV、+0.90% 核 IPV、+0.60% 交易数量、+1.13% 交易金额），同时搜索效率从 53.3% 提升至 93.3%（+40 个百分点），且在实验周期内无需人工干预。", "interpret": "当前推荐系统优化方法多为被动响应模式，仅能根据指标变化调整参数，却无法主动设计实验、针对不同用户群体定制策略，也难以复用经验。本文提出了 PILOT 框架，利用大语言智能体在严格的安全与权限约束下，构建一个可控的实验循环。该系统通过“实验经理”全权管理实验生命周期，严格遵循规则生成的合法指令集；结合“搜索规划器”为用户细分制定个性化决策树策略。这一研究突破了现有技术的被动局限，旨在赋予系统自主探索与持续进化的能力。其意义在于推动推荐系统从简单的规则执行向具备主动实验、精准个性化及方法复用的智能体转型，为构建更高效、公平的在线推荐系统提供了新的技术范式。", "interpret_v": 3, "num": 18}, {"title": "CTIFoundry: An Agent-Native Corpus Scaffold for Cyber Threat Intelligence", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-19T15:00:29+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Cyber threat intelligence (CTI) is increasingly consumed not by human analysts but by LLM agents that compose multi-step investigations at query time. The harness side of this shift has matured rap…", "link": "https://arxiv.org/abs/2608.18613", "points": {"类别": "实证研究，验证新架构在 LLM 智能体威胁情报调查中的性能增益", "背景": "威胁情报正转向 LLM 智能体，但现有数据底座仍适配传统检索而非智能体工作流", "贡献": "构建融合四权威库的语义图谱与工具技能的 AgentNative 数据架构，提升调查准确率并减少工具调用", "合理性": "实验数据支撑有力，结构化知识与流程技能协同效果显著，方法逻辑自洽且具可复现性", "清晰度": "摘要结构紧凑，从问题到架构再到实验结果层层递进，技术术语使用精准且表达明确"}, "kind": "paper", "title_cn": "CTIFoundry：面向自主智能体的网络威胁情报语料骨架", "summary_cn": "网络威胁情报正日益由人类分析师转向由大型语言模型智能体在查询时进行多步调查。这一转变的应用端已趋于成熟……", "abstract": "Cyber threat intelligence (CTI) is increasingly consumed not by human analysts but by LLM agents that compose multi-step investigations at query time. The harness side of this shift has matured rapidly (planning loops, tool protocols, context management), but the corpus side has not: threat reports and vulnerability databases are still packaged for retrieval-augmented generation, as opaque chunks behind an embedding index. We argue that this substrate, not model capability, is the bottleneck on agentic CTI investigation, and present CTIFoundry, an agent-native corpus scaffold. At build time, CTIFoundry materializes the latent structure of a CTI corpus: a deterministic ontology graph over four authoritative knowledge bases (CVE, CWE, CAPEC, ATT&CK) whose official cross-references become typed, traversable edges; a span-grounded report layer whose canonical, alias-resolved cross-vendor entities index provenance-carrying chunks; and hybrid dense+lexical retrieval surfaces. At query time this structure is exposed through seven typed tools and three procedural skills mounted on a stock open-source agent harness. On the public CTIConnect benchmark, swapping only the action surface lifts the identically-harnessed agent by +0.19 to +0.28 overall F1 across a four-model, two-provider panel: a small model on CTIFoundry surpasses a flagship on the flat substrate, and the gain is not bought with search effort, since on both Claude models the scaffolded agent is more accurate at roughly half the tool calls. An ablation attributes it: typed structure carries the larger share, procedural skills convert structure into discipline, and the two compose super-additively, because skills bind only to structure that exists.", "abstract_cn": "网络安全情报正逐渐由人工分析师转向在查询时即执行多步调查的大型语言模型代理。虽然这一转变在规划循环、工具协议和上下文管理等 harness 侧已快速成熟，但语料侧并未跟进：情报报告和漏洞数据库仍以嵌入索引背后不透明的块形式提供检索增强生成。我们认为，这一基础而非模型能力是代理式情报调查的瓶颈，并提出了 CTIFoundry 这一智能原生语料脚手架。在构建阶段，CTIFoundry 将情报语料的潜在结构具体化：它基于四个权威知识库（CVE、CWE、CAPEC 和 ATT&CK）构建了确定性本体图，使官方交叉引用变为类型化的可遍历边；同时建立了基于文段的报告层，其标准且已解析别名跨厂商实体索引着携带溯源信息的块，并提供了混合稠密与词汇检索接口。在查询阶段，该结构通过七个类型化工具和三种过程技能在开源代理 harness 上暴露出来。在公开的情报 CTIConnect 基准测试中，仅替换行动界面就将相同 harness 的代理的总 F1 分数从 +0.19 提升至 +0.28，覆盖四模型两提供商面板：在 CTIFoundry 上运行的小模型超越了在平铺结构上运行的旗舰模型，且这种提升并未以增加检索努力为代价，因为在两个 Claude 模型上，脚手架化代理的工具调用次数约为前者的一半，但准确性更高。消融实验表明：类型化结构贡献了主要部分，过程技能将结构转化为纪律，两者共同作用呈现超加性，因为技能仅能绑定于实际存在的结构。", "interpret": "当前，网络安全情报（CTI）正从人工分析转向由大语言模型驱动的自动化智能体执行复杂调查，尽管智能体规划能力已成熟，但情报数据本身仍被封装为不可检索的静态片段，导致其成为智能体应用的核心瓶颈。为此，研究提出了 CTIFoundry 这一面向智能体的情报知识库框架。该框架在构建时即显式还原情报数据的潜在结构：基于四个权威基准（漏洞、缺陷、攻击方法及技术战术）构建具有交叉引用关系的本体图谱；同时针对报告层建立基于文本片段且解析了厂商别名映射的索引。实验表明，CTIFoundry 能显著提升智能体在跨数据源检索、推理及任务规划方面的效率，为大规模、可解释的自动化安全调查提供了坚实的数据基础。", "interpret_v": 3, "num": 19}, {"title": "AppEval: A Unified Benchmark for LLM-Based Mobile Application Repair in ArkTS, Swift, and Kotlin", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-19T14:30:34+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Repository-level LLM agents are typically evaluated on projects whose tests run on the build host. It remains unclear whether their repairs survive the mobile build-install-launch-test boundary, wh…", "link": "https://arxiv.org/abs/2608.18588", "points": {"背景": "现有评估多基于本地构建测试，忽略了移动设备特有的运行时环境差异与基础设施故障风险。", "贡献": "提出支持多平台的统一基准框架，量化显示运行时感知对准确评估 LLM 修复性能至关重要。", "合理性": "实验设计严谨且数据详实，但跨平台结论的普遍性受限于 Android 数据集规模及 iOS/HarmonyOS 结果缺失。", "清晰度": "结构逻辑严密，方法定义清晰，虽数据受限但明确指出了当前研究边界与未来方向。"}, "kind": "paper", "title_cn": "AppEval：面向 ArkTS、Swift 和 Kotlin 的基于大语言模型的移动应用修复统一基准", "summary_cn": "通常在构建主机上运行的项目的级库中评估基于大语言模型的代理。目前尚不清楚，它们的修复是否能跨越移动构建、安装、启动和测试的边界。", "abstract": "Repository-level LLM agents are typically evaluated on projects whose tests run on the build host. It remains unclear whether their repairs survive the mobile build-install-launch-test boundary, where a missing SDK, offline device, or pre-assertion crash can be mistaken for a program failure. We present AppEval, a benchmark and native-toolchain evaluation framework for mobile application repair across HarmonyOS/ArkTS, iOS/Swift, and Android/Kotlin. Each task separates a hidden behavior test from the reference production fix and is accepted only when the same installed-app target reaches an assertion failure on the defective revision and passes after the fix; infrastructure failures remain a distinct outcome. A common schema maps this contract to each platform's build system, runtime, and test runner. The audited Android partition contains 200 accepted instrumentation tasks from 24 independently buildable repositories. On these tasks, five agents achieve Pass@1 between 22.00% and 90.50%, a 68.50-percentage-point spread under the same dynamic oracle. These results show that mobile repair performance depends strongly on the evaluated agent while demonstrating why runtime-aware acceptance is necessary for meaningful comparison. The quantitative findings in this paper are Android-specific; audited iOS and HarmonyOS results are required before drawing cross-platform generalization conclusions.", "abstract_cn": "基于大型语言模型的仓库级智能体通常仅在构建主机上运行测试的项目中进行评估，尚不清楚其修复能否跨越移动“构建 - 安装 - 启动 - 测试”边界，该边界中 SDK 缺失、离线设备或预断言崩溃可能被误判为程序失败。我们提出了 AppEval，这是一个跨 HarmonyOS/ArkTS、iOS/Swift 和 Android/Kotlin 移动应用修复的基准及原生工具链评估框架。每个任务将隐藏行为测试与参考修复分离开来，仅当安装的应用目标在缺陷版本中失败并在修复后通过时才会接受；基础设施故障则被视为独立结果。共同的模式将该契约映射到各平台的构建系统、运行时和测试执行器。经审计的 Android 分区包含来自 24 个可独立构建仓库的 200 个接受度测试任务。在这些任务中，五个智能体的 Pass@1 分数介于 22.00% 和 90.50% 之间，在相同的动态预言机下相差 68.50 个百分点。结果表明移动修复性能高度依赖于被评估的智能体，并证明了需要运行时感知的接受标准才能进行有意义的比较。本文的定量结果特定于 Android 平台，在得出跨平台泛化结论之前需要审计 iOS 和 HarmonyOS 结果。", "interpret": "现有大模型在软件修复任务中的评估多基于构建主机上的单元测试，却忽视移动端特有的“构建 - 安装 - 启动 - 测试”闭环环境。由于移动端常面临 SDK 缺失、离线运行或预断言崩溃等基础设施干扰，导致修复结果真实性难以验证。为此，研究提出了 AppEval 基准测试框架，涵盖 HarmonyOS、iOS 和 Android 三大平台，支持 ArkTS、Swift 及 Kotlin 等原生语言。该框架将任务拆解为隐藏行为测试与参考修复，严格规定：仅当修复前后的实际安装应用在测试环境中均表现出正确的断言失败或通过时，任务才算成功，从而将基础设施故障与程序故障明确区分。其审计结果证实了该框架的有效性，为移动场景下大模型的可靠性评估提供了标准化基准，填补了当前评估体系的空白。", "interpret_v": 3, "num": 20}, {"title": "CentaurBench: Benchmarking LLM Capabilities on Augmenting vs. Automating Real-World Work Tasks", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-19T13:22:20+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Most LLM benchmarks rank models on their ability to automate work tasks. In practice, however, models are often used to assist other (human or LLM) agents. The question that drives model selection…", "link": "https://arxiv.org/abs/2608.18554", "points": {"类别": "实证研究，评估大模型在自动化与增强作业任务中的表现差异", "背景": "现有评测多聚焦自动化能力，但实际应用中模型常用于辅助其他智能体或人类", "贡献": "构建新框架，发现自动化冠军在多数任务中无法有效增强弱智能体的产出质量", "合理性": "盲测评分与跨任务对比方法严谨，但仅靠单一模型辅助效果具有不确定性", "清晰度": "结构明确，通过具体任务案例与数据直观呈现了自动与增强能力的分离现象"}, "kind": "paper", "title_cn": "CentaurBench：在增强与自动化现实世界工作任务的 LLM 能力基准测试", "summary_cn": "大多数大语言模型基准测试依据其自动化工作任务的能力对模型进行排名。然而，在实际应用中，模型通常被用来辅助其他（人类或大语言模型）代理。这一驱动模型选择的", "abstract": "Most LLM benchmarks rank models on their ability to automate work tasks. In practice, however, models are often used to assist other (human or LLM) agents. The question that drives model selection is therefore not only which model produces the best output, but which model most improves the work of another (weaker) agent. We introduce a unified framework that evaluates the capability of models to automate and augment another agent's performance. Across seven economically grounded real-world tasks, an assistant model writes assistance text for a standardized lower-capacity worker model, which produces the deliverable. In automation mode, the assistant produces the output directly. Outputs are scored through blind pairwise comparisons by an LLM judge panel with task-specific rubrics, replicated across ten runs. Rankings across the two regimes are only modestly correlated, and the automation winner loses augmentation on five of seven tasks. Assistance is not reliably positive. The unaided worker outranks every assisted condition on three tasks, and only one model's guidance beats no guidance on average. These results suggest that automation ability is an incomplete proxy for assistance quality, motivating benchmarks that evaluate models according to the roles they play in human-AI and multi-agent systems.", "abstract_cn": "大多数 LLM 基准测试按模型自动化工作任务的能力对模型进行排名，然而在实际应用中，模型常被用作辅助其他（人类或 LLM）代理。因此，驱动模型选择的问题不仅是哪个模型能产生最佳输出，而是哪个模型最能提升其他（较弱的）代理的工作表现。我们引入一个统一框架，评估模型在自动化和增强另一个代理性能方面的能力。在涵盖七个基于经济逻辑的真实世界任务的实验中，辅助模型为一位标准化低容量工作模型撰写辅助文本，该工作模型生成最终成果；在自动化模式下，辅助模型直接生成输出。输出结果通过带有任务特定评分标准的 LLM 评审团进行盲法双向比较打分，并在十个运行中重复。两种模式下的排名仅存在微弱的正相关性，且自动化模式的赢家在五分之七的任务中表现低于辅助模式。辅助作用并非总是有益的：未受辅助的工人在三个任务中优于所有辅助条件，且仅有一个模型的指导在平均意义上优于无指导。这些结果表明，自动化能力是不完整的代理，不足以衡量辅助质量，从而激发了根据模型在人类 -AI 及多智能体系统中所扮演的角色进行评估的基准建设。", "interpret": "当前主流大模型评测多聚焦于“自动化”能力，即模型直接生成最终结果。然而在实际工作流中，大模型常作为助手辅助人类或弱能力代理完成复杂任务，因此“增强”效能往往比单纯“替代”更具价值。CentaurBench 提出了一个统一框架，评估模型在自动化与增强两种模式下的表现。研究基于七个源自经济场景的真实世界任务，由助手模型为能力受限的基础模型生成辅助文本，或由其直接产出交付物。采用盲测对、LLM 专家裁判及具体评分标准，并在十次重复实验中验证结果。研究发现，两种模式下的模型排名相关性较低，意味着擅长自动化的模型未必擅长辅助他人，反之亦然。这一发现揭示了选择大模型时更应关注其在协作场景中的实际增益，推动了从单一性能评估向复杂工作流效能评估的范式转变。", "interpret_v": 3, "num": 21}, {"title": "Measuring Proof Burden in Public Bounty Listings: A RentAHuman Case Study", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-19T13:08:21+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Online bounty markets let requesters advertise paid tasks. Workers may be asked not just to complete a task but to prove it, and proof can mean exposure: revealing identity or location, using a per…", "link": "https://arxiv.org/abs/2608.18547", "points": {"类别": "实证研究，提出在线悬赏市场中“举证负担”的测量框架与案例。", "背景": "针对在线市场中任务发布隐含的身份暴露或物理行动等隐性举证要求缺乏度量标准的问题。", "贡献": "构建了包含十三种特征的举证负担词汇表并通过人工审计制定了评分体系。", "合理性": "研究受限于仅抓取公开列表且对平台机器人标签的区分结论仅为事后探索性分析。", "清晰度": "逻辑连贯，在提供详细方法的同时如实指出了后续推断的局限性。"}, "kind": "paper", "title_cn": "公开悬赏清单中的举证责任衡量：以 RentAHuman 为例", "summary_cn": "在线悬赏市场允许发布人发布有偿任务，参与者可能被要求不仅完成任务，还需证明其完成情况，而“证明”往往意味着暴露：披露身份或位置信息，或使用个人数据作为证明依据。", "abstract": "Online bounty markets let requesters advertise paid tasks. Workers may be asked not just to complete a task but to prove it, and proof can mean exposure: revealing identity or location, using a personal account, posting publicly, acting in the physical world, or repeated evidence at later checks, none disclosed by the posted price. We call these advertised requirements proof burden and measure them on RentAHuman, a 2026 market publicized as a place for AI agents to hire humans. We study what listings request, not what workers submit or experience. We manually audited a nonrandom May 31, 2026 snapshot: every listing our searches returned from RentAHuman and Human Pages, another such market (981 listings, all but one from RentAHuman). Two independent coders recorded 13 features (11 kinds of evidence, recurring monitoring, physical-world action) and our 0-5 Proof Burden Score; a blinded third resolved all disagreements. A planned content screen leaves 779 bounty/task listings as the primary population; 438 (56.2%) score 4 or 5, spanning 154 distinct feature combinations: a checklist, not a single score, tells workers what a listing entails. Platform metadata labels some requester accounts as agents or bots. Exploratory comparisons show physical-world action, location proof, or recurring monitoring in 75.0% of agent-or-bot-labeled versus 55.3% of human-labeled listings, though score-4-or-5 shares did not clearly differ. The labels are self-reported or platform-assigned, the agent-or-bot-labeled listings come from only 20 displayed names, and the comparison was chosen post hoc, after seeing the data: a hypothesis, not a confirmed difference. We contribute the 13-requirement vocabulary, the adjudicated manual audit, and this descriptive case study; the score is a secondary screening summary. The study offers no worker-validated measure or automated detector yet.", "abstract_cn": "在线悬赏市场允许发布者广告付费任务，发布者不仅要求任务完成，还要求证明完成，而证明可能意味着身份或位置暴露、使用个人账号、公开张贴、线下行动或重复验证等未在标价中披露的事项；我们在 RentAHuman（2026 年宣布为 AI 代理人雇佣人类的平台）的悬赏页面中衡量这些广告要求的“举证责任”，研究对象为发布者的请求而非工人类提交或体验。本研究对 2026 年 5 月 31 日非随机截面的数据进行人工审计，涵盖 RentAHuman 与另一同类市场 Human Pages 的搜索结果（981 条条目，除 1 条外均来自 RentAHuman）；两名独立编码员记录了 13 个特征（11 类证据、持续监控、线下行动）并采用 0-5 举证责任评分，由第三名盲评员解决所有分歧。经过内容筛选后，共保留 779 条悬赏/任务条目作为主要研究对象；其中 438 条（56.2%）评分为 4 或 5，涵盖 154 种不同的特征组合，表明该评分对应一系列检查清单而非单一分数，用于说明任务内容。平台元数据标签将部分发布者的账户标记为\"AI 代理人”或“机器人”；探索性比较显示，与标记为“代理人”或“机器人”的列表相比（75.0%），线下行动、位置证明或持续监控的比例在标记为“人类”的列表中（55.3%）较低，但评分为 4 或 5 的条目在这些群体间的分布并无显著差异。鉴于这些标签来自自我报告或平台分配，仅基于 20 个显示名称的列表来源，且比较为数据观察后的事后选择（非预先假设），因此本研究未确认群体间存在差异。本研究贡献了包含 13 项要求的词汇表、经裁决的人工审计过程及这一描述性案例研究，该评分仅作为辅助筛查总结；目前研究尚不提供经工人类验证的衡量标准或自动化检测器。", "interpret": "在线悬赏市场常出现一种隐蔽风险：雇主不仅要求完成任务，还强制要求“证明”完成，却未明说。本文以 RentAHuman 为例，研究了此类未被标价披露的“证明负担”。研究者对 2026 年 5 月的市场快照进行了人工审计，共分析 981 个悬赏任务。\n\n核心发现揭示，雇主常设置极高证据门槛，包括暴露身份地点、使用个人账户、公开张贴结果、实地行动及重复验证等，且证明方式与价格严重不匹配。研究构建了 0 至 5 分的“证明负担评分系统”，量化了这 13 种取证特征的影响。这一发现指出，当前机制缺乏透明度，导致劳动者面临不必要的隐私与行动风险。这不仅警示了在线劳动市场的潜在剥削，也为设计更公平、透明的任务发布标准提供了数据支撑。", "interpret_v": 3, "num": 22}, {"title": "Science Done on a Machine by a Machine: AI Agents in Computational Chemistry", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "AI Agent", "ts": "2026-08-19T11:55:13+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "We are witnessing an explosion of agentic systems for computational chemistry simulations: from half a dozen in 2024 to a dozen in 2025, and the current number approaches fifty, surveyed in this Pe…", "link": "https://arxiv.org/abs/2608.18508", "points": {"类别": "综述视角，系统梳理近期涌现的五十多个智能体在计算化学中的最新进展。", "背景": "智能体正将计算化学从辅助工具推向自主执行实验与设计的前沿趋势。", "贡献": "综述了智能体从单一任务辅助向全自动“机对机”科研发展的演进路径。", "合理性": "指出当前系统仍需人类干预，并承认通用智能体可能取代专用系统的潜在局限。", "清晰度": "作为综述文章，结构清晰且紧扣智能体发展现状与未来展望主题。"}, "kind": "paper", "title_cn": "由机器基于机器进行的科学：计算化学中的 AI 代理", "summary_cn": "我们正目睹用于计算化学模拟的智能体系统呈爆炸式增长：从 2024 年的不到十几个，到 2025 年的十几个，而目前的数量已接近五十个，本文对该情况进行了综述…", "abstract": "We are witnessing an explosion of agentic systems for computational chemistry simulations: from half a dozen in 2024 to a dozen in 2025, and the current number approaches fifty, surveyed in this Perspective as of 8 August 2026. The capabilities of these agentic systems are shifting from assisting in performing a selection of computational tasks to autonomous design and execution of \\textit{in silico} experiments, their analysis, and even manuscript writing. The ultimate destination is a fully autonomous AI scientist, where the entirety of computational chemistry is performed on a machine by a machine, without human supervision. While we are not there yet, and all reported systems currently involve a human in the loop, the trend is unmistakable. Even building specialized agentic systems for computational chemistry is increasingly commoditized by generalist agents, which may in the end replace the need for the specialized ones altogether, since adding a new capability will be as easy as asking AI to do it for you. Both the explosion in their number and the very limited adoption beyond their own developers point that way, and we close this Perspective on what it leaves us to do. The speed and scale of disruption agentic systems are bringing to computational chemistry leave many of us dumbfounded about the field's future and what we should spend our efforts on, as already established specialists, teachers, and students, and we have no answer.", "abstract_cn": "我们正见证计算化学模拟中智能体系统的爆发式增长：从 2024 年的少数几个到 2025 年的十几个，截至 2026 年 8 月 8 日目前已接近五十个，本文以此为视角进行了综述。这些智能体系统的能力正在从辅助执行部分计算任务，转向自主设计并执行“硅基”实验、分析结果，甚至撰写论文。终极目标是完全自主的 AI 科学家，即所有计算化学工作均由机器为机器执行，无需人类监管。虽然我们尚未达到这一阶段，目前所有报道的系统仍涉及人在回路中，但这一趋势显而易见。即便是构建专门的计算化学智能体系统，也正在被通用智能体所商品化，后者最终可能使专门智能体变得多余，因为添加新功能只需让 AI 代劳即可。智能体数量激增及其采用范围仅限于自身开发者的现状，均指向这一结论，本文借此结束对“我们还能做什么”的探讨。智能体系统为计算化学带来的颠覆速度与规模，令身为领域专家、教师及学生的我们对其未来及未来应投入的精力感到困惑，且目前尚无答案。", "interpret": "当前，计算化学领域正经历从辅助任务到全自动自主实验的范式转变。自 2024 年起，智能体系统数量激增，目前已有近五十个专门工具，它们不仅能执行计算任务，还能自主设计实验、分析数据甚至撰写论文，目标是实现“机器为机器工作”的完全自动化。尽管目前所有系统仍依赖人类监督，但这一趋势不可逆转，通用智能体正在加速专业化工具的普及。这项研究不仅揭示了计算化学未来的发展图景，更强调了 AI 在加速药物发现与材料创新中的革命性潜力，标志着科研模式将从“人机协作”迈向深层的“人机共生”。", "interpret_v": 3, "num": 23}, {"title": "Partition the Support, Reconstruct the Residual: Training-Free Sparse Attention for Video Generation and World Models", "source": "arXiv", "sourceShort": "arXiv", "hue": 212, "domain": "世界模型", "ts": "2026-08-19T11:16:09+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "Training-free block-sparse attention can accelerate video transformers, but row-wise attention concentration does not by itself specify an executable sparse operator. Queries sharing a block route…", "link": "https://arxiv.org/abs/2608.18484", "points": {"类别": "方法，提出训练免算的稀疏注意力方案以加速视频生成 Transformer。", "背景": "解决现有行级注意力集中无法直接转化为可执行稀疏算子的研究缺口。", "贡献": "引入 SparsePR 框架，结合响应耦合分块与探测拟合残差重构技术。", "合理性": "基于四类模型实证显示误差降低显著，但依赖特定探测预算存在局限。", "清晰度": "摘要逻辑严密，清晰阐明了几何分区对残差预测的内在机理。"}, "kind": "paper", "title_cn": "划分支持集，重构残差：无需训练的稀疏注意力用于视频生成与世界模型", "summary_cn": "无训练的块稀疏注意力能够加速视频 Transformer，但仅凭行向注意力的集中特性并不能定义一个可执行的稀疏算子，共享块的查询路由机制……", "abstract": "Training-free block-sparse attention can accelerate video transformers, but row-wise attention concentration does not by itself specify an executable sparse operator. Queries sharing a block route may have poorly overlapping supports, while retained attention mass alone does not determine the post-softmax error from skipped interactions. We show that partition geometry affects both pooled support and the predictability of the remaining residual from the sparse output. We introduce SparsePR, which combines Response-Coupled Partitioning with Probe-Fitted Residual Reconstruction. Sampled-query key responses form paired K/V groups, whose centroids induce query-response coordinates for shared routing. A small set of exact query rows then calibrates a call-specific affine correction from the sparse output within the output subspace observed in the probe residuals. Across four heterogeneous video generation and world models, SparsePR consistently reduces attention-reconstruction error. Ablations show that probe fitting accounts for most of this reduction, while response-coupled partitioning lowers hard-drop error and improves reconstruction under a finite probe budget. SparsePR preserves generation quality at 22.0-26.0% realized executed-pair density while achieving 1.48x-2.61x end-to-end speedups. Project page: https://pardistaghavi.github.io/SparsePR-website/", "abstract_cn": "免训练的块稀疏注意力可加速视频变换器，但行级注意力集中本身并不能定义可执行的稀疏算子；共享块的查询路由可能具有重叠极差的支撑集，而保留的注意力质量单独也无法确定因跳过交互产生的后 softmax 误差。我们表明，划分几何结构同时影响池化后的支撑集以及从稀疏输出预测剩余残差的可靠性。我们提出 SparsePR，其融合了响应耦合划分与探针适配残差重构。采样查询 - 键响应构成成对的键值组，其质心诱导出共享路由的查询 - 响应坐标；随后少量精确查询行在探针残差中观察到的输出子空间内，为稀疏输出校准特定查询 - 响应的仿射修正。在四种异构视频生成与世界模型上，SparsePR 一致降低了注意力重构误差。消融实验表明，探针适配贡献了大部分误差降低，而响应耦合划分降低了硬丢弃误差，并在有限探针预算下提升了重构效果。SparsePR 在 22.0%-26.0% 的实现执行对密度下保持了生成质量，同时实现了 1.48 倍至 2.61 倍的端到端加速。", "interpret": "这项研究针对视频生成和世界模型中 Transformers 训练成本高、推理慢的痛点，提出了一种无需重新训练的稀疏注意力机制。虽然将注意力矩阵分割为块状能加速计算，但若简单截断，因查询间信息重叠不足且忽略被跳过的交互，会导致重构误差显著上升。论文通过理论分析证明，几何划分方式直接影响残差的预测能力。为此，团队开发了 SparsePR 算法，它结合了响应耦合的注意力分配与探针拟合的残差重构技术：首先利用采样查询的响应中心坐标引导路由决策，再用少量精确查询数据，针对特定样本在输出子空间内构建仿射校正项，从而精准修复被跳过的细节。该方案在多种异构视频数据集上验证有效，不仅大幅提升了生成质量，更以近乎零成本的方式实现了高效推理，为构建实时、高精度的世界模型提供了重要新路径。", "interpret_v": 3, "num": 24}, {"title": "FM-Bench：面向长期管理场景的智能体评测基准", "source": "HuggingFace Daily Papers（社区热门论文）", "sourceShort": "HuggingFace Daily Papers", "hue": 209, "domain": "LLM", "ts": "2026-08-19T08:00:00+08:00", "date": "2026-08-19", "weekday": "周三", "summary": "FM-Bench（足球管理基准）让大语言模型智能体通过26个工具、约340至400个决策节点，在20个游戏年内运营一家足球俱乐部，并以确定性引擎累计最终得分。15个前沿模型在三个随机种子下均完成全程，claude-fable-5在单人赛道和Arena中均居首，但冠军在10个模型间轮换。得分差异源于管理行为而非算力，token支出与表现无关。", "link": "https://arxiv.org/abs/2608.18423", "points": {"类别": "实证研究，首次构建面向长期动态环境的大模型智能体管理评测基准。", "背景": "语言模型虽能执行短期任务，但其在具有累积效应的长期管理场景中决策能力尚未被有效衡量。", "贡献": "通过模拟足球俱乐部 20 年运营全流程，在 15 家前沿模型间开展大规模无人类判定的头部对头评估。", "合理性": "采用确定性引擎与无人类打分机制可信度高，但完全脱离人类干预可能缺乏部分场景的直观解释力。", "清晰度": "实验设计逻辑严密、数据详实，行文结构清晰，对长周期行为的分析极具洞察力。"}, "kind": "paper", "abstract": "Language model agents now execute bounded tasks reliably. Whether they can sustain effective decision-making over long horizons, where actions have cumulative consequences and the environment responds to their choices, remains largely unmeasured. FM-Bench (Football Management Benchmark) measures this. An LLM agent runs a football club for 20 in-game years through 26 tools and roughly 340 to 400 decision stops. It drafts a squad on the same budget as every rival, trades players, negotiates contracts, invests in facilities and youth, sets lineups, and answers to a board that can fire it, while a deterministic engine accumulates every year into one final score with no LLM judge or human rater. The solo track plays each of 15 frontier models against a frozen scripted world, and the Arena places the same models plus a scripted anchor in one shared 20-year world; to our knowledge, the first head-to-head evaluation at this scale. We measure six behavioral capabilities behind the score. Across three seeds, all 15 models complete every horizon while the blind scripted baselines die out in most of theirs, and claude-fable-5 tops the solo board on mean score and the Arena, where the title nonetheless rotates among ten models. Neither scale, price, nor vendor predicts the order; the order settles only late in the horizon, and the best first-play human lands only at the bottom of the model board. What separates the models is managerial behavior rather than computation. Higher-scoring models reduce slow-payoff investment near the end, keep cash invested rather than idle, and open renewals well before the deadline, while token spend predicts nothing. No model learns the market's hidden prices from hundreds of rejected bids, and self-managed memory fails in two opposite modes: an archive that only grows or a plan rewritten every season. Code is available at https://github.com/Analogy-AI/fm-bench.", "abstract_cn": "语言模型代理如今能可靠地执行有界任务，但在具有累积后果且环境会对选择做出回应的长时序中能否维持有效决策，目前仍缺乏有效测度。FM-Bench（足球管理基准）对此进行了测度，其中大型语言模型代理在 26 种工具约 340 至 400 次决策点下，带领一支足球队历经 20 个比赛赛季，在与其他对手相同的预算下组建阵容、球员交易、合同谈判、设施与青训投资、排兵布阵，并需面对可能解雇它的董事会；同时由确定性引擎逐年累计得出一个最终分数，无需大型语言模型裁判或人类评分者。独奏模式使 15 款前沿模型对抗一个冻结的剧本世界，Arena 则将这些模型与一个剧本基准模型置于同一 20 年共享世界中；据我们所知，这是首个此规模的直接头对头评估。我们测度了决定分数的六项行为能力。在三个随机种子下，所有 15 款模型均完成了整个时序，而盲测的剧本基线在大多数情况下均消亡；其中 claude-fable-5 在独奏榜单的平均分及 Arena 中表现最佳，尽管冠军头衔在十款模型间轮换。无论规模、价格还是厂商均无法预测排名顺序；该顺序仅在时序末期才能确定，而表现最优的首轮人类选手仅位于模型榜单底部。区分模型的不是计算能力而是管理行为：高分模型在时序末端减少了回报缓慢的投资，保持现金投资而非闲置，并在截止日期前提前开启续约，而 token 消耗无法预测任何结果。没有任何模型能从数百次被拒绝的报价中学会市场的隐性价格，而自管理记忆失效于两种相反模式：仅增长不变的档案或每赛季重写计划的代码已在 GitHub 上开放。", "title_cn": "FM-Bench：面向长期管理场景的智能体评测基准", "interpret": "大型语言模型智能体虽能可靠完成短时任务，但其在长期、累积效应显著的足球管理场景中能否保持有效决策能力，至今缺乏系统评测。FM-Bench 填补了这一空白：它构建了一个包含 26 种工具、近 400 个决策节点的“20 年长周期”足球俱乐部仿真环境。智能体需独立处理阵容规划、转会谈判、设施投资及董事会考核等复杂任务，且全程由
